<defs><radialGradient id="bg" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="#151a2b"/><stop offset="1" stop-color="#05060b"/></radialGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter></defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<g transform="translate(540 540)">
<circle r="330" fill="none" stroke="#1f2538" stroke-width="44"/>
<path d="M-233.3 -233.3 A330 330 0 1 1 -330 0" fill="none" stroke="url(#ac)" stroke-width="44" stroke-linecap="round" transform="rotate(0)"/>
