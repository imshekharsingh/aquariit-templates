<text x="0" y="0" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="104" fill="#fff" letter-spacing="-4">TURNS</text>
<text x="0" y="118" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="104" fill="#ffc46b" letter-spacing="-4">OUT</text>
