<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="t">
  <title id="t">Aquarii Tech Studio, motion logo</title>
  <!-- Motion logo v1 (14 Oct 2026). The water bearer's sign built from water: a drop falls, its impact ripples out into the two waves of the Aquarius
       glyph, liquid light runs through them, the wordmark springs up. 2.6 s, then it rests (reload to replay). Pure SVG + CSS: no images, no script.
       Easing: arrivals on a soft overshoot (~5%), departures accelerate; nothing linear. -->
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ec8ff"/>
      <stop offset=".45" stop-color="#1ec8ff"/>
      <stop offset=".5" stop-color="#e9fdff"/>
      <stop offset=".55" stop-color="#d6ff3d"/>
      <stop offset=".62" stop-color="#1ec8ff"/>
      <stop offset="1" stop-color="#0a8fff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" keyTimes="0;1" calcMode="spline" keySplines=".65 0 .35 1" begin="1.15s" dur="1.1s" fill="freeze"/>
    </linearGradient>
    <clipPath id="reveal"><rect x="180" y="560" height="180" width="720"><animate attributeName="width" values="0;720" keyTimes="0;1" calcMode="spline" keySplines=".16 1 .3 1" begin="1.3s" dur=".8s" fill="freeze"/></rect></clipPath>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1ec8ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1ec8ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800..900&amp;family=Geist+Mono:wght@500&amp;display=block');
      .bg { fill: #061722; }
      .wave { fill: none; stroke: url(#liquid); stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .w1 { animation: draw .7s cubic-bezier(.22,.9,.3,1) .62s forwards; }
      .w2 { animation: draw .7s cubic-bezier(.22,.9,.3,1) .76s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .drop { transform-box: fill-box; transform-origin: 50% 100%; animation: fall .62s cubic-bezier(.55,0,.9,.55) both, squash .18s cubic-bezier(.3,1.3,.5,1) .6s both; }
      @keyframes fall { from { transform: translateY(-420px); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(0); opacity: 1; } }
      @keyframes squash { from { transform: scale(1, 1); opacity: 1; } to { transform: scale(2.2, .2); opacity: 0; } }
      .ring { fill: none; stroke: #bff4ff; stroke-width: 6; transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: ring .8s cubic-bezier(.16,1,.3,1) .62s both; }
      .ring.r2 { animation-delay: .74s; stroke-width: 4; }
      @keyframes ring { from { transform: scale(.1, .05); opacity: .9; } to { transform: scale(1, .25); opacity: 0; } }
      .glow { opacity: 0; animation: glow 1s cubic-bezier(.16,1,.3,1) .7s forwards; }
      @keyframes glow { to { opacity: 1; } }
      .word { font: 900 128px/1 Archivo, 'Arial Black', sans-serif; font-variation-settings: "wdth" 112; letter-spacing: -.01em; fill: #ffffff; }
      .word { transform-box: fill-box; transform-origin: 50% 100%; animation: rise .7s cubic-bezier(.3,1.32,.5,1) 1.3s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(46px); } 40% { opacity: 1; } to { opacity: 1; transform: translateY(0); } }
      .sub { font: 500 34px/1 'Geist Mono', ui-monospace, monospace; fill: #9fe9ff; letter-spacing: .1em; opacity: 0; animation: track .9s cubic-bezier(.16,1,.3,1) 1.9s forwards; }
      @keyframes track { from { opacity: 0; letter-spacing: .02em; } to { opacity: 1; letter-spacing: .42em; } }
      .dot { fill: #d6ff3d; transform-box: fill-box; transform-origin: 50% 50%; transform: scale(0); animation: pop .5s cubic-bezier(.3,1.32,.5,1) 2.1s forwards; }
      @keyframes pop { to { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .wave, .word, .sub, .dot, .glow { animation-duration: .01s !important; animation-delay: 0s !important; } .drop, .ring { display: none; } }
    </style>
  </defs>

  <rect class="bg" width="1080" height="1080"/>
  <ellipse class="glow" cx="540" cy="430" rx="380" ry="240" fill="url(#glow)"/>

  <!-- the sign: two waves, each one stroke (pathLength 1 so the draw is resolution free) -->
  <g transform="translate(0 0)">
    <path class="wave w1" pathLength="1" d="M300 400 L360 340 L420 400 L480 340 L540 400 L600 340 L660 400 L720 340 L780 400"/>
    <path class="wave w2" pathLength="1" d="M300 500 L360 440 L420 500 L480 440 L540 500 L600 440 L660 500 L720 440 L780 500"/>
  </g>

  <!-- the drop and its impact rings (they become the sign) -->
  <ellipse class="ring" cx="540" cy="450" rx="300" ry="300"/>
  <ellipse class="ring r2" cx="540" cy="450" rx="230" ry="230"/>
  <path class="drop" fill="#1ec8ff" d="M540 386 C540 386 512 422 512 440 A28 28 0 0 0 568 440 C568 422 540 386 540 386 Z"/>

  <!-- wordmark -->
  <g clip-path="url(#reveal)"><text class="word" x="540" y="700" text-anchor="middle">AQUARII</text></g>
  <text class="sub" x="540" y="780" text-anchor="middle">TECH STUDIO</text>
  <circle class="dot" cx="540" cy="850" r="9"/>
</svg>
