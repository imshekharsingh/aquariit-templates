    <text x="540" y="520" font-size="250" font-weight="500" letter-spacing="-6">Turns</text>
    <text x="548" y="745" font-size="250" font-weight="400" font-style="italic" letter-spacing="-6">out<tspan fill="url(#au)" font-style="normal" font-weight="600">.</tspan></text>
