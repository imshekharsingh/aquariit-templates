<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Turns Out, option D "Masthead": the name set like a magazine masthead, cream serif on deep oxblood, a gold full stop -->
  <style>@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&amp;display=block");</style>
  <defs>
    <radialGradient id="bg" cx=".35" cy=".28" r=".95"><stop offset="0" stop-color="#6b2621"/><stop offset=".6" stop-color="#4a1916"/><stop offset="1" stop-color="#2e0f0d"/></radialGradient>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d9a0"/><stop offset=".5" stop-color="#c9a15a"/><stop offset="1" stop-color="#9c7a3c"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="540" r="452" fill="none" stroke="url(#au)" stroke-width="3" opacity=".75"/>
