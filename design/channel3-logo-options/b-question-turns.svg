<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Turns Out logo (option B, chosen): a question mark whose red hook turns, in one stroke, into the ink stem of an exclamation mark.
       The question becomes the answer: the channel's format in one glyph. Drawn in code, no fonts; edit this file and re-export. -->
  <defs>
    <radialGradient id="bg" cx=".36" cy=".28" r=".9"><stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#e9ddc2"/></radialGradient>
    <linearGradient id="st" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="740">
      <stop offset="0" stop-color="#d4503a"/><stop offset=".84" stop-color="#b53d2a"/><stop offset=".842" stop-color="#23202b"/><stop offset="1" stop-color="#23202b"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3a2a1a" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <path d="M366 408 A174 174 0 1 1 600 572 Q540 598 540 650 V712" fill="none" stroke="url(#st)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="540" cy="852" r="60" fill="#23202b"/>
  </g>
</svg>
