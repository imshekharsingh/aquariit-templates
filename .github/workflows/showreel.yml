name: Showreel

# "N styles, one reel" (owner, 21 Oct 2026): plays our own templates frame by frame (scripts/showreel/capture.mjs), cuts them together with
# transitions, labels and a beat-synced score made in code (compose.py; owner chose code-made sound for showreels), keeps the MP4 in the
# "reels" release and opens an issue for the owner. Run by hand: Actions -> Showreel -> config (default scripts/showreel/reel-01.json).
on:
  workflow_dispatch:
    inputs:
      config:
        description: Reel config
        default: scripts/showreel/reel-01.json
      seconds:
        description: Preview only, this many seconds with sound (goes to the "study" release, no issue). Empty = the whole reel.
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  render:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 75   # shader scenes render on a software GPU (~0.6 s a frame) and motion blur multiplies frames
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CFG: ${{ inputs.config }}
      SECS: ${{ inputs.seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # before/after reels play older versions from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install numpy==2.1.3 Pillow==11.0.0
      - name: Capture and compose
        run: |
          set -o pipefail
          NAME=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "$CFG")
          if [ -n "$SECS" ]; then NAME="$NAME-preview"; fi
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p out
          SEEK=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1])).get('seek',''))" "$CFG")
          COVER=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1])).get('cover',1.6))" "$CFG")
          if [ -n "$SEEK" ]; then
            # a seekable scene (window.seek(t)): frames straight to MP4; its window.CUES become the sound below
            node scripts/showreel/seek.mjs "$CFG" "out/$NAME.mp4" ${SECS:+--seconds "$SECS"} 2>&1 | tee capture.log
          else
            node scripts/showreel/capture.mjs "$CFG" out/frames 2>&1 | tee capture.log
            python3 scripts/showreel/compose.py "$CFG" out/frames "out/$NAME.mp4" 2>&1 | tail -3
          fi
          ffmpeg -y -loglevel error -ss "$COVER" -i "out/$NAME.mp4" -frames:v 1 -q:v 3 "out/$NAME-cover.jpg"
          mkdir -p out/review && ffmpeg -y -loglevel error -i "out/$NAME.mp4" -vf "fps=2,scale=270:-1,tile=8x5" -frames:v 1 "out/$NAME-review.png"
      - name: Voice model
        # the hook voice (owner, 23 Oct: "audio similar to techin20sec"): Kokoro-82M, Apache-2.0, CPU only, no key.
        # If it cannot install, sound.py skips the voice and the reel keeps its effects and bed.
        if: hashFiles('out/*.cues.json') != ''
        continue-on-error: true
        run: |
          grep -q '"k":"voice"' out/*.cues.json || exit 0
          sudo apt-get install -y --no-install-recommends espeak-ng
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro==0.9.4 soundfile==0.12.1
      - name: Sound
        # every sound comes from the scene's cues (scripts/showreel/sound.py), levelled to -14 LUFS like the reels that hold attention
        if: hashFiles('out/*.cues.json') != ''
        run: |
          python3 scripts/showreel/sound.py "out/$NAME.cues.json" out/sound.wav
          ffmpeg -y -loglevel error -i "out/$NAME.mp4" -i out/sound.wav -map 0:v -map 1:a -c:v copy -af "loudnorm=I=-14:TP=-1.5:LRA=7" -ar 48000 -c:a aac -b:a 192k -shortest out/muxed.mp4
          mv out/muxed.mp4 "out/$NAME.mp4"
          ffmpeg -hide_banner -i "out/$NAME.mp4" -af ebur128 -f null - 2>&1 | grep -E "^\s+(I|LRA):" | tail -2
      - name: Keep the preview
        if: inputs.seconds != ''
        run: |
          gh release view study --repo "$REPO" >/dev/null 2>&1 || gh release create study --repo "$REPO" --title "Study" --latest=false --notes "Reel study and previews"
          gh release upload study --repo "$REPO" --clobber "out/$NAME.mp4"
          echo "https://github.com/$REPO/releases/download/study/$NAME.mp4"
      - name: Keep it and tell the owner
        if: inputs.seconds == ''
        run: |
          gh release view reels --repo "$REPO" >/dev/null 2>&1 || gh release create reels --repo "$REPO" --title "Reels" --latest=false --notes "Rendered reels"
          cp "$CFG" "out/$NAME.json"
          gh release upload reels --repo "$REPO" --clobber "out/$NAME.mp4" "out/$NAME-cover.jpg" "out/$NAME-review.png" "out/$NAME.json"
          CAP=$(python3 -I -c "import json,sys; j=json.load(open(sys.argv[1])); t=j.get('caption','').strip(); k=j.get('keywords') or []; h=j.get('hashtags') or []; print(t+('\\n\\n'+' · '.join(k[:6]) if k else '')+('\\n\\n'+' '.join(h[:5]) if h else ''))" "$CFG")
          URL="https://github.com/$REPO/releases/download/reels/$NAME.mp4"
          # post text as one block to copy whole (owner, 22 Oct: no labels, caption + keywords + hashtags together)
          printf '**Showreel ready:** [%s.mp4](%s) (1080x1920) · [contact sheet](https://github.com/%s/releases/download/reels/%s-review.png)\n\n```text\n%s\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$NAME" "$URL" "$REPO" "$NAME" "$CAP" > body.md
          gh issue create --repo "$REPO" --title "Showreel ready: $NAME" --body-file body.md --assignee imshekharsingh || gh issue create --repo "$REPO" --title "Showreel ready: $NAME" --body-file body.md
