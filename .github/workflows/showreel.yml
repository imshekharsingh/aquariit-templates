name: Showreel

# Three jobs: the narration, the frames (split across "parts" jobs, owner 1 Nov 2026), then join, sound, voice check and keep.
# Renders one seekable scene (window.seek(t)) to MP4 with its code-made sound and voice, keeps it in the private R2 bucket (scripts/r2.sh;
# owner, 3 Nov 2026: never in the public releases) and opens an issue that only says it is ready in the app. The older template-capture reels were retired with the template archive (owner, 31 Oct 2026). Run by hand: Actions -> Showreel -> config.
on:
  workflow_dispatch:
    inputs:
      config:
        description: Reel config
        default: scripts/explainer/overscroll.json
      seconds:
        description: Preview only, this many seconds with sound (goes to R2 under study/, no issue). Empty = the whole reel.
        required: false
        default: ''
      parts:
        description: Split the capture into this many parallel jobs (Turns Out 3D, about 2.5 s a frame, uses 2)
        type: choice
        options: ['1', '2', '3']
        default: '1'

permissions:
  contents: write
  issues: write

jobs:
  # 1. the narration (one voice for every part, so captions and beats line up across the split)
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@v4
      - name: Mandatory Gate
        # no render without review/<channel>/<name>.md, items 1-12 and the FLOW items 14-17 PASS (design/mandatory.md; owner, 7 Nov 2026); a short preview (seconds) is exempt
        if: inputs.seconds == ''
        run: node scripts/review-gate.mjs --config "$CFG"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Narration
        # explainer reels (owner, 23 Oct): a voice for the whole reel, with a timestamp per word for the captions and beats
        run: |
          mkdir -p out
          python3 -I -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('voice') else 1)" "$CFG" || exit 0
          # misaki also ships espeak-ng (espeakng-loader), so a slow mirror only costs this one try
          timeout 120 sudo apt-get install -y --no-install-recommends espeak-ng || echo 'espeak-ng from apt unavailable; using the bundled one'
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          # spacy's helpers pinned to the 24 Oct set: preshed 3.0.14 / cymem 2.0.16 (released 24-25 Oct) break loading en_core_web_sm
          pip install kokoro==0.9.4 soundfile==0.12.1 preshed==3.0.13 cymem==2.0.13 murmurhash==1.0.15 srsly==2.5.4 spacy==3.8.16 thinc==8.3.13 blis==1.3.3
          python3 scripts/showreel/voice.py "$CFG" out/narration.wav out/words.json
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: out/
          if-no-files-found: ignore
          retention-days: 1

  # 2. the frames: one job per part (owner, 1 Nov 2026: split render), each captures its share of the frames to MP4
  frames:
    needs: voice
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 100   # shader scenes render on a software GPU (~0.6 s a frame; Turns Out 3D about 2.5 s: split it with "parts")
    strategy:
      matrix:
        part: ${{ fromJSON(inputs.parts == '3' && '[0,1,2]' || inputs.parts == '2' && '[0,1]' || '[0]') }}
    env:
      CFG: ${{ inputs.config }}
      SECS: ${{ inputs.seconds }}
      PART: ${{ matrix.part }}
      PARTS: ${{ inputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        # GitHub's Ubuntu mirror sometimes crawls (26 Oct: three renders stalled here for 15-20 minutes). Each apt install gets a
        # few minutes, then falls back to a source that does not need the mirror: Playwright's browser alone (the runner image
        # already has the system libraries) and a static ffmpeg from PyPI (imageio-ffmpeg). The step still gives up after 10 minutes.
        timeout-minutes: 10
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
          if ! timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg; then
            # into a folder of its own and linked by path (3 Nov 2026: pip fell back to a user install that python3 -I cannot see)
            python3 -m pip install --quiet --target "$RUNNER_TEMP/iff" imageio-ffmpeg==0.6.0
            f=$(find "$RUNNER_TEMP/iff" -type f -name "ffmpeg-*" | head -1); [ -n "$f" ] || { echo "::error::no ffmpeg in imageio-ffmpeg"; exit 1; }; chmod +x "$f"; sudo ln -sf "$f" /usr/local/bin/ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voice
          path: out
      - name: Capture
        run: |
          set -o pipefail
          mkdir -p out
          NAME=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "$CFG")
          SEEK=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1])).get('seek',''))" "$CFG")
          [ -n "$SEEK" ] || { echo "::error::$CFG has no \"seek\" scene; template-capture reels were retired on 31 Oct 2026"; exit 1; }
          # narrated reels: the scene times its beats and captions to the real voice
          [ -s out/words.json ] && export VOICE_WORDS=out/words.json
          # a seekable scene (window.seek(t)): frames straight to MP4; part 0 also writes the cover time and the sound cues
          node scripts/showreel/seek.mjs "$CFG" "out/$NAME.part$PART.mp4" ${SECS:+--seconds "$SECS"} --part "$PART/${PARTS:-1}" 2>&1 | tee capture.log
          rm -f out/narration.wav out/words.json
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.part }}
          path: out/
          retention-days: 1

  # 3. join the parts, then sound, voice check, and keep it
  render:
    needs: frames
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CFG: ${{ inputs.config }}
      SECS: ${{ inputs.seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # before/after reels play older versions from git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4   # wrangler (package.json) uploads the reel to R2
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tools
        timeout-minutes: 10
        run: |
          if ! timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg; then
            # into a folder of its own and linked by path (3 Nov 2026: pip fell back to a user install that python3 -I cannot see)
            python3 -m pip install --quiet --target "$RUNNER_TEMP/iff" imageio-ffmpeg==0.6.0
            f=$(find "$RUNNER_TEMP/iff" -type f -name "ffmpeg-*" | head -1); [ -n "$f" ] || { echo "::error::no ffmpeg in imageio-ffmpeg"; exit 1; }; chmod +x "$f"; sudo ln -sf "$f" /usr/local/bin/ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1
          pip install numpy==2.1.3 Pillow==11.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voice
          path: out
      - name: Join and compose
        run: |
          set -o pipefail
          NAME=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "$CFG")
          COVER=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1])).get('cover',1.6))" "$CFG")
          ls out/$NAME.part*.mp4 | sort -V | sed "s|^out/|file '|; s|$|'|" > out/parts.txt
          cat out/parts.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/parts.txt -c copy -movflags +faststart "out/$NAME.mp4"
          rm -f out/$NAME.part*.mp4
          # the imageio-ffmpeg fallback (apt mirror down) has no ffprobe: then read the duration from ffmpeg itself
          if command -v ffprobe >/dev/null; then ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$NAME.mp4"; else ffmpeg -hide_banner -i "out/$NAME.mp4" 2>&1 | grep -m1 Duration || true; fi
          if [ -n "$SECS" ]; then mv "out/$NAME.mp4" "out/$NAME-preview.mp4"; for f in out/$NAME.cues.json out/$NAME.cover.txt; do [ -f "$f" ] && mv "$f" "${f/$NAME/$NAME-preview}"; done; NAME="$NAME-preview"; fi
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          [ -s out/words.json ] && echo "VOICE_WORDS=out/words.json" >> "$GITHUB_ENV"
          [ -s "out/$NAME.cover.txt" ] && COVER=$(cat "out/$NAME.cover.txt") && echo "cover at $COVER s (from the scene: its title is fully on screen)"
          ffmpeg -y -loglevel error -ss "$COVER" -i "out/$NAME.mp4" -frames:v 1 -q:v 3 "out/$NAME-cover.jpg"
          mkdir -p out/review && ffmpeg -y -loglevel error -i "out/$NAME.mp4" -vf "fps=2,scale=270:-1,tile=8x5" -frames:v 1 "out/$NAME-review.png"
      - name: Voice model
        # the hook voice (owner, 23 Oct: "audio similar to techin20sec"): Kokoro-82M, Apache-2.0, CPU only, no key.
        # If it cannot install, sound.py skips the voice and the reel keeps its effects and bed.
        if: hashFiles('out/*.cues.json') != ''
        continue-on-error: true
        run: |
          grep -q '"k":"voice"' out/*.cues.json || exit 0
          # misaki also ships espeak-ng (espeakng-loader), so a slow mirror only costs this one try
          timeout 120 sudo apt-get install -y --no-install-recommends espeak-ng || echo 'espeak-ng from apt unavailable; using the bundled one'
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro==0.9.4 soundfile==0.12.1 preshed==3.0.13 cymem==2.0.13 murmurhash==1.0.15 srsly==2.5.4 spacy==3.8.16 thinc==8.3.13 blis==1.3.3
      - name: Sound
        # every sound comes from the scene's cues (scripts/showreel/sound.py), levelled to -14 LUFS like the reels that hold attention
        if: hashFiles('out/*.cues.json') != ''
        run: |
          SAY_CONFIG="$CFG" python3 scripts/showreel/sound.py "out/$NAME.cues.json" out/sound.wav $( [ -f out/narration.wav ] && echo out/narration.wav )
          # two passes: measure, then the exact gain to -14 LUFS and a limiter on the peaks (one-pass loudnorm stayed near -16)
          EQ="highpass=f=55,equalizer=f=200:t=q:w=1.2:g=-3,equalizer=f=3000:t=q:w=1:g=2"
          IN=$(ffmpeg -hide_banner -i out/sound.wav -af "$EQ,ebur128" -f null - 2>&1 | grep -E "^\s+I:" | tail -1 | awk '{print $2}')
          GAIN=$(python3 -I -c "import sys; print(round(-13.8 - float(sys.argv[1]), 2))" "$IN")
          echo "mix measured $IN LUFS, gain $GAIN dB"
          ffmpeg -y -loglevel error -i "out/$NAME.mp4" -i out/sound.wav -map 0:v -map 1:a -c:v copy -af "$EQ,volume=${GAIN}dB,alimiter=limit=0.8:attack=5:release=60:level=false" -ar 48000 -c:a aac -b:a 192k -shortest -movflags +faststart out/muxed.mp4
          mv out/muxed.mp4 "out/$NAME.mp4"
          ffmpeg -hide_banner -i "out/$NAME.mp4" -af ebur128=peak=true -f null - 2>&1 | grep -E "^\s+(I|LRA|Peak):" | tail -3 | tee out/loud.txt
          # Mandatory Gate item 8 (design/mandatory.md; owner, 7 Nov 2026): -14 LUFS +-1 and true peak at most -1 dBTP, or the run fails here
          python3 -I -c "import re,sys; t=open(sys.argv[1]).read(); i=float(re.search(r'I:\s+(-?[\d.]+)',t).group(1)); p=float(re.search(r'Peak:\s+(-?[\d.inf]+)',t).group(1)); ok=-15<=i<=-13 and p<=-1; print(('SOUND GATE: ok' if ok else '::error::SOUND GATE: out of range'), i, 'LUFS, true peak', p, 'dBTP (need -15 to -13, at most -1)'); sys.exit(0 if ok else 1)" out/loud.txt
      - name: Voice check
        # the narration transcribed by an open recogniser and compared with the script, word by word (owner, 26 Oct: some words
        # could not be understood); lists wrong, missing and unsure words with their times in the log and the run summary
        if: hashFiles('out/narration.wav') != ''
        continue-on-error: true
        run: |
          pip install faster-whisper==1.1.1 requests
          python3 scripts/showreel/voicecheck.py "$CFG" out/narration.wav "$GITHUB_STEP_SUMMARY"
      - name: Keep the preview
        if: inputs.seconds != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash scripts/r2.sh put "out/$NAME.mp4" "v/study/$NAME.mp4"
          if [ -f out/words.json ]; then bash scripts/r2.sh put out/words.json "c/study/$NAME-words.json"; fi
      - name: Keep it in R2 and tell the owner
        if: inputs.seconds == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # private bucket only (owner, 3 Nov 2026): v/ = MP4 + contact sheet (deleted 15 days after upload), c/ = cover + config (kept)
          cp "$CFG" "out/$NAME.json"
          # the light copy the app plays (owner, 6 Nov 2026: videos were slow to start); "Save video" keeps the full file
          node scripts/showreel/mp4boxes.mjs "out/$NAME.mp4" --need-moov-first
          bash scripts/showreel/play.sh "out/$NAME.mp4" "out/$NAME-play.mp4"
          for f in "$NAME.mp4" "$NAME-play.mp4" "$NAME-review.png" "$NAME-cover.jpg" "$NAME.json"; do bash scripts/r2.sh put "out/$f" || exit 1; done
          # issues are public: the reel's name only, no media links and no post text (the app has both)
          printf '**Showreel ready:** %s is ready in the app (Showreels).\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$NAME" > body.md
          gh issue create --repo "$REPO" --title "Showreel ready: $NAME" --body-file body.md --assignee imshekharsingh || gh issue create --repo "$REPO" --title "Showreel ready: $NAME" --body-file body.md
      - name: Contact sheet for the review (scripts/reel-status.mjs reads it; kept 2 days)
        if: inputs.seconds == ''
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: out/${{ env.NAME }}-review.png
          retention-days: 2
