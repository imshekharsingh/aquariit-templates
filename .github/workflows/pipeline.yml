name: Template pipeline

on:
  push:
    branches: ['main', 'template/**', 'claude/**']
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'   # 10:00 IST watchdog: re-deploys main and re-runs the smoke test, so a failed morning deploy heals itself

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  merge:
    needs: checks
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Open PR if needed, then merge
        run: |
          # Only an OPEN pull request counts: a merged one from an earlier push of the same branch name must never be reused.
          n=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            ahead=$(gh api "repos/${{ github.repository }}/compare/main...$BRANCH" -q .ahead_by)
            if [ "$ahead" = "0" ]; then echo "Nothing to merge: $BRANCH is already contained in main."; exit 0; fi
            gh pr create --base main --head "$BRANCH" \
              --title "Daily template: ${BRANCH##*/}" \
              --body "Automated daily template. Sanity checks passed in run ${{ github.run_id }}."
            n=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          gh pr merge "$n" --squash
          git push origin --delete "$BRANCH" || true


  deploy:
    needs: [checks, merge]
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.merge.result == 'success' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Require basic-auth secrets
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          if [ -z "$BASIC_AUTH_USER" ] || [ -z "$BASIC_AUTH_PASS" ]; then
            echo "::error::Add repository secrets BASIC_AUTH_USER and BASIC_AUTH_PASS (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
      - name: Choose Worker secrets to publish
        id: sec
        env:
          BASIC_AUTH_USER_2: ${{ secrets.BASIC_AUTH_USER_2 }}
          BASIC_AUTH_PASS_2: ${{ secrets.BASIC_AUTH_PASS_2 }}
        run: | # the optional second account is published only when BOTH of its secrets exist
          {
            echo "names<<EOF"
            echo BASIC_AUTH_USER
            echo BASIC_AUTH_PASS
            if [ -n "$BASIC_AUTH_USER_2" ] && [ -n "$BASIC_AUTH_PASS_2" ]; then echo BASIC_AUTH_USER_2; echo BASIC_AUTH_PASS_2; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Ensure the D1 database for reel ticks (never blocks the deploy)
        id: d1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Finds (or creates) the database "aquarii-templates" and binds it as DB for this deploy only. If the token lacks D1
          # permission this step fails softly: the site deploys without the binding and the checkboxes say tracking is unavailable.
          set -e
          NAME=aquarii-templates
          find_id() { npx wrangler d1 list --json 2>/dev/null | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{try{const m=t.match(/\[[\s\S]*\]/);const a=JSON.parse(m?m[0]:t);const x=(Array.isArray(a)?a:[]).find(d=>d.name===process.argv[1]);process.stdout.write(x?(x.uuid||x.database_id||x.id||""):"")}catch(e){}})' "$NAME"; }
          id=$(find_id || true)
          if [ -z "$id" ]; then
            echo "Creating D1 database $NAME"
            npx wrangler d1 create "$NAME" >/dev/null
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "Could not determine the D1 database id"; exit 1; }
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));c.d1_databases=[{binding:"DB",database_name:process.argv[1],database_id:process.argv[2]}];fs.writeFileSync("wrangler.jsonc",JSON.stringify(c,null,2))' "$NAME" "$id"
          echo "D1 bound (not committed)"
      - name: D1 status
        if: always()
        run: |
          if [ "${{ steps.d1.outcome }}" = "success" ]; then echo "D1 reel-tick tracking: ON"; else echo "::warning::D1 reel-tick tracking is OFF (could not find/create the database; check the token has D1 Edit permission). The site still deployed."; fi
      - name: Attach recent reels so the site can serve them behind the sign-in (never blocks the deploy)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the 8 newest reels (video + cover) from the "reels" release; the Reel publish workflow puts them there
          mkdir -p templates/reels
          for f in $(gh release view reels --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -E '\.(mp4|jpg)$' | sort -r | head -n 16); do
            gh release download reels --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir templates/reels --clobber
          done
          ls -la templates/reels | tail -n +2 || true
      - uses: cloudflare/wrangler-action@v3
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          BASIC_AUTH_USER_2: ${{ secrets.BASIC_AUTH_USER_2 }}
          BASIC_AUTH_PASS_2: ${{ secrets.BASIC_AUTH_PASS_2 }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: ${{ steps.sec.outputs.names }}
          command: deploy
      - name: Smoke test live site
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          BASIC_AUTH_USER_2: ${{ secrets.BASIC_AUTH_USER_2 }}
          BASIC_AUTH_PASS_2: ${{ secrets.BASIC_AUTH_PASS_2 }}
        run: |
          B=https://templates.aquariit.com
          check() { # url, expected status, extra curl args
            url=$1; want=$2; shift 2
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$@" "$url")
              if [ "$code" = "$want" ]; then echo "OK $code $url"; return 0; fi
              echo "Attempt $i: $url returned $code (want $want)"; sleep 10
            done
            return 1
          }
          LATEST=$(node -e "const l=require('./design-log.json');const k=e=>e.id||e.date;console.log(l.length?l.sort((a,b)=>k(a)<k(b)?1:-1).map(k)[0]:'')")
          J=$(mktemp)
          check "$B/" 303 -H 'Accept: text/html' || exit 1              # closed: page requests bounce to the sign-in page
          check "$B/design-log.json" 401 || exit 1                      # closed: data requests are refused (no popup)
          check "$B/login" 200 || exit 1
          check "$B/manifest.webmanifest" 200 || exit 1                 # public so the PWA can install
          check "$B/sw.js" 200 || exit 1
          check "$B/login" 401 -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=wrong-$RANDOM" || exit 1
          check "$B/login" 303 -c "$J" -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=$BASIC_AUTH_PASS" || exit 1
          grep -q aq_session "$J" || { echo "No session cookie was issued"; exit 1; }
          for path in "" design-log.json social-kits.json kit/ play/player.js ${LATEST:+$LATEST/}; do
            check "$B/$path" 200 -b "$J" || exit 1                      # signed-in (cookie) access
          done
          check "$B/design-log.json" 200 --user "$BASIC_AUTH_USER:$BASIC_AUTH_PASS" || exit 1  # scripts can still use a Basic header
          if [ -n "$BASIC_AUTH_USER_2" ] && [ -n "$BASIC_AUTH_PASS_2" ]; then                   # optional second account
            J2=$(mktemp)
            check "$B/login" 401 -X POST --data-urlencode "username=$BASIC_AUTH_USER_2" --data-urlencode "password=wrong-$RANDOM" || exit 1
            check "$B/login" 303 -c "$J2" -X POST --data-urlencode "username=$BASIC_AUTH_USER_2" --data-urlencode "password=$BASIC_AUTH_PASS_2" || exit 1
            check "$B/" 200 -b "$J2" || exit 1
          fi
      - name: Smoke test reel-tick API
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          B=https://templates.aquariit.com; J=$(mktemp)
          curl -s -o /dev/null -c "$J" -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=$BASIC_AUTH_PASS" "$B/login"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$J" "$B/api/uploaded")
          if [ "$code" = "200" ]; then
            T=2000-01-01
            curl -sf -b "$J" -H 'X-Requested-With: reel' -H 'Content-Type: application/json' -X PUT -d '{"on":true}' "$B/api/uploaded/$T" >/dev/null
            curl -sf -b "$J" "$B/api/uploaded" | grep -q "$T" || { echo "tick did not round-trip"; exit 1; }
            curl -sf -b "$J" -H 'X-Requested-With: reel' -H 'Content-Type: application/json' -X PUT -d '{"on":false}' "$B/api/uploaded/$T" >/dev/null
            echo "OK reel-tick API round-trip (D1 live)"
          else
            echo "Reel-tick API answered $code (no database bound): checkboxes show 'tracking unavailable'"
          fi
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/uploaded")" = "401" ] || { echo "API must be closed to signed-out requests"; exit 1; }
      - name: Smoke test performance API
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          B=https://templates.aquariit.com; J=$(mktemp)
          curl -s -o /dev/null -c "$J" -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=$BASIC_AUTH_PASS" "$B/login"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/perf")" = "401" ] || { echo "performance API must be closed to signed-out requests"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$B/api/perf/ingest")" = "401" ] || { echo "ingest must be closed to signed-out requests"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/perf/token")" = "401" ] || { echo "the stored-token endpoint must be closed to signed-out requests"; exit 1; }
          # a fresh deploy can take a moment to reach every edge location: retry like the live-site check does
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -b "$J" "$B/api/perf")
            if [ "$code" = "200" ] || [ "$code" = "501" ]; then break; fi
            echo "Attempt $i: /api/perf returned $code (waiting for the new version)"; sleep 10
          done
          echo "performance API signed in: HTTP $code (200 = database ready, 501 = no database bound)"
          [ "$code" = "200" ] || [ "$code" = "501" ] || { echo "unexpected status"; exit 1; }
          page=000
          for i in 1 2 3 4 5 6; do
            page=$(curl -s -o /dev/null -w '%{http_code}' -b "$J" "$B/performance/")
            [ "$page" = "200" ] && break
            echo "Attempt $i: /performance/ returned $page"; sleep 10
          done
          [ "$page" = "200" ] || { echo "/performance/ page missing"; exit 1; }
      - name: Check the reels are served only to signed-in users
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          f=$(ls templates/reels/*.mp4 2>/dev/null | sort -r | head -n 1)
          if [ -z "$f" ]; then echo "No reels attached yet."; exit 0; fi
          n=$(basename "$f"); B=https://templates.aquariit.com; J=$(mktemp)
          curl -s -o /dev/null -c "$J" -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=$BASIC_AUTH_PASS" "$B/login"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$B/reels/$n")" != "200" ] || { echo "::error::$n is reachable without signing in"; exit 1; }
          echo "signed out: $(curl -s -o /dev/null -w '%{http_code}' "$B/reels/$n") (good, not public)"
          echo "signed in, whole file: $(curl -s -o /dev/null -w '%{http_code} %{size_download} bytes' -b "$J" "$B/reels/$n")"
          echo "signed in, Range 0-99: $(curl -s -o /dev/null -w '%{http_code} %{size_download} bytes' -b "$J" -r 0-99 "$B/reels/$n") (informational: the kit page downloads the file first, so a 200 here is fine)"
      - name: Summary
        run: echo "Deployed. Home https://templates.aquariit.com/" >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [checks, merge, deploy]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open an issue so the failure is seen the same day (GitHub emails the repo owner)
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Pipeline failed: ${{ github.ref_name }}" \
            --body "The Template pipeline failed on \`${{ github.ref_name }}\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  cleanup:
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete branches whose pull request is merged and that have no newer commits
        run: |
          repo="${{ github.repository }}"
          for b in $(gh api "repos/$repo/branches" --paginate -q '.[].name'); do
            [ "$b" = "main" ] && continue
            [ -n "$(gh pr list --repo "$repo" --head "$b" --state open --json number -q '.[0].number')" ] && continue
            merged_sha=$(gh pr list --repo "$repo" --head "$b" --state merged --json headRefOid -q '.[0].headRefOid')
            [ -z "$merged_sha" ] && continue
            tip=$(gh api "repos/$repo/git/ref/heads/$b" -q .object.sha)
            if [ "$tip" = "$merged_sha" ]; then
              echo "Deleting merged branch $b"
              gh api -X DELETE "repos/$repo/git/refs/heads/$b" || true
            else
              echo "Keeping $b: it has commits newer than its merged PR"
            fi
          done
