name: Template pipeline

on:
  push:
    branches: ['main', 'template/**', 'claude/**']
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'   # 10:00 IST watchdog: re-deploys main and re-runs the smoke test, so a failed morning deploy heals itself

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  merge:
    needs: checks
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Open PR if needed, then merge
        run: |
          # Only an OPEN pull request counts: a merged one from an earlier push of the same branch name must never be reused.
          n=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            ahead=$(gh api "repos/${{ github.repository }}/compare/main...$BRANCH" -q .ahead_by)
            if [ "$ahead" = "0" ]; then echo "Nothing to merge: $BRANCH is already contained in main."; exit 0; fi
            gh pr create --base main --head "$BRANCH" \
              --title "Daily template: ${BRANCH##*/}" \
              --body "Automated daily template. Sanity checks passed in run ${{ github.run_id }}."
            n=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          gh pr merge "$n" --squash
          git push origin --delete "$BRANCH" || true


  deploy:
    needs: [checks, merge]
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.merge.result == 'success' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Require basic-auth secrets
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          if [ -z "$BASIC_AUTH_USER" ] || [ -z "$BASIC_AUTH_PASS" ]; then
            echo "::error::Add repository secrets BASIC_AUTH_USER and BASIC_AUTH_PASS (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
      - name: Choose Worker secrets to publish
        id: sec
        env:
          BASIC_AUTH_USER_2: ${{ secrets.BASIC_AUTH_USER_2 }}
          BASIC_AUTH_PASS_2: ${{ secrets.BASIC_AUTH_PASS_2 }}
        run: | # the optional second account is published only when BOTH of its secrets exist
          {
            echo "names<<EOF"
            echo BASIC_AUTH_USER
            echo BASIC_AUTH_PASS
            if [ -n "$BASIC_AUTH_USER_2" ] && [ -n "$BASIC_AUTH_PASS_2" ]; then echo BASIC_AUTH_USER_2; echo BASIC_AUTH_PASS_2; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          BASIC_AUTH_USER_2: ${{ secrets.BASIC_AUTH_USER_2 }}
          BASIC_AUTH_PASS_2: ${{ secrets.BASIC_AUTH_PASS_2 }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: ${{ steps.sec.outputs.names }}
          command: deploy
      - name: Smoke test live site
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          BASIC_AUTH_USER_2: ${{ secrets.BASIC_AUTH_USER_2 }}
          BASIC_AUTH_PASS_2: ${{ secrets.BASIC_AUTH_PASS_2 }}
        run: |
          B=https://templates.aquariit.com
          check() { # url, expected status, extra curl args
            url=$1; want=$2; shift 2
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$@" "$url")
              if [ "$code" = "$want" ]; then echo "OK $code $url"; return 0; fi
              echo "Attempt $i: $url returned $code (want $want)"; sleep 10
            done
            return 1
          }
          LATEST=$(node -e "const l=require('./design-log.json');const k=e=>e.id||e.date;console.log(l.length?l.sort((a,b)=>k(a)<k(b)?1:-1).map(k)[0]:'')")
          J=$(mktemp)
          check "$B/" 303 -H 'Accept: text/html' || exit 1              # closed: page requests bounce to the sign-in page
          check "$B/design-log.json" 401 || exit 1                      # closed: data requests are refused (no popup)
          check "$B/login" 200 || exit 1
          check "$B/manifest.webmanifest" 200 || exit 1                 # public so the PWA can install
          check "$B/sw.js" 200 || exit 1
          check "$B/login" 401 -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=wrong-$RANDOM" || exit 1
          check "$B/login" 303 -c "$J" -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=$BASIC_AUTH_PASS" || exit 1
          grep -q aq_session "$J" || { echo "No session cookie was issued"; exit 1; }
          for path in "" design-log.json social-kits.json kit/ play/player.js ${LATEST:+$LATEST/}; do
            check "$B/$path" 200 -b "$J" || exit 1                      # signed-in (cookie) access
          done
          check "$B/design-log.json" 200 --user "$BASIC_AUTH_USER:$BASIC_AUTH_PASS" || exit 1  # scripts can still use a Basic header
          if [ -n "$BASIC_AUTH_USER_2" ] && [ -n "$BASIC_AUTH_PASS_2" ]; then                   # optional second account
            J2=$(mktemp)
            check "$B/login" 401 -X POST --data-urlencode "username=$BASIC_AUTH_USER_2" --data-urlencode "password=wrong-$RANDOM" || exit 1
            check "$B/login" 303 -c "$J2" -X POST --data-urlencode "username=$BASIC_AUTH_USER_2" --data-urlencode "password=$BASIC_AUTH_PASS_2" || exit 1
            check "$B/" 200 -b "$J2" || exit 1
          fi
      - name: Summary
        run: echo "Deployed. Home https://templates.aquariit.com/" >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [checks, merge, deploy]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open an issue so the failure is seen the same day (GitHub emails the repo owner)
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Pipeline failed: ${{ github.ref_name }}" \
            --body "The Template pipeline failed on \`${{ github.ref_name }}\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
