name: Reel publish

# (A template with film/ID/story.js is rendered as a directed film, see design/film-playbook.md; the others as a screen recording.)
# After every successful "Template pipeline" run: if the newest template has no rendered reel yet, render it (free, headless Chromium + ffmpeg),
# keep the MP4 in the "reels" release (persistent, private with the repo), open a "Reel ready" issue for the owner (GitHub emails/notifies) and
# redeploy once so the site can serve the video behind the sign-in (the deploy job downloads recent reels from the release).
# Nothing is posted to Instagram: the owner taps Post (semi-auto, so Instagram's own audio can be used).
on:
  workflow_run:
    workflows: ['Template pipeline']
    types: [completed]
  workflow_dispatch:
    inputs:
      id:
        description: Template id (empty = newest in design-log.json)
        required: false
        default: ''
      force:
        description: Render again even if a reel already exists
        type: boolean
        default: false
      draft:
        description: Phone draft (half resolution, no motion blur, with voice) uploaded as ID-draft.mp4; no issue, no redeploy
        type: boolean
        default: false

permissions:
  contents: write   # releases
  issues: write
  actions: write    # to start one redeploy

concurrency:
  # manual (forced) renders get their own queue: GitHub keeps only one waiting run per group, so an automatic run queued after a merge used to replace a
  # forced render that was still waiting (14 Oct 2026)
  group: reel-publish-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 80   # 28 s films with 3D hero shots render for ~35-45 min; supersampled films (timing.json ss 1.5) take ~50 min
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the template and see if its reel exists
        id: pick
        env:
          IN_ID: ${{ inputs.id }}
          IN_FORCE: ${{ inputs.force }}
          IN_DRAFT: ${{ inputs.draft }}
        run: |
          ID="${IN_ID:-$(node -e "const l=require('./design-log.json');const k=e=>e.id||e.date;console.log(l.map(k).sort().reverse()[0])")}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "draft=${IN_DRAFT:-false}" >> "$GITHUB_OUTPUT"
          if [ "$IN_FORCE" != "true" ] && [ "$IN_DRAFT" != "true" ] && gh release view reels --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ID.mp4"; then
            echo "Reel for $ID already exists: nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -f "film/$ID/HOLD" ] && [ "$IN_FORCE" != "true" ]; then
            echo "$ID is on hold (film/$ID/HOLD): no render."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$IN_ID" ] && [ ! -f "film/$ID/story.js" ]; then
            # website first (owner, 17 Oct 2026): a new template waits for the owner's OK; its film (film/ID/story.js) is made after that, and only then rendered
            echo "$ID has no film yet (website first, awaiting the owner's OK): no render."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install render tools (free, nothing committed)
        if: steps.pick.outputs.skip != 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 three@0.180.0   # three.js (MIT) for films with real 3D scenes
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Music and sound (only when a licensed music source is configured)
        if: steps.pick.outputs.skip != 'true'
        continue-on-error: true   # no source / rejected candidates = the film ships without a music bed (owner adds Instagram audio); never blocks the reel
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MUSIC_LICENCE_NOTE: ${{ secrets.MUSIC_LICENCE_NOTE }}
        run: |
          ID="${{ steps.pick.outputs.id }}"
          if [ -f "film/$ID/music-brief.json" ]; then node scripts/audio/produce.mjs "$ID" || echo "::notice::no music bed for $ID (exit $?)"; else echo "no film/$ID/music-brief.json: effects only"; fi
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - name: Cache the Kokoro voice model
        if: steps.pick.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-0.9.4-af_heart
      - name: Cache the licensed sound pack (CC0)
        if: steps.pick.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/aquarii-sfx
          key: aquarii-sfx-kenney-v1
      - name: Licensed sound pack (CC0, Kenney; falls back to the film's own effects)
        if: steps.pick.outputs.skip != 'true'
        continue-on-error: true
        run: bash scripts/audio/sfx-pack.sh
      - name: Voice-over (films with film/ID/voice.md; AI voice, owner plan 15 Oct 2026)
        if: steps.pick.outputs.skip != 'true'
        continue-on-error: true   # a voice failure never blocks the reel
        env:
          SFX_DIR: /home/runner/.cache/aquarii-sfx   # a voice failure renders with effects only and the issue says so
        run: |
          ID="${{ steps.pick.outputs.id }}"
          pip install numpy==2.1.3
          if [ -f "film/$ID/voice.md" ]; then
            sudo apt-get install -y --no-install-recommends espeak-ng
            pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu" "transformers==4.46.3" "kokoro==0.9.4" "soundfile==0.12.1" "misaki[en]==0.9.4"
            node scripts/film/voice.mjs "$ID" --out out/voice
          else echo "no film/$ID/voice.md: no voice-over"; fi
      - name: Render the reel
        if: steps.pick.outputs.skip != 'true'
        env:
          SFX_DIR: /home/runner/.cache/aquarii-sfx
        run: |
          set -o pipefail
          ID="${{ steps.pick.outputs.id }}"
          # a directed film (film/ID/story.js: virtual camera, beat-locked type, effects-only sound) when the template has one; otherwise, or if the film render fails,
          # the screen-recording renderer, without its generated music (CLAUDE.md: no music synthesised in code), so a reel is always produced
          if [ -f "film/$ID/story.js" ]; then
            VO=""; [ -f out/voice/final.wav ] && VO="--audio out/voice/final.wav"
            if [ "${{ steps.pick.outputs.draft }}" = "true" ]; then
              node scripts/film/render-film.mjs "$ID" --draft --variant A --workers 2 --out out/film $VO 2>&1 | tee render.log
              mkdir -p out/reels && cp "out/film/$ID-A.mp4" "out/reels/$ID-draft.mp4"
              gh release upload reels --repo "$REPO" --clobber "out/reels/$ID-draft.mp4"
              echo "draft: uploaded $ID-draft.mp4"; exit 0
            fi
            if node scripts/film/render-film.mjs "$ID" --variant A --workers 2 --out out/film $VO --deliver out/reels 2>&1 | tee render.log; then
              echo "format: film"
            else
              echo "::warning::film render failed, falling back to the screen recording"
              node scripts/render-reel.mjs "$ID" --out out/reels --no-audio 2>&1 | tee -a render.log
            fi
          else
            node scripts/render-reel.mjs "$ID" --out out/reels --no-audio --light 2>&1 | tee render.log   # a light day: recording + hook + end card (themes.md E)
            if [ -f out/voice/final.wav ]; then   # a light day with film/ID/voice.md + timing.json: lay the voice story under the recording (owner, 17 Oct 2026)
              ffmpeg -y -loglevel error -i "out/reels/$ID.mp4" -i out/voice/final.wav -filter_complex '[1:a]apad[a]' -map 0:v -map '[a]' -c:v copy -c:a aac -ar 48000 -b:a 192k -shortest -movflags +faststart "out/reels/$ID-vo.mp4"
              mv "out/reels/$ID-vo.mp4" "out/reels/$ID.mp4"; echo "voice-over laid under the light-day recording"
            fi
          fi
      - name: Check it, keep it in the reels release, tell the owner (GitHub issue, assigned so it emails and notifies)
        id: gate
        if: steps.pick.outputs.skip != 'true' && steps.pick.outputs.draft != 'true'
        run: |
          ID="${{ steps.pick.outputs.id }}"
          # quality gate first (design/aligned-plan.md "Reel recipe"; owner, 16 Oct 2026: a failed reel must never reach the site)
          # checks are per theme (design/themes.md): the film's S.dna.theme from its manifest, collage when it has none
          THEME=$(python3 -I -c "import json,sys; print((json.load(open(sys.argv[1])).get('dna') or {}).get('theme') or 'collage')" "film/$ID/manifest.json" 2>/dev/null || echo collage)
          [ -f "film/$ID/story.js" ] || THEME=demo   # no film: a light-day recording
          if python3 -I scripts/film/reel-gate.py "out/reels/$ID.mp4" --theme "$THEME" > gate.txt; then GATE=PASS; else GATE=FAIL; fi
          # a film with a voice script must carry its voice: a missing voice never passes silently
          if [ -f "film/$ID/voice.md" ] && [ ! -f out/voice/final.wav ]; then GATE=FAIL; echo "FAIL voice     film/$ID/voice.md exists but the voice-over failed (see the Voice-over step log)" >> gate.txt; fi
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          gh release view reels --repo "$REPO" >/dev/null 2>&1 || gh release create reels --repo "$REPO" --title "Reels" --latest=false \
            --notes "Rendered reels (MP4 + cover), one per template. Written by the Reel publish workflow; the site serves recent ones behind the sign-in."
          if [ "$GATE" = PASS ]; then gh release upload reels --repo "$REPO" --clobber "out/reels/$ID.mp4" "out/reels/$ID-cover.jpg" "out/reels/$ID.json"
          else cp "out/reels/$ID.mp4" "out/reels/$ID-needsfix.mp4"; gh release upload reels --repo "$REPO" --clobber "out/reels/$ID-needsfix.mp4"; fi   # kept for Claude to inspect; the site skips it
          # frame-by-frame review: contact sheets + motion graph, published next to the reel for Claude to read (not deployed: png)
          pip install Pillow==11.0.0 >/dev/null 2>&1 || true
          if python3 -I scripts/film/frame-review.py "out/reels/$ID.mp4" out/review --every 3 > review.txt 2>&1; then
            for f in out/review/*.png; do cp "$f" "out/review/$ID-review-$(basename "$f")"; done
            gh release upload reels --repo "$REPO" --clobber out/review/$ID-review-*.png || true
            { echo; echo "Frame review (Claude reads these before you see the reel):"; cat review.txt; } >> gate.txt
          fi
          cat gate.txt
          gh label create reel --repo "$REPO" --color 7C3AED --description "A reel is ready to post" 2>/dev/null || true
          node scripts/build-kits.mjs >/dev/null
          node scripts/reel-issue.mjs "$ID" > issue.md
          TITLE="$(node scripts/reel-issue.mjs "$ID" --title)"
          if [ "$GATE" = FAIL ]; then TITLE="Reel needs fix: $ID"; { echo "> **Quality gate: FAIL.** Not on the site, do not post. Reply \"fix\" in the Claude chat."; echo; echo '```'; cat gate.txt; echo '```'; echo; cat issue.md; } > issue2.md
          else { echo "> Quality gate: PASS"; echo '```'; cat gate.txt; echo '```'; echo; cat issue.md; } > issue2.md; fi
          URL=$(gh issue create --repo "$REPO" --title "$TITLE" --body-file issue2.md --label reel --assignee "${{ github.repository_owner }}"); echo "$URL"; NEW="${URL##*/}"
          # tidy (owner, 16 Oct 2026: close issues that are no longer in use): earlier issues for this same reel (needs fix, older ready, render failed)
          # are superseded by the one just opened; reel issues older than 3 days are past their posting slot
          OLD=$(date -u -d '3 days ago' +%FT%TZ)
          [ -n "$NEW" ] && gh issue list --repo "$REPO" --state open --limit 100 --json number,title,createdAt,labels \
            -q ".[] | select(.number != ${NEW}) | select(((.title | contains(\"$ID\")) and ((.title | startswith(\"Reel \")))) or (((.labels | map(.name) | index(\"reel\")) != null) and .createdAt < \"$OLD\")) | .number" |
            while read -r n; do gh issue close "$n" --repo "$REPO" --reason completed --comment "Closed automatically: superseded by #${NEW} or past its posting slot. The kit page still works." || true; done
      - name: Redeploy once so the site serves the new video
        if: steps.pick.outputs.skip != 'true' && steps.pick.outputs.draft != 'true' && steps.gate.outputs.gate == 'PASS'
        run: gh workflow run pipeline.yml --repo "$REPO" --ref main
      - name: Summary
        if: always() && steps.pick.outputs.skip != 'true'
        run: |
          { echo '### Reel publish'; echo '```'; cat render.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Report a failed render (so it is seen the same day)
        if: failure()
        run: |
          gh issue create --repo "$REPO" --title "Reel render failed: ${{ steps.pick.outputs.id }}" --assignee "${{ github.repository_owner }}" \
            --body "The Reel publish workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
