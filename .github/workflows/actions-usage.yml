name: Actions usage

# Once a day (about 02:10 IST) counts this month's GitHub Actions minutes the way GitHub bills them, for the meter in the Showreels app.
# The result goes to the private R2 bucket (c/showreel-usage-actions.json). Old reel videos are no longer removed here: the R2 lifecycle
# rule deletes them 15 days after upload (owner, 3 Nov 2026; the release clean-up is in attic/scripts/actions-usage-cleanup.mjs).
# The allowance is the repo variable ACTIONS_MINUTES_ALLOWANCE (default 2000, GitHub Free; set 3000 for Pro).
on:
  schedule:
    - cron: '40 20 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: actions-usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Count
        env:
          ALLOWANCE: ${{ vars.ACTIONS_MINUTES_ALLOWANCE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash scripts/r2.sh get c/showreel-usage-actions.json prev.json || rm -f prev.json
          node scripts/actions-usage.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/r2.sh put showreel-usage-actions.json c/showreel-usage-actions.json
