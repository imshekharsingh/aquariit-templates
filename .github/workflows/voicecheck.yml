name: Voice check
# Re-check a reel already in the private R2 bucket, without re-rendering it: its narration transcribed and compared with the script,
# and each sentence timed for pace and pauses (scripts/showreel/voicecheck.py; the Showreel workflow runs the same check on every render).
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Reel config, e.g. scripts/explainer/stagger.json (empty with sample)"
        required: false
      sample:
        description: "Instead of a reel: lines to speak and hear before/after a lexicon fix, one per line break or '|' (scripts/voice/sample.py)"
        required: false
      sample_off:
        description: "With sample: the say.json words left out for 'before', comma-separated (e.g. photos,photo)"
        required: false
      speed:
        description: "With sample: Kokoro speed (the reel's voice.speed)"
        required: false
        default: '1.0'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CFG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sample
        # a word before and after its say.json fix, spoken by Kokoro and heard by the recogniser, with no reel render (11 Nov 2026: "photos")
        if: inputs.sample != ''
        env:
          SAMPLE: ${{ inputs.sample }}
          OFF: ${{ inputs.sample_off }}
          SPEED: ${{ inputs.speed }}
        run: |
          timeout 120 sudo apt-get install -y --no-install-recommends espeak-ng || echo 'espeak-ng from apt unavailable; using the bundled one'
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro==0.9.4 soundfile==0.12.1 preshed==3.0.13 cymem==2.0.13 murmurhash==1.0.15 srsly==2.5.4 spacy==3.8.16 thinc==8.3.13 blis==1.3.3 faster-whisper==1.1.1
          set -o pipefail
          python3 -I -c "import os,re,subprocess,sys; ls=[x.strip() for x in re.split(r'[|\n]', os.environ['SAMPLE']) if x.strip()]; sys.exit(subprocess.call([sys.executable, 'scripts/voice/sample.py', '--speed', os.environ.get('SPEED') or '1.0', '--off', os.environ.get('OFF', '')] + ls))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check
        if: inputs.sample == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install faster-whisper==1.1.1 requests
          NAME=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "$CFG")
          mkdir -p out && bash scripts/r2.sh get "v/$NAME.mp4" "out/$NAME.mp4" || { echo "::error::v/$NAME.mp4 is not in R2 (deleted 15 days after upload?)"; exit 1; }
          ffmpeg -y -loglevel error -i "out/$NAME.mp4" -vn -ac 1 -ar 16000 out/voice.wav
          python3 scripts/showreel/voicecheck.py "$CFG" out/voice.wav "$GITHUB_STEP_SUMMARY"
