name: R2

# The private reel store (owner, 3 Nov 2026: reel media moves from the public GitHub releases to a private Cloudflare R2 bucket that only
# the signed-in app serves). scripts/r2.sh does the work. Run by hand: Actions -> R2 -> action.
#   check: the token can create, write and read the bucket (prints R2_OK=yes / no)
#   copy:  copy every asset of the reels, techreel and study releases into R2 and verify each (releases untouched)
#   move:  the same, then delete the verified assets from the releases
#   site:  sign in to the app: the Showreels list loads, a reel plays (Range -> 206), and its old public release URL is gone (404);
#          and the first 256 KB of the newest reel's full MP4 (what the app plays, owner 11 Nov 2026) hold its moov atom
#   faststart: reels in the app whose full MP4 has its moov atom after mdat get it moved first (-c copy, no re-encode)
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [check, copy, move, site, faststart]
        default: check

permissions:
  contents: write

concurrency:
  group: r2
  cancel-in-progress: false

jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: inputs.action != 'site'
      - name: Check
        if: inputs.action == 'check'
        run: bash scripts/r2.sh check
      - name: Copy
        if: inputs.action == 'copy'
        run: bash scripts/r2.sh migrate
      - name: Move
        if: inputs.action == 'move'
        run: bash scripts/r2.sh migrate --delete
      - name: Faststart
        if: inputs.action == 'faststart'
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout 180 sh -c 'sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg' || { echo "::error::no ffmpeg"; exit 1; }
          fi
          B=https://templates.aquariit.com; J=$(mktemp)
          curl -s --retry 3 -o /dev/null -c "$J" -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=$BASIC_AUTH_PASS" "$B/login"
          curl -s --retry 3 -b "$J" "$B/api/showreels" > list.json
          bash scripts/r2.sh faststart list.json
      - name: Site
        if: inputs.action == 'site' || inputs.action == 'faststart'
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          curl() { command curl --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors --retry-delay 5 "$@"; }
          B=https://templates.aquariit.com; J=$(mktemp); fail=0
          curl -s -o /dev/null -c "$J" -X POST --data-urlencode "username=$BASIC_AUTH_USER" --data-urlencode "password=$BASIC_AUTH_PASS" "$B/login"
          curl -s -b "$J" "$B/api/showreels" > list.json
          node -e 'const s=JSON.parse(require("fs").readFileSync("list.json","utf8")).showreels||[]; console.log(`SHOWREELS: ${s.length} listed, ${s.filter(x=>x.video).length} with video, ${s.filter(x=>x.cover).length} with cover`)' || { echo "::error::the Showreels list did not load"; cat list.json; exit 1; }
          n=$(node -e 'const s=JSON.parse(require("fs").readFileSync("list.json","utf8")).showreels||[]; const v=s.find(x=>x.video); console.log(v?v.name:"")')
          [ -n "$n" ] || { echo "::error::no reel with a video"; exit 1; }
          v=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' -H 'Range: bytes=0-1023' -b "$J" "$B/reels/$n.mp4"); echo "PLAY $n.mp4 signed in, Range 0-1023: $v"
          [ "$v" = "206 1024" ] || fail=1
          c=$(curl -s -o /dev/null -w '%{http_code}' -b "$J" "$B/reels/$n-cover.jpg"); echo "COVER $n-cover.jpg: $c"; [ "$c" = 200 ] || fail=1
          o=$(curl -s -o /dev/null -w '%{http_code}' "$B/reels/$n.mp4"); echo "SIGNED OUT $n.mp4: $o"; [ "$o" = 401 ] || fail=1
          g=$(command curl -s -L -o /dev/null -w '%{http_code}' "https://github.com/$REPO/releases/download/reels/$n.mp4"); echo "OLD PUBLIC URL github.com/.../releases/download/reels/$n.mp4: $g"; [ "$g" = 404 ] || fail=1
          # first byte to playable (owner, 11 Nov 2026: the app plays the full MP4): the newest reel's first 256 KB hold the whole moov atom,
          # and a Range from the middle of the file comes back 206 (seeking)
          sz=$(node -e 'const s=JSON.parse(require("fs").readFileSync("list.json","utf8")).showreels; console.log(s.find(x=>x.name===process.argv[1]).size)' "$n")
          curl -s -o head.bin -w '%{http_code} %{size_download}\n' -H 'Range: bytes=0-262143' -b "$J" "$B/reels/$n.mp4" | sed "s/^/FULL_RANGE $n.mp4 0-262143: /"
          node scripts/showreel/mp4boxes.mjs head.bin --bytes 262144 --need-moov-first || fail=1
          m=$((sz / 2)); s=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' -H "Range: bytes=$m-$((m + 65535))" -b "$J" "$B/reels/$n.mp4"); echo "SEEK $n.mp4 bytes $m-$((m + 65535)) of $sz: $s"
          [ "$s" = "206 65536" ] || fail=1
          h=$(curl -s -D - -o /dev/null -H 'Range: bytes=0-1' -b "$J" "$B/reels/$n.mp4" | grep -i '^cache-control' | tr -d '\r'); echo "$h"
          for t in reels techreel study; do echo "RELEASE $t: $(gh api "repos/$REPO/releases/tags/$t" -q '.assets | length' 2>/dev/null || echo none) assets"; done
          [ $fail = 0 ] && echo "SITE_OK=yes" || { echo "SITE_OK=no"; exit 1; }
