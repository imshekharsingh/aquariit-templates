name: Media

# Free real images for a tech or Turns Out reel (owner, 14 Nov 2026: "yes to free real images ... take those and work or animate your design
# around it"; CLAUDE.md "Free real images and footage"). GitHub does the fetching: for each entry of the config's "media" list,
# scripts/media/fetch.py searches keyless APIs (Wikimedia Commons, Openverse cc0/pdm/by, NASA, Library of Congress), keeps only allowed
# licences, downloads, resizes and cuts a foreground layer when asked; the files go to the private R2 bucket under media/<reel name>/
# (no expiry) and, with the contact sheet, to the run's "media-<name>" artifact (7 days: the builder's and the critic's stills).
# The log's MEDIA_JSON line is copied back into the config (file, author, licence, source_url per entry; Output QA LICENCE reads them).
# The Showreel and Tech reel workflows pull the files at render time (scripts/media/pull.sh). Run by hand: Actions -> Media -> config.
on:
  workflow_dispatch:
    inputs:
      config:
        description: Reel config (a scripts/channel3 config or techreel/topics/<slug>.json) with a "media" list
        default: scripts/channel3/niagara-dry.json

permissions:
  contents: read

jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tools
        run: |
          pip install --quiet Pillow==11.0.0 numpy==2.1.3 opencv-python-headless==4.10.0.84
          # the cut-out model (u2net, about 170 MB, fetched by rembg on first use); GrabCut is the fallback when it is not there
          pip install --quiet "rembg[cpu]==2.0.59" || echo "rembg unavailable: GrabCut only"
      - name: Fetch
        id: fetch
        run: |
          set -o pipefail
          NAME=$(python3 -I -c "import json,sys; c=json.load(open(sys.argv[1])); print(c.get('name') or 'showreel-tech-' + c['slug'])" "$CFG")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          python3 scripts/media/fetch.py "$CFG" "out/media/$NAME" 2>&1 | tee fetch.log
          grep -q '^MEDIA: all' fetch.log || echo "::warning::$(grep '^MEDIA: ' fetch.log)"
      - uses: actions/setup-node@v4   # wrangler (package.json) uploads to R2
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep it in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          N="${{ steps.fetch.outputs.name }}"
          for f in out/media/$N/*; do bash scripts/r2.sh put "$f" "media/$N/$(basename "$f")" || exit 1; done
      - name: Files and contact sheet (kept 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ steps.fetch.outputs.name }}
          path: out/media/${{ steps.fetch.outputs.name }}/
          retention-days: 7
