name: Instagram collect

# Once a day (about 01:45 IST) reads your Instagram account and every recent reel's numbers (read-only, official API) and stores them in the
# site's D1 database for /performance/. Nothing is ever posted or changed on Instagram. Run it by hand any time: Actions -> "Instagram collect".
# Needs the GitHub secrets INSTAGRAM_TOKEN, BASIC_AUTH_USER and BASIC_AUTH_PASS.
on:
  schedule:
    - cron: '14 20 * * *'
    # Same-morning numbers for the 13:39 Turns Out build and the 19:00 reel (owner, 5 Nov 2026); keeps the nightly follower snapshot.
    # 05:23 UTC = 10:53 IST, not 07:00 UTC: GitHub starts scheduled runs late (the 20:14 UTC run started 3-6 h late, 1-6 Nov) and drops some
    # at :00, so an off-minute about 2.5 h early still lands before the 13:39 build on a normal delay and before the 19:00 build on a long one.
    - cron: '23 5 * * *'
    # Post check (owner, 7 Nov 2026: the owner never reports a post): latest 5 posts per account, matched and auto-marked, ~40 min after each slot.
    # IST -> UTC, off-minutes: 13:37 + 14:13 IST (web 13:00, Turns Out 13:30), Fri 18:07 IST (tech 17:30), 19:37 IST (web + tech 19:00),
    # 20:43 IST (Turns Out 20:00), 23:43 IST (catch-all). Each run prints POSTED / NOT POSTED lines per channel for today.
    - cron: '7,43 8 * * *'
    - cron: '37 12 * * 5'
    - cron: '7 14 * * *'
    - cron: '13 15 * * *'
    - cron: '13 18 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: Read from Instagram and show the result, but do not save it
        type: boolean
        default: false
      refresh:
        description: Also refresh the token now (it is refreshed weekly automatically)
        type: boolean
        default: false
      post_check:
        description: Light post check only (latest 5 posts, match + mark, POSTED lines; under a minute)
        type: boolean
        default: false
      state_only:
        description: Only print the posting state (scripts/post-state.mjs), no Instagram read
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ig-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        if: inputs.state_only != true
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_TOKEN_2: ${{ secrets.INSTAGRAM_TOKEN_2 }}
          INSTAGRAM_TOKEN_3: ${{ secrets.INSTAGRAM_TOKEN_3 }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          DRY: ${{ inputs.dry }}
          REFRESH: ${{ inputs.refresh }}
          MIDDAY: ${{ github.event.schedule == '23 5 * * *' }}
          POST_CHECK: ${{ inputs.post_check == true || (github.event_name == 'schedule' && github.event.schedule != '23 5 * * *' && github.event.schedule != '14 20 * * *') }}
        run: |
          flags=""
          [ "$POST_CHECK" = "true" ] && flags="$flags --post-check"
          [ "$MIDDAY" = "true" ] && flags="$flags --midday"
          [ "$DRY" = "true" ] && flags="$flags --dry"
          [ "$REFRESH" = "true" ] && flags="$flags --refresh"
          set -o pipefail   # a failed collect must fail the run, or the owner is never told (the log goes through tee)
          ok=0
          node scripts/ig-collect.mjs $flags 2>&1 | tee collect.log || ok=1
          if [ -n "$INSTAGRAM_TOKEN_2" ]; then   # the second account (owner, 21 Oct 2026)
            echo; echo "---- second account ----"
            INSTAGRAM_TOKEN="$INSTAGRAM_TOKEN_2" node scripts/ig-collect.mjs $flags --slot 2 2>&1 | tee -a collect.log || ok=1
          fi
          if [ -n "$INSTAGRAM_TOKEN_3" ]; then   # the third account, Turns Out @itturns.out (owner, 31 Oct 2026)
            echo; echo "---- third account ----"
            INSTAGRAM_TOKEN="$INSTAGRAM_TOKEN_3" node scripts/ig-collect.mjs $flags --slot 3 2>&1 | tee -a collect.log || ok=1
          fi
          exit $ok
      - name: Audit numbers (the daily run reads AUDIT_CHANNELS from this step's log; scripts/audit-numbers.mjs)
        if: success() && inputs.dry != true && inputs.state_only != true && !(inputs.post_check == true || (github.event_name == 'schedule' && github.event.schedule != '23 5 * * *' && github.event.schedule != '14 20 * * *'))
        continue-on-error: true
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: node scripts/audit-numbers.mjs
      - name: Posting state (per channel, due -7..+2 days; PROBLEM lines; scripts/post-state.mjs)
        if: success() && inputs.dry != true && !(inputs.post_check == true || (github.event_name == 'schedule' && github.event.schedule != '23 5 * * *' && github.event.schedule != '14 20 * * *'))
        continue-on-error: true
        env:
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          STATE_ONLY: ${{ inputs.state_only }}
        run: |
          if [ "$STATE_ONLY" = "true" ]; then node scripts/post-state.mjs; else node scripts/post-state.mjs --fresh; fi
      - name: Tell the owner when it fails (one open issue at a time)
        if: failure()
        run: |
          [ -n "$(gh issue list --repo "$REPO" --state open --search 'Instagram collector failed in:title' --json number -q '.[0].number')" ] && exit 0
          msg=$(grep -E '^✗' collect.log | head -n 1)
          gh issue create --repo "$REPO" --title "Instagram collector failed" --assignee "${{ github.repository_owner }}" \
            --body "The daily Instagram collector could not finish. ${msg:-See the run for details.}"$'\n\n'"Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
