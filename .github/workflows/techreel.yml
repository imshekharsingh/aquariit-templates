name: Tech reel

# Tech explainer reels (owner, 24 Oct 2026): python3 techreel/make.py <slug> renders the voice, frames, sound and QA for one topic file.
# The MP4, contact sheet, QA report and word timings go to the private R2 bucket under techreel/ (scripts/r2.sh; owner, 3 Nov 2026). Run by hand: Actions -> Tech reel -> slug.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Topic file in techreel/topics (without .json)
        default: walmart-agents

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - name: Mandatory Gate
        # no render without review/tech/showreel-tech-<slug>.md, items 1-12 and the FLOW items 14-17 PASS (design/mandatory.md; owner, 7 Nov 2026)
        run: node scripts/review-gate.mjs --name "showreel-tech-$SLUG"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tools
        # GitHub's Ubuntu mirror sometimes crawls (26 Oct: renders stalled 15-20 minutes): apt gets a few minutes, then each tool
        # comes from a source that does not need it (a static ffmpeg from PyPI, Inter's own release, misaki's bundled espeak-ng)
        timeout-minutes: 15
        run: |
          if ! timeout 240 sh -c 'sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter espeak-ng'; then
            # into a folder of its own and linked by path (3 Nov 2026: pip fell back to a user install that python3 -I cannot see)
            python3 -m pip install --quiet --target "$RUNNER_TEMP/iff" imageio-ffmpeg==0.6.0
            f=$(find "$RUNNER_TEMP/iff" -type f -name "ffmpeg-*" | head -1); [ -n "$f" ] || { echo "::error::no ffmpeg in imageio-ffmpeg"; exit 1; }; chmod +x "$f"; sudo ln -sf "$f" /usr/local/bin/ffmpeg
            curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
            sudo mkdir -p /usr/share/fonts/truetype/inter && sudo unzip -oj -q /tmp/inter.zip 'extras/ttf/Inter-*.ttf' -d /usr/share/fonts/truetype/inter
          fi
          ffmpeg -hide_banner -version | head -1
          pip install numpy==2.1.3 scipy==1.14.1 Pillow==11.0.0 soundfile==0.12.1
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro==0.9.4 preshed==3.0.13 cymem==2.0.13 murmurhash==1.0.15 srsly==2.5.4 spacy==3.8.16 thinc==8.3.13 blis==1.3.3
          # the voice's English model, installed before Kokoro would fetch it itself (8 Nov 2026: GitHub's release download
          # answered 504 for every try for an hour): a few tries with backoff, then the same wheel from spaCy's Hugging Face copy
          W=en_core_web_sm-3.8.0; ok=
          for d in 0 5 15 30 60; do sleep $d; pip install --quiet "https://github.com/explosion/spacy-models/releases/download/$W/$W-py3-none-any.whl" && { ok=1; break; }; done
          # (the Hugging Face file is named "-any-", which pip refuses as a wheel name: saved under the real one first)
          [ -n "$ok" ] || { curl -fsSL --retry 3 -o "$RUNNER_TEMP/$W-py3-none-any.whl" "https://huggingface.co/spacy/en_core_web_sm/resolve/main/en_core_web_sm-any-py3-none-any.whl" && pip install "$RUNNER_TEMP/$W-py3-none-any.whl"; }
          python3 -c "import spacy; spacy.load('en_core_web_sm'); print('en_core_web_sm ok')"
      - name: Render
        run: |
          set -o pipefail
          python3 techreel/make.py "$SLUG" 2>&1 | grep -v "^frame " | tee render.log
      - name: Voice check
        # the narration transcribed and compared with the script, and each line timed for pace and breaths (scripts/showreel/voicecheck.py)
        continue-on-error: true
        run: |
          pip install faster-whisper==1.1.1 requests
          python3 -I -c "import json,sys; t=json.load(open(sys.argv[1])); json.dump({'voice': {'text': ' '.join(l['text'] for l in t['lines'])}}, open('vc.json','w'))" "techreel/topics/$SLUG.json"
          python3 scripts/showreel/voicecheck.py vc.json "out/techreel/$SLUG/vo.wav" "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4   # wrangler (package.json) uploads to R2
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep it in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D="out/techreel/$SLUG"
          cp "$D/contact.png" "$D/$SLUG-contact.png"; cp "$D/qa.txt" "$D/$SLUG-qa.txt"; cp "$D/vo.json" "$D/$SLUG-vo.json"
          for f in "$SLUG.mp4" "$SLUG-contact.png" "$SLUG-qa.txt" "$SLUG-vo.json"; do bash scripts/r2.sh put "$D/$f" "$(case $f in *.mp4|*.png) echo v;; *) echo c;; esac)/techreel/$f" || exit 1; done
          cat "$D/qa.txt"
          # also on the Showreels page with its post text (owner, 26 Oct), as showreel-tech-<slug>
          N="showreel-tech-$SLUG"; cp "$D/$SLUG.mp4" "$D/$N.mp4"
          python3 -I -c "import json,sys; t=json.load(open(sys.argv[1])); p=t.get('post',{}); json.dump({'name': sys.argv[2], 'caption': p.get('caption',''), 'keywords': p.get('keywords',[]), 'hashtags': p.get('hashtags',[])}, open(sys.argv[3],'w'), ensure_ascii=False, indent=1)" "techreel/topics/$SLUG.json" "$N" "$D/$N.json"
          ffmpeg -y -loglevel error -ss 2 -i "$D/$N.mp4" -frames:v 1 -q:v 3 "$D/$N-cover.jpg"
          node scripts/showreel/mp4boxes.mjs "$D/$N.mp4" --need-moov-first
          bash scripts/showreel/play.sh "$D/$N.mp4" "$D/$N-play.mp4"   # the light copy the app plays (owner, 6 Nov 2026)
          for f in "$N.mp4" "$N-play.mp4" "$N.json" "$N-cover.jpg"; do bash scripts/r2.sh put "$D/$f" || exit 1; done
      - name: Contact sheet and QA for the review (kept 2 days)
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: |
            out/techreel/${{ inputs.slug }}/${{ inputs.slug }}-contact.png
            out/techreel/${{ inputs.slug }}/${{ inputs.slug }}-qa.txt
          retention-days: 2
