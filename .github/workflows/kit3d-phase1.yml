name: 3D kit phase 1 preview

# One-off preview (owner chat, 25 Nov 2026): renders the hidden 7 s demo techkit/scenes/kit3d-phase1-demo.html (never posted) like test-3d.yml.
# frames jobs do (headless Chrome on the runner's software GPU, 60 fps, parts side by side), joins with the same tmix blur to 30 fps and keeps the MP4
# as an artifact. The log prints seconds per frame per part. Run by hand: Actions -> 3D kit phase 1 preview.
run-name: "3D kit phase 1 preview"
on:
  workflow_dispatch:
    inputs:
      parts:
        description: Frame jobs side by side (1-8)
        default: '6'

permissions:
  contents: read

jobs:
  frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Frames
        run: |
          npm i --no-save --no-audit --no-fund playwright-core@1.49.1
          export CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          python3 scripts/3dkit-assemble.py
          mkdir -p frames
          # 420 frames (7 s at 60 fps) in 6 parts of 70
          S=$(( ${{ matrix.part }} * 70 )); E=$(( S + 70 ))
          START=$(date +%s); node techkit/capture.cjs out/3dkit/scene.html frames 60 $S $E 2>&1 | tee cap.log
          echo "PART ${{ matrix.part }}: $(( $(date +%s) - START )) s wall for 70 frames incl. browser start" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -1 cap.log | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.part }}
          path: frames
          retention-days: 1
          compression-level: 0

  join:
    needs: frames
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: frames
      - name: Join
        run: |
          ls frames | wc -l
          ffmpeg -hide_banner -loglevel error -framerate 60 -i frames/f%05d.jpg -vf "tmix=frames=2:weights='1 1',fps=30" -c:v libx264 -crf 17 -pix_fmt yuv420p -movflags +faststart kit3d-phase1.mp4
          ls -l kit3d-phase1.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kit3d-phase1
          path: kit3d-phase1.mp4
          retention-days: 7
