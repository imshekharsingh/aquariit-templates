name: Owner answers

# The app's "Needs you" list (owner, 1 Nov 2026). A Claude session dispatches this to read the owner's replies (action read: prints
# "ANSWER <id> ..." lines), add questions (add), clear replies it has acted on (clear), mark reels uploaded (mark) or clear a mark tapped by mistake (unmark); read also prints the owner's new Feedback items ("FEEDBACK <id> ..."), feedback-done marks them done with a note. Format in scripts/asks.mjs. A few seconds.
on:
  workflow_dispatch:
    inputs:
      action:
        description: read (answers + new feedback), add, clear, mark, unmark, feedback (new feedback only), feedback-done, refs (new references + previews) or refs-done
        type: choice
        options: [read, add, clear, mark, unmark, feedback, feedback-done, refs, refs-done]
        default: read
      asks:
        description: 'add: [{"id":"x","question":"...","why":"...","kind":"yesno|done|text"}] · clear: ["x"] · mark: {"showreel-x":"ISO time"} · unmark: ["showreel-x"] · feedback-done: {"ids":[3],"note":"what was done"} · refs-done: {"ids":[3],"state":"studied|used","note":"..."}'
        type: string
        required: false

permissions:
  contents: read

jobs:
  asks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - name: ffmpeg for reference previews
        if: inputs.action == 'refs'
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Owner answers
        env:
          ACTION: ${{ inputs.action }}
          ASKS: ${{ inputs.asks }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: node scripts/asks.mjs | tee -a "$GITHUB_STEP_SUMMARY"
