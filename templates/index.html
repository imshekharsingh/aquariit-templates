<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showreels · Studio</title>
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0b0d14;--card:#141724;--ink:#f1efe9;--mute:#9aa0b2;--line:#252a3b;--accent:#7c8cff;--ok:#6fd49a}
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 120px}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  a{color:inherit}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0}
  .brand{font:800 1rem system-ui,sans-serif;letter-spacing:-.01em}
  .tr{display:flex;gap:8px}
  button.pill{background:transparent;color:var(--ink);cursor:pointer}
  button.pill:disabled{opacity:.6;cursor:default}
  .pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;text-decoration:none;font:700 .85rem system-ui,sans-serif}
  h1{font:800 2rem/1.05 system-ui,sans-serif;letter-spacing:-.02em;margin:8px 0 6px}
  .lede{color:var(--mute)}
  .reel{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
  .reel video{display:block;width:100%;aspect-ratio:9/16;background:#000;object-fit:cover}
  .body{padding:16px 16px 18px}
  .name{font:700 1rem system-ui,sans-serif}
  .meta{color:var(--mute);font-size:.85rem;margin-top:2px}
  .cap{white-space:pre-wrap;margin-top:12px;padding:12px 14px;border-radius:14px;background:#0e1019;border:1px solid var(--line);font-size:.9rem;color:#d9d7d0}
  .cap.wait{color:#8e8a80}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font:700 .9rem system-ui,sans-serif;text-decoration:none;cursor:pointer}
  .btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.done{background:var(--ok);color:#06200f}
  .btn.tick.on{background:var(--ok);color:#06200f;border-color:var(--ok)}
  .btn:disabled{opacity:.5;cursor:default}
  .when{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;margin-bottom:10px;border-radius:999px;background:#1d2133;font:700 .8rem system-ui,sans-serif;color:var(--ink)}
  .when.now{background:var(--accent);color:#0b0d14}
  .when.ok{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ok);color:var(--ok)}
  .reel.posted video{opacity:.55}
  .tile{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:10px 14px 10px 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
  .tile .th{flex:none;width:54px;aspect-ratio:9/16;border-radius:10px;background:#000 center/cover no-repeat}
  .tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .tile .when{margin:0;min-height:26px;font-size:.75rem}
  .tile .chev{font:700 1.6rem/1 system-ui,sans-serif;color:var(--mute)}
  .tile.posted .th{opacity:.55}
  .empty{margin-top:30px;color:var(--mute)}
  /* one tab per channel (owner, 27 Oct 2026; Channel 3 pilots 31 Oct): its own accent, posting window and queue */
  body[data-ch="web"]{--accent:#7c8cff}
  body[data-ch="tech"]{--accent:#3ee08f}
  body[data-ch="c3"]{--accent:#ffb454}
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0 14px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:18px}
  .tab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;min-height:56px;padding:9px 8px;border:0;border-radius:13px;background:transparent;color:var(--mute);text-align:left;cursor:pointer;font:inherit}
  .tab b{font:800 .8rem system-ui,sans-serif;color:var(--ink);letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab span{font:600 .7rem system-ui,sans-serif}
  .tab[aria-selected="true"]{background:#1d2133;box-shadow:inset 0 0 0 1.5px var(--tc)}
  .tab[aria-selected="true"] span{color:var(--tc)}
  .tab.web{--tc:#7c8cff}
  .tab.tech{--tc:#3ee08f}
  .tab.c3{--tc:#ffb454}
  /* the channel's profile (owner, 31 Oct 2026): what goes on its Instagram profile, one Copy button per field, the logo to download */
  .prof{margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:18px}
  .prof summary{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;cursor:pointer;list-style:none}
  .prof summary::-webkit-details-marker{display:none}
  .prof summary img,.prof summary .ph{flex:none;width:44px;height:44px;border-radius:50%;background:#fff}
  .prof summary .ph{display:grid;place-items:center;background:#1d2133;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font:800 1.1rem system-ui,sans-serif}
  .about{margin:-2px 0 8px;color:var(--mute);font-size:.85rem}
  .prof .who{flex:1;min-width:0;display:flex;flex-direction:column}
  .prof .who b{font:800 .95rem system-ui,sans-serif}
  .prof .who span{color:var(--mute);font-size:.8rem}
  .prof .chev{color:var(--mute);font:700 .8rem system-ui,sans-serif}
  .prof[open] .chev{color:var(--accent)}
  .prof .in{padding:0 14px 14px}
  .prof .f{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .prof .f div{flex:1;min-width:0}
  .prof .f small{display:block;color:var(--mute);font:700 .7rem system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .prof .f p{overflow-wrap:anywhere;font-size:.9rem}
  .prof .f .btn{flex:none;min-height:40px;padding:0 14px;font-size:.8rem}
  .tab .due{color:var(--tc)}
  .reel{border-top:3px solid var(--accent)}
  /* GitHub Actions minutes this month (owner, 27 Oct 2026), from the nightly "Actions usage" workflow */
  .use{margin:4px 0 16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;font-size:.8rem;color:var(--mute)}
  .use summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;color:var(--ink);font-weight:700}
  .use summary::-webkit-details-marker{display:none}
  .bar{height:8px;margin:9px 0 6px;border-radius:99px;background:#1d2133;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
  .bar.warn i{background:#f2c14e}
  .bar.over i{background:#ff6b6b}
  .use ul{margin:8px 0 0;padding:0;list-style:none}
  .use li{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid var(--line)}
  /* posted more than 7 days ago: folded at the bottom (owner, 27 Oct 2026); MP4s go 30 days after upload, cover and post text stay */
  .src{margin-top:12px;padding:10px 14px 12px;border:1px solid var(--line);border-radius:14px;font-size:.85rem}
  .src small{display:block;color:var(--mute);font:700 .7rem system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .src ol{margin:6px 0 10px;padding-left:18px}
  .src li{margin:3px 0}
  .src a{color:#d9d7d0;overflow-wrap:anywhere}
  .old{margin-top:22px}
  .old summary{cursor:pointer;color:var(--mute);font:700 .85rem system-ui,sans-serif;min-height:44px;display:flex;align-items:center}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">Studio</span><span class="tr"><button class="pill" id="refresh" type="button">Refresh</button><a class="pill" href="/archive/">Archive</a></span></div>
  <div class="tabs" role="tablist" aria-label="Channel">
    <button class="tab web" role="tab" type="button" data-ch="web" aria-selected="true"><b>@webin20sec</b><span>Web fixes</span></button>
    <button class="tab tech" role="tab" type="button" data-ch="tech" aria-selected="false"><b>@techin20sec</b><span>Tech news</span></button>
    <button class="tab c3" role="tab" type="button" data-ch="c3" aria-selected="false"><b>Channel 3</b><span>True stories</span></button>
  </div>
  <details class="prof" id="prof" hidden><summary>Profile</summary></details>
  <details class="use" id="use" hidden><summary><span>GitHub minutes</span><span id="use-n"></span></summary><div class="bar" id="use-bar"><i></i></div><div id="use-note"></div><ul id="use-list"></ul></details>
  <h1 id="title">Showreels</h1>
  <p class="lede" id="lede">The next reel to post is open; tap any other to open it. Copy the post text, save the video, post it, then mark it uploaded.</p>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<script>
(function(){
  var list = document.getElementById('list'), caps = fetch('/showreels/captions.json', { credentials: 'same-origin' }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; });
  // refresh (owner, 25 Oct): the installed app can resume an old copy of this page and never reload on its own. The button drops the
  // offline copies, asks for a new service worker if there is one and reloads; after 15 minutes in the background the app reloads itself
  var rb = document.getElementById('refresh'), hiddenAt = 0;
  function refresh(){ rb.disabled = true; rb.textContent = 'Refreshing…';
    var sw = 'serviceWorker' in navigator ? navigator.serviceWorker.getRegistration().then(function(r){ return r && r.update(); }) : Promise.resolve();
    var cl = window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.filter(function(k){ return k.indexOf('aquarii-') === 0; }).map(function(k){ return caches.delete(k); })); }) : Promise.resolve();
    Promise.all([sw, cl]).catch(function(){}).then(function(){ location.reload(); }); }
  rb.addEventListener('click', refresh);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 15 * 60 * 1000) refresh(); });
  function el(t, c, txt){ var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
  // what gets pasted into Instagram: the caption, one line of niche search keywords, then exactly 5 niche hashtags (owner, 22 Oct 2026)
  function postText(j){ var t = j.caption.trim(); if (j.keywords && j.keywords.length) t += '\n\n' + j.keywords.slice(0, 6).join(' · '); if (j.hashtags && j.hashtags.length) t += '\n\n' + j.hashtags.slice(0, 5).join(' '); return t; }
  // never navigate to the mp4: in the installed iOS app that opens a file viewer with no way back. Fetch it, then hand it to the share sheet ("Save Video"),
  // or download it from a blob URL where sharing files is not supported
  function save(s, btn){
    if (btn.file) return share(btn);
    if (btn.disabled) return; btn.disabled = true; btn.textContent = 'Preparing…';
    fetch(s.video, { credentials: 'same-origin' }).then(function(r){ if (!r.ok) throw 0; return r.blob(); }).then(function(blob){
      var f = new File([blob], s.name + '.mp4', { type: 'video/mp4' }); btn.disabled = false;
      if (navigator.canShare && navigator.canShare({ files: [f] })) { btn.file = f; return share(btn); }
      var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(u); }, 60000); flash(btn, 'Downloaded');
    }).catch(function(){ btn.disabled = false; flash(btn, 'Try again'); });
  }
  // the share sheet needs a fresh tap: if the download took too long, the file is kept and the next tap opens it straight away
  function share(btn){
    navigator.share({ files: [btn.file] }).then(function(){ flash(btn, 'Saved'); }, function(e){ btn.textContent = e && e.name === 'NotAllowedError' ? 'Ready: tap to save' : 'Save video'; });
  }
  function flash(btn, t){ btn.textContent = t; setTimeout(function(){ if (btn.textContent === t) btn.textContent = 'Save video'; }, 1800); }
  function mb(n){ return (n / 1048576).toFixed(1) + ' MB'; }
  // a reel's sources (Channel 3, owner 31 Oct 2026: every fact in two sources): listed on the card, and one comment text to paste under the post
  function sources(box, list){ box.textContent = ''; box.hidden = false; box.appendChild(el('small', null, 'Sources'));
    var ol = el('ol'); list.forEach(function(x){ var li = el('li'), a = el('a', null, x.title); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; li.appendChild(a); ol.appendChild(li); }); box.appendChild(ol);
    var text = 'Sources:\n' + list.map(function(x, i){ return (i + 1) + '. ' + x.title + ': ' + x.url; }).join('\n'), b = el('button', 'btn g', 'Copy as comment'); b.type = 'button';
    b.addEventListener('click', function(){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){ b.textContent = 'Copied'; b.classList.add('done'); setTimeout(function(){ b.textContent = 'Copy as comment'; b.classList.remove('done'); }, 1800); }, function(){}); });
    box.appendChild(b); }
  // the posting plan (owner, 23 Oct): each reel carries the IST date to post it ("postOn" in captions.json, set by Claude) and an
  // "Uploaded" marker stored on the server (D1, /api/uploaded/<name>), so it is the same on every device
  var DAY = 864e5, IST = 5.5 * 36e5;
  function istToday(){ return new Date(Date.now() + IST).toISOString().slice(0, 10); }
  function nice(d){ return new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); }
  // each channel has its own reels, posting window and look (owner, 27 Oct 2026). A reel belongs to @techin20sec when its name starts with
  // showreel-tech- or showreel-t<digit> (the tech reels), to Channel 3 when it starts with showreel-c3- (31 Oct: pilots, the owner picks one
  // concept), or to the channel captions.json names ("channel": "tech" / "c3" / "web"); everything else is @webin20sec
  var CH = { web: { name: '@webin20sec', slot: '12:30–13:30 IST', sub: 'Web fixes' }, tech: { name: '@techin20sec', slot: '15:00–19:00 IST', sub: 'Tech news' },
    c3: { name: 'Channel 3', slot: 'to be decided', sub: 'True stories' } };
  function chOf(s, c){ var m = c[s.name] || {}; return CH[m.channel] ? m.channel : /^showreel-(tech-|t\d)/.test(s.name) ? 'tech' : /^showreel-c3-/.test(s.name) ? 'c3' : 'web'; }
  function label(s){ return s.name.replace(/^showreel-(tech-|c3-)?/, '').replace(/-/g, ' '); }
  var ch = 'web';
  try { var saved = localStorage.getItem('studio-ch'); if (CH[saved]) ch = saved; } catch (e) {}
  if (CH[location.hash.slice(1)]) ch = location.hash.slice(1);
  function when(d){ if (!d) return ch === 'c3' ? 'Pilot' : 'Not scheduled'; var diff = Math.round((Date.parse(d) - Date.parse(istToday())) / DAY), t = CH[ch].slot;
    return diff === 0 ? 'Post today · ' + t : diff === 1 ? 'Post tomorrow · ' + t : diff < 0 ? 'Was due ' + nice(d) + ' · post next' : 'Post ' + nice(d) + ' · ' + t; }
  var ticks = {}, trackOk = true;
  function load(){ return fetch('/api/uploaded', { credentials: 'same-origin' }).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(j){ ticks = j.ids || {}; }).catch(function(){ trackOk = false; }); }
  function mark(name, on){ return fetch('/api/uploaded/' + encodeURIComponent(name), { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'reel' }, body: JSON.stringify({ on: on }) })
    .then(function(r){ if (!r.ok) throw 0; if (on) ticks[name] = new Date().toISOString(); else delete ticks[name]; }); }
  var LEDE = document.getElementById('lede').textContent, DATA = null, openName = { web: null, tech: null, c3: null }, tabs = document.querySelectorAll('.tab');
  Array.prototype.forEach.call(tabs, function(t){ t.addEventListener('click', function(){ ch = t.getAttribute('data-ch'); try { localStorage.setItem('studio-ch', ch); } catch (e) {} if (DATA) render(); else paint(); }); });
  // the profile card: one entry per channel in /channels/channels.json (logo, name, username, bio, posting window); a channel without one shows no card
  var PROF = {}, prof = document.getElementById('prof');
  function copyBtn(text){ var b = el('button', 'btn g', 'Copy'); b.type = 'button';
    b.addEventListener('click', function(){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){ b.textContent = 'Copied'; b.classList.add('done'); setTimeout(function(){ b.textContent = 'Copy'; b.classList.remove('done'); }, 1800); }, function(){}); });
    return b; }
  function field(name, text, btn){ var f = el('div', 'f'), d = el('div'); d.appendChild(el('small', null, name)); d.appendChild(el('p', null, text)); f.appendChild(d); f.appendChild(btn || copyBtn(text)); return f; }
  function profile(){ var p = PROF[ch]; prof.textContent = ''; prof.hidden = !p; if (!p) return;
    var sm = el('summary'), img = document.createElement('img'), who = el('span', 'who');
    if (p.logo) { img.src = p.logo; img.alt = ''; sm.appendChild(img); } else sm.appendChild(el('span', 'ph', '?'));   // no logo yet: a placeholder
    who.appendChild(el('b', null, p.name)); who.appendChild(el('span', null, p.logo ? p.username + ' · posts ' + p.slot : 'Name, username and bio to be decided')); sm.appendChild(who); sm.appendChild(el('span', 'chev', 'Profile'));
    var inn = el('div', 'in'), dl = el('button', 'btn g', 'Download logo'); dl.type = 'button';
    dl.addEventListener('click', function(){ saveFile(p.logo, p.username.replace(/^@/, '') + '-logo.png', 'image/png', dl, 'Download logo'); });
    inn.appendChild(field('Name', p.name)); inn.appendChild(field('Username', p.username + (p.fallbacks ? ' (if taken: ' + p.fallbacks.join(', ') + ')' : ''), copyBtn(p.username)));
    inn.appendChild(field('Bio', p.bio)); inn.appendChild(field('Post', p.logo ? 'Daily, ' + p.slot : p.slot, el('span')));
    inn.appendChild(field('Profile picture', p.logo ? '1080 × 1080 PNG' : 'to be decided', p.logo ? dl : el('span')));
    prof.appendChild(sm); prof.appendChild(inn); }
  // the logo goes to the share sheet ("Save Image") where files can be shared, otherwise it downloads
  function saveFile(url, name, type, btn, idle){ if (btn.disabled) return; btn.disabled = true;
    fetch(url, { credentials: 'same-origin' }).then(function(r){ if (!r.ok) throw 0; return r.blob(); }).then(function(blob){ var f = new File([blob], name, { type: type }); btn.disabled = false;
      if (navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f] }).catch(function(){});
      var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
    }).catch(function(){ btn.disabled = false; btn.textContent = 'Try again'; setTimeout(function(){ btn.textContent = idle; }, 1800); }); }
  fetch('/channels/channels.json', { credentials: 'same-origin' }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; }).then(function(j){ PROF = j || {}; profile(); });
  function paint(counts){
    document.body.setAttribute('data-ch', ch); document.getElementById('title').textContent = CH[ch].name; profile();
    document.getElementById('lede').textContent = ch === 'c3' ? 'The true story behind something everyone knows. Three pilots, one per animation pattern; the channel rotates the patterns. Each lists its sources, ready to paste as a comment.' : LEDE;
    Array.prototype.forEach.call(tabs, function(t){ var k = t.getAttribute('data-ch'), n = counts && counts[k], sp = t.querySelector('span');
      t.setAttribute('aria-selected', k === ch ? 'true' : 'false');
      sp.textContent = CH[k].sub + (n ? ' · ' + n + ' to post' : ''); sp.className = n ? 'due' : ''; });
  }
  function render(){
    var d = DATA.d, c = DATA.c, all = ((d && d.showreels) || []).filter(function(s){ return !(c[s.name] && c[s.name].hidden); }), counts = { web: 0, tech: 0, c3: 0 };
    all.forEach(function(s){ var k = chOf(s, c); if (!ticks[s.name] && k !== 'c3') counts[k]++; });   // pilots are not a posting queue
    paint(counts);
    var items = all.filter(function(s){ return chOf(s, c) === ch; }); list.textContent = '';
    if (!items.length) { list.appendChild(el('p', 'empty', d && d.error ? 'Could not load the list right now. Try again in a minute.' : 'No reels for ' + CH[ch].name + ' yet.')); return; }
    // to post first (by date), then the uploaded ones (newest upload first)
    items.sort(function(x, y){ var ux = !!ticks[x.name], uy = !!ticks[y.name]; if (ux !== uy) return ux ? 1 : -1;
      if (ux) return ticks[x.name] < ticks[y.name] ? 1 : -1; var px = (c[x.name] || {}).postOn || '9999', py = (c[y.name] || {}).postOn || '9999'; if (px !== py) return px < py ? -1 : 1; var cx = (c[x.name] || {}).concept || '', cy = (c[y.name] || {}).concept || ''; return cx < cy ? -1 : cx > cy ? 1 : 0; });   // unscheduled pilots in concept order
    if (!openName[ch] || !items.some(function(s){ return s.name === openName[ch]; })) openName[ch] = items[0].name;
    var fold = null, weekAgo = Date.now() - 7 * DAY;
    items.forEach(function(s){
      var into = list;
      if (ticks[s.name] && Date.parse(ticks[s.name]) < weekAgo && s.name !== openName[ch]) {
        if (!fold) { fold = el('details', 'old'); fold.appendChild(el('summary', null, 'Posted more than a week ago')); list.appendChild(fold); }
        into = fold; }
      var meta = c[s.name] || {}, up = ticks[s.name];
      if (s.name !== openName[ch]) {   // collapsed tile: cover, name, date or uploaded mark; tap to open it
        var tl = el('button', 'tile' + (up ? ' posted' : '')); tl.type = 'button'; tl.setAttribute('aria-label', 'Open ' + s.name);
        var th = el('span', 'th'); if (s.cover) th.style.backgroundImage = 'url(' + s.cover + ')'; tl.appendChild(th);
        var tx = el('span', 'tx'); tx.appendChild(el('span', 'name', meta.concept || label(s)));
        tx.appendChild(el('span', 'when' + (up ? ' ok' : meta.postOn === istToday() ? ' now' : ''), up ? '✓ Uploaded ' + nice(up.slice(0, 10)) : when(meta.postOn)));
        tl.appendChild(tx); tl.appendChild(el('span', 'chev', '›'));
