<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showreels · webin20sec</title>
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0b0d14;--card:#141724;--ink:#f1efe9;--mute:#9aa0b2;--line:#252a3b;--accent:#7c8cff;--ok:#6fd49a}
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 120px}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  a{color:inherit}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0}
  .brand{font:800 1rem system-ui,sans-serif;letter-spacing:-.01em}
  .pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;text-decoration:none;font:700 .85rem system-ui,sans-serif}
  h1{font:800 2rem/1.05 system-ui,sans-serif;letter-spacing:-.02em;margin:8px 0 6px}
  .lede{color:var(--mute)}
  .reel{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
  .reel video{display:block;width:100%;aspect-ratio:9/16;background:#000;object-fit:cover}
  .body{padding:16px 16px 18px}
  .name{font:700 1rem system-ui,sans-serif}
  .meta{color:var(--mute);font-size:.85rem;margin-top:2px}
  .cap{white-space:pre-wrap;margin-top:12px;padding:12px 14px;border-radius:14px;background:#0e1019;border:1px solid var(--line);font-size:.9rem;color:#d9d7d0}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font:700 .9rem system-ui,sans-serif;text-decoration:none;cursor:pointer}
  .btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.done{background:var(--ok);color:#06200f}
  .btn.tick.on{background:var(--ok);color:#06200f;border-color:var(--ok)}
  .btn:disabled{opacity:.5;cursor:default}
  .when{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;margin-bottom:10px;border-radius:999px;background:#1d2133;font:700 .8rem system-ui,sans-serif;color:var(--ink)}
  .when.now{background:var(--accent);color:#0b0d14}
  .when.ok{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ok);color:var(--ok)}
  .reel.posted video{opacity:.55}
  .tile{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:10px 14px 10px 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
  .tile .th{flex:none;width:54px;aspect-ratio:9/16;border-radius:10px;background:#000 center/cover no-repeat}
  .tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .tile .when{margin:0;min-height:26px;font-size:.75rem}
  .tile .chev{font:700 1.6rem/1 system-ui,sans-serif;color:var(--mute)}
  .tile.posted .th{opacity:.55}
  .empty{margin-top:30px;color:var(--mute)}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">webin20sec</span><a class="pill" href="/archive/">Archive</a></div>
  <h1>Showreels</h1>
  <p class="lede">The next reel to post is open; tap any other to open it. Copy the post text, save the video, post at 14:00 IST, then mark it uploaded.</p>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<script>
(function(){
  var list = document.getElementById('list'), caps = fetch('/showreels/captions.json', { credentials: 'same-origin' }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; });
  function el(t, c, txt){ var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
  // what gets pasted into Instagram: the caption, one line of niche search keywords, then exactly 5 niche hashtags (owner, 22 Oct 2026)
  function postText(j){ var t = j.caption.trim(); if (j.keywords && j.keywords.length) t += '\n\n' + j.keywords.slice(0, 6).join(' · '); if (j.hashtags && j.hashtags.length) t += '\n\n' + j.hashtags.slice(0, 5).join(' '); return t; }
  // never navigate to the mp4: in the installed iOS app that opens a file viewer with no way back. Fetch it, then hand it to the share sheet ("Save Video"),
  // or download it from a blob URL where sharing files is not supported
  function save(s, btn){
    if (btn.file) return share(btn);
    if (btn.disabled) return; btn.disabled = true; btn.textContent = 'Preparing…';
    fetch(s.video, { credentials: 'same-origin' }).then(function(r){ if (!r.ok) throw 0; return r.blob(); }).then(function(blob){
      var f = new File([blob], s.name + '.mp4', { type: 'video/mp4' }); btn.disabled = false;
      if (navigator.canShare && navigator.canShare({ files: [f] })) { btn.file = f; return share(btn); }
      var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(u); }, 60000); flash(btn, 'Downloaded');
    }).catch(function(){ btn.disabled = false; flash(btn, 'Try again'); });
  }
  // the share sheet needs a fresh tap: if the download took too long, the file is kept and the next tap opens it straight away
  function share(btn){
    navigator.share({ files: [btn.file] }).then(function(){ flash(btn, 'Saved'); }, function(e){ btn.textContent = e && e.name === 'NotAllowedError' ? 'Ready: tap to save' : 'Save video'; });
  }
  function flash(btn, t){ btn.textContent = t; setTimeout(function(){ if (btn.textContent === t) btn.textContent = 'Save video'; }, 1800); }
  function mb(n){ return (n / 1048576).toFixed(1) + ' MB'; }
  // the posting plan (owner, 23 Oct): each reel carries the IST date to post it ("postOn" in captions.json, set by Claude) and an
  // "Uploaded" marker stored on the server (D1, /api/uploaded/<name>), so it is the same on every device
  var DAY = 864e5, IST = 5.5 * 36e5;
  function istToday(){ return new Date(Date.now() + IST).toISOString().slice(0, 10); }
  function nice(d){ return new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); }
  function when(d){ if (!d) return 'Not scheduled'; var diff = Math.round((Date.parse(d) - Date.parse(istToday())) / DAY);
    return diff === 0 ? 'Post today · 14:00 IST' : diff === 1 ? 'Post tomorrow · 14:00 IST' : diff < 0 ? 'Was due ' + nice(d) + ' · post next' : 'Post ' + nice(d) + ' · 14:00 IST'; }
  var ticks = {}, trackOk = true;
  function load(){ return fetch('/api/uploaded', { credentials: 'same-origin' }).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(j){ ticks = j.ids || {}; }).catch(function(){ trackOk = false; }); }
  function mark(name, on){ return fetch('/api/uploaded/' + encodeURIComponent(name), { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'reel' }, body: JSON.stringify({ on: on }) })
    .then(function(r){ if (!r.ok) throw 0; if (on) ticks[name] = new Date().toISOString(); else delete ticks[name]; }); }
  var DATA = null, openName = null;
  function render(){
    var d = DATA.d, c = DATA.c, items = ((d && d.showreels) || []).filter(function(s){ return !(c[s.name] && c[s.name].hidden); }); list.textContent = '';
    if (!items.length) { list.appendChild(el('p', 'empty', d && d.error ? 'Could not load the list right now. Try again in a minute.' : 'No showreels yet.')); return; }
    // to post first (by date), then the uploaded ones (newest upload first)
    items.sort(function(x, y){ var ux = !!ticks[x.name], uy = !!ticks[y.name]; if (ux !== uy) return ux ? 1 : -1;
      if (ux) return ticks[x.name] < ticks[y.name] ? 1 : -1; var px = (c[x.name] || {}).postOn || '9999', py = (c[y.name] || {}).postOn || '9999'; return px < py ? -1 : px > py ? 1 : 0; });
    if (!openName || !items.some(function(s){ return s.name === openName; })) openName = items[0].name;
    items.forEach(function(s){
      var meta = c[s.name] || {}, up = ticks[s.name];
      if (s.name !== openName) {   // collapsed tile: cover, name, date or uploaded mark; tap to open it
        var tl = el('button', 'tile' + (up ? ' posted' : '')); tl.type = 'button'; tl.setAttribute('aria-label', 'Open ' + s.name);
        var th = el('span', 'th'); if (s.cover) th.style.backgroundImage = 'url(' + s.cover + ')'; tl.appendChild(th);
        var tx = el('span', 'tx'); tx.appendChild(el('span', 'name', s.name.replace(/^showreel-/, 'Showreel ')));
        tx.appendChild(el('span', 'when' + (up ? ' ok' : meta.postOn === istToday() ? ' now' : ''), up ? '✓ Uploaded ' + nice(up.slice(0, 10)) : when(meta.postOn)));
        tl.appendChild(tx); tl.appendChild(el('span', 'chev', '›'));
        tl.addEventListener('click', function(){ openName = s.name; render(); var o = list.querySelector('.reel'); if (o) o.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        list.appendChild(tl); return;
      }
      var card = el('article', 'reel' + (up ? ' posted' : '')), v = document.createElement('video');
      v.src = s.video; v.controls = true; v.playsInline = true; v.preload = 'metadata'; if (s.cover) v.poster = s.cover;
      v.setAttribute('aria-label', 'Showreel ' + s.name);
      var b = el('div', 'body');
      b.appendChild(el('div', 'when' + (up ? ' ok' : meta.postOn === istToday() ? ' now' : ''), up ? '✓ Uploaded ' + nice(up.slice(0, 10)) + (meta.postOn ? ' · planned ' + nice(meta.postOn) : '') : when(meta.postOn)));
      b.appendChild(el('div', 'name', s.name.replace(/^showreel-/, 'Showreel ')));
      b.appendChild(el('div', 'meta', 'Rendered ' + new Date(s.at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' · ' + mb(s.size)));
      var cap = el('div', 'cap'), row = el('div', 'row'), copy = el('button', 'btn', 'Copy post text'), dl = el('button', 'btn g', 'Save video'), tick = el('button', 'btn g tick' + (up ? ' on' : ''), up ? 'Uploaded ✓' : 'Mark uploaded');
      copy.type = 'button'; copy.disabled = true; dl.type = 'button'; tick.type = 'button'; tick.disabled = !trackOk; if (!trackOk) tick.title = 'Upload tracking is unavailable right now';
      dl.addEventListener('click', function(){ save(s, dl); });
      tick.addEventListener('click', function(){ tick.disabled = true; mark(s.name, !up).then(render, function(){ tick.disabled = false; tick.textContent = 'Try again'; }); });
      copy.addEventListener('click', function(){ (navigator.clipboard ? navigator.clipboard.writeText(cap.textContent) : Promise.reject()).then(function(){ copy.textContent = 'Copied'; copy.classList.add('done'); setTimeout(function(){ copy.textContent = 'Copy post text'; copy.classList.remove('done'); }, 1800); }, function(){}); });
      row.appendChild(copy); row.appendChild(dl); row.appendChild(tick);
      // the caption comes with the reel (NAME.json in the release); fields in captions.json (edited in the repo) win, so a caption can be fixed after the render
      (s.info ? fetch(s.info, { credentials: 'same-origin' }).then(function(r){ return r.json(); }).catch(function(){ return {}; }) : Promise.resolve({})).then(function(j){
        var m = Object.assign({}, j, meta); if (m.caption) { cap.textContent = postText(m); b.insertBefore(cap, row); copy.disabled = false; } });
      b.appendChild(row); card.appendChild(v); card.appendChild(b); list.appendChild(card);
    });
  }
  Promise.all([fetch('/api/showreels', { credentials: 'same-origin' }).then(function(r){ return r.json(); }), caps, load()]).then(function(r){ DATA = { d: r[0], c: r[1] }; render(); })
    .catch(function(){ list.textContent = ''; list.appendChild(el('p', 'empty', 'Could not load the list right now.')); });
})();
</script>
</body>
</html>
