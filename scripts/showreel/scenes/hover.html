<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6 hover effects</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Showreel scene: one button, six hover effects (owner, 22 Oct 2026). ?fx=1..6 picks the effect; a scripted cursor drives it, so the
   reel needs no real pointer. Everything is driven by performance.now(), which the showreel capture steps frame by frame. */
:root{--bg:#0b0b14;--ink:#fff;--acc:#e9ff6a;--btn:#fff;--btnInk:#0b0b14}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:'Space Grotesk',system-ui,sans-serif}
.lab{position:absolute;left:30px;top:118px;right:30px}
.lab .n{font:700 15px/1 'Space Grotesk';letter-spacing:.18em;opacity:.7}
.lab h1{font:900 34px/1.02 'Unbounded';letter-spacing:-.02em;margin-top:12px}
.lab p{font:500 16px/1.3 'Space Grotesk';opacity:.75;margin-top:10px}
.bar{display:flex;gap:6px;margin-bottom:16px}.bar i{flex:1;height:4px;border-radius:2px;background:currentColor;opacity:.25}.bar i.on{opacity:1}
.stage{position:absolute;left:0;right:0;top:300px;height:260px;display:grid;place-items:center}
.btn{position:relative;width:300px;height:104px;border-radius:52px;background:var(--btn);color:var(--btnInk);display:grid;place-items:center;font:700 26px/1 'Space Grotesk';letter-spacing:-.01em;overflow:hidden;will-change:transform}
.btn .t{position:relative;z-index:2;display:flex;gap:10px;align-items:center}
.cur{position:absolute;left:0;top:0;width:34px;height:40px;z-index:10;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
/* 2 liquid */ .liq{position:absolute;left:-20%;right:-20%;bottom:0;height:0;z-index:1}
.liq svg{position:absolute;left:0;top:-18px;width:200%;height:20px}
/* 3 glitch */ .gl{position:absolute;inset:0;display:grid;place-items:center;font:700 26px/1 'Space Grotesk';z-index:3;opacity:0;mix-blend-mode:screen}
/* 4 tilt */ .shine{position:absolute;inset:0;z-index:1;opacity:0;background:radial-gradient(160px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.75),transparent 60%)}
/* 5 ripple */ .rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid currentColor;z-index:1;opacity:0}
canvas#pc{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
</style>
</head>
<body>
<div class="lab"><div class="bar"></div><div class="n"></div><h1></h1><p></p></div>
<div class="stage"><div class="btn" id="b"><span class="t">Get started <span>→</span></span></div></div>
<canvas id="pc"></canvas>
<svg class="cur" id="c" viewBox="0 0 34 40"><path d="M3 2 L3 32 L11 25 L16.5 37 L22 34.5 L16.5 23 L27 23 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
<script>
var FX = +(new URLSearchParams(location.search).get('fx') || 1);
var S = [null,
  { n: 'Magnetic', d: 'the button leans into the cursor on a spring', bg: '#0d0f1c', btn: '#e9ff6a', ink: '#0d0f1c', acc: '#e9ff6a' },
  { n: 'Liquid fill', d: 'a wave rises from where you enter', bg: '#0e1a3a', btn: '#ffffff', ink: '#0e1a3a', acc: '#5b8cff' },
  { n: 'Glitch', d: 'the label splits into red, green and blue', bg: '#09090c', btn: '#16161d', ink: '#ffffff', acc: '#ff2e63' },
  { n: '3D tilt + glare', d: 'the card tilts toward the cursor, light follows', bg: '#ff8a5c', btn: '#1a0f2e', ink: '#ffffff', acc: '#1a0f2e' },
  { n: 'Ripple', d: 'rings spread from the point you touch', bg: '#0d3b33', btn: '#4df0b8', ink: '#06281d', acc: '#4df0b8' },
  { n: 'Particle burst', d: 'sparks fly out when you arrive', bg: '#1b0f3a', btn: '#a68bff', ink: '#12082b', acc: '#ffd36b' }][FX];
var R = document.documentElement, b = document.getElementById('b'), c = document.getElementById('c'), lab = document.querySelector('.lab');
R.style.setProperty('--bg', S.bg); R.style.setProperty('--btn', S.btn); R.style.setProperty('--btnInk', S.ink); lab.style.color = FX === 4 ? '#1a0f2e' : '#fff';
lab.querySelector('.n').textContent = String(FX).padStart(2, '0') + ' / 06'; lab.querySelector('h1').textContent = S.n; lab.querySelector('p').textContent = S.d;
lab.querySelector('.bar').innerHTML = '<i></i><i></i><i></i><i></i><i></i><i></i>'; [].forEach.call(lab.querySelectorAll('.bar i'), function (e, k) { if (k < FX) e.classList.add('on'); });
var W = innerWidth, H = innerHeight, br = b.getBoundingClientRect(), BX = br.left + br.width / 2, BY = br.top + br.height / 2;
/* the cursor's path (seconds): enters from below right, glides onto the button, explores it, leaves, comes back */
var K = [[0, W + 30, H * .86], [.5, BX + 70, BY + 30], [1.0, BX - 60, BY - 10], [1.45, BX + 40, BY + 12], [1.85, BX + 30, BY + 120], [2.25, BX - 40, BY + 110], [2.6, BX - 20, BY + 6], [3.6, BX + 30, BY - 4]];   // in, explore, out, back in
function ease(u) { return u * u * (3 - 2 * u); }
function at(t) { for (var i = 0; i < K.length - 1; i++) if (t <= K[i + 1][0]) { var a = K[i], z = K[i + 1], u = ease((t - a[0]) / (z[0] - a[0])); return [a[1] + (z[1] - a[1]) * u, a[2] + (z[2] - a[2]) * u]; } var l = K[K.length - 1]; return [l[1], l[2]]; }
function inside(x, y) { return x > br.left - 6 && x < br.right + 6 && y > br.top - 6 && y < br.bottom + 6; }
/* effect state */
var sx = 0, sy = 0, vx = 0, vy = 0, was = false, enter = null, hov = 0, P = [], rips = [];
var liq = null, gl = null, shine = null;
if (FX === 2) { liq = document.createElement('div'); liq.className = 'liq'; liq.style.background = S.acc; liq.innerHTML = '<svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 20 V10 Q12.5 0 25 10 T50 10 T75 10 T100 10 T125 10 T150 10 T175 10 T200 10 V20Z" fill="' + S.acc + '"/></svg>'; b.appendChild(liq); }
if (FX === 3) { ['#ff2e63', '#00e5ff'].forEach(function (col, k) { var e = document.createElement('div'); e.className = 'gl'; e.style.color = col; e.textContent = 'Get started →'; e.dataset.k = k; b.appendChild(e); }); gl = b.querySelectorAll('.gl'); }
if (FX === 4) { shine = document.createElement('div'); shine.className = 'shine'; b.appendChild(shine); b.style.borderRadius = '26px'; b.style.height = '150px'; b.style.boxShadow = '0 30px 60px -20px rgba(26,15,46,.6)'; br = b.getBoundingClientRect(); }
var pc = document.getElementById('pc'), px = pc.getContext('2d'), D = Math.min(2, devicePixelRatio || 1); pc.width = W * D; pc.height = H * D; px.setTransform(D, 0, 0, D, 0, 0);
var T0 = performance.now(), lt = 0;
function frame(now) {
  requestAnimationFrame(frame);
  var t = (now - T0) / 1000, dt = Math.min(.05, Math.max(.001, t - lt)); lt = t;
  var p = at(t), on = inside(p[0], p[1]);
  c.style.transform = 'translate(' + (p[0] - 3).toFixed(1) + 'px,' + (p[1] - 2).toFixed(1) + 'px)';
  hov += ((on ? 1 : 0) - hov) * Math.min(1, dt * 9);
  if (on && !was) { enter = [p[0] - br.left, p[1] - br.top, t]; if (FX === 5) rips.push([p[0], p[1], t]); if (FX === 6) for (var i = 0; i < 90; i++) { var a = Math.random() * 6.283, s = 120 + Math.random() * 420; P.push({ x: p[0], y: p[1], vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, l: 1, c: Math.random() < .5 ? S.acc : '#ffffff', r: 2 + Math.random() * 3.5 }); } }
  if (FX === 5 && on && Math.floor(t * 3) !== Math.floor((t - dt) * 3)) rips.push([p[0], p[1], t]);
  if (FX === 6 && on) for (var e2 = 0; e2 < 2; e2++) { var a2 = Math.random() * 6.283; P.push({ x: br.left + Math.random() * br.width, y: br.top + Math.random() * br.height, vx: Math.cos(a2) * 90, vy: -60 - Math.random() * 160, l: .8, c: Math.random() < .5 ? S.acc : '#ffffff', r: 1.5 + Math.random() * 2.5 }); }
  was = on;
  var dx = (p[0] - BX) / (br.width / 2), dy = (p[1] - BY) / (br.height / 2);
  if (FX === 1) { var tx = on ? dx * 26 : 0, ty = on ? dy * 16 : 0; vx += ((tx - sx) * 180 - vx * 14) * dt; vy += ((ty - sy) * 180 - vy * 14) * dt; sx += vx * dt; sy += vy * dt;
    b.style.transform = 'translate(' + sx.toFixed(2) + 'px,' + sy.toFixed(2) + 'px) scale(' + (1 + hov * .06).toFixed(3) + ')'; b.querySelector('.t').style.transform = 'translate(' + (sx * .5).toFixed(2) + 'px,' + (sy * .5).toFixed(2) + 'px)';
    b.style.boxShadow = '0 0 ' + (hov * 60).toFixed(0) + 'px ' + (hov * 6).toFixed(0) + 'px rgba(233,255,106,.45)'; }
  if (FX === 2) { liq.style.height = (hov * 112).toFixed(1) + '%'; liq.querySelector('svg').style.transform = 'translateX(' + (-(t * 40) % 50) + '%)'; b.style.color = hov > .55 ? '#fff' : S.ink; }
  if (FX === 3) { var g = on ? 1 : hov * .4; [].forEach.call(gl, function (e, k) { var j = Math.sin(t * 61 + k * 2) * 6 * g + (k ? -3 : 3) * g; e.style.opacity = g.toFixed(2); e.style.transform = 'translate(' + j.toFixed(1) + 'px,' + (Math.sin(t * 47 + k) * 2 * g).toFixed(1) + 'px)';
      var y0 = (Math.sin(t * 23 + k * 3) * .5 + .5) * 70; e.style.clipPath = g > .1 ? 'inset(' + y0.toFixed(0) + '% 0 ' + (100 - y0 - 18).toFixed(0) + '% 0)' : 'none'; });
    b.querySelector('.t').style.transform = on ? 'translateX(' + (Math.sin(t * 90) * 2).toFixed(1) + 'px)' : 'none'; b.style.boxShadow = '0 0 0 2px ' + (on ? '#ff2e63' : 'rgba(255,255,255,.12)'); }
  if (FX === 4) { var rx = on ? -dy * 14 : 0, ry = on ? dx * 18 : 0; sx += (rx - sx) * Math.min(1, dt * 8); sy += (ry - sy) * Math.min(1, dt * 8);
    b.style.transform = 'perspective(700px) rotateX(' + sx.toFixed(2) + 'deg) rotateY(' + sy.toFixed(2) + 'deg) scale(' + (1 + hov * .05).toFixed(3) + ')';
    shine.style.opacity = hov.toFixed(2); shine.style.setProperty('--gx', ((p[0] - br.left) / br.width * 100).toFixed(1) + '%'); shine.style.setProperty('--gy', ((p[1] - br.top) / br.height * 100).toFixed(1) + '%'); }
  if (FX === 5) { b.style.transform = 'scale(' + (1 + hov * .04 - (on && t % .45 < .08 ? .03 : 0)).toFixed(3) + ')'; }
  if (FX === 6) { b.style.transform = 'scale(' + (1 + hov * .07).toFixed(3) + ')'; b.style.boxShadow = '0 0 ' + (hov * 70).toFixed(0) + 'px rgba(255,211,107,' + (hov * .5).toFixed(2) + ')'; }
  /* overlay canvas: ripples and particles */
  px.clearRect(0, 0, W, H);
  for (var r = 0; r < rips.length; r++) { var age = t - rips[r][2]; if (age > .9) continue; var k9 = 1 - age / .9, rad = 8 + (1 - k9 * k9) * 150; px.beginPath(); px.arc(rips[r][0], rips[r][1], rad, 0, 6.283); px.strokeStyle = 'rgba(214,255,240,' + (k9 * .95).toFixed(3) + ')'; px.lineWidth = 6 * k9 + 1; px.stroke(); px.fillStyle = 'rgba(77,240,184,' + (k9 * .18).toFixed(3) + ')'; px.fill(); }
  for (var q = 0; q < P.length; q++) { var o = P[q]; if (o.l <= 0) continue; o.vy += 420 * dt; o.vx *= .985; o.x += o.vx * dt; o.y += o.vy * dt; o.l -= dt * .9; px.globalAlpha = Math.max(0, o.l); px.fillStyle = o.c; px.beginPath(); px.arc(o.x, o.y, o.r, 0, 6.283); px.fill(); }
  px.globalAlpha = 1;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
