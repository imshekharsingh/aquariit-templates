<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Why do some buttons feel expensive?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* @webin20sec, narrated explainer Nº 01 (owner picked storyboard B on 23 Oct and the narrated route on 24 Oct 2026): "Why do some buttons feel expensive?"

   re-times the scene to the real narration. Stage 540x960 CSS px (rendered at 2x). Every frame is a pure function of t (window.seek).
   Craft: one idea per beat, text at 22 px and up, the demo as the hero (a checkout card, its button riding its own motion curve). */
:root{--ink:#121110;--paper:#f2efe8;--dim:#8d877c;--line:#2c2a27;--surface:#1c1a1f;--rule:#34303c;--violet:#8b6cff;--good:#3ddc84;--f:'Bricolage Grotesque',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}

.a{position:absolute}
#lbl{left:36px;top:120px;font:700 15px/1 var(--m);letter-spacing:.14em;color:var(--dim);white-space:nowrap}

.card .sub{left:106px;top:66px;font:500 14px/1 var(--m);color:var(--dim)}
.card .pr{right:28px;top:32px;font:700 24px/1 var(--f);font-variation-settings:'opsz' 24}
.card .pay{left:32px;top:118px;width:404px;height:76px;border-radius:999px;display:grid;place-items:center;font:700 26px/1 var(--f);font-variation-settings:'opsz' 28;transform-origin:50% 50%}

#graph{left:36px;top:446px;width:468px;height:200px}

#one b{font-weight:500;color:var(--violet)}
#chips{left:36px;top:500px;display:flex;gap:10px}

.chip i{width:9px;height:9px;border-radius:50%;background:var(--good)}
#base{left:36px;top:562px;height:42px;padding:0 16px;border-radius:999px;border:2px solid var(--rule);display:flex;align-items:center;font:700 16px/1 var(--m);color:var(--dim);letter-spacing:.06em;transform-origin:0 50%}
/* the payoff */

</style>

<script>
(function(){

  var WORDS = [], DUR = 23;

  (function(){ var t = .2; TEXT.split(/\s+/).forEach(function(w){ var d = .16 + w.length * .03; WORDS.push({ w: w.replace('¦', ''), s: t, e: t + d }); t += d + (/[.?:,]$/.test(w) ? .22 : .06); }); })();
  var norm = function(w){ return w.toLowerCase().replace(/[^a-z0-9]/g, ''); };
  function at(word, nth){ var n = nth || 1; for (var i = 0; i < WORDS.length; i++) if (norm(WORDS[i].w) === word && --n === 0) return WORDS[i].s; return 99; }

  function anchors(){

    A = { same: at('same'), dur: at('duration'), this1: at('this'), eases: at('eases'), dead: at('dead'), this2: at('this', 2), springs: at('springs'), over: at('overshoots'), settles: at('settles'),

    A.end = WORDS[WORDS.length - 1].e;

  // ---------- the motion curve: the button's scale over time, drawn as it happens ----------

    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 936, 400); g.fillStyle = 'rgba(0,0,0,0.004)'; g.fillRect(0, 0, 1, 1);   // never leave the layer empty (stale-canvas bug)
    if (alpha <= 0) return; g.globalAlpha = alpha; g.setTransform(2, 0, 0, 2, 0, 0);

    g.strokeStyle = '#2c2a27'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(1), Y(0)); g.stroke();
    g.setLineDash([7, 7]); g.beginPath(); g.moveTo(X(0), Y(1)); g.lineTo(X(1), Y(1)); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#8d877c'; g.font = "700 14px 'JetBrains Mono'"; g.fillText('FULL SIZE', X(0), Y(1) - 12); g.fillText('TIME →', X(0), Y(0) + 24);

    for (var i = 0; i <= 160 * prog; i++) { var x = i / 160; i ? g.lineTo(X(x), Y(f(x))) : g.moveTo(X(x), Y(f(x))); } g.stroke();

  // ---------- the code, typed ----------

  function typed(n){   // the first n visible characters, tags kept balanced
    var o = '', k = 0, open = [];
    for (var i = 0; i < CODE.length; i++) { if (CODE[i] === '<') { var e = CODE.indexOf('>', i), tag = CODE.slice(i, e + 1); o += tag; if (tag[1] === '/') open.pop(); else open.push(tag.match(/<(\w+)/)[1]); i = e; continue; }

  }
  function tf(el, x, y, s, o){ el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')'; el.style.opacity = o; }

    t = Math.max(0, Math.min(DUR, t));
    var ex = io(P(t, DUR - .6, DUR - .1));   // the exit: everything drops away so the loop starts on bare ink
    // ---- 1. the hook: each word lands as it is spoken; "expensive?" springs ----
    var gone = io(P(t, A.same - .3, A.same + .15));
    [].forEach.call($('hook').querySelectorAll('.ln > span'), function(sp, i){
      var s = WORDS[i] ? WORDS[i].s - .08 : 0, k = i === 5 ? spring(t - s) : out(P(t, s, s + .26));
      sp.style.opacity = cl((t - s) * 9) * (1 - gone);

    });

    var cA = $('cA'), cB = $('cB'), payA = cA.querySelector('.pay'), payB = cB.querySelector('.pay'), tag = $('tag');

    tf(cB, mix(70, 540, solo), 182 + 40 * (1 - pairIn), .7, (t < A.same - .15 ? 0 : pairIn) * (1 - solo));
    var tmK = P(t, A.dur, A.dur + .6), tmO = out(P(t, A.dur - .1, A.dur + .1)) * (1 - solo);
    $('timer').firstChild.style.width = tmK * 100 + '%'; $('timer').style.opacity = tmO; $('timerL').style.opacity = tmO;
    // both Pay buttons pop in on "Same duration" with the same timing, so they look identical
    var pairPop = t < A.dur ? 1 : ease(t - A.dur);
    payA.style.transform = 'scale(' + (solo > 0 ? (t < A.eases ? 1 - P(t, A.this1, A.this1 + .25) : ease(t - A.eases)) : pairPop) + ')';
    payB.style.transform = 'scale(' + pairPop + ')';
    // ---- 3. A alone, easing; 4. the match cut to B, springing (same framing) ----
    var showB = toB > 0 && t < A.css + .3;
    if (showB) { tf(cB, 0, 0, 1, 1 - codeIn); payB.style.transform = 'scale(' + (t < A.springs ? 0 : spring(t - A.springs)) + ')'; }
    if (t < A.same - .2) { tag.style.opacity = 0; }
    else if (t < A.this1) { tag.textContent = 'SAME BUTTON · SAME TIMING'; tag.style.color = 'var(--dim)'; tag.style.opacity = pairIn; }
    else if (!showB) { tag.textContent = 'A · EASE-OUT'; tag.style.color = 'var(--dim)'; tag.style.opacity = solo; }
    else { tag.textContent = 'B · SPRING'; tag.style.color = 'var(--violet)'; tag.style.opacity = 1 - codeIn; }
    if (t >= A.css + .3) tag.style.opacity = 0;
    // the curve under the card: drawn as the button grows; for the spring, the overshoot and the settle are called out as they are said

    else if (solo > 0) graph('ease', cl((t - A.eases) / 1.1), solo * (1 - toB), '#f2efe8', [{ s: 'stops dead', x: .52, y: 1.16, c: '#8d877c', k: out(P(t, A.dead, A.dead + .3)) }]);

    var nch = Math.floor(CODE_TXT.length * P(t, A.css + .05, A.linear + .8));

    [['c1', A.chrome], ['c2', A.firefox], ['c3', A.safari]].forEach(function(c){ var k = spring(t - c[1] + .05);

    var ph0 = null;
    for (var i = 0; i < PH.length; i++) { if (t >= WORDS[PH[i][0]].s - .1 && (i === PH.length - 1 || t < WORDS[PH[i + 1][0]].s - .1)) ph0 = PH[i]; }

  }
  window.setVoice = function(v){ if (v && v.words && v.words.length) { WORDS = v.words; anchors(); } };
  // ---------- sound (scripts/showreel/sound.py): the voice leads; quiet taps and soft air under it (owner, 24 Oct: no big funky pops) ----------
  function buildCues(){
    var Q = [{ t: 0, k: 'swish', d: .5, g: .5, p: -.5 }, { t: A.end > 0 ? WORDS[5].s : 1, k: 'tap', g: .8, p: 0 }];
