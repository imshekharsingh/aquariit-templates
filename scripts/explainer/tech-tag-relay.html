   a nearby device hears it -> the place is locked), a curve through the servers to your map, and the network that makes it work (900 million+ devices) closing back on the tag.
   One camera over one canvas; moves of 0.45-0.7 s, no dwell; the next card shows as a ghost before the camera goes; light wedges and dim sub-nodes, grid and dust fill the frame;
   every value is continuous in t (no modulo wraps, no per-frame random, no instant swaps); the camera path starts every flight from the real hold position.

   Facts: Samsung Newsroom, "The Technology Behind More Precise Finding With Galaxy SmartTag3 and SmartThings", 23 Nov 2026 (offline finding: nearby Galaxy devices detect the tag's BLE
   signals and relay them to SmartThings servers; more than 900 million participating Galaxy devices form the Galaxy Find Network; location is encrypted with a unique private key,
