    for (var i2 = 0; i2 < PH.length; i2++) { if (t >= WORDS[PH[i2][0]].s - LEAD - .05 && (i2 === PH.length - 1 || t < WORDS[PH[i2 + 1][0]].s - LEAD - .05)) ph0 = PH[i2]; }
    var html = '';
    if (ph0 && ph0[0] >= HOOK_N && t < DUR - .5)
      ph0.forEach(function(j){ var w = WORDS[j], on2 = t >= w.s - LEAD, k = back(P(t, w.s - LEAD, w.s - LEAD + .3)), aft = w.s >= A.fix;
        var col2 = aft && /^(scroll|snap|type|x$|mandatory|every|one)/i.test(w.d) ? 'var(--acc)' : !aft && /^(stops|half|two)/i.test(w.d) ? 'var(--red)' : 'var(--paper)';
        html += '<span style="opacity:' + (on2 ? 1 - ex : 0) + ';transform:translateY(' + (1 - k) * 14 + 'px);color:' + col2 + '">' + w.d.replace(/</g, '') + '</span>'; });
    $('cap').innerHTML = html;
  }
  window.setVoice = function(v){ if (v && v.words && v.words.length) { WORDS = v.words; anchors(); } };
  // sound follows the motion: each cue carries the length of its move (d), where it is on screen (x, x2) and a room send (r)
  var CHORDS = [[45, 57, 64, 67, 71], [41, 57, 60, 64, 69], [48, 60, 64, 67, 72], [43, 55, 62, 67, 71]];
  function buildCues(){
    var BAR = DUR / 8, Q = [];
    var chordAt = function(t){ return CHORDS[Math.floor(t / BAR) % CHORDS.length]; };
    var tone = function(t, i){ var ch = chordAt(t); return ch[1 + i % (ch.length - 1)] - 69 + 12; };   // a chord tone, as semitones from A5 (blip p)
    Q.push({ t: 0, k: 'move', d: .6, g: .35, dir: 1, x: 270, r: .3 });
    // the title words: soft tuned blips, placed where each word lands
    var wx = [80, 200, 330, 190, 110, 330, 200];
    for (var i = 0; i < HOOK_N; i++) Q.push({ t: WORDS[i].s - LEAD + .05, k: 'blip', g: .1, p: tone(WORDS[i].s, i) - 12, x: wx[i] });
    // each swipe: a fingertip touch, air shaped to the swipe's own length travelling with it, then a dead stop or a snap that lands in key
    SW.forEach(function(w, i){ var dir = w[2] > w[1] ? -1 : 1, x0 = A.leave < w[0] ? 160 : 270, scr = A.leave < w[0] ? 1 : .68;
      Q.push({ t: w[0], k: 'touch', g: .45, p: w[4] ? 3 : 0, x: x0 - dir * 50 * scr });
      Q.push({ t: w[0] + .05, k: 'move', d: w[3] * .9, g: w[4] ? .3 : .26, dir: -dir, x: x0 - dir * 60 * scr, x2: x0 + dir * 60 * scr, r: .15 });
      if (!w[4]) Q.push({ t: w[0] + w[3] - .05, k: 'thud', g: .22, p: -3, x: x0 });
      else Q.push({ t: w[0] + w[3] * .55, k: 'snap', g: .5, p: tone(w[0] + w[3], i), x: x0 }); });
    // the phone rises out of the title; the push-in on the seam; the red pill
    Q.push({ t: A.leave + .15, k: 'move', d: .6, g: .4, dir: 1, x: 270, x2: 160, r: .35 });
    Q.push({ t: A.half - .25, k: 'move', d: .7, g: .35, dir: 1, p: -.3, x: 270, x2: 200, r: .3 });
    Q.push({ t: A.half + .05, k: 'blip', g: .16, p: -1, x: 200 });
    // the fix: the outline lifts out of the carousel and travels to the code column while the camera pulls back
    Q.push({ t: A.fix - .25, k: 'move', d: .8, g: .45, dir: 1, p: .2, x: 160, x2: 405, r: .45 });
    for (var c = 0, t0 = A.scroll, t1 = A.mand + .25; t0 + c * .09 < t1; c++) Q.push({ t: t0 + c * .09, k: 'tick', g: .08, p: (c * 5) % 7, x: 405 });
    Q.push({ t: A.snap, k: 'swell', d: Math.min(1.6, A.snap - A.scroll + .2), g: .3, x: 300 });
    Q.push({ t: A.snap, k: 'resolve', g: .5, notes: chordAt(A.snap).slice(1), x: 160, r: .5 });
    Q.push({ t: A.snap + .5, k: 'snap', g: .45, p: tone(A.snap, 2), x: 160 });
    for (var n = 0; n < 4; n++) Q.push({ t: A.mand - .05 + n * .09 + .2, k: 'blip', g: .08, p: tone(A.mand, n), x: 90 + n * 30 });
    for (var c2 = 0, u0 = A.mand + .3, u1 = A.mand + 1.4; u0 + c2 * .11 < u1; c2++) Q.push({ t: u0 + c2 * .11, k: 'tick', g: .06, p: (c2 * 3) % 7, x: 405 });
    Q.push({ t: A.now - .1, k: 'move', d: .8, g: .3, dir: 1, p: -.2, x: 270, x2: 220, r: .3 });
    Q.push({ t: DUR - .6, k: 'move', d: .6, g: .4, dir: -1, p: -.4, x: 270, r: .4 });
    Q.forEach(function(q){ q.t = Math.max(0, +q.t.toFixed(3)); });   // the real voice can start at 0 s: no cue before the reel
    window.CUES = { dur: DUR, cues: Q, mix: { duck: 9, attack: .02, release: .3, room: .55 },
      bed: { bpm: 240 / BAR, origin: 0, gain: .3, chords: CHORDS } };
  }
  window.seek = seek; window.DURATION = DUR;
  document.fonts.load("800 72px 'Bricolage Grotesque'").then(function(){ return document.fonts.load("500 22px 'JetBrains Mono'"); }).then(function(){ return document.fonts.ready; })
    .then(function(){ anchors(); seek(+(new URLSearchParams(location.search).get('t') || 0)); document.documentElement.dataset.ready = 1; });
})();
