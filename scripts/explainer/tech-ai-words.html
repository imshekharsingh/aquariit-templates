/* @techin20sec, 27 Nov 2026: the first real 2.5D map reel (design/references.md "R-ref 27 Nov 2026" + its rules; owner's 2.5D notes 1-6 of 27 Nov).
   Topic: why an AI chat types its answer word by word. The map follows the process: a LINE out (your prompt -> tokens -> the model), a LOOP on the
   right (the model reads everything so far -> predicts one next token -> adds it on -> again), a LINE back (each token streams to your screen).
   One camera over one canvas; moves of 0.45-0.7 s with a quick ease, no dwell before a move; the next card shows as a ghost before the camera goes;
   coloured light wedges and dim sub-nodes, grid and dust fill the frame; text on plates, 26 world px+ at the hold scale (26 px+ at 1080).
   Glitch rules (owner note 2): every value is continuous in t (no modulo wraps, no per-frame random, no instant swaps, no will-change raster pops);
   the camera path is built from the real hold position, so a flight starts exactly where the hold ends.
   Facts: Anthropic glossary (models predict the next token given the text so far; tokens are pieces of words), Anthropic streaming docs (a reply is
   sent incrementally), OpenAI latency guide (generating tokens is the slowest step; fewer output tokens, lower latency). The token split and the odds
   bars are labelled EXAMPLE. See review/tech/showreel-tech-ai-words.md. */
