<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Why does your page jump when you tap a link?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* @webin20sec, narrated explainer Nº 07, a motion tip: "Why does your page jump when you tap a link?"
   A tap on an in-page link teleports the page (no motion, so you lose your place); scroll-behavior: smooth makes it glide, wrapped in a
   prefers-reduced-motion query so people who turn motion off keep the jump. Flow as Nº 04-06: one screen (a browser window with a page
   that really scrolls) that only moves and scales, one panel under it that changes shape (a scroll trace, code, a scroll trace, the query).
   Beats and captions lead the voice by 0.15 s; every frame a pure function of t. */
:root{--ink:#121110;--paper:#f2efe8;--dim:#8d877c;--surface:#1c1a1f;--rule:#34303c;--row:#24222a;--acc:#ffb547;--red:#ff4d3d;--f:'Bricolage Grotesque',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f);-webkit-font-smoothing:antialiased}
.a{position:absolute}
#lbl{left:36px;top:120px;font:700 15px/1 var(--m);letter-spacing:.14em;color:var(--dim);white-space:nowrap}
#hud{right:36px;top:120px;font:700 15px/1 var(--m);letter-spacing:.06em;white-space:nowrap;color:var(--dim);text-align:right}
#hud b{font-weight:700;color:var(--paper)}#hud .r{color:var(--red)}#hud .y{color:var(--acc)}
#tag{left:36px;top:170px;font:700 15px/1 var(--m);letter-spacing:.14em;white-space:nowrap;color:var(--dim)}
#hook{left:34px;top:236px;font-weight:800;font-size:72px;line-height:.96;letter-spacing:-.045em;font-variation-settings:'wdth' 100,'opsz' 96}
#hook .ln{display:block;white-space:nowrap}
#hook .ln > span{display:inline-block;transform-origin:0 80%}
#hook .acc{color:var(--acc)}
/* the screen: a browser window, a sticky nav of in-page links, and a page that scrolls inside it */
#scr{left:36px;top:206px;width:468px;height:286px;border-radius:30px;background:var(--surface);overflow:hidden;transform-origin:50% 0}
#nav{left:0;right:0;top:0;height:56px;background:#1f1d23;border-bottom:1.5px solid var(--rule);z-index:2}
#nav .logo{position:absolute;left:22px;top:21px;width:26px;height:14px;border-radius:7px;background:var(--acc)}
#nav .ln{position:absolute;top:14px;height:28px;padding:0 12px;border-radius:14px;font:700 15px/28px var(--f);color:var(--dim);white-space:nowrap}
#vp{left:0;right:22px;top:56px;bottom:0;overflow:hidden}
#pg{left:0;right:0;top:0}
.sec{position:absolute;left:18px;right:6px;height:300px}
.sec h3{position:absolute;left:4px;top:18px;font:800 30px/1 var(--f);letter-spacing:-.02em;white-space:nowrap}
.sec .bx{position:absolute;left:4px;top:66px;right:10px;height:96px;border-radius:16px;opacity:.85}
.sec .l1{position:absolute;left:4px;top:180px;height:12px;border-radius:6px;background:#4a4555}
.sec .l2{position:absolute;left:4px;top:202px;height:10px;border-radius:5px;background:var(--rule)}
/* the scrollbar: where you are on the page */
#bar{right:8px;top:64px;bottom:8px;width:6px;border-radius:3px;background:rgba(242,239,232,.08)}
#thumb{left:0;width:6px;border-radius:3px;background:var(--dim)}
#tap{width:46px;height:46px;border-radius:50%;border:3px solid var(--paper);margin:-23px 0 0 -23px;z-index:3}
/* the deck: scroll trace (position over time) → code → scroll trace → the reduced-motion query */
#deck{left:36px;width:468px;border-radius:20px;background:var(--surface);overflow:hidden}
#deck > .lay{position:absolute;left:0;top:0;right:0;bottom:0}
#tr svg{position:absolute;left:0;top:0}
#cd{padding:18px 22px;font:500 20px/1.45 var(--m);white-space:pre;color:var(--paper)}
#cd b{font-weight:500;color:var(--acc)}#cd .dim{color:var(--dim)}
#deckL{left:36px;font:700 15px/1 var(--m);letter-spacing:.12em;white-space:nowrap}
#cap{left:36px;right:36px;top:672px;font:700 34px/1.12 var(--f);font-variation-settings:'opsz' 36;letter-spacing:-.015em}
#cap span{display:inline-block;margin-right:.24em}
</style>
</head>
<body>
<div id="lbl" class="a">Nº 07 · MOTION</div>
<div id="hud" class="a"></div>
<div id="tag" class="a"></div>
<div id="hook" class="a"><span class="ln"><span>Why</span> <span>does</span> <span>your</span></span><span class="ln"><span>page</span> <span class="acc">jump</span></span><span class="ln"><span>when</span> <span>you</span> <span>tap</span></span><span class="ln"><span>a</span> <span>link?</span></span></div>
<div id="scr" class="a">
  <div id="vp" class="a"><div id="pg" class="a"></div></div>
  <div id="bar" class="a"><div id="thumb" class="a"></div></div>
  <div id="nav" class="a"><i class="logo"></i></div>
  <div id="tap" class="a"></div>
</div>
<div id="deck" class="a"><div id="tr" class="lay"><svg width="468" height="120" viewBox="0 0 468 120"><path id="trace" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle id="dot" r="6"/></svg></div><div id="cd" class="lay"></div></div>
<div id="deckL" class="a"></div>
<div id="cap" class="a"></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cl = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }, P = function(t, a, b){ return cl((t - a) / (b - a)); }, mix = function(a, b, k){ return a + (b - a) * k; };
  var out = function(k){ return 1 - Math.pow(1 - k, 3); }, io = function(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
  var win = function(t, a, b, f){ return Math.min(P(t, a - f, a), 1 - P(t, b - f, b)); };
  var TEXT = "Why does your page jump when you tap a link? It teleports, and you lose your place. The fix: scroll-behavior smooth. One line of CSS. Now the page glides to the section, so you see where you went. Wrap it in a reduced-motion query, so people who turn motion off still jump. Every link, one line.";
  // 21 s, the whole script in one take; beats and caption words land 0.15 s before the word
  var WORDS = [], DUR = 21, LEAD = .15;
  (function(){ var t = .2; TEXT.split(/\s+/).forEach(function(w){ var d = .14 + w.length * .03; WORDS.push({ w: w, s: t, e: t + d }); t += d + (/[.?:,;]$/.test(w) ? .32 : .06); }); })();
  var norm = function(w){ return w.toLowerCase().replace(/[^a-z0-9]/g, ''); };
  function at(word, nth){ var n = nth || 1; for (var i = 0; i < WORDS.length; i++) if (norm(WORDS[i].w) === word && --n === 0) return WORDS[i].s - LEAD; return 99; }
  function first(){ for (var i = 0; i < arguments.length; i++) if (arguments[i] < 99) return arguments[i]; return 99; }
  function align(){ var T = TEXT.split(/\s+/), j = 0;
    WORDS.forEach(function(w){ w.d = w.w; for (var k = j; k < Math.min(T.length, j + 4); k++) if (norm(T[k]) === norm(w.w)) { w.d = T[k]; j = k + 1; break; } }); }
  var A = {}, PH = [];
  function anchors(){
    align();
    A = { link: at('link'), tele: at('it'), lose: at('lose'), place: at('place'), broken: at('place'), fix: at('fix'), smooth: at('smooth'), line: at('line'), css: at('css'),
      now: at('now'), glides: at('glides'), section: at('section'), went: at('went'), wrap: at('wrap'), reduced: first(at('reducedmotion'), at('reduced')), off: at('off'), jumps: at('jump', 2),
      every: at('every'), menu: at('menu'), one: at('one', 2) };
    A.end = WORDS[WORDS.length - 1].e;
    PH = []; var cur = [];
    WORDS.forEach(function(w, i){ cur.push(i); if (/[.?!]$/.test(w.d) || i === WORDS.length - 1) {
      if (cur.length > 7) { var best = -1; cur.forEach(function(j, k){ if (/[,:;]$/.test(WORDS[j].d) && k > 1 && k < cur.length - 2 && (best < 0 || Math.abs(k - cur.length / 2) < Math.abs(best - cur.length / 2))) best = k; });
        if (best < 0) best = Math.floor(cur.length / 2) - 1; PH.push(cur.slice(0, best + 1)); PH.push(cur.slice(best + 1)); }
      else PH.push(cur);
      cur = []; } });
    // the scroll story: tap "Pricing" → jump (no motion); back to the top while the rule types; tap "Pricing" → glide; on "every": FAQ, Features, Top, each a glide
    SC = [{ t: A.tele, to: 2, smooth: false }, { t: A.fix - .1, to: 0, smooth: true, d: .9 }, { t: A.now - .2, to: 2, smooth: true }, { t: A.every - .2, to: 3, smooth: true }, { t: A.every + .75, to: 1, smooth: true }, { t: A.one - .1, to: 0, smooth: true }];
    buildCues();
  }
  // ---- the page: four sections; the nav links scroll to them ----
  var SECS = [{ h: 'Built for teams', c: '#7aa7ff' }, { h: 'Features', c: '#52d6a4' }, { h: 'Pricing', c: '#ffb547' }, { h: 'Questions', c: '#c792ff' }], SH = 300, VPH = 230, MAXY = SH * SECS.length - VPH;
  var LINKS = [{ t: 'Features', s: 1, x: 196 }, { t: 'Pricing', s: 2, x: 296 }, { t: 'FAQ', s: 3, x: 384 }], SC = [];
  (function(){ var pg = $('pg'), nav = $('nav');
    SECS.forEach(function(s, i){ var d = document.createElement('div'); d.className = 'sec'; d.style.top = (i * SH) + 'px';
      d.innerHTML = '<h3>' + s.h + '</h3><i class="bx" style="background:' + s.c + '"></i><i class="l1" style="width:' + [300, 260, 330, 280][i] + 'px"></i><i class="l2" style="width:' + [220, 300, 240, 200][i] + 'px"></i>'; pg.appendChild(d); });
    pg.style.height = (SH * SECS.length) + 'px';
    LINKS.forEach(function(l){ var a = document.createElement('span'); a.className = 'ln'; a.textContent = l.t; a.style.left = l.x + 'px'; nav.appendChild(a); });
    $('thumb').style.height = Math.round(214 * VPH / (SH * SECS.length)) + 'px';
  })();
  var target = function(i){ return Math.min(MAXY, i * SH); };
  // scroll position at t: each step starts from where the last one ended; a jump is instant, a glide eases over ~0.8 s (the browser picks the curve)
  function scrollAt(t){ var y = 0, from = 0;
    for (var i = 0; i < SC.length; i++) { var s = SC[i]; if (t < s.t) break; from = y; var to = target(s.to);
      y = s.smooth ? mix(from, to, io(P(t, s.t, s.t + (s.d || .8)))) : to; }
    return y; }
  var CODE = '<span class="dim">html {</span>\n  <b>scroll-behavior: smooth;</b>\n<span class="dim">}</span>';
  var CODE2 = '<b>@media (prefers-reduced-motion:\n       no-preference)</b> {\n  html { scroll-behavior: smooth; }\n}';
  var CODE_TXT = CODE.replace(/<[^>]+>/g, '');
  function typed(src, n){ var o = '', k = 0, open = [];
    for (var i = 0; i < src.length; i++) { if (src[i] === '<') { var e = src.indexOf('>', i), tag = src.slice(i, e + 1); o += tag; if (tag[1] === '/') open.pop(); else open.push(tag.match(/<(\w+)/)[1]); i = e; continue; }
      if (k >= n) break; o += src[i]; k++; }
    while (open.length) o += '</' + open.pop() + '>'; return o; }
  function show(el, o, y, s){ el.style.opacity = o; el.style.transform = 'translateY(' + (y || 0) + 'px) scale(' + (s === undefined ? 1 : s) + ')'; }
  function seek(t){
    t = Math.max(0, Math.min(DUR, t));
    var ex = io(P(t, DUR - .6, DUR - .1));
    // ---- the hook ----
    var gone = io(P(t, A.tele - .5, A.tele - .1));
    [].forEach.call($('hook').querySelectorAll('.ln > span'), function(sp, i){
      var s = WORDS[i] ? WORDS[i].s - LEAD : 0, k = out(P(t, s, s + .26)), hard = i === 4;
      sp.style.opacity = (hard ? (t >= s ? 1 : 0) : cl((t - s) * 9)) * (1 - gone); sp.style.transform = 'translateY(' + ((hard ? (t >= s ? 0 : 1) : (1 - k)) * 40 - gone * 80) + 'px)'; });
    $('lbl').style.opacity = 1 - ex;
    // ---- the screen: small under the hook, full for the jump, smaller while the rule is typed, full again ----
    var rise = io(P(t, A.tele - .55, A.tele - .1)), m1 = io(P(t, A.fix - .2, A.fix + .3)), m2 = io(P(t, A.now - .45, A.now - .1)), m3 = io(P(t, A.wrap - .2, A.wrap + .3)), m4 = io(P(t, A.every - .45, A.every - .15));
    var shrink = Math.max(m1 * (1 - m2), m3 * (1 - m4));
    var drift = Math.sin(t * .9) * 3 * (1 - rise), jolt = Math.sin(P(t, A.broken - .05, A.broken + .3) * Math.PI * 3) * (1 - P(t, A.broken - .05, A.broken + .3)) * 5;
    show($('scr'), out(P(t, .05, .4)) * (1 - ex), (1 - rise) * 340 + drift + ex * 20, mix(.62, 1, rise) * mix(1, .62, shrink));
    $('scr').style.transform += ' translateX(' + jolt + 'px)';
    // the page and its scrollbar
    var y = scrollAt(t); $('pg').style.transform = 'translateY(' + (-y) + 'px)';
    var jumpNow = t >= A.tele && t < A.tele + .5, gliding = SC.some(function(s){ return s.smooth && t >= s.t && t < s.t + (s.d || .8); });
    $('thumb').style.top = (y / MAXY * (214 - parseFloat($('thumb').style.height))) + 'px';
    $('thumb').style.background = t >= A.tele - .05 && t < A.fix - .2 ? '#ff4d3d' : gliding ? '#ffb547' : '#8d877c';
    // the tap: a ring on the link just before each scroll starts
    var taps = SC.filter(function(s, i){ return i !== 1; }), tp = null;
    taps.forEach(function(s){ if (t >= s.t - .35 && t < s.t + .25) tp = s; });
    var tapEl = $('tap');
    if (tp) { var L = LINKS.filter(function(l){ return l.s === tp.to; })[0], k = P(t, tp.t - .35, tp.t + .25);
      var x = L ? L.x + 32 : 40, ty = 28; tapEl.style.left = x + 'px'; tapEl.style.top = ty + 'px';
      tapEl.style.opacity = Math.sin(k * Math.PI); tapEl.style.transform = 'scale(' + mix(1.3, .8, out(k)) + ')'; } else tapEl.style.opacity = 0;
    // the active link lights while its section is on screen
    [].forEach.call($('nav').querySelectorAll('.ln'), function(a, i){ var on = Math.abs(y - target(LINKS[i].s)) < 40 && t > A.tele - .05;
      a.style.color = on ? '#121110' : 'var(--dim)'; a.style.background = on ? 'var(--acc)' : 'transparent'; });
    // "you lose your place": where you were flashes at the top of the screen as a ghost, gone in a frame
    // ---- the deck: scroll trace (top 510) → code (396) → trace → the query (396) → gone on "every" ----
    var dIn = out(P(t, A.lose - .2, A.lose + .1)), m5 = io(P(t, A.every - .3, A.every + .1));
    var dTop = 510 + (396 - 510) * shrink, dH = 120 + 20 * shrink + 26 * m3 * (1 - m4), dk = $('deck');
    dk.style.top = dTop + 'px'; dk.style.height = dH + 'px'; dk.style.opacity = dIn * (1 - m5) * (1 - ex); dk.style.transform = 'translateY(' + ((1 - dIn) * 30 + m5 * 30) + 'px)';
    var trA = Math.max(win(t, A.lose - .15, A.fix - .12, .12), win(t, A.now - .1, A.wrap + .1, .15));
    $('tr').style.opacity = trA;
    // the trace: page position (up) over 1.2 s around the latest scroll; a jump is a vertical cliff, a glide a smooth S
    var sNow = t < A.fix ? SC[0] : SC[2], T0 = sNow.t - .3, X0 = 30, XW = 408, Y0 = 100, YH = 76, pts = [], seen = Math.min(t, T0 + 1.4);
    for (var q = T0; q <= seen + 1e-6; q += 1 / 60) { var yy = scrollAt(q); if (t >= A.fix && q < A.now - .2) yy = 0; pts.push((X0 + XW * (q - T0) / 1.4).toFixed(1) + ',' + (Y0 - YH * yy / target(2)).toFixed(1)); }
    $('trace').setAttribute('d', pts.length ? 'M' + pts.join(' L') : ''); $('trace').setAttribute('stroke', t < A.fix ? '#ff4d3d' : '#ffb547');
    var last = pts[pts.length - 1]; if (last) { var c = last.split(','); $('dot').setAttribute('cx', c[0]); $('dot').setAttribute('cy', c[1]); }
    $('dot').setAttribute('fill', t < A.fix ? '#ff4d3d' : '#ffb547');
    var dl = $('deckL'); dl.style.top = (dTop + dH + 14) + 'px';
    dl.textContent = t < A.fix - .15 ? 'SCROLL POSITION · 0 MS: A CLIFF' : t < A.now - .1 ? 'ONE RULE, ON THE ROOT' : t < A.wrap - .1 ? 'SCROLL POSITION · A GLIDE' : 'MOTION OFF? IT STILL JUMPS';
    dl.style.color = t < A.fix - .15 ? '#ff4d3d' : '#ffb547'; dl.style.opacity = dIn * (1 - m5) * (1 - ex);
    var cdA = Math.max(win(t, A.fix, A.now - .15, .12), win(t, A.wrap + .05, A.every - .25, .15));
    $('cd').style.opacity = cdA;
    $('cd').innerHTML = t < A.wrap ? typed(CODE, 6 + Math.floor((CODE_TXT.length - 6) * P(t, A.fix + .2, A.css))) : typed(CODE2, Math.floor(CODE2.replace(/<[^>]+>/g, '').length * P(t, A.wrap + .1, A.off)));
    // ---- the readout top right ----
    var H;
    if (t < A.tele - .1) H = 'SCROLL · <b>4 SECTIONS</b>';
    else if (t < A.fix - .2) H = 'SCROLL · <b class="r">0 MS</b>';
    else if (t < A.now - .2) H = 'CSS <b>1 LINE</b>';
    else if (t < A.wrap - .1) H = 'SCROLL · <b class="y">SMOOTH</b>';
    else if (t < A.every - .2) H = 'MOTION OFF · <b>JUMP</b>';
    else H = 'EVERY <b class="y">#LINK</b>';
    $('hud').innerHTML = H; $('hud').style.opacity = 1 - ex;
    var tg = $('tag'); tg.style.opacity = (t >= A.tele - .1 ? 1 : 0) * (1 - ex);
    tg.textContent = t < A.lose - .1 ? 'TAP: PRICING' : t < A.fix - .2 ? 'WHERE AM I?' : t < A.now - .2 ? 'THE FIX' : t < A.wrap - .1 ? 'IT GLIDES' : t < A.every - .2 ? 'RESPECT REDUCED MOTION' : 'EVERY IN-PAGE LINK';
    // ---- captions ----
    var ph0 = null;
    for (var i = 0; i < PH.length; i++) { if (t >= WORDS[PH[i][0]].s - LEAD - .05 && (i === PH.length - 1 || t < WORDS[PH[i + 1][0]].s - LEAD - .05)) ph0 = PH[i]; }
    var html = '', hookN = 10;
    if (ph0 && ph0[0] >= hookN && t < DUR - .5)   // the first ten words are the hook question, shown as the title instead
      ph0.forEach(function(j){ var w = WORDS[j], on = t >= w.s - LEAD, k = out(P(t, w.s - LEAD, w.s - LEAD + .2));
        var col = /^(scroll|behavior|smooth|glides|reduced|motion)/i.test(w.d) ? 'var(--acc)' : /^(teleports|lose|place)/i.test(w.d) ? 'var(--red)' : 'var(--paper)';
        html += '<span style="opacity:' + (on ? 1 - ex : 0) + ';transform:translateY(' + (1 - k) * 12 + 'px);color:' + col + '">' + w.d.replace(/</g, '') + '</span>'; });
    $('cap').innerHTML = html;
  }
  window.setVoice = function(v){ if (v && v.words && v.words.length) { WORDS = v.words; anchors(); } };
  // sound under the voice: the jump is a hard cut (thud, no swish); each glide is a soft swish that follows the scroll
  function buildCues(){
    var Q = [{ t: 0, k: 'swish', d: .5, g: .5, p: -.5 }, { t: A.tele - .5, k: 'swish', d: .4, g: .5 }];
    Q.push({ t: A.tele - .3, k: 'tick', g: .35, p: 4 }, { t: A.tele, k: 'thud', g: .7 }, { t: A.broken, k: 'thud', g: .45 });
    Q.push({ t: A.fix - .2, k: 'swish', d: .5, g: .5, p: .2 });
    for (var c = 0, t0 = A.fix + .2, t1 = A.css; t0 + c * .1 < t1; c++) Q.push({ t: t0 + c * .1, k: 'tick', g: .1, p: (c * 5) % 7 });
    SC.forEach(function(s, i){ if (s.smooth && i !== 1) Q.push({ t: s.t - .3, k: 'tick', g: .3, p: 4 }, { t: s.t, k: 'swish', d: .8, g: .55, p: .3 }); });
    for (var r = 0, t2 = A.wrap + .1, t3 = A.off; t2 + r * .1 < t3; r++) Q.push({ t: t2 + r * .1, k: 'tick', g: .08, p: (r * 3) % 7 });
    Q.push({ t: A.jumps, k: 'tap', g: .4, p: 2 }, { t: DUR - .45, k: 'swish', d: .6, g: .5, p: -.6 });
    window.CUES = { dur: DUR, cues: Q, bed: { bpm: 240 / (DUR / 8), origin: 0, gain: .3, chords: [[45, 57, 64, 67, 71], [41, 57, 60, 64, 69], [43, 55, 62, 67, 71], [40, 55, 59, 64, 67]] } };
  }
  window.seek = seek; window.DURATION = DUR;
  document.fonts.load("800 72px 'Bricolage Grotesque'").then(function(){ return document.fonts.load("500 22px 'JetBrains Mono'"); }).then(function(){ return document.fonts.ready; })
    .then(function(){ anchors(); seek(+(new URLSearchParams(location.search).get('t') || 0)); document.documentElement.dataset.ready = 1; });
})();
</script>
