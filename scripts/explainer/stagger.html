<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Why does your list feel so flat?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* @webin20sec, narrated explainer Nº 04, a motion tip: "Why does your list feel so flat?"
   Every row runs the same entrance at the same moment, so the list lands as one block; the same animation with each row 40 ms after
   the last (animation-delay from an index, --i) reads top to bottom. Plain CSS animations, no browser versions on screen.
   Flow (owner, 25 Oct, on Nº 03: "it feels as if blocks are placed"): one screen holds the list for the whole reel and only moves and
   scales; one panel under it changes shape (timing diagram, code, timing diagram, one line). Every spoken line has its picture;
   beats and captions lead the voice by 0.15 s (window.setVoice); stage 540x960 CSS px at 2x; every frame a pure function of t. */
:root{--ink:#121110;--paper:#f2efe8;--dim:#8d877c;--surface:#1c1a1f;--rule:#34303c;--row:#24222a;--acc:#ffb547;--red:#ff4d3d;--f:'Bricolage Grotesque',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f);-webkit-font-smoothing:antialiased}
.a{position:absolute}
#lbl{left:36px;top:120px;font:700 15px/1 var(--m);letter-spacing:.14em;color:var(--dim);white-space:nowrap}
#hud{right:36px;top:120px;font:700 15px/1 var(--m);letter-spacing:.06em;white-space:nowrap;color:var(--dim);text-align:right}
#hud b{font-weight:700;color:var(--paper)}#hud .r{color:var(--red)}#hud .y{color:var(--acc)}
#tag{left:36px;top:170px;font:700 15px/1 var(--m);letter-spacing:.14em;white-space:nowrap;color:var(--dim)}
#hook{left:34px;top:250px;font-weight:800;font-size:78px;line-height:.96;letter-spacing:-.045em;font-variation-settings:'wdth' 85,'opsz' 96}
#hook .ln{display:block;white-space:nowrap}
#hook .ln > span{display:inline-block;transform-origin:0 80%}
#hook .acc{color:var(--acc)}
/* the screen: five rows (an inbox, a feed: any list); later the same screen holds a grid and a menu */
#scr{left:36px;top:206px;width:468px;height:286px;border-radius:30px;background:var(--surface);overflow:hidden;transform-origin:50% 0}
.row{position:absolute;left:14px;right:14px;height:44px;border-radius:14px;background:var(--row)}
.row .av{position:absolute;left:10px;top:8px;width:28px;height:28px;border-radius:50%}
.row .l1{position:absolute;left:52px;top:10px;height:10px;border-radius:5px;background:#4a4555}
.row .l2{position:absolute;left:52px;top:26px;height:8px;border-radius:4px;background:var(--rule)}
.row .pl{position:absolute;right:12px;top:12px;width:46px;height:20px;border-radius:10px;background:var(--rule)}

#eye{left:6px;top:14px;width:4px;height:44px;border-radius:2px;background:var(--acc)}
.card{position:absolute;width:136px;height:118px;border-radius:18px;background:var(--row);overflow:hidden}
.card .im{position:absolute;left:10px;top:10px;right:10px;height:58px;border-radius:10px;opacity:.6}
.card .l1{position:absolute;left:12px;top:80px;width:84px;height:10px;border-radius:5px;background:#4a4555}
.card .l2{position:absolute;left:12px;top:96px;width:56px;height:8px;border-radius:4px;background:var(--rule)}
#menu{left:24px;top:18px;width:250px;height:250px;border-radius:20px;background:#26232c;border:1.5px solid #3c3846;transform-origin:0 0;overflow:hidden}
#menu .hd{position:absolute;left:18px;top:16px;font:700 13px/1 var(--m);letter-spacing:.12em;color:var(--dim)}
#menu .it{position:absolute;left:10px;right:10px;height:38px;border-radius:10px;font:600 19px/38px var(--f);padding-left:12px}
#menu .hl{position:absolute;left:10px;right:10px;height:38px;border-radius:10px;background:rgba(255,181,71,.14)}
/* the deck: one panel under the screen that changes shape (timing diagram, code, timing diagram, one line) */
#deck{left:36px;width:468px;border-radius:20px;background:var(--surface);overflow:hidden}
#deck > .lay{position:absolute;left:0;top:0;right:0;bottom:0}
.bar{position:absolute;height:12px;border-radius:6px}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
#ph{top:0;bottom:0;width:2px;background:var(--paper)}
#cd{padding:18px 22px;font:500 19px/1.45 var(--m);white-space:pre;color:var(--paper)}
#cd b{font-weight:500;color:var(--acc)}#cd .dim{color:var(--dim)}
#ol{padding:0 22px;display:flex;align-items:center;font:500 17.5px/1 var(--m);white-space:pre;color:var(--paper)}
#ol b{font-weight:500;color:var(--acc);border-radius:6px;padding:4px 2px}
#deckL{left:36px;font:700 15px/1 var(--m);letter-spacing:.12em;white-space:nowrap}
#cap{left:36px;right:36px;top:672px;font:700 34px/1.12 var(--f);font-variation-settings:'opsz' 36;letter-spacing:-.015em}
#cap span{display:inline-block;margin-right:.24em}
</style>
</head>
<body>
<div id="lbl" class="a">Nº 04 · MOTION</div>
<div id="hud" class="a"></div>
<div id="tag" class="a"></div>
<div id="hook" class="a"><span class="ln"><span>Why</span> <span>does</span> <span>your</span></span><span class="ln"><span>list</span> <span>feel</span></span><span class="ln"><span class="acc">so</span> <span class="acc">flat?</span></span></div>
<div id="scr" class="a"><div id="eye" class="a"></div><div id="menu" class="a"><div class="hd">SORT BY</div><i class="hl"></i></div></div>
<div id="deck" class="a"><div id="tl" class="lay"><div id="ph" class="a"></div></div><div id="cd" class="lay"></div><div id="ol" class="lay">animation-delay: <b>calc(var(--i) * 40ms)</b>;</div></div>

<div id="cap" class="a"></div>
<script>
(function(){

      S.insertBefore(r, $('eye'));

    });

    // ---- the screen never leaves: small under the hook, full for the problem, smaller while the rule is typed, full again ----

    var run = RUNS[0]; for (var q = 0; q < RUNS.length; q++) if (t < RUNS[q].until) { run = RUNS[q]; break; }
    var ri = RUNS.indexOf(run), gOut = function(i){ return io(P(t, A.grids - .1 + i * .03, A.grids + .15 + i * .03)); };

    [].forEach.call($('scr').querySelectorAll('.row'), function(r, i){ var s = run.t0 + i * run.gap, k = out(P(t, s, s + run.d)), go = gOut(i);
      r.style.opacity = Math.max(.16 * cl(t * 3), cl(k * 1.6)) * (1 - go);   // between runs the rows wait as ghosts, so the screen is never blank r.style.transform = 'translateY(' + ((1 - k) * 26 + jolt - go * 14) + 'px)';
      // "Give each row an index": the right-hand pill turns into the row's --i, top to bottom
      var ik = out(P(t, A.index + i * .07, A.index + i * .07 + .25)); r.querySelector('.pl').style.opacity = 1 - ik; var ix = r.querySelector('.ix'); ix.style.opacity = ik; ix.style.transform = 'scale(' + mix(.7, 1, ik) + ')'; });
    // "Now the eye flows top to bottom": a marker runs down the rows
    var ek = io(P(t, A.flows - .05, A.flows + .65));

    // "grids": a card grid staggers in on the diagonal; "menus": a sort menu drops in and its items stagger; a highlight steps through them
    var mOn = out(P(t, A.menus - .05, A.menus + .3));

    show($('menu'), mOn, (1 - mOn) * -10, mix(.92, 1, mOn));
    [].forEach.call($('menu').querySelectorAll('.it'), function(it, i){ var s = A.menus + .1 + i * .04, k = out(P(t, s, s + .4)); it.style.opacity = cl(k * 1.6); it.style.transform = 'translateY(' + (1 - k) * 18 + 'px)'; });
    var step = Math.max(0, t - A.menus - .8), hi = Math.floor(step / .45), pos = hi < 1 ? 0 : Math.min(4, hi - 1 + out(cl((step - hi * .45) / .2)));
    $('menu').querySelector('.hl').style.top = (40 + pos * 41) + 'px'; $('menu').querySelector('.hl').style.opacity = P(t, A.menus + .6, A.menus + .8);
    // ---- the deck: timing diagram (top 510, 104) → code (396, 204) → timing diagram → one line (510, 84) → gone on "Works" ----
    var dIn = out(P(t, A.once - .2, A.once + .1)), m3 = io(P(t, A.line - .3, A.line + .1)), m4 = io(P(t, A.works - .2, A.works + .2));

    var lit = P(t, A.delays - .05, A.delays + .15); $('ol').lastElementChild.style.background = 'rgba(255,181,71,' + (.18 * lit) + ')';
    // ---- the readout top right: what the list is doing right now ----

    var nT = Math.floor(CODE_TXT.length * P(t, A.fix + .1, A.same - .35)), lines = CODE_TXT.slice(0, nT).split('\n').length;
    if (t < A.every - .1) H = 'LIST · <b>5 ROWS</b>';

    else if (t < A.same - .2) H = 'CSS <b>' + Math.max(1, lines) + '/5 LINES</b>';

    else H = (t < A.grids ? '<b class="y">LISTS</b>' : 'LISTS') + ' · ' + (t >= A.grids && t < A.menus ? '<b class="y">GRIDS</b>' : 'GRIDS') + ' · ' + (t >= A.menus ? '<b class="y">MENUS</b>' : 'MENUS');
    $('hud').innerHTML = H; $('hud').style.opacity = 1 - ex;
    var tg = $('tag'); tg.style.opacity = (t >= A.every - .1 ? 1 : 0) * (1 - ex);

    // ---- captions ----
