<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Why does your headline break so badly?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* @webin20sec, narrated explainer Nº 06, a type tip: "Why does your headline break so badly?"
   A headline wraps with one word alone on its last line (an orphan); text-wrap: balance makes the browser even out the lines.
   The words are real text: the scene lays the headline out twice off screen (wrap and balance) and moves each word from one layout
   to the other, so what you see is what the browser does. Flow as Nº 04/05: one screen that only moves and scales, one panel under it
   that changes shape (line lengths, code, line lengths, one line). Beats and captions lead the voice by 0.15 s; every frame a pure function of t. */
:root{--ink:#121110;--paper:#f2efe8;--dim:#8d877c;--surface:#1c1a1f;--rule:#34303c;--row:#24222a;--acc:#ffb547;--red:#ff4d3d;--f:'Bricolage Grotesque',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f);-webkit-font-smoothing:antialiased}
.a{position:absolute}

/* the screen: a landing page whose headline is real text, then two cards with titles of their own */
#scr{left:36px;top:206px;width:468px;height:286px;border-radius:30px;background:var(--surface);overflow:hidden;transform-origin:50% 0}
#nav{left:24px;top:20px;right:24px;height:14px}

.card .im{position:absolute;left:10px;top:10px;right:10px;height:36px;border-radius:10px;opacity:.65}
.card .tt{position:absolute;left:12px;top:54px;width:182px}
.card .hl{font:800 22px/1.1 var(--f);letter-spacing:-.03em}
/* measuring copies, off screen: the browser's own layouts, wrap and balance */
.ms{position:absolute;left:-2000px;top:0;visibility:hidden}
.ms.b{text-wrap:balance}
/* the deck: line lengths → code → line lengths → one line */
#deck{left:36px;width:468px;border-radius:20px;background:var(--surface);overflow:hidden}
#deck > .lay{position:absolute;left:0;top:0;right:0;bottom:0}
.bar{position:absolute;left:24px;height:14px;border-radius:7px;background:rgba(242,239,232,.08)}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
#cd{padding:18px 22px;font:500 21px/1.45 var(--m);white-space:pre;color:var(--paper)}
#cd b{font-weight:500;color:var(--acc)}#cd .dim{color:var(--dim)}
#ol{padding:0 22px;display:flex;align-items:center;font:500 21px/1 var(--m);white-space:pre;color:var(--paper)}
#ol b{font-weight:500;color:var(--acc);border-radius:6px;padding:4px 2px}
#deckL{left:36px;font:700 15px/1 var(--m);letter-spacing:.12em;white-space:nowrap}
#cap{left:36px;right:36px;top:672px;font:700 34px/1.12 var(--f);font-variation-settings:'opsz' 36;letter-spacing:-.015em}
#cap span{display:inline-block;margin-right:.24em}

<script>

    { el: $('c2').querySelector('.hl'), text: 'Pricing that grows with your team', w: 182 }];

    var L = $('ln'); for (var i = 0; i < 3; i++) { var b = document.createElement('div'); b.className = 'bar'; b.style.top = (20 + i * 26) + 'px'; b.style.width = '420px'; b.innerHTML = '<b></b>'; L.appendChild(b); }

    $('box').style.borderRightColor = 'rgba(242,239,232,' + (.28 * Math.max(P(t, A.last - .05, A.last + .3), 1 - cards) * (1 - cards)) + ')';

      place(h, P(t, A.heading - .05 + i * .18, A.heading + .7 + i * .18), t < A.heading + i * .18 + .3); });

  document.fonts.load("800 76px 'Bricolage Grotesque'").then(function(){ return document.fonts.load("500 22px 'JetBrains Mono'"); }).then(function(){ return document.fonts.ready; })
    .then(function(){ layout(); anchors(); seek(+(new URLSearchParams(location.search).get('t') || 0)); document.documentElement.dataset.ready = 1; });
})();
</script>
