<html lang="en">
<head>
<meta charset="utf-8">

<title>Why does your grey text vanish on phones?</title>

<style>
/* @webin20sec SAMPLE S1 (sample (6 Nov 2026, temporary)): "Why does your grey text vanish on phones?" A story opening (Client and Dev chat
   bubbles whose lines are the voice), ONE camera that never cuts (the pale price → a loupe → a contrast dial → its colour drops into the
   code → the camera pulls back to the fixed screen), and a calm light look (off-white, faint grid, soft shadows, one serif italic accent).
   Light grey #b3b3b3 on white is 2.1:1; WCAG asks 4.5:1 for body text (MDN, Color contrast); #767676 is 4.54:1. The dial's needle is the
   real WCAG ratio of the grey on screen, computed every frame. Beats lead the voice by 0.15 s; every frame a pure function of t. */

*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
.a{position:absolute}

#lbl{left:30px}#hud{right:30px;text-align:right}
#hud b{font-weight:700}
/* the world: one camera over a phone showing a shop */

<script>
