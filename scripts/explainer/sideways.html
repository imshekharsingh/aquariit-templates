<!doctype html>

<title>Why does your page slide sideways on phones?</title>

<style>
/* @webin20sec, narrated explainer Nº 13, a text tip: "Why does your page slide sideways on phones?"
   overflow-wrap is normal by default (MDN: lines break only at normal break points, such as a space), so one long link
   can't wrap: it sticks out past the screen and the whole page can be dragged sideways. overflow-wrap: anywhere lets an
   unbreakable string break at any point, only when it would overflow. Same phone and column as Nº 11, a new page (an order
   card) and the link's overflow drawn outside the phone in red. Beats and captions lead the voice by 0.15 s; the title holds
   until it is complete and the cover is that moment (window.COVER); every frame a pure function of t. */
:root{--ink:#111214;--paper:#f2efe8;--dim:#8a8780;--surface:#1b1c21;--rule:#33343c;--acc:#7cf0b6;--red:#ff5a4a;--f:'Bricolage Grotesque',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}

.a{position:absolute}

#ph{left:0;top:0;width:250px;height:470px;border-radius:38px;background:#2a2b31;padding:8px;transform-origin:0 0}

.url{font:500 13px/18px var(--m);color:#2e5bd8;text-decoration:underline;white-space:nowrap;margin-top:6px}
#u2{white-space:normal;overflow-wrap:anywhere;width:178px}
#card .btn{margin-top:12px;height:38px;border-radius:19px;background:var(--ink);color:var(--paper);font:800 15px/38px var(--f);text-align:center}

/* the link's overflow, drawn outside the screen */
#tail{position:absolute;left:8px;top:8px;width:520px;height:454px;pointer-events:none}
#tail .url{position:absolute;color:var(--red);text-decoration:none}

#ok{position:absolute;border:3px solid var(--acc);border-radius:20px;z-index:6}
/* the column: the code, under the link's tail */
#col{left:306px;top:430px;width:198px;height:200px}
#cd{position:absolute;left:0;right:0;top:0;padding:16px 14px;border-radius:18px;background:var(--surface);font:500 17px/1.45 var(--m);white-space:pre;color:var(--paper)}
#cd b{font-weight:500;color:var(--acc)}#cd .dim{color:var(--dim)}

<body>

<div id="tag" class="a"></div>
<div id="hook" class="a"><span class="ln"><span>Why</span> <span>does</span> <span>your</span></span><span class="ln"><span>page</span> <span class="acc">slide</span></span><span class="ln"><span class="acc">sideways</span> <span>on</span></span><span class="ln"><span>phones?</span></span></div>
<div id="ph" class="a">
  <div id="scr">
    <div id="sb">9:41</div>
    <div id="pg">
      <div class="br">PARCELBAY</div><div class="h">Your order<br>is on its way.</div>
      <div id="card"><div class="k">Track it here:</div><div class="url" id="u1">https://parcelbay.shop/track/7Q4KXW92LMZRHT</div><div class="url" id="u2">https://parcelbay.shop/track/7Q4KXW92LMZRHT</div><div class="btn">Track parcel</div></div>
      <div class="bar" style="top:318px;width:190px"></div><div class="bar" style="top:336px;width:168px"></div><div class="bar" style="top:354px;width:182px"></div><div class="bar" style="top:372px;width:120px"></div>
    </div>

    <div id="ok"></div>
  </div>

</div>
<div id="col" class="a"><div id="cd"></div></div>
<div id="cap" class="a"></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  var TEXT = "Why does your page slide sideways on phones? One long link can't break, because text only wraps at spaces. It sticks out past the edge, and the whole page slides. The fix: overflow wrap, anywhere. Now it breaks to fit, and the page stays put.";
  var WORDS = [], DUR = 20, LEAD = .15, HOOK_N = 8;
  (function(){ var t = .2; TEXT.split(/\s+/).forEach(function(w){ var d = .14 + w.length * .03; WORDS.push({ w: w, s: t, e: t + d }); t += d + (/[.?:,;]$/.test(w) ? .32 : .06); }); })();
  var norm = function(w){ return w.toLowerCase().replace(/[^a-z0-9]/g, ''); };
  function at(word, nth){ var n = nth || 1; for (var i = 0; i < WORDS.length; i++) if (norm(WORDS[i].w) === word && --n === 0) return WORDS[i].s - LEAD; return 99; }
  function align(){ var T = TEXT.split(/\s+/), j = 0;
    WORDS.forEach(function(w){ w.d = w.w; for (var k = j; k < Math.min(T.length, j + 4); k++) if (norm(T[k]) === norm(w.w)) { w.d = T[k]; j = k + 1; break; } }); }
  var A = {}, PH = [];
  function anchors(){
    align();
    A = { one: at('one'), cant: at('cant'), wraps: at('wraps'), spaces: at('spaces'), sticks: at('sticks'), edge: at('edge'), whole: at('whole'), slides: at('slides'),
      fix: at('fix'), overflow: at('overflow'), anywhere: at('anywhere'), now: at('now'), breaks: at('breaks'), fit: at('fit'), stays: at('stays'), put: at('put') };
    A.hookIn = (WORDS[HOOK_N - 1] ? WORDS[HOOK_N - 1].s - LEAD : 2) + .3; A.leave = Math.max(A.one - .3, A.hookIn + .35);
    window.COVER = +(A.hookIn + .1).toFixed(2);
    PH = []; var cur = [];
    WORDS.forEach(function(w, i){ cur.push(i); if (/[.?!]$/.test(w.d) || i === WORDS.length - 1) {
      if (cur.length > 7) { var best = -1; cur.forEach(function(j, k){ if (/[,:;]$/.test(WORDS[j].d) && k > 1 && k < cur.length - 2 && (best < 0 || Math.abs(k - cur.length / 2) < Math.abs(best - cur.length / 2))) best = k; });
        if (best < 0) best = Math.floor(cur.length / 2) - 1; PH.push(cur.slice(0, best + 1)); PH.push(cur.slice(best + 1)); }
      else PH.push(cur);
      cur = []; } });
    buildCues();
  }
  var SW = 234, SCALE = 390 / SW;   // the phone's screen is 234 px wide; the HUD shows a real phone's 390 CSS px
  // how far the page is dragged sideways (px) at t: it drifts in the hook (the problem from frame 0), rests while the cause is
  // told, is dragged on "the whole page slides", snaps back when the link wraps, and a drag on "stays put" no longer moves it
  function drag(t, maxS){
    var hook = Math.sin(P(t, .15, A.leave) * Math.PI) * .75;
    var slide = io(P(t, A.whole - .15, A.slides + .3)) * (1 - io(P(t, A.anywhere, A.anywhere + .45)));
    return maxS * Math.max(hook, slide);
  }
  var CODE = '<span class="dim">a {</span>\n  overflow-wrap:\n    <b>anywhere</b>;\n<span class="dim">}</span>';
  function typed(src, n){ var o = '', k = 0, open = [];
    for (var i = 0; i < src.length; i++) { if (src[i] === '<') { var e = src.indexOf('>', i), tag = src.slice(i, e + 1); o += tag; if (tag[1] === '/') open.pop(); else open.push(tag.match(/<(\w+)/)[1]); i = e; continue; }
      if (k >= n) break; o += src[i]; k++; }
    while (open.length) o += '</' + open.pop() + '>'; return o; }
  var CODE_N = CODE.replace(/<[^>]+>/g, '').length;
  function seek(t){
    t = Math.max(0, Math.min(DUR, t));
    var ex = io(P(t, DUR - .6, DUR - .1));
    var gone = io(P(t, A.leave, A.leave + .35));
    [].forEach.call($('hook').querySelectorAll('.ln > span'), function(sp, i){
      var s = WORDS[i] ? WORDS[i].s - LEAD : 0, k = out(P(t, s, s + .26));
      sp.style.opacity = cl((t - s) * 9) * (1 - gone); sp.style.transform = 'translateY(' + ((1 - k) * 40 - gone * 80) + 'px)'; });
    $('lbl').style.opacity = 1 - ex;

    var rise = io(P(t, A.leave + .2, A.leave + .7)), s = mix(.56, 1, rise), x = mix((540 - 250 * .56) / 2 - 40, 36, rise), y = mix(538 + Math.sin(t * .9) * 3, 206, rise);
    var ph = $('ph'); ph.style.opacity = out(P(t, 0, .3)) * (1 - ex); ph.style.transform = 'translate(' + x + 'px,' + (y + ex * 20) + 'px) scale(' + s + ')';
    // ---- the link: one line until "anywhere", then it wraps inside the card ----
    var wrapK = io(P(t, A.anywhere + .45, A.anywhere + .85));
    var u1 = $("u1"), u2 = $("u2"), lw = u1.scrollWidth, card = $('card');
    var lx = 14 + 14, ly = 26 + 132 + 14 + 16 + 6;               // the link's left edge and top inside the screen
    var maxS = Math.min(110, Math.max(0, lx + lw + 14 - SW));                    // how far the page can be dragged: the link's end plus the card's padding
    var d = drag(t, maxS);
    $('pg').style.transform = 'translateX(' + (-d) + 'px)';
    u1.style.display = 'block'; lw = u1.scrollWidth; maxS = Math.min(110, Math.max(0, lx + lw + 14 - SW)); d = drag(t, maxS); $('pg').style.transform = 'translateX(' + (-d) + 'px)';
    u1.style.display = wrapK < .5 ? 'block' : 'none'; u2.style.display = wrapK < .5 ? 'none' : 'block';
    u1.style.opacity = 1 - wrapK * 2; u2.style.opacity = cl(wrapK * 2 - 1);
    $('pg').style.width = (SW + 120) + 'px';
    // the tail: the part of the link past the screen's right edge, in red, outside the phone (gone once it wraps)
    var over = Math.max(0, lx - d + lw - SW), tA = (1 - wrapK) * (over > 2 ? 1 : 0) * (1 - ex);
    var u3 = $('u3'); u3.style.left = (lx - d) + 'px'; u3.style.top = ly + 'px'; u3.style.clipPath = 'inset(0 0 0 ' + (SW - (lx - d) + 4) + 'px)'; u3.style.opacity = tA;
    var bx = $('tail').querySelector('.box'); bx.style.left = (SW + 4) + 'px'; bx.style.top = (ly - 5) + 'px'; bx.style.width = (over + 6) + 'px'; bx.style.height = '28px'; bx.style.opacity = tA * cl(over / 20);
    // the finger: drags the page on "slides", then tries again on "stays put" and the page doesn't move
    var f1 = win(t, A.whole - .35, A.slides + .55, .2), f2 = win(t, A.stays - .3, A.put + .6, .2), fg = $('fg');
    var fx = f1 > 0 ? mix(170, 170 - maxS, io(P(t, A.whole - .15, A.slides + .3))) : mix(170, 110, io(P(t, A.stays - .15, A.put + .2)));
    fg.style.left = (fx - 22) + 'px'; fg.style.top = '362px'; fg.style.opacity = Math.max(f1, f2) * (1 - ex);
    // the card, ringed green once the link fits
    var ok = $('ok'); ok.style.left = (14 - 5) + 'px'; ok.style.top = (26 + 132 - 5) + 'px'; ok.style.width = (206 + 10) + 'px'; ok.style.height = (card.offsetHeight + 10) + 'px';
    ok.style.opacity = Math.max(win(t, A.anywhere + .8, A.now + .3, .15), win(t, A.fit, DUR - .7, .15)) * (1 - ex);
    // ---- the code: typed on "overflow wrap, anywhere" ----
    var codeOn = P(t, A.fix - .1, A.fix + .15) * (1 - ex), col = $('col');
    col.style.opacity = codeOn; col.style.transform = 'translateY(' + (1 - out(P(t, A.fix - .1, A.fix + .3))) * 24 + 'px)';
    $('cd').innerHTML = typed(CODE, Math.floor(3 + (CODE_N - 3) * P(t, A.fix + .1, A.anywhere + .1)));
    // ---- HUD and tag ----
    var pagePx = Math.round(SW * SCALE), linkPx = Math.round((lx + lw + 14) * SCALE), Hd;
    if (t < A.leave + .2) Hd = 'PAGE · <b class="r">SLIDES SIDEWAYS</b>';
    else if (t < A.anywhere) Hd = 'SCREEN <b>' + pagePx + ' PX</b> · LINK <b class="r">' + linkPx + ' PX</b>';
    else Hd = 'SCREEN <b>' + pagePx + ' PX</b> · LINK <b class="y">FITS</b>';
    $('hud').innerHTML = Hd; $('hud').style.opacity = 1 - ex;
    var tg = $('tag'); tg.style.opacity = (t >= A.leave + .2 ? 1 : 0) * (1 - ex);
    tg.textContent = t < A.sticks - .2 ? 'TEXT WRAPS ONLY AT SPACES' : t < A.fix - .2 ? 'THE PAGE SLIDES SIDEWAYS' : t < A.now - .2 ? 'THE FIX' : 'IT BREAKS ONLY IF IT MUST';
    // ---- captions ----
    var ph0 = null;
    for (var i = 0; i < PH.length; i++) { if (t >= WORDS[PH[i][0]].s - LEAD - .05 && (i === PH.length - 1 || t < WORDS[PH[i + 1][0]].s - LEAD - .05)) ph0 = PH[i]; }
    var html = '';
    if (ph0 && ph0[0] >= HOOK_N && t < DUR - .5)
      ph0.forEach(function(j){ var w = WORDS[j], on = t >= w.s - LEAD, k = out(P(t, w.s - LEAD, w.s - LEAD + .2)), aft = w.s >= A.fix;

        html += '<span style="opacity:' + (on ? 1 - ex : 0) + ';transform:translateY(' + (1 - k) * 12 + 'px);color:' + col2 + '">' + w.d.replace(/</g, '') + '</span>'; });
    $('cap').innerHTML = html;
  }
  window.setVoice = function(v){ if (v && v.words && v.words.length) { WORDS = v.words; anchors(); } };
  function buildCues(){
    var Q = [{ t: 0, k: 'swish', d: .5, g: .5, p: -.5 }, { t: A.leave, k: 'swish', d: .4, g: .5 }];
    Q.push({ t: A.cant, k: 'thud', g: .3 }, { t: A.whole - .15, k: 'swish', d: .5, g: .4, p: -.3 }, { t: A.slides + .3, k: 'thud', g: .35 });

  }

  document.fonts.load("800 72px 'Bricolage Grotesque'").then(function(){ return document.fonts.load("500 22px 'JetBrains Mono'"); }).then(function(){ return document.fonts.ready; })
    .then(function(){ anchors(); seek(+(new URLSearchParams(location.search).get('t') || 0)); document.documentElement.dataset.ready = 1; });
})();
