<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Liquid glass</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* @webin20sec, series "Material": liquid glass over a living app. v2 (owner, 23 Oct: "where's the variation?"): the glass travels through four
   apps on the beat (music at night, weather at noon, a map in macro, a wallet), each with its own light, colour world and camera. A WebGL2 renderer written for this reel: the app (a fictional player,
   Tidepool) is drawn on a 2D canvas every frame and used as a texture; glass shapes are signed-distance fields joined with a smooth union,
   so they stretch, split and merge like liquid. Per pixel: a rounded bevel gives the normal, the app is refracted through it with a little
   dispersion (R, G and B bend by different amounts), frosted inside, lit by a moving light (specular + Fresnel rim), and the glass casts a
   soft shadow on the app. Every frame is a pure function of t (window.seek). One typeface: Hanken Grotesk. */
*{margin:0}html,body{width:540px;height:960px;overflow:hidden;background:#140f1a}
canvas{position:absolute;left:0;top:0;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<script>
(function(){

    a.font = '500 13px ' + F; a.textAlign = 'right'; a.fillText('Tidepool', 510, 128); a.textAlign = 'left';

    var rk = P(t % 17, 10.2, 13.0); a.strokeStyle = '#ff5a1f'; a.lineWidth = 7; a.lineJoin = 'round'; a.setLineDash([]); a.beginPath(); a.moveTo(120, 760);

  }

    var g = a.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0f3a2e'); g.addColorStop(1, '#06140f'); a.fillStyle = g; a.fillRect(0, 0, W, H);

    a.save(); a.translate(270, 300); a.rotate(-.06); var cg = a.createLinearGradient(-220, -130, 220, 130); cg.addColorStop(0, '#c9f2d8'); cg.addColorStop(.5, '#6fd3a4'); cg.addColorStop(1, '#2c8f68');
    a.fillStyle = cg; a.beginPath(); a.roundRect(-220, -135, 440, 270, 26); a.fill();
    a.strokeStyle = 'rgba(255,255,255,.35)'; a.lineWidth = 1.5; for (var k = 0; k < 9; k++) { a.beginPath(); a.arc(140, -40, 30 + k * 16, 0, 7); a.stroke(); }
    a.fillStyle = 'rgba(8,40,30,.85)'; a.font = '700 22px ' + F; a.fillText('Fernpay', -190, -88); a.font = '600 24px ' + F; a.fillText('•••• •••• •••• 4821', -190, 70); a.font = '500 15px ' + F; a.fillText('M. ILVES', -190, 105); a.restore();
    a.fillStyle = 'rgba(220,255,236,.6)'; a.font = '600 13px ' + F; a.letterSpacing = '2px'; a.fillText('BALANCE', 30, 500); a.letterSpacing = '0px';
    a.fillStyle = '#e9fff3'; a.font = '800 64px ' + F; a.fillText('$2,480.50', 30, 560);
    var rows = [['Corner Bakery', '−$6.40'], ['Ferry pass', '−$32.00'], ['Refund · Kiln Co.', '+$58.20'], ['Night Market', '−$14.75']];
    rows.forEach(function(r, i){ var y = 760 + i * 62; a.fillStyle = 'rgba(220,255,236,.12)'; a.beginPath(); a.arc(52, y - 6, 20, 0, 7); a.fill(); a.fillStyle = '#e9fff3'; a.font = '700 18px ' + F; a.fillText(r[0], 86, y);
      a.textAlign = 'right'; a.fillStyle = r[1][0] === '+' ? '#7dffb6' : '#e9fff3'; a.fillText(r[1], 510, y); a.textAlign = 'left'; });
  }
  var WORLDS = [music, wallet, weather, map, music], CUT = [3.4, 6.6, 9.8, 15.4];
  function worldAt(t){ var w = 0; for (var i = 0; i < CUT.length; i++) if (t >= CUT[i] - .25) w = i + 1; return w; }
  function drawApp(t){
    a.setTransform(S, 0, 0, S, 0, 0);

    'void main(){',
    '  vec2 p = (vec2(v.x * 540., (1. - v.y) * 960.) - vec2(270., 480.)) / cam.z + cam.xy;',
    '  float d = scene(p);',
    '  vec3 base = bg(p, dof);',

    '  float sd = scene(p + L * 26.);',
    '  base *= 1. - shK * (1. - smoothstep(-18., 34., sd));',
    '  if (d > 1.) { o = vec4(base, 1.); return; }',
