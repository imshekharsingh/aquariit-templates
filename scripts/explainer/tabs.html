   each tab draws its own border-bottom, so the underline blinks off one tab and on under another (a red dashed ghost where it was). Beat 2:
   the fix is typed (one indicator for the whole bar, moved with translateX and stretched with scaleX, a 0.3 s transition); the bar splits
   into BEFORE over AFTER and the same tab is tapped in both at the same moment: the top one blinks, the bottom one slides and stretches.
   Beat 3: the fixed bar returns to full size and one slide is replayed at 0.25x with its live easing curve and the distance counting.
