<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Six page transitions</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
/* @webin20sec, series "Six ways": six page transitions on one site. Tinta, a fictional paint studio: every page is one paint colour,
   and each page's big circle is the next page's colour, so every transition is a way of arriving at the colour you were shown.
   Stage 540x960 CSS px (rendered at 2x). Every frame is a pure function of t through window.seek(t). One typeface: Bricolage Grotesque. */
:root{--f:'Bricolage Grotesque',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#efe9dd;font-family:var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.pg{position:absolute;left:0;top:0;width:540px;height:960px;overflow:hidden;transform-origin:0 0}
.pg .nav{position:absolute;left:30px;right:30px;top:124px;display:flex;justify-content:space-between;align-items:baseline;font:700 20px/1 var(--f);font-variation-settings:'wdth' 75,'opsz' 24;letter-spacing:.02em}
.pg .nav span{font:500 14px/1 var(--f);opacity:.7;letter-spacing:.01em}
.pg .name{position:absolute;left:26px;top:166px;white-space:nowrap;overflow:hidden;padding-bottom:6px}
.pg .name i{display:inline-block;font-style:normal;font-weight:800;font-variation-settings:'wdth' 90,'opsz' 96;letter-spacing:-.035em;line-height:.92}
.pg .blob{position:absolute;border-radius:50%;transform-origin:50% 50%}
.pg .det{position:absolute;left:30px;top:458px;font:500 16px/1.45 var(--f);font-variation-settings:'opsz' 16}
.pg .det b{display:block;font:700 30px/1 var(--f);font-variation-settings:'opsz' 32;letter-spacing:-.02em;margin-bottom:10px}
.pg .buy{position:absolute;left:30px;top:590px;height:52px;padding:0 24px;border-radius:999px;display:flex;align-items:center;gap:10px;font:700 17px/1 var(--f);font-variation-settings:'opsz' 18}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#tiles{position:absolute;left:0;top:0;width:540px;height:960px;pointer-events:none}
#tiles i{position:absolute;width:91px;height:88px}
#chip{position:absolute;left:30px;top:686px;height:46px;display:flex;align-items:center;gap:12px;padding:0 18px 0 6px;border-radius:999px;font:700 17px/1 var(--f);font-variation-settings:'opsz' 18;z-index:20;overflow:hidden}
#chip b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--f)}
#chip .lab{position:relative;height:20px;min-width:150px;overflow:hidden}
#chip .lab span{position:absolute;left:0;top:0;white-space:nowrap;line-height:20px}
/* the hook (study 23 Oct: the hook is the shot, not a caption on the demo): one question, full frame, each word arriving by one of the
   six transitions, on Ink. It opens like a pair of doors onto the first page and closes again at the end, so the reel loops. */
.door{position:absolute;left:0;width:540px;height:480px;overflow:hidden;background:#141414;z-index:40}
.door .in{position:absolute;left:0;width:540px;height:960px}
.q{position:absolute;left:34px;top:206px;color:#efe9dd;font-weight:800;font-variation-settings:'wdth' 85,'opsz' 96;letter-spacing:-.04em;line-height:.94}
.q .ln{white-space:nowrap}
.q .w{display:inline-block;vertical-align:top;padding-bottom:.06em}
.q .w3{overflow:hidden}
.q .w3 i{display:inline-block;font-style:normal}
.q .acc{color:#ff4a1c}
.q .w4{transform-origin:0 80%}
.tag{position:absolute;left:36px;font:700 15px/1 var(--f);font-variation-settings:'wdth' 75,'opsz' 18;letter-spacing:.3em;color:rgba(239,233,221,.62);white-space:nowrap}
#ttl{position:absolute;left:30px;top:654px;z-index:20;font:800 21px/1 var(--f);font-variation-settings:'wdth' 75,'opsz' 18;letter-spacing:.12em;text-transform:uppercase}
#bar{position:absolute;left:30px;top:744px;width:200px;height:4px;display:flex;gap:4px;z-index:20}
#bar i{flex:1;border-radius:2px}
#tap{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;z-index:21;opacity:0;background:rgba(20,20,20,.18);box-shadow:0 0 0 2px rgba(20,20,20,.55)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="tiles"></div>
<div id="tap"></div>
<div class="door" id="dt"></div>
<div class="door" id="db" style="top:480px"></div>
<div id="ttl">6 page transitions</div>
<div id="chip"><b>01</b><div class="lab"></div></div>
<div id="bar"></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cl = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }, P = function(t, a, b){ return cl((t - a) / (b - a)); }, mix = function(a, b, k){ return a + (b - a) * k; };
  var out = function(k){ return 1 - Math.pow(1 - k, 4); }, inc = function(k){ return k * k * k; }, io = function(k){ return k < .5 ? 8 * k * k * k * k : 1 - Math.pow(-2 * k + 2, 4) / 2; };
  var ioe = function(k){ return k === 0 ? 0 : k === 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2; };   // expo in-out for the zoom
  // the paints; page 7 is page 1 again, so the reel loops
  var C = [
    { n: 'Bone', bg: '#efe9dd', ink: '#141414', hex: '#EFE9DD', m: 'Chalk matte' },
    { n: 'Cobalt', bg: '#2340ff', ink: '#efe9dd', hex: '#2340FF', m: 'Silk sheen' },
    { n: 'Vermilion', bg: '#ff4a1c', ink: '#141414', hex: '#FF4A1C', m: 'Eggshell' },
    { n: 'Moss', bg: '#3e5a2b', ink: '#efe9dd', hex: '#3E5A2B', m: 'Chalk matte' },
    { n: 'Ink', bg: '#141414', ink: '#efe9dd', hex: '#141414', m: 'Flat' },
    { n: 'Blush', bg: '#f4b9a7', ink: '#141414', hex: '#F4B9A7', m: 'Eggshell' }
  ];
  var LAB = ['Circle reveal', 'Liquid wipe', 'Blinds', 'Split type', 'Tile cascade', 'Zoom through'];
  // the hook, built twice (one copy per door half)
  var HQ = '<div class="q"><div class="ln"><span class="w w0">Which</span></div><div class="ln"><span class="w w1 acc">transition</span></div>'
    + '<div class="ln"><span class="w w2">would</span> <span class="w w3"><i>y</i><i>o</i><i>u</i></span></div><div class="ln"><span class="w w4">ship?</span></div></div>'
    + '<div class="tag">6 WAYS · IN 18 SECONDS</div>';
  $('dt').innerHTML = '<div class="in" style="top:0">' + HQ + '</div>'; $('db').innerHTML = '<div class="in" style="top:-480px">' + HQ + '</div>';
  var OFF = 1.6, DUR = 17.85;   // the pages run 1.6 s later than v2; 17.85 s = seven bars of the bed, so sound and picture loop together
  var back = function(k){ var c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
  var BX = 30 + 75, BY = 590 + 26;   // the Add-to-cart button centre (the tap)
  var BC = { x: 420, y: 790, r: 230 };   // each page's big circle: the next colour
  var PG = [];
  for (var i = 0; i < 7; i++) {
    var c = C[i % 6], nx = C[(i + 1) % 6], d = document.createElement('div'); d.className = 'pg'; d.style.background = c.bg; d.style.color = c.ink;
    d.innerHTML = '<div class="blob" style="left:' + (BC.x - BC.r) + 'px;top:' + (BC.y - BC.r) + 'px;width:' + 2 * BC.r + 'px;height:' + 2 * BC.r + 'px;background:' + nx.bg + (nx.bg === c.bg ? ';box-shadow:inset 0 0 0 2px ' + c.ink : '') + '"></div>'
      + '<div class="nav"><span style="font:700 20px/1 var(--f);font-variation-settings:\'wdth\' 75,\'opsz\' 24;opacity:1;letter-spacing:.06em">TINTA</span><span>No. 0' + (i % 6 + 1) + ' / 06</span></div>'
      + '<div class="name">' + c.n.split('').map(function(ch){ return '<i>' + ch + '</i>'; }).join('') + '</div>'
      + '<div class="det"><b>' + c.hex + '</b>' + c.m + ' · 2.5 L<br>Covers 30 m² · dries in 2 h</div>'
      + '<div class="buy" style="background:' + c.ink + ';color:' + c.bg + '">Add to cart · $38</div><div class="dim"></div>';
    $('stage').appendChild(d); PG.push({ el: d, c: c, name: d.querySelector('.name'), blob: d.querySelector('.blob'), L: [].slice.call(d.querySelectorAll('.name i')), det: d.querySelector('.det'), buy: d.querySelector('.buy'), dim: d.querySelector('.dim') });
  }
  // tiles for the cascade (6 x 11)
  var TL = []; for (var r = 0; r < 11; r++) for (var q = 0; q < 6; q++) { var ti = document.createElement('i'); ti.style.left = q * 90 + 'px'; ti.style.top = r * 87.3 + 'px'; $('tiles').appendChild(ti); TL.push({ el: ti, d: (q + r) * .034 }); }
  // label chip and progress
  LAB.forEach(function(l, i){ var s = document.createElement('span'); s.textContent = l; $('chip').querySelector('.lab').appendChild(s); });
  for (var b = 0; b < 6; b++) $('bar').appendChild(document.createElement('i'));
  var T = [0.45, 3.0, 5.55, 8.1, 10.65, 13.3], D = [1.0, 1.0, 1.05, 1.2, 1.1, 1.7];   // v2: 17 s, a transition every ~2.55 s
  function fitHook(){ [].forEach.call(document.querySelectorAll('.q'), function(q){ q.style.fontSize = '100px'; var w = 0;
      [].forEach.call(q.querySelectorAll('.ln'), function(l){ w = Math.max(w, l.scrollWidth); }); var fs = Math.min(126, 100 * 470 / w); q.style.fontSize = fs + 'px';
      q.nextSibling.style.top = (206 + 4 * .94 * fs + 26) + 'px'; }); }
  function hook(t){
    // each word lands with one of the reel's transitions: circle, liquid wipe, blinds, split type, zoom
    var a = [-.2, .08, .32, .5, .66];
    var k0 = P(t, a[0], a[0] + .36), k1 = P(t, a[1], a[1] + .4), k2 = P(t, a[2], a[2] + .32), k4 = P(t, a[4], a[4] + .3);
    var show = t < 2.3;
    [].forEach.call(document.querySelectorAll('.q'), function(q){
      q.style.visibility = q.nextSibling.style.visibility = show ? 'visible' : 'hidden'; if (!show) return;
      var w = q.querySelectorAll('.w');
      w[0].style.clipPath = k0 >= 1 ? 'none' : 'circle(' + (io(k0) * 150) + '% at 30% 60%)'; w[0].style.transform = 'translateY(' + (1 - back(k0)) * 40 + 'px)';
      var e = io(k1), amp = 14 * Math.sin(Math.PI * k1), wv = ['0% 0%'];
      for (var y = 0; y <= 100; y += 10) wv.push((e * 112 - 6 + amp * Math.sin(y * .09 + t * 14)) + '% ' + y + '%');
      wv.push('0% 100%'); w[1].style.clipPath = 'polygon(' + wv.join(',') + ')'; w[1].style.transform = 'translateX(' + (1 - back(k1)) * -30 + 'px)';
      w[1].style.fontVariationSettings = "'wdth' " + (85 + 6 * io(P(t, 1.0, 1.5)) * Math.sin(Math.PI * P(t, 1.0, 1.9))) + ",'opsz' 96";
      var pts = []; for (var sj = 0; sj < 5; sj++) { var x0 = sj * 20, x1 = x0 + 20.5, h = 100 * io(P(t, a[2] + sj * .04, a[2] + sj * .04 + .2)); pts.push(x0 + '% 0%', x0 + '% ' + h + '%', x1 + '% ' + h + '%', x1 + '% 0%'); }
      w[2].style.clipPath = 'polygon(' + pts.join(',') + ')';
      [].forEach.call(w[3].children, function(l, j){ l.style.transform = 'translateY(' + (110 * (1 - back(P(t, a[3] + j * .045, a[3] + j * .045 + .3)))) + '%)'; });
      w[4].style.opacity = cl(k4 * 3); w[4].style.transform = 'scale(' + mix(2.6, 1, back(k4)) + ')';
      var tg = q.nextSibling, tk = out(P(t, .95, 1.4)); tg.style.opacity = tk; tg.style.letterSpacing = mix(.7, .3, tk) + 'em';
      q.style.transform = 'translateY(' + (-10 * P(t, 0, 1.55)) + 'px)';   // a slow push so the hold never freezes
    });
    // the doors: open onto the first page, close again at the end (the loop)
    var d = io(P(t, 1.5, 1.98)) - io(P(t, DUR - .42, DUR));
    $('dt').style.transform = 'translateY(' + (-d * 500) + 'px)'; $('db').style.transform = 'translateY(' + (d * 500) + 'px)';
  }
  function fit(){ PG.forEach(function(p){ p.el.style.display = 'block'; p.name.style.fontSize = '100px'; var w = p.name.scrollWidth; p.name.style.fontSize = Math.min(290, 100 * 486 / w) + 'px'; p.el.style.display = 'none'; }); }
  function reset(p){ p.el.style.display = 'none'; p.el.style.transform = ''; p.el.style.clipPath = ''; p.el.style.zIndex = 1; p.dim.style.opacity = 0; p.det.style.transform = ''; p.buy.style.transform = '';
    p.L.forEach(function(l){ l.style.transform = ''; l.style.fontVariationSettings = ''; }); p.blob.style.transform = ''; }
  function seek(t){
    t = Math.max(0, Math.min(DUR, t)); hook(t); t = Math.max(0, t - OFF);
    PG.forEach(reset); TL.forEach(function(x){ x.el.style.transform = 'scale(0)'; });
    var i = -1; for (var j = 0; j < 6; j++) if (t >= T[j]) i = j;   // i = the last transition that has started
    var cur = i < 0 ? 0 : i, k = i < 0 ? 0 : P(t, T[i], T[i] + D[i]);
    if (i < 0 || k >= 1) { var p = PG[i < 0 ? 0 : i + 1]; p.el.style.display = 'block';
      // between transitions the page keeps moving: the name stretches into its width and the next colour swells into place
      if (i >= 0) { var sa = t - T[i] - D[i]; p.L.forEach(function(l, j){ l.style.fontVariationSettings = "'wdth' " + mix(75, 90, out(P(sa, j * .03, .7 + j * .03))) + ",'opsz' 96"; });
        p.blob.style.transform = 'scale(' + mix(.82, 1, out(P(sa, .1, 1.1))) + ')'; }
      var br = Math.sin(t * 2.4);   // between transitions nothing freezes: the name breathes on its width axis, the circle drifts
      if (i < 0 || t - T[i] - D[i] > .7) p.L.forEach(function(l, j){ l.style.fontVariationSettings = "'wdth' " + (86 + 4 * Math.sin(t * 2.4 - j * .5)) + ",'opsz' 96"; });
      p.blob.style.transform = (p.blob.style.transform || '') + ' translate(' + (10 * Math.sin(t * .9)) + 'px,' + (8 * Math.cos(t * .7)) + 'px) scale(' + (1 + .03 * br) + ')'; }
    else {
      var A = PG[i], B = PG[i + 1], s = t - T[i]; A.el.style.display = B.el.style.display = 'block'; B.el.style.zIndex = 2;
      if (i === 0) {   // circle reveal from the tapped button
        B.el.style.clipPath = 'circle(' + (io(k) * 1150) + 'px at ' + BX + 'px ' + BY + 'px)';
        A.buy.style.transform = 'scale(' + (1 - .06 * Math.sin(Math.PI * P(s, 0, .2))) + ')';
      } else if (i === 1) {   // liquid wipe: the new colour pours across from the left behind a wave that calms as it lands
        var e = io(k), amp = 70 * Math.sin(Math.PI * k), wv = ['0px 0px'];
        for (var y = 0; y <= 960; y += 24) wv.push((620 * e - 40 + amp * Math.sin(y * .011 + s * 7.5) + .4 * amp * Math.sin(y * .027 - s * 5)) + 'px ' + y + 'px');
        wv.push('0px 960px'); B.el.style.clipPath = 'polygon(' + wv.join(',') + ')';
      } else if (i === 2) {   // blinds: six strips drop in turn
        var pts = []; for (var sj = 0; sj < 6; sj++) { var x0 = sj * 90, x1 = x0 + 90 + .5, h = 960 * io(P(s, sj * .08, sj * .08 + .62)); pts.push(x0 + 'px 0', x0 + 'px ' + h + 'px', x1 + 'px ' + h + 'px', x1 + 'px 0'); }
        B.el.style.clipPath = 'polygon(' + pts.join(',') + ')';
      } else if (i === 3) {   // split type: the name leaves letter by letter, the colour rises, the new name arrives letter by letter
        A.L.forEach(function(l, j){ l.style.transform = 'translateY(' + (-115 * inc(P(s, j * .035, j * .035 + .4))) + '%)'; });
        B.el.style.clipPath = 'inset(' + (1 - io(P(s, .25, .85))) * 100 + '% 0 0 0)';
        B.L.forEach(function(l, j){ l.style.transform = 'translateY(' + (115 * (1 - out(P(s, .55 + j * .04, .95 + j * .04)))) + '%)'; });
        var dk = out(P(s, .7, 1.2)); B.det.style.transform = B.buy.style.transform = 'translateY(' + (1 - dk) * 14 + 'px)';
      } else if (i === 4) {   // tile cascade: tiles in the new colour flip in on a diagonal, then the page is there
        var cover = s < .95; B.el.style.display = cover ? 'none' : 'block';
        TL.forEach(function(x){ var tk = P(s, x.d, x.d + .38), e2 = out(tk); x.el.style.background = B.c.bg; x.el.style.transform = cover ? 'perspective(400px) rotateY(' + (1 - e2) * 90 + 'deg) scale(' + (e2 * 1.02) + ')' : 'scale(0)'; });
        var dk2 = out(P(s, .95, 1.15)); B.det.style.transform = B.buy.style.transform = 'translateY(' + (1 - dk2) * 30 + 'px)';
        B.L.forEach(function(l, j){ l.style.transform = 'translateY(' + (100 * (1 - out(P(s, .9 + j * .03, 1.15 + j * .03)))) + '%)'; });
      } else {   // zoom through the circle into the next colour
        var z = ioe(k), sc = Math.pow(14, z);
        A.el.style.transformOrigin = BC.x + 'px ' + BC.y + 'px'; A.el.style.transform = 'scale(' + sc + ')';
        B.el.style.clipPath = 'circle(' + (BC.r * sc) + 'px at ' + BC.x + 'px ' + BC.y + 'px)';
        B.el.style.transformOrigin = BC.x + 'px ' + BC.y + 'px'; B.el.style.transform = 'scale(' + mix(1.5, 1, out(P(s, .55, 1.6))) + ')';
      }
    }
    // the tap before the circle reveal
    var tp = $('tap'), ta = (1 - P(t, .9, 1.2)), tk = out(P(t, 0, .5)); tp.style.opacity = t < 1.2 ? ta : 0;
    tp.style.transform = 'translate(' + mix(320, BX + 40, tk) + 'px,' + mix(820, BY, tk) + 'px) scale(' + (1 - .25 * Math.sin(Math.PI * P(t, .5, .72))) + ')';
    // chip and bar take the colours of whatever page is on screen
    var on = PG[(i < 0 ? 0 : (k > .5 ? i + 1 : i))].c, dark = on.ink === '#efe9dd';
    $('ttl').style.color = on.ink; var chip = $('chip'); chip.style.background = on.ink; chip.style.color = on.bg; chip.querySelector('b').style.background = on.bg; chip.querySelector('b').style.color = on.ink;
    var li = 0; for (var m = 0; m < 6; m++) if (t >= T[m] - .45) li = m; if (t >= 15.6) li = 0;
    var num = chip.querySelector('b'); num.textContent = '0' + (li + 1);
    [].forEach.call(chip.querySelectorAll('.lab span'), function(sp, m){ var a = m === 0 ? (t >= 15.6 ? 15.6 : -1) : T[m] - .45, nb = m < 5 ? T[m + 1] - .45 : 15.6;
      var inK = a < 0 ? 1 : out(P(t, a, a + .35)), oK = io(P(t, nb - .25, nb)), vis = (m === li);
      sp.style.transform = 'translateY(' + ((1 - inK) * 22 - (m === 0 && t < 15.6 ? oK : (m === li ? 0 : oK)) * 22) + 'px)'; sp.style.visibility = vis ? 'visible' : 'hidden'; });
    [].forEach.call($('bar').children, function(x, m){ x.style.background = on.ink; x.style.opacity = m < li ? .55 : m === li ? 1 : .2; });
  }
  // sound cues (scripts/showreel/sound.py): every sound is tied to something moving on screen
  var Q = [{ t: 0, k: 'voice', text: 'Which transition would you ship?', speed: 1.15 }, { t: 0, k: 'hit', g: .5, p: -.3 },
    { t: .1, k: 'pop', p: 0 }, { t: .33, k: 'whoosh', d: .35, g: .5, p: .6 }, { t: .5, k: 'pop', p: 3 }, { t: .62, k: 'tick', p: 0 }, { t: .66, k: 'tick', p: 2 }, { t: .71, k: 'tick', p: 4 },
    { t: .85, k: 'hit', g: .9 }, { t: 1.0, k: 'shimmer', g: .8 }, { t: 1.82, k: 'whoosh', d: .6, g: .8, p: -.4 }, { t: 1.98, k: 'hit', g: .45, p: -.5 },
    { t: OFF + .55, k: 'click', g: 1 }];
  var SW = [{ g: .9, p: 0 }, { g: 1, p: -.3 }, null, { g: .7, p: .4 }, null, null];
  T.forEach(function(x, j){ var s = OFF + x;
    if (SW[j]) Q.push({ t: s + D[j] * .55, k: 'whoosh', d: D[j] * .9, g: SW[j].g, p: SW[j].p });
    if (j === 2) for (var b2 = 0; b2 < 6; b2++) Q.push({ t: s + b2 * .08 + .35, k: 'tick', p: b2 * 2, g: .9 });   // blinds: one tick per strip
    if (j === 3) { Q.push({ t: s + .3, k: 'whoosh', d: .5, g: .6, p: .5 }); for (var l3 = 0; l3 < PG[4].L.length; l3++) Q.push({ t: s + .75 + l3 * .04, k: 'tick', p: 7 + l3, g: .6 }); }
    if (j === 4) for (var dg = 0; dg < 16; dg += 2) Q.push({ t: s + dg * .034 + .2, k: 'tick', p: dg, g: .7 });   // tile cascade: the diagonal
    if (j === 5) { Q.push({ t: s + .85, k: 'riser', d: 1.6, g: .8 }); Q.push({ t: s + .85, k: 'boom', g: 1 }); }
    else Q.push({ t: s + D[j] * .85, k: 'hit', g: .5, p: j * .1 }); });
  Q.push({ t: DUR - .05, k: 'whoosh', d: .5, g: .7, p: -.6 });
  // the bed: 94.1 bpm, a bar every 2.55 s with its downbeat on each transition; seven chords, so bar -1 and bar 6 match and the loop is seamless
  window.CUES = { dur: DUR, cues: Q, bed: { bpm: 60 / .6375, origin: OFF + T[0], chords: [[38, 53, 57, 60, 64], [34, 50, 53, 57, 62], [31, 46, 50, 53, 57], [33, 50, 52, 55, 61],
