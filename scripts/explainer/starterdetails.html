<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>__TITLE__</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* @webin20sec "details" starter (node scripts/explainer/newweb.mjs <slug> --details N; owner, 8 Nov 2026). A compilation of small UI motions,
   each slowed down so the eye can read it: the hook beat opens on the first one already running (result first), then one beat per detail
   (a numbered eyebrow, a three-word title with one accent word, the component's one micro-interaction played once at real speed, then
   once in slow motion with its easing curve drawn live (a dot riding it) and one speed chip, then a settle hold; the CSS that does it typed
   underneath; a segmented bar on top), then a recap grid that plays every detail once at full speed and holds (the saveable frame).
   Calm by default (owner, 8 Nov 2026: the 4-5 detail 20 s cut "feels rushed"): 3 details, ~5.5 s a beat, rules-web.md rule 13. One camera that pans from part to part (declared
   matchMoves) and never stops drifting; motion from scripts/explainer/kitmotion.js; every frame a pure function of t.
   Edit DETAILS (kind, title, accent word) and the KINDS library (markup, draw, css, curve, chip) for the reel's own components.
   The look is the kit's theme (KM.theme: style C, "Glass and light", the web default from 8 Nov 2026): every colour below is a token it sets;
   window.WEB_THEME = 'dark' before this script gives the old ink-and-mint look. Cheap glass only (no backdrop-filter, no live blur on big layers). */
:root{--f:'Sora',system-ui,sans-serif;--m:'DM Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f);-webkit-font-smoothing:antialiased}
.a{position:absolute}
#vp{left:0;top:0;width:540px;height:960px;overflow:hidden}
#world{left:0;top:0;width:540px;height:960px;transform-origin:0 0}
.pn{position:absolute;top:0;width:540px;height:960px}
.stage{position:absolute;left:30px;top:230px;width:450px;height:190px;border-radius:28px;background:var(--glass);overflow:hidden;box-shadow:var(--edge),var(--lift)}
.comp{position:absolute;left:0;top:0;width:450px;height:190px;transform-origin:50% 50%}
.code{position:absolute;left:30px;top:430px;width:450px;height:118px;border-radius:24px;background:var(--glass);overflow:hidden;box-shadow:var(--edge),var(--lift)}
.cd{position:absolute;left:26px;top:12px;font:500 14px/19px var(--m);white-space:pre;color:var(--paper)}
.cd b{font-weight:500;color:var(--acc)}.cd .dim{color:var(--dim)}
.km-caret{display:inline-block;width:2px;height:16px;margin-left:1px;vertical-align:-3px;background:var(--acc)}
.cg{position:absolute;left:50px;top:556px;overflow:visible}
.cg-axis{stroke:rgba(255,255,255,.2);stroke-width:2}.cg-guide{stroke:rgba(255,255,255,.2);stroke-width:1.5;stroke-dasharray:4 5}
.cg-ghost{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cg-line{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--glow))}
.cg-h{stroke:var(--ring);stroke-width:1.5;stroke-dasharray:3 4}
.cg-dot{fill:var(--paper);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--acc))}
.cg-t{fill:var(--dim);font:700 11px var(--m);letter-spacing:.06em}
/* the recap grid */
.grid{position:absolute;left:40px;top:230px;width:430px}
.tile{position:absolute;width:210px;border-radius:22px;background:var(--glass);overflow:hidden;box-shadow:var(--edge),var(--lift)}
.mini{position:absolute;left:8px;top:8px;width:450px;height:190px;border-radius:28px;background:rgba(255,255,255,.05);overflow:hidden;transform-origin:0 0}
.tl{position:absolute;left:14px;white-space:nowrap}
.tl b{display:block;font:700 15px/1.1 var(--f);letter-spacing:-.01em}
.tl small{display:block;margin-top:4px;font:700 11px/1 var(--m);letter-spacing:.06em;color:var(--acc)}
/* screen space: the part bar, the titles, the badge, the subtitles */
#bar{left:34px;top:126px;width:442px;height:5px;display:flex;gap:6px}
#bar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
#bar b{display:block;width:100%;height:100%;background:var(--acc);transform-origin:0 0;transform:scaleX(0)}
#hook{left:34px;top:146px;font-weight:var(--hw);font-size:__HOOK_FS__px;line-height:.98;letter-spacing:var(--ht)}
#hook .ln{display:block;white-space:nowrap}
#hook .ln > span,.blk .tt > span,.blk .eb{display:inline-block;transform-origin:0 80%}
.acc{color:var(--acc)}
.blk{left:34px;top:144px;width:440px}
.blk .eb{font:700 14px/1 var(--m);letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.blk .tt{margin-top:12px;font-weight:var(--hw);font-size:40px;line-height:1;letter-spacing:var(--ht);white-space:nowrap}
.badge{right:60px;top:138px;height:28px;padding:0 12px 0 10px;border-radius:14px;background:var(--soft);border:1.5px solid var(--ring);color:var(--acc);font:700 12px/25px var(--m);letter-spacing:.12em;white-space:nowrap;opacity:0;transform-origin:100% 50%}
.badge i{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--acc);vertical-align:0;box-shadow:0 0 8px var(--acc)}
#band{left:0;top:668px;width:540px;height:140px;background:var(--ink)}
#cap{left:30px;top:680px;width:450px;min-height:80px;font:600 30px/1.16 var(--f);letter-spacing:-.025em}
#cap span{display:inline-block;margin-right:.24em}

.fg{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.75);opacity:0}
.cp{position:absolute;top:63px;height:64px;border-radius:32px;background:var(--ctl);overflow:hidden}
.cp .ic{position:absolute;left:22px;top:20px;width:18px;height:22px;border:3px solid currentColor;border-radius:5px}
.cp .ic::after{content:'';position:absolute;left:5px;top:-8px;width:18px;height:22px;border:3px solid currentColor;border-radius:5px;border-left-color:transparent;border-bottom-color:transparent}
.cp .ck{position:absolute;left:24px;top:16px;width:12px;height:24px;border:solid currentColor;border-width:0 4px 4px 0;transform:rotate(45deg) scale(0);transform-origin:60% 70%}
.cp span{position:absolute;left:58px;top:0;font:650 22px/64px var(--f);white-space:nowrap}
.tg-l{position:absolute;left:44px;top:62px;font:650 27px/1 var(--f);letter-spacing:-.02em;white-space:nowrap}
.tg-s{position:absolute;left:44px;top:100px;font:700 13px/1 var(--m);letter-spacing:.12em;color:var(--dim);white-space:nowrap}
.tg{position:absolute;left:294px;top:63px;width:112px;height:64px;border-radius:32px;background:var(--ctl)}
.kn{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:26px;background:var(--paper);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.ts{position:absolute;left:35px;top:104px;width:380px;height:74px;border-radius:22px;background:var(--raise);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 30px rgba(0,0,0,.35)}
.ts i{position:absolute;left:18px;top:21px;width:32px;height:32px;border-radius:50%;background:var(--acc)}
.ts i::after{content:'';position:absolute;left:11px;top:6px;width:7px;height:14px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ts b{position:absolute;left:66px;top:0;font:650 21px/74px var(--f);white-space:nowrap}
.ts small{position:absolute;right:20px;top:0;font:700 15px/74px var(--m);letter-spacing:.08em;color:var(--acc)}
.sk{position:absolute;left:35px;width:330px;height:28px;border-radius:10px;background:rgba(255,255,255,.08)}
.st-t{position:absolute;left:84px;top:62px;width:282px;height:8px;border-radius:4px;background:var(--ctl)}
.st-f{position:absolute;left:84px;top:62px;width:282px;height:8px;border-radius:4px;background:var(--acc);transform-origin:0 0}
.st-d{position:absolute;top:44px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--ctl);font:700 18px/44px var(--f);text-align:center}
.st-n{position:absolute;top:104px;width:90px;margin-left:-45px;text-align:center;font:700 13px/1 var(--m);letter-spacing:.12em;color:var(--dim)}
.lk-h{position:absolute;left:150px;top:52px;width:86px;height:86px;transform-origin:50% 55%}
.lk-h path{stroke:var(--paper);stroke-width:7;stroke-linejoin:round}
.lk-c{position:absolute;left:256px;top:62px;font:700 50px/1 var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.ck-b{position:absolute;left:58px;top:63px;width:64px;height:64px;border-radius:18px;background:var(--ctl);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.ck-b svg{position:absolute;left:0;top:0}
.ck-b path{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.ck-l{position:absolute;left:150px;top:70px;font:650 27px/1 var(--f);letter-spacing:-.02em;white-space:nowrap}
.ck-s{position:absolute;left:151px;top:108px;font:700 13px/1 var(--m);letter-spacing:.12em;color:var(--dim);white-space:nowrap}
.lk-s{position:absolute;left:258px;top:126px;font:700 13px/1 var(--m);letter-spacing:.12em;color:var(--dim);white-space:nowrap}
</style>
</head>
