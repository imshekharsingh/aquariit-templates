<html lang="en">
<head>

<style>
/* @webin20sec "details" starter (node scripts/explainer/newweb.mjs <slug> --details N; owner, 8 Nov 2026). A compilation of small UI motions,
   each slowed down so the eye can read it: the hook beat opens on the first one already running (result first), then one beat per detail
   (a numbered eyebrow, a three-word title with one accent word, the component doing its one micro-interaction in slow motion, the CSS that
   does it typed underneath, its easing curve drawn live with a dot riding it, a spec chip whose numbers roll in, a speed badge, a segmented
   bar on top), then a recap grid with every detail at full speed (the saveable frame). One camera that pans from part to part (declared
   matchMoves) and never stops drifting; motion from scripts/explainer/kitmotion.js; every frame a pure function of t.
   Edit DETAILS (kind, title, accent word) and the KINDS library (markup, draw, css, curve, chip) for the reel's own components. */
:root{--ink:#111214;--paper:#f2efe8;--dim:#8a8780;--stage:#26272e;--card:#202128;--line:#34353d;--acc:#7cf0b6;--red:#ff5a4a;--f:'Bricolage Grotesque',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f);-webkit-font-smoothing:antialiased}
.a{position:absolute}
#bg{left:-200px;top:-100px;width:940px;height:1160px}
#bg i{position:absolute;border-radius:50%;filter:blur(40px)}
#vp{left:0;top:0;width:540px;height:960px;overflow:hidden}
#world{left:0;top:0;width:540px;height:960px;transform-origin:0 0}
.pn{position:absolute;top:0;width:540px;height:960px}
.stage{position:absolute;left:30px;top:230px;width:450px;height:190px;border-radius:28px;background:var(--stage);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.comp{position:absolute;left:0;top:0;width:450px;height:190px;transform-origin:50% 50%}
.code{position:absolute;left:30px;top:430px;width:450px;height:118px;border-radius:20px;background:var(--card);overflow:hidden}
.cd{position:absolute;left:26px;top:12px;font:500 14px/19px var(--m);white-space:pre;color:var(--paper)}
.cd b{font-weight:700;color:var(--acc)}.cd .dim{color:var(--dim)}
.km-caret{display:inline-block;width:2px;height:16px;margin-left:1px;vertical-align:-3px;background:var(--acc)}
.cg{position:absolute;left:50px;top:556px;overflow:visible}
.cg-axis{stroke:var(--line);stroke-width:2}.cg-guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5}
.cg-ghost{fill:none;stroke:rgba(242,239,232,.12);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cg-line{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(124,240,182,.55))}
.cg-h{stroke:rgba(124,240,182,.4);stroke-width:1.5;stroke-dasharray:3 4}
.cg-dot{fill:var(--paper);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 7px rgba(124,240,182,.9))}
.cg-t{fill:var(--dim);font:700 11px var(--m);letter-spacing:.06em}
.chip{position:absolute;left:316px;top:562px;width:138px;opacity:0}
.chip div{white-space:nowrap}
.chip small{display:block;font:700 11px/1 var(--m);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.chip .sc-r0 b{font:800 34px/1 var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chip .sc-r0 span{font:700 15px/1 var(--m);color:var(--dim)}
.chip .sc-r1{margin-top:8px;font:700 14px/1 var(--m);color:var(--acc)}
.chip .sc-r1 b{font-weight:700}
/* the recap grid */
.grid{position:absolute;left:40px;top:230px;width:430px}
.tile{position:absolute;width:210px;border-radius:20px;background:var(--card);overflow:hidden}
.mini{position:absolute;left:8px;top:8px;width:450px;height:190px;border-radius:28px;background:var(--stage);overflow:hidden;transform-origin:0 0}
.tl{position:absolute;left:14px;white-space:nowrap}
.tl b{display:block;font:800 15px/1.1 var(--f);letter-spacing:-.01em}
.tl small{display:block;margin-top:4px;font:700 11px/1 var(--m);letter-spacing:.06em;color:var(--acc)}
/* screen space: the part bar, the titles, the badge, the subtitles */
#bar{left:34px;top:126px;width:442px;height:5px;display:flex;gap:6px}
#bar i{flex:1;height:5px;border-radius:3px;background:rgba(242,239,232,.16);overflow:hidden}
#bar b{display:block;width:100%;height:100%;background:var(--acc);transform-origin:0 0;transform:scaleX(0)}
#hook{left:34px;top:146px;font-weight:800;font-size:__HOOK_FS__px;line-height:.98;letter-spacing:-.024em;font-variation-settings:'wdth' 100,'opsz' 96}
#hook .ln{display:block;white-space:nowrap}
#hook .ln > span,.blk .tt > span,.blk .eb{display:inline-block;transform-origin:0 80%}
.acc{color:var(--acc)}
.blk{left:34px;top:144px;width:440px}
.blk .eb{font:700 14px/1 var(--m);letter-spacing:.14em;color:var(--dim);white-space:nowrap}

.badge i{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--acc);vertical-align:0;box-shadow:0 0 8px var(--acc)}

#cap{left:30px;top:680px;width:450px;min-height:80px;font:700 31px/1.14 var(--f);font-variation-settings:'opsz' 36;letter-spacing:-.015em}
#cap span{display:inline-block;margin-right:.24em}

.fg{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(242,239,232,.22);border:3px solid rgba(242,239,232,.75);opacity:0}

.cp .ic{position:absolute;left:22px;top:20px;width:18px;height:22px;border:3px solid currentColor;border-radius:5px}

.cp .ck{position:absolute;left:24px;top:16px;width:12px;height:24px;border:solid currentColor;border-width:0 4px 4px 0;transform:rotate(45deg) scale(0);transform-origin:60% 70%}

.tg-l{position:absolute;left:44px;top:62px;font:800 28px/1 var(--f);white-space:nowrap}
.tg-s{position:absolute;left:44px;top:100px;font:700 13px/1 var(--m);letter-spacing:.12em;color:var(--dim);white-space:nowrap}

.kn{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:26px;background:var(--paper);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.ts{position:absolute;left:35px;top:104px;width:380px;height:74px;border-radius:20px;background:#34353e;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.ts i{position:absolute;left:18px;top:21px;width:32px;height:32px;border-radius:50%;background:var(--acc)}
.ts i::after{content:'';position:absolute;left:11px;top:6px;width:7px;height:14px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ts b{position:absolute;left:66px;top:0;font:800 22px/74px var(--f);white-space:nowrap}
.ts small{position:absolute;right:20px;top:0;font:700 15px/74px var(--m);letter-spacing:.08em;color:var(--acc)}
.sk{position:absolute;left:35px;width:330px;height:28px;border-radius:10px;background:#2e2f37}
.st-t{position:absolute;left:84px;top:62px;width:282px;height:8px;border-radius:4px;background:#3a3b44}
.st-f{position:absolute;left:84px;top:62px;width:282px;height:8px;border-radius:4px;background:var(--acc);transform-origin:0 0}
.st-d{position:absolute;top:44px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#3a3b44;font:800 19px/44px var(--f);text-align:center}
.st-n{position:absolute;top:104px;width:90px;margin-left:-45px;text-align:center;font:700 13px/1 var(--m);letter-spacing:.12em;color:var(--dim)}
.lk-h{position:absolute;left:150px;top:52px;width:86px;height:86px;transform-origin:50% 55%}
.lk-h path{stroke:var(--paper);stroke-width:7;stroke-linejoin:round}
.lk-c{position:absolute;left:256px;top:62px;font:800 52px/1 var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.lk-s{position:absolute;left:258px;top:126px;font:700 13px/1 var(--m);letter-spacing:.12em;color:var(--dim);white-space:nowrap}
