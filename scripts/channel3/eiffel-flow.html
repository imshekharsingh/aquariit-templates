<!doctype html>
<!--
  Turns Out: "Why was the Eiffel Tower almost torn down?" in 2.5D, one continuous camera (owner, 1 Nov 2026: a second version of the
  3D reel showreel-c3-eiffel-saved, to compare; same story, voice, timing, caption and sources).
  - Facts (two sources each; the pilot's checked set, unchanged): toureiffel.paris "Why was the Eiffel Tower kept?" and "The Eiffel Tower
    laboratory"; history.com "How the Eiffel Tower survived"; Guinness World Records "Tallest iron structure". Built for the 1889 Exposition
    Universelle; 300 m, the tallest structure in the world until 1930; Eiffel's concession ran 20 years (to 1909), after which the City of
    Paris could have it dismantled; radio trials with Captain Ferrie's army team from 1903; the naval base at Bizerte (Tunisia), across the
    Mediterranean, reached soon after (no year on screen: accounts say 1904-1907); the concession renewed for 70 years from 1 January 1910;
    the tower still carries radio and TV transmitters.
  - Look (design/channel3.md, "2.5D toolkit"): flat engraved layers (ink linework, cross-hatching that stays the same size on screen at any
    zoom, old paper with fibres, one amber accent) at real depths in front of ONE pinhole camera that never stops and never cuts. The camera
    flies through the tower's arch into the 1889 crowd, cranes up a measuring rod, pulls back until the tower is the drawing on Eiffel's
    permit, flies through the "0" of 1909 into the tower at dusk, cranes to the top, follows the radio rings out to a map of the
    Mediterranean, and comes back in for the stamp and the payoff.
  - The tower is drawn from its published proportions (toureiffel.paris: base 125 m square, floors at 57, 115 and 276 m); approximate.
    The permit sheet, the crane with the wrecking ball (what demolition would have meant; it never came), the antenna wires and the
    radio set are illustrations, not records. The map coastline is hand-traced and approximate.
  - People: Gustave Eiffel (top hat, grey beard, frock coat) and an army radio operator (kepi, tunic, headphones, telegraph key) as clean
    illustrated figures recognised by props and setting, never a likeness or a caricature (CLAUDE.md exception for Turns Out).
  - Every frame is a pure function of t; randomness is seeded (mulberry32). 2D canvas only; no external origin but Google Fonts.
-->
