  Turns Out: "Why was the Sphinx buried up to its shoulders?" in 2.5D: a JOURNEY of seven worlds (Mon 9 Nov 2026, 13:00 IST).
  The turn: everyone pictures the whole lion body; for most of the last 4,500 years the desert hid it and only the head showed.
  - Facts (two sources each; design/channel3.md "Fact rules"):
    carved from the bedrock left in a quarry, so it sits in a hollow below the plateau: Britannica (Great Sphinx), Smithsonian (Uncovering the secrets of the Sphinx);
    wind-blown sand kept filling the hollow; for much of its history buried to the shoulders: Smithsonian, National Geographic;
    about 4,500 years old (c. 2500 BC), about 73 m long and 20 m high (240 x 66 ft): Britannica, National Geographic;
    Thutmose IV, as a prince (c. 1400 BC), slept in its shadow, dreamed it promised him the throne if he cleared the sand, cleared it and set the
    Dream Stele between its paws: Britannica, Smithsonian;
    the sand returned; 19th-century photographs show it buried to the shoulders: Smithsonian, National Geographic;
    fully cleared 1925-1936 (Emile Baraize): Britannica, Smithsonian.
  - Look: engraved paper worlds, each with its own camera that never stops, joined by six different declared transitions (window.TRANSITIONS):
    dive through the sand, page turn, zoom-through the dream cloud, match cut (moon -> stele), print (the frame becomes a photo), fold.
    Seeded randomness; every frame a pure function of t. The Sphinx is drawn from its shape, not to exact proportions.
-->

    if (t < tw1(3)) { var mA = moon(C4(t)), mB = stele(C5(t)); return Kt.match(Kt.paint(0, function(){ W4(t); }), Kt.paint(1, function(){ W5(t); }), tk(3, t), mA, mB); }
    if (t < tw0(4)) return W5(t);
    if (t < tw1(4)) { W6(t, true); var p = proj(C6(t), -10, 30, 0); Kt.print(Kt.paint(0, function(){ W5(t); }), tk(4, t), [p.x, p.y, .58, -.07]); return; }
    if (t < tw0(5)) return W6(t);
    if (t < tw1(5)) return Kt.fold(Kt.paint(0, function(){ W6(t); }), Kt.paint(1, function(){ W7(t); }), tk(5, t), 6);
    W7(t);
  }

  // ---------- type over the picture (kinetic type keyed to the spoken word, above the subject: y 150-340) ----------
  function kinetic(t){ var CX = SX, k, o, k2;
    function shown(i){ return 1 - P(t, A[i + 1] - .45, A[i + 1] - .1); }
    k = P(t, WT(1, /carved/) - .1, WT(1, /carved/) + .6); o = shown(1) * (1 - 0);
    if (k > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.roll('2500 BC', CX, 196, 64, '800 ' + FD, AMBER, k, KD); Kt.label('CARVED FROM THE BEDROCK', CX, 232, 15, '800 ' + FI, CREAM, k, 3.5, KD); x.restore(); }
    k = P(t, WT(1, /pit/) - .1, WT(1, /pit/) + .4); if (k > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.place(C2(t), -2, 20, 120, 'QUARRY PIT', k, { col: AMBER, up: 26 }); x.restore(); }
    k = P(t, WT(2, /winds/) - .1, WT(2, /winds/) + .4); o = shown(2); k2 = P(t, WT(2, /sand/) - .3, A[3] - .3);
    if (k > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.label('WIND-BLOWN SAND', CX, 176, 20, '800 ' + FI, CREAM, k, 3.5, KD);
      tag('CENTURIES PASS · ' + Math.round(mix(1, 11, eio(k2))) + '00 YEARS', CX, 214, 13, '800 ' + FI, '#2a1d14', '#f0c98e', 2.5); x.restore(); }
    k = P(t, WT(3, /1400/) - .1, WT(3, /1400/) + .6); o = shown(3);
    if (k > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.roll('1400 BC', CX, 196, 64, '800 ' + FD, AMBER, k, KD); Kt.label('PRINCE THUTMOSE', CX, 232, 17, '800 ' + FI, CREAM, P(t, WT(3, /Thutmose/) - .1, WT(3, /Thutmose/) + .4), 3.5, KD); x.restore(); }
    k = P(t, WT(4, /throne/) - .1, WT(4, /throne/) + .4); o = shown(4); k2 = P(t, WT(4, /freed/) - .1, WT(4, /freed/) + .4);
    if (k > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.label('IN HIS DREAM', CX, 168, 18, '800 ' + FI, '#f6e6c2', k, 4, KD); x.restore(); }
    if (k2 > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.stamp([['CLEAR THE SAND', 22, '800 ' + FI, 2], ['', 6, '800 ' + FI, 0, 0], ['AND BE KING', 14, '800 ' + FI, 3]], CX, 232, -.04, '#7a2e16', k2); x.restore(); }
    k = P(t, WT(5, /dream/) - .1, WT(5, /dream/) + .4); o = shown(5);
    if (k > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.stamp([['THE DREAM STELE', 22, '800 ' + FI, 2], ['', 6, '800 ' + FI, 0, 0], ['STILL BETWEEN ITS PAWS', 12, '800 ' + FI, 2.5]], CX, 200, .04, '#5a3a1c', k); x.restore(); }
    k = P(t, WT(6, /sand/) - .1, TFREEZE - .1); o = 1 - P(t, tw0(4) + .1, tw0(4) + .4);
    if (k > 0 && o > 0) { var yr = Math.round(mix(-1400, 1850, eio(k))); x.save(); x.globalAlpha = o * cl(k * 4, 0, 1); tag('THE SAND RETURNS · ' + (yr < 0 ? -yr + ' BC' : yr + ' AD'), CX, 176, 15, '800 ' + FI, '#2a1d14', '#f0c98e', 2.5); x.restore(); }
    k = P(t, WT(6, /photos/) - .1, WT(6, /photos/) + .4); o = shown(6);
    if (k > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.stamp([['PHOTOGRAPHED, 1800s', 18, '800 ' + FI, 2], ['', 6, '800 ' + FI, 0, 0], ['ONLY THE HEAD SHOWS', 12, '800 ' + FI, 2.5]], CX, 200, -.05, '#3a2414', k); x.restore(); }
    k = P(t, WT(7, /1936/) - .1, WT(7, /1936/) + .6); o = 1 - P(t, DUR - 3.1, DUR - 2.8); k2 = P(t, WT(7, /1936/) + .5, WT(7, /1936/) + 1.2);
    if (k > 0 && o > 0) { x.save(); x.globalAlpha = o; Kt.roll('1936', CX, 196, 80, '800 ' + FD, AMBER, k, KD); Kt.label('FULLY CLEARED', CX, 232, 16, '800 ' + FI, CREAM, k, 4, KD); x.restore(); }
    if (k2 > 0 && o > 0) { x.save(); x.globalAlpha = o * cl(k2 * 3, 0, 1); tag('73 M LONG · 20 M HIGH (240 × 66 FT)', CX, 272, 13, '800 ' + FI, '#2a1d14', '#f0c98e', 2); x.restore(); }
    k = P(t, WT(7, /1936/) + 1, WT(7, /1936/) + 1.5); if (k > 0) { x.save(); x.globalAlpha = 1 - P(t, DUR - 3.1, DUR - 2.8); Kt.place(C7(t), -16, 13.4, 119, 'SAND LINE, 1800s', k, { col: CREAM, up: 30 }); x.restore(); }
  }
  function drawPayoff(t){ var k = es(P(t, DUR - 2.9, DUR - 2.2)); if (k <= 0) return; x.save(); x.globalAlpha = cl(k * 1.6, 0, 1); x.translate(SX, 210); arrive(k);
    x.font = font(46, '700 ' + FD); x.textAlign = 'center'; x.strokeStyle = 'rgba(14,10,8,.75)'; x.lineWidth = 8; x.lineJoin = 'round'; x.strokeText(PAYOFF, 0, 0); txt(PAYOFF, 0, 0, 46, '700 ' + FD, AMBER, 'center', -.5);
    x.font = font(16, '800 ' + FI); x.strokeStyle = 'rgba(14,10,8,.8)'; x.lineWidth = 6; x.letterSpacing = '3px'; x.strokeText('THE SAND HID THE REST', 0, 38); x.letterSpacing = '0px'; txt('THE SAND HID THE REST', 0, 38, 16, '800 ' + FI, CREAM, 'center', 3); x.restore(); }
  function seek(t){
    t = cl(t, 0, DUR); BOXES.length = 0; x.globalAlpha = 1; frame(t);
    Kt.off(0, 0); Kt.screen(); x.globalAlpha = 1;
    if (PAPERTEX) { x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'multiply'; x.globalAlpha = .8; x.drawImage(PAPERTEX, 0, 0); x.restore(); }
    x.setTransform(2, 0, 0, 2, 0, 0); x.globalAlpha = 1; x.letterSpacing = '0px';
    kinetic(t); drawCaption(t); drawCredit(t); drawPayoff(t);
  }
  // sound (scripts/showreel/sound.py; owner, 8 Nov: every element that moves gets a sound by its size, panned by its x):
  // small (birds, hammers, steps, labels) = high ticks and blips; medium (stamps, the page, the fold, the print landing) = snaps and paper
  // rustles; large (the dive, the sand pouring, the zoom-through, the time-lapse, the clearing) = low moves and thuds
  function sfx(){ var Q = [{ t: 0, k: 'boom', g: .3 }, { t: .05, k: 'move', d: 1.6, g: .2, p: -1, x: 270, r: .3 }];
    function S(t, x0, g){ Q.push({ t: t, k: 'blip', g: g || .12, p: 7, x: x0 }); } function M(t, x0, g, kind, d){ Q.push(kind === 'rustle' ? { t: t, k: 'rustle', d: d || .6, g: g || .3, x: x0, r: .2 } : { t: t, k: 'snap', g: g || .2, p: -5, x: x0 }); }
    function Lg(t, d, x0, x2, g){ Q.push({ t: t, k: 'move', d: d, g: g || .22, p: -1.2, x: x0, x2: x2, r: .35 }); }
    for (var b = .6; b < tw0(0); b += 1.3) Q.push({ t: b, k: 'tick', g: .045, p: 3, x: 60 + b * 60 });                         // the birds' wingbeats, left to right
    S(1.9, 380, .06); Lg(tw0(0), tw1(0) - tw0(0) + .3, 270, 270, .26);                                                         // the dive
    Lg(tw1(0), 1.1, 200, 340, .18);                                                                                              // time drains back
    for (var h = A[1] + .3; h < WT(2, /pit/); h += .5) Q.push({ t: h, k: 'tick', g: .07, x: 160 + (h * 97 % 220) });               // chisels
    Lg(WT(2, /winds/) - .2, A[3] - WT(2, /winds/), 80, 460, .24); M(WT(2, /sand/), 300, .18);                                  // the pit fills, left to right
    M(tw0(1) + .1, 470, .32, 'rustle', tw1(1) - tw0(1));                                                                         // the page turns from the right
    var n0 = nap0(); M(n0 + .55, 300, .2, 'rustle', .8); M(n0 + 1.3, 310, .14, 'rustle', .75);                                       // the prince lies down: cloth, no thud
    Q.push({ t: n0 + 2.1, k: 'swell', d: 1.3, g: .1, p: -1, x: 310 }); for (var zz = n0 + 2.5; zz < A[4] - 1.6; zz += 1.82 / 3 * 1.8) Q.push({ t: zz, k: 'blip', g: .05, p: 14, x: 330 });   // a sigh, then each z
    Q.push({ t: A[4] - 1.5, k: 'blip', g: .1, p: 12, x: 330 }, { t: A[4] - 1.1, k: 'blip', g: .1, p: 14, x: 340 });            // the dream puffs rise
    Lg(tw0(2), tw1(2) - tw0(2) + .4, 330, 270, .26); Q.push({ t: tw1(2), k: 'shimmer', g: .1 });                               // through the cloud into the night
    Lg(WT(4, /throne/) - .5, 1, 120, 230, .16); M(WT(4, /freed/), 270, .2);                                                     // the crown descends, the stamp
    M(tw0(3) + .3, 270, .22); Q.push({ t: tw1(3) - .2, k: 'thud', g: .18, x: 270 });                                          // the match cut lands on the stele
    Lg(WT(5, /carved/) - .3, .9, 270, 270, .2); for (var d = A[5] + .3; d < A[6] - .4; d += .45) Q.push({ t: d, k: 'tick', g: .06, x: d * 131 % 2 ? 140 : 400 });
    Lg(WT(6, /sand/) - .1, TFREEZE - WT(6, /sand/), 270, 270, .26); for (var y = WT(6, /sand/); y < TFREEZE - .2; y += .22) Q.push({ t: y, k: 'blip', g: .04, p: 10, x: 200 + (y * 53 % 140) });   // the time-lapse: suns flick past
    M(tw0(4) + .5, 300, .3, 'rustle', .5); M(tw1(4) - .1, 300, .22);                                                            // the print lands
    Q.push({ t: tw1(4) + .2, k: 'touch', g: .2, x: 200 });                                                                      // the magnifier slides
    M(tw0(5), 300, .28, 'rustle', tw1(5) - tw0(5)); for (var f = 0; f < 5; f++) Q.push({ t: tw0(5) + .15 + f * .14, k: 'snap', g: .08, p: 2 - f, x: 470 - f * 80 });   // the panels fold leftward
    Lg(WT(7, /whole/) - .2, 1.8, 120, 420, .26); Q.push({ t: WT(7, /1936/), k: 'hit', g: .16 });
    for (var c = A[7]; c < A[8]; c += .55) Q.push({ t: c, k: 'tick', g: .05, x: 380 });                                       // rail carts
    Q.push({ t: DUR - 2.4, k: 'resolve', g: .3, notes: [57, 64, 69, 73] });
    [[WT(3, /1400/), 270], [WT(1, /carved/), 270], [WT(7, /1936/) + .5, 270]].forEach(function(q){ S(q[0], q[1], .1); });
    Q.forEach(function(q){ q.t = +Math.max(0, q.t).toFixed(2); }); Q.sort(function(a, b){ return a.t - b.t; });
    window.CUES = { dur: DUR, cues: Q, mix: { duck: 8, room: .6 }, bed: { bpm: 72, origin: 0, gain: .3, soft: true, lift: +(A[A.length - 1] - .2).toFixed(2), chords: [[45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [48, 55, 60, 64, 67], [43, 50, 55, 59, 62]] } }; }
  window.seek = seek; window.DURATION = DUR;
  Promise.all([document.fonts.load("800 44px 'Playfair Display'"), document.fonts.load("700 44px 'Playfair Display'"), document.fonts.load("700 27px 'Inter'"), document.fonts.load("800 18px 'Inter'"), document.fonts.load("600 18px 'Inter'")]).then(function(){ return document.fonts.ready; })
    .then(function(){ buildCam(); sfx(); PAPERTEX = Kt.paperTex(17);
      seek(+(new URLSearchParams(location.search).get('t') || 0)); document.documentElement.dataset.ready = 1; });
})();
