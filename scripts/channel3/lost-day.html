   Facts (two sources each): Linda Hall Library "Antonio Pigafetta" (scientist of the day); R. H. van Gent (Utrecht University), "The
   discovery of the calendrical date line"; National Geographic, "Magellan got the credit, but this man was first to sail around the
   world": five ships left Spain (Sanlucar) in September 1519 sailing west; Pigafetta kept a daily journal; in July 1522 the Victoria
   reached the Cape Verde islands, where the journal said Wednesday 9 July and the people on shore said Thursday; sailing westward around
