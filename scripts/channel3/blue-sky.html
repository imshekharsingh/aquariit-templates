<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Why the sky is blue and sunsets are red</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Channel 3 pilot, pattern "One continuous zoom" (design/channel3.md): why the sky is blue and sunsets are red, told in ONE unbroken
   camera move through scales, no cuts: a person on a hill (1x), into a sunbeam whose strands are the colours of the rainbow (22x), into
   the air's molecules (160x), onto one molecule as blue light scatters off it (600x), back out over many molecules, back to the person,
   out past the planet as the sun sinks (1/26x), and back down to the hill at sunset. Everything lives in one world (units = CSS px at
   1x); the camera is a focus point and a zoom, interpolated in log scale, so every frame is a pure function of t. Flat colours, crisp
   edges, hard small shadows, paper grain; no glow, no gradients (the sky is flat bands).
   Facts (two sources each): Met Office "Why is the sky blue?" and "Why is the sunset red?"; NOAA NESDIS "Why is the sky blue?";
   NASA Space Place "Why is the sky blue?": sunlight holds all colours; air is mostly nitrogen and oxygen molecules, far smaller than
   light's wavelength; they scatter short (blue) wavelengths much more than long (red) ones; at sunset light crosses much more air,
   so most blue is scattered out of the beam and reds and oranges remain. The atmosphere is drawn thicker than it is (labelled). */
*{margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#8ec5ea}
canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function(){
  // ---- shared core of the Channel 3 scenes (design/channel3.md): timing, voice, captions, hook, text probes, grain ----

  // every text drawn in the last seek, as its box on screen (CSS px), for scripts/channel3/qa.mjs

  story([['Why is the sky blue, but sunsets red?', 0], ['Sunlight carries every colour of the rainbow.', .45], ['Our air is full of tiny molecules, mostly nitrogen and oxygen.', .4],

  var STYLE = { hl: /^(colour|rainbow|molecules|nitrogen|oxygen|blue|scatters|red|straight|everywhere|sky|sunset|more|reds|oranges)/i, hlCol: BLUE };
  var CREDIT = 'SOURCES: MET OFFICE · NOAA · NASA SPACE PLACE';
