<!--
  Turns Out: "What happened to Niagara in 1969?", the GUESS format (design/rules-c3.md rule 1), 2.5D, one camera feel (2026-11-14).
  The turn: everyone pictures Niagara pouring; in 1969 engineers dammed the river above the American Falls and drained them for months.
  The format: the question, three options as lettered chips (A / B / C; the falls give nothing away: they pour, white, the whole time),
  "Lock in your guess.", a 3-2-1 countdown in the sky left of centre, the flow stopping at the crest on the answer and the brown rock showing,
  the why, the payoff, and an ending that matches frame 0 (the reel loops).
  - Facts (two sources each; design/channel3.md "Fact rules"):
    in June 1969 the US Army Corps of Engineers built a cofferdam of rock across the river above the American Falls and the falls ran dry
    (History.com, "The Time Engineers Turned Off Niagara Falls"; DVIDS, "Buffalo District recalls the dewatering of the American Falls";
    Niagara Falls USA, "When and why the falls stopped flowing"); for months crews studied the rock face and bolted its faults
    (Niagara Falls USA; NiagaraFallsInfo, "American dry falls"; History.com: drilled core samples, about five months); the dam was removed
    and the water flowed again in late November 1969 (Niagara Falls USA: 25 November; DVIDS).
  - Look: dusk over the gorge (Kt.mood('dusk')), the falling water warm cream, the gorge walls dark blue-grey; the bared rock is the only
    warm brown, and only after the answer. Four worlds joined by declared transitions: the falls -> ZOOM-THROUGH over the crest -> the dam
    upstream (rock tipped from the shore across the river, the channel below draining) -> PAGE turn -> the bare cliff close (bolts going
    in while the months pass) -> MATCH CUT from the last bolt onto a boulder below the falls -> the falls, the water back (the frame-0 view).
    Matte, no glow. Every frame is a pure function of t; seeded randomness.
  Built on the guess starter's machinery (scripts/channel3/starterguess.html, new25d.mjs --guess) from the Taj reel's scene core.
-->

  // ---------- type over the picture: the options, the countdown, labels (y 150-370, above the falls) ----------
  function lab(s, X, Y, size, col, k, sp){ if (k <= 0) return; x.save(); x.globalAlpha *= cl(k * 2.5, 0, 1); x.translate(0, (1 - eo(k)) * 8); var w = tw(s, size, '800 ' + FI, sp) + size * 1.2;
