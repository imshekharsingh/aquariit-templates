  Turns Out: "Was the Terracotta Army once painted in bright colours?" in 2.5D: a JOURNEY of six worlds (Wed 11 Nov 2026, 13:00 IST).
  The turn: everyone pictures a grey clay army; every soldier was painted (pink skin, robes of red, blue, green and purple) and the colour is
  lost within minutes of meeting dry air.
  - Facts (two sources each; design/channel3.md "Fact rules"):
    found in March 1974 by farmers digging a well near Xi'an (Lintong, Shaanxi): UNESCO (whc.unesco.org/en/list/441), Britannica (Qin tomb);
    about 8,000 life-size soldiers, buried with the first emperor, Qin Shi Huang (died 210 BC): Britannica, UNESCO;
    originally painted in bright colours (pink faces, red, green, blue, purple) over a layer of lacquer: TUM (Technical University of Munich,
    the Chinese-German conservation project), Britannica;
    out of the damp earth the lacquer dries, shrinks and curls, and the paint flakes off within minutes: TUM, History.com.
  - Look: engraved paper worlds, each with its own camera that never stops, joined by five different declared transitions (window.TRANSITIONS):
    fold, zoom-through the well, parallax pan across a cut-paper seam, match cut on the painted face, page turn.
  - Depth kit (11 Nov 2026; owner, 8 Nov: "feels flat"): every world is Kt.world + 4 or more Kt.plane layers with air between them, one
    foreground plane passing the lens, contact shadows, one light from the upper left; the farmer and the painter move from keyframed joints
    (Kt.act + Kt.figure: anticipation, ease, settle); every world has ambient life (dust, wheat, lamps, cloth) with a quiet matched sound.
    The warriors are drawn from the type (topknot, plated vest, robe), not copied from any one figure; colours follow the pigments found.
    Seeded randomness; every frame a pure function of t.
-->
