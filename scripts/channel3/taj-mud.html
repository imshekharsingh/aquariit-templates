  Turns Out: "How does the Taj stay white?", the GUESS format (design/rules-c3.md rule 1), 2.5D, one camera feel (2026-11-13).
  The turn: everyone pictures the Taj Mahal gleaming white; to keep it that way, workers coat its marble in a mud pack.
  The format: the question, three options as chips (the Taj gives nothing away: a dull yellow film creeps up it, the problem, not the
  answer), "Lock in your guess.", a 3-2-1 countdown above the dome, the clay climbing the Taj on the answer, the why, the payoff, and an
  ending that matches frame 0 (the reel loops).
  - Facts (two sources each; design/channel3.md "Fact rules"):
    the yellowing marble is coated in a paste of fuller's earth clay (multani mitti), left to dry and washed off with water, taking the
    grime with it (Quartz, "Can India's favourite beauty treatment save the Taj Mahal from decay?"; Deccan Herald, "Taj Mahal to get mud pack");
    the Archaeological Survey of India has used the treatment since 1994 (Quartz; The Week, "Mud pack treatment for Taj Mahal").
  - Look: a pale hazy morning over the garden, cypresses and the long pool, marble whites and muted greens; the clay is the only strong
    colour, and only after the answer. Four worlds joined by declared transitions: the Taj -> ZOOM-THROUGH the great arch -> the marble
    wall close (a worker spreads the clay on an inlaid flower panel) -> PAGE turn -> the same panel overnight (it dries and cracks, then
    the water washes it off) -> MATCH CUT from the clean flower onto the dome -> the Taj, white (the frame-0 view). Matte, no glow.
    Every frame is a pure function of t; seeded randomness.
  Made from the guess starter (scripts/channel3/starterguess.html) by scripts/channel3/new25d.mjs --guess.
-->
