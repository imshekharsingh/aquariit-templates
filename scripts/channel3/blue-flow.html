<!doctype html>
<!--
  Turns Out: "Why is the sky blue?" in 2.5D, one continuous camera (2 Nov 2026; replaces the 2D pilot showreel-c3-blue-sky, hidden).
  The turn: violet light scatters even more than blue, so the sky "should" be violet; it is not, because sunlight carries less violet
  and our eyes see blue much better.
  - Facts (two sources each): sunlight is a mix of all colours; air molecules (mostly nitrogen and oxygen) scatter short waves (blue)
    far more than long ones (red), which mostly pass straight through (NASA Space Place "Why is the sky blue?", NOAA NESDIS "Why is the
    sky blue?", Met Office "Why is the sky blue?"); violet is shorter still and scatters even more, but the Sun emits less violet than
    blue and our eyes are more sensitive to blue (National Weather Service Flagstaff "Why is the sky blue?", the UCR Physics FAQ "Why is
    the sky blue?" (Baez et al.), Met Office). Skylight still holds violet; we perceive the mix as blue (the same sources).
  - The sunlight bars beside the sun are a rough shape of the solar spectrum (less violet than blue), not data; the molecules are drawn
    far bigger than life (said on screen) and the wavelengths are not to scale.
  - Look (design/channel3.md, "2.5D toolkit"): engraved paper layers (ink lines, cross-hatching, paper fibres, matte, no glow) at real
    depths in front of ONE pinhole camera that never stops and never cuts. A deep navy sky over far blue ridges (aerial perspective: the
    same scattering) for the hook; the camera flies up a sunbeam into the air, the beam splits into its colours, molecules appear by
    scale, blue scatters in rings, red passes, violet scatters most; the camera pulls all the way back out to a violet sky, then to the
    two reasons, and ends on the person under a blue sky.
  - A person shading their eyes (a clean illustrated figure, no likeness). Every frame is a pure function of t; randomness is seeded.
-->
