  The turn: the odd length is not ancient Greek; it is the 1908 London course, from Windsor Castle to the royal box, made official in 1921.
  - Facts (World Athletics, "Marathon"; Olympics.com, "Olympic marathon innovations" and "The most challenging marathons in Olympic history"):
    Athens 1896 about 40 km; lengths varied until 1921 (Antwerp 1920: 42.75 km); London 1908 from Windsor Castle to the royal box at the
    White City stadium, 26 miles 385 yards (42.195 km); standardised by the IAAF (now World Athletics) in 1921. The disputed "royal nursery
    window" story is left out on purpose.
  - Look (design/channel3.md, "2.5D toolkit"): engraved paper layers at real depths in front of ONE camera that never stops and never cuts:
    0 a runner of 1896 on a Greek road, 1 a globe that turns from Athens to London (Britain in amber), the dive through it onto 2 an
    engraved map of the 1908 course, the route and the last 385 yards to the royal box. One warm grade; matte, no glow; pure function of t.
  Made from scripts/channel3/starter25d.html by scripts/channel3/new25d.mjs.
-->
