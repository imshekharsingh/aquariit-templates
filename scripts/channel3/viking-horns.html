<script>
/* facts and sources: The Viksø helmets (National Museum of Denmark) https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-bronze-age/the-viksoe-helmets/ | Researchers Date Horned Helmets Discovered in Denmark (Archaeology, Archaeological Institute of America, 2022) https://www.archaeology.org/news/10270-220107-denmark-horned-helmets | Did Vikings really wear horned helmets? (History.com) https://www.history.com/news/did-vikings-really-wear-horned-helmets | What Types of Helmets Did Vikings Wear? (History Hit) https://www.historyhit.com/types-of-viking-helmets/ */
window.EPC={"credit":"SOURCES: NATIONAL MUSEUM OF DENMARK · ARCHAEOLOGY MAGAZINE · HISTORY.COM","chapters":["The Myth","The Find","The Age","The Stage","The Truth"],"title":"The Horned Myth","coverTitle":"Vikings Never Wore These","coverY":1060,"badge":"TURNS OUT · MYTHS","lines":["Vikings never wore horned helmets.","The one almost complete Viking helmet ever found has no horns.","Denmark's famous horned helmets are about 2,900 years old, long before the Vikings.","The horned look took off in 1876, on costumes for a Wagner opera.","Turns out, the horns came from the opera stage, not the Vikings."],"keys":["never","horned","no","horns","2,900","before","1876","costumes","opera","stage"],"shots":[{"type":"ill","kind":"sketch","line":0,"at":"start","art":"warrior","tone":"amber","stamp":"THE VIKING WE PICTURE","drawn":true},{"type":"ill","kind":"sketch","line":0,"at":"horned","art":"horned","tone":"red","stamp":"HORNS?","stampRed":true,"crossAt":"helmets","xz":[180,440,900,1000]},{"type":"ill","kind":"sketch","line":1,"at":"start","art":"ship","tone":"gold","stamp":"THE VIKING AGE"},{"type":"ill","kind":"sketch","line":1,"at":"has","art":"round","tone":"blue","stamp":"NO HORNS","opt":{"ghost":true,"label":"GJERMUNDBU · NORWAY"},"crossAt":"horns","xz":[140,240,940,700]},{"type":"ill","kind":"sketch","line":2,"at":"start","art":"vekso","tone":"amber","stamp":"FOUND IN DENMARK","opt":{"label":"VEKSØ"}},{"type":"ill","kind":"sketch","line":2,"at":"2900","art":"timeline","tone":"blue","stamp":"THE BRONZE AGE","adds":[{"kind":"count","at":"2900","to":2900,"suffix":" YEARS","label":"OLD","x":240,"y":400}]},{"type":"ill","kind":"sketch","line":2,"at":"before","art":"timeline","tone":"violet","stamp":"LONG BEFORE THE VIKINGS","opt":{"gap":true}},{"type":"ill","kind":"sketch","line":3,"at":"start","art":"theatre","tone":"gold","stamp":"AN OPERA HOUSE, 1876","opt":{"label":"FESTSPIELHAUS"}},{"type":"ill","kind":"sketch","line":3,"at":"costumes","art":"costume","tone":"blue","stamp":"OPERA COSTUMES","opt":{"label":"COSTUME DESIGN"}},{"type":"ill","kind":"sketch","line":3,"at":"opera","art":"stage","tone":"red","stamp":"A WAGNER OPERA"},{"type":"ill","kind":"sketch","line":4,"at":"start","art":"spot","tone":"violet","stamp":"TURNS OUT","opt":{"label":"A STAGE PROP"}},{"type":"ill","kind":"sketch","line":4,"at":"not","art":"warrior","tone":"amber","stamp":"NOT THE VIKINGS","crossAt":"Vikings","xz":[330,280,710,620]}],"dur":25,"img":{}};

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,x)=>a+(b-a)*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eoc=x=>1-Math.pow(1-x,3),eox=x=>x>=1?1:1-Math.pow(2,-10*x);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const E=window.EPC,IMG=E.img,NW=w=>w.replace(/[^\w']/g,'').toLowerCase();
const fitK=()=>document.documentElement.style.setProperty('--k',innerWidth/1080);fitK();addEventListener('resize',fitK);
const KEYRE=new RegExp('^('+E.keys.map(k=>k.toLowerCase()).join('|')+')');
const pick=k=>(k||'').split('|').find(x=>IMG[x])||null;   // "a|b": the first image that arrived (the kit's fallback per shot)

// ---------- timeline (the kit's build_ep.py, here in the page: real word times from the voice, or an estimate) ----------
let EP=null;
function timeline(vw){
  const lines=E.lines.map(l=>l.split(/\s+/).filter(Boolean));const flat=lines.flat();let times=null;
  if(vw&&vw.length){const v=vw.filter(x=>/\w/.test(x.w));
    if(v.length===flat.length)times=v.map(x=>[x.s,x.e]);
    else{// counts differ (a number read as two tokens): align by order of normalised words, spread the rest
      times=[];let j=0;for(let i=0;i<flat.length;i++){const want=NW(flat[i]);let k=j;while(k<v.length&&k<j+4&&NW(v[k].w)!==want)k++;
        if(k<v.length&&NW(v[k].w)===want){times.push([v[k].s,v[k].e]);j=k+1}else{const a=v[Math.min(j,v.length-1)];times.push([a.s,a.e]);j=Math.min(j+1,v.length)}}}}
  else{let t=.35;times=[];lines.forEach((L,li)=>{L.forEach(w=>{const d=(w.replace(/[^\w]/g,'').length+1.6)*.062;times.push([t,t+d]);t+=d+(/[.?!]$/.test(w)?.5:/,$/.test(w)?.22:.05)});t+=.15})}
  let k=0;const scenes=lines.map(L=>{const words=L.map(w=>{const [a,b]=times[k++];return{w,t0:+a.toFixed(3),t1:+b.toFixed(3)}});return{start:words[0].t0,end:words[words.length-1].t1,words}});
  const lastW=scenes[scenes.length-1].end,total=vw&&vw.length?+Math.min(E.dur,lastW+1.4).toFixed(3):E.dur;const W=(li,key)=>{let [kk,n]=key.split('#');n=+(n||0);const h=scenes[li].words.filter(x=>NW(x.w).startsWith(kk.toLowerCase()));return (h[n]||h[0]||scenes[li].words[0]).t0};
  const shots=E.shots.map(s=>{const sh=Object.assign({},s);if(s.type==='arch'&&s.stamp&&typeof s.stamp==='object'){const k=pick(s.img);sh.stamp=s.stamp[k]||s.stamp['*']||''}sh.t0=s.line===0&&s.at==='start'?0:s.at==='start'?scenes[s.line].start-.35:W(s.line,s.at)-.25;if(s.words)sh.wt=s.words.map(x=>W(s.line,x));if(s.circleAt)sh.ct=W(s.line,s.circleAt);if(s.crossAt)sh.xt=W(s.line,s.crossAt);if(s.drawAt)sh.legT=+(W(s.line,s.drawAt)-(s.line===0&&s.at==='start'?0:s.at==='start'?scenes[s.line].start-.35:W(s.line,s.at)-.25)).toFixed(3);sh.t0=+sh.t0.toFixed(3);return sh});
  shots.forEach((sh,i)=>sh.t1=+(i+1<shots.length?shots[i+1].t0+.7:E.dur).toFixed(3));
  // layered elements (16 Nov 2026): each add, year and route leg lands on its own spoken word (line, at: "start" | word | word#n; dt shifts it)
  const AT=(li,key,dt)=>+((key==='start'?scenes[li].start:W(li,key))+(dt||0)).toFixed(3);
  shots.forEach(sh=>{if(sh.adds)sh.adds=sh.adds.map(a=>Object.assign({},a,{t:AT(a.line??sh.line,a.at,a.dt)}))});
  const H=E.hud||{},hud={years:(H.years||[]).map(y=>({y:String(y.y),t:AT(y.line,y.at,y.dt)})),legs:(H.legs||[]).map(g=>Object.assign({},g,{t:AT(g.line,g.at,g.dt)})),pulse:(H.pulse||[]).map(g=>Object.assign({},g,{t:AT(g.line,g.at,g.dt)}))};
  if(EP)shots.forEach((sh,i)=>{const o=EP.shots[i];['el','st','key','filt','fh','fw','base','motes','bgEl','addEls'].forEach(k=>{if(o[k]!==undefined)sh[k]=o[k]})});
  EP={total,scenes,shots,hud};
  // after the last word + 1.4 s the video ends (run 43696792618: a 3 s tail failed Output QA DEAD) (the sound is that long and the mux is -shortest): the frames past it are never seen
  window.HOLDS=total<E.dur-.05?[[+total.toFixed(2),E.dur]]:[];
  window.TRANSITIONS=shots.slice(1).map(s=>[s.t0,+(s.t0+.7).toFixed(2),'crossfade']);
  const cov=shots[0].stamp?.35+1.0+.3:1.2;window.COVER=E.cover!==false?0:+Math.min(cov,shots[1]?shots[1].t0-.1:cov).toFixed(2);   // with the cover moment, frame 0 is the cover
  window.CUES={engine:'echoes',dur:total,ep:{total,scenes,hud,shots:shots.map(({el,st,base,motes,bgEl,addEls,...r})=>JSON.parse(JSON.stringify(r)))}};
  buildCaps();
}
window.setVoice=v=>{timeline(v&&(v.words||v));};

// ---------- shots ----------
const ROOT=$('#shots');
function el(h){const d=document.createElement('div');d.className='shot';d.innerHTML=h;ROOT.appendChild(d);return d}
const TONES={teal:'#0e5a5a',green:'#1f4a2a',red:'#6a1410',blue:'#10306a',amber:'#7a4a10',violet:'#3a1a5a',terra:'#7a3018',gold:'#6a5010'};
function tone(t){const c=TONES[t]||t||'#3a2a18';return `<div style="position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 42%,${c}cc,transparent 75%);mix-blend-mode:screen;opacity:.75"></div>`}
const FR={cy:812,mw:760,mh:740};
function buildArch(s){const k=pick(s.img),m=IMG[k];s.key=k;
  if(!m){return el(`<div style="position:absolute;inset:0;background:#1a120a"></div>`)}
  const filt=m.mono?'sepia(.55) contrast(1.08) brightness(1.02)':'saturate(1.08) contrast(1.04)';s.filt=filt;
  if(s.mode==='framed'){const ar=m.w/m.h;let fw=FR.mw,fh=fw/ar;if(fh>FR.mh){fh=FR.mh;fw=fh*ar}s.fh=fh;s.fw=fw;
    return el(`<div style="position:absolute;inset:-80px;background:url(${m.src}) center/cover;filter:blur(40px) brightness(${s.lit?2:.34}) sepia(.35) saturate(1.4)"></div>${tone(s.tone)}${s.lit?`<div style="position:absolute;inset:0;background:radial-gradient(54% 26% at 50% 43%,rgba(255,238,200,1),rgba(255,218,160,.6) 60%,transparent 80%);mix-blend-mode:screen"></div><div style="position:absolute;left:0;right:0;top:0;height:390px;background:linear-gradient(180deg,rgba(6,4,2,.92),rgba(6,4,2,.82) 86%,rgba(6,4,2,0))"></div>`:''}
     <div class="frm" data-subject style="position:absolute;left:${540-fw/2}px;top:${FR.cy-fh/2}px;width:${fw}px;height:${fh}px;overflow:hidden;box-shadow:0 0 0 2px #c9a04a,0 0 0 14px rgba(20,12,5,.92),0 0 0 16px rgba(201,160,74,.6),0 50px 100px rgba(0,0,0,.8)"><img src="${m.src}" alt="" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;filter:${filt};transform-origin:${s.focus||'50% 35%'}"></div>
     <div class="plate" style="position:absolute;left:120px;right:120px;top:${FR.cy+fh/2+30}px;text-align:center"><div style="font:italic 600 30px 'Cormorant Garamond';color:#efe2c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.title}</div><div style="margin-top:6px;font:600 14px Cinzel;letter-spacing:.24em;color:#b8a586">${m.credit}</div></div>`)}
  if(s.mode==='depth')return buildDepth(s,m,filt);
  return el(`<img src="${m.src}" alt="" data-subject style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;object-position:${s.focus||'50% 50%'};transform-origin:50% 45%;filter:${filt}">${s.tone?tone(s.tone):''}
     <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,2,.15),transparent 30%,transparent 60%,rgba(8,5,2,.35))"></div>
     <div class="plate" style="position:absolute;right:120px;top:1236px;text-align:right;font:600 14px Cinzel;letter-spacing:.22em;color:rgba(239,226,196,.9);text-shadow:0 1px 6px #000">${m.title.toUpperCase()}<br><span style="color:rgba(210,190,150,.85)">${m.credit}</span></div>`)}

// ---------- 2.5D depth shot (owner, 15 Nov 2026, the Mona Lisa reel: "use combination of 2.5D with such images to make it more available on the
// screen (as it seems to be centered mostly)"): the photo fills the 9:16 frame on three planes that move at different speeds.
//   far: the whole photo, cover-fitted through the shot's camera (cam: [[u, v, z] start, [u, v, z] end], photo point u, v held at the anchor),
//        out of focus and dimmed; mid: the cut-out (cut: [u0, v0, u1, v1] of the photo, a feathered ellipse) sharp and lit, scaled about its own
//        centre by 1 + d (d grows 0.05 -> 0.13 over the shot: it comes forward) and moved 1.4x the far plane's pan (parallax), with a soft
//        contact shadow under it; near: out-of-focus motes that move 2.5x. Never stops: the camera eases but keeps some speed at both ends.
const DEP={cx:540,cy:880,d0:.05,d1:.13,par:.4};
function coverAt(m,u,v,z){const S=Math.max(1080/m.w,1920/m.h)*z,W=m.w*S,H=m.h*S;return{S,x:clamp(DEP.cx-u*W,1080-W,0),y:clamp(DEP.cy-v*H,1920-H,0)}}
function buildDepth(s,m,filt){if(s.sat)filt+=` saturate(${s.sat})`;   // sat: a calmer colour for a vivid painting (pre-render COLOUR)
  if(s.grade)filt+=` ${s.grade}`;   // grade: a CSS filter for a bright archival print (Output QA GRADE black point and FILL on pale skies; liberty-arm 15 Nov 2026)
const S0=Math.max(1080/m.w,1920/m.h),bw=m.w*S0,bh=m.h*S0,c=s.cut||[.2,.15,.8,.75];
  const cx=(c[0]+c[2])/2*bw,cy=(c[1]+c[3])/2*bh,rx=(c[2]-c[0])/2*bw,ry=(c[3]-c[1])/2*bh;s.base=[bw,bh,cx,cy,rx,ry];

  if(H.legs.length){const mm=$('#hud .mm'),top=EP.shots.filter(s=>T>=s.t0&&T<=s.t1).pop(),hide=top&&top.kind==='journey'?1-eio(prog(T,top.t0,top.t0+.5)):1;
    mm.style.opacity=eoc(prog(T,H.legs[0].t,H.legs[0].t+.5))*hide;const when={};
    H.legs.forEach((g,i)=>{const e=mm.querySelector(`.leg[data-i="${i}"]`),L=e.getTotalLength(),p=eio(prog(T,g.t,g.t+1.2));e.setAttribute('stroke-dasharray',`${L*p} ${L+1}`);
      when[g.from]=Math.min(when[g.from]??99,g.t);when[g.to]=Math.min(when[g.to]??99,g.t+1.2)});
    mm.querySelectorAll('.pin').forEach(g=>{const w=when[g.dataset.k]??99;g.setAttribute('opacity',eoc(prog(T,w,w+.3)));
      const pu=H.pulse.filter(x=>x.stop===g.dataset.k&&T>=x.t).pop(),r=g.querySelector('.ring');if(pu){const q=prog(T,pu.t,pu.t+1.4);r.setAttribute('r',20+60*q);r.setAttribute('opacity',(1-q)*.9)}else r.setAttribute('opacity',0)})}}
let built=false;
function build(){if(built)return;built=true;
  EP.shots.forEach((s,i)=>{const d=s.type==='arch'?buildArch(s):s.type==='ill'?ILL[s.kind](s):el('');s.el=d;d.dataset.shot=i;
    // 2.5D behind a card (15 Nov 2026, owner: "make it more available on the screen"): bg = an archival photo as the far plane, toned into the
    // card's own colour (luminosity) and drifting slower than the card, so the card stands in a full-frame world instead of on a flat field
    const bk=s.type==='ill'&&pick(s.bg);if(bk){const m=IMG[bk],f=document.createElement('div');f.className='illbg';
      f.style.cssText='position:absolute;inset:-60px;mix-blend-mode:luminosity;opacity:.5';f.innerHTML=`<img src="${m.src}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:${s.bgPos||'50% 40%'};filter:${m.mono?'':'grayscale(1) '}blur(${s.bgBlur||3}px) contrast(1.15)">`;
      d.insertBefore(f,d.children[1]||null);s.bgEl=f}
    if(s.stamp&&typeof s.stamp==='object')s.stamp=s.stamp[s.key]||s.stamp['*']||'';
    if(s.stamp){const st=document.createElement('div');st.className='stamp'+(s.stampRed?' red':'');const fy=s.mode==='framed'?FR.cy+(s.fh||600)/2-28:(s.stampY||1150);st.style.cssText=`left:${s.mode==='framed'?Math.max(140,540-(s.fw||600)/2-30):150}px;top:${fy}px`;st.dataset.full=s.stamp;d.appendChild(st);s.st=st}
    if(s.adds)s.addEls=s.adds.map(a=>{const w=document.createElement('div');w.className='add';w.style.inset='0';w.innerHTML=ADD[a.kind](a);d.appendChild(w);return w})});
  // the running year and the journey inset (16 Nov 2026), above every shot, under the captions
  if(E.cover!==false){$('#cover').innerHTML=`<b>${E.coverKicker||'TURNS OUT'}</b><span>${E.coverTitle||E.title}</span>`;$('#cover').style.top=(E.coverY||1000)+'px'}else $('#cover').remove();
  const H=EP.hud;$('#hud').innerHTML=(H.years.length?'<div class="yr"><b>YEAR</b><span></span></div>':'')+(H.legs.length?`<svg class="mm" viewBox="0 0 1000 700">${mapLand('rgba(214,196,150,.25)','rgba(240,226,190,.7)')}
    ${H.legs.map((g,i)=>`<path class="leg" data-i="${i}" d="${MAP.R[g.from+'-'+g.to]}" fill="none" stroke="#ff8a5a" stroke-width="12" stroke-linecap="round"/>`).join('')}
    ${Object.entries(MAP.P).map(([k,[x,y]])=>`<g class="pin" data-k="${k}"><circle class="ring" cx="${x}" cy="${y}" r="20" fill="none" stroke="#fff3d0" stroke-width="5" opacity="0"/><circle cx="${x}" cy="${y}" r="16" fill="#fff3d0"/><text x="${x+(x>500?-30:28)}" y="${y+(k==='ny'?-26:k==='phila'?60:-30)}" text-anchor="${x>500?'end':'start'}" fill="#fff3d0" font-family="Cinzel" font-weight="700" font-size="54" letter-spacing="3">${k==='phila'?'PHILA.':MAP.N[k]}</text></g>`).join('')}</svg>`:'');
  $('#prog').innerHTML=E.lines.map(()=>'<i></i>').join('');$('#badge').innerHTML=(E.badge||'TURNS OUT · TRUE STORIES')+'<span class="rule"></span>';}
const typeIn=(e,p)=>{const f=e.dataset.full||e.textContent;e.dataset.full=f;e.textContent=f.slice(0,Math.round(f.length*p))||' ';e.style.opacity=p>0?1:0};

function animIll(s,lt,T){const d=s.el,dur=Math.max(1,Math.min(s.t1,EP.total)-s.t0);
  if(s.kind==='wall'){const cam=d.querySelector('.cam');const z=1+.08*eio(prog(lt,0,dur));cam.setAttribute('transform',`translate(540 820) scale(${z}) translate(-540 -820)`);d.querySelector('.rope').setAttribute('transform',`translate(${-30*eio(prog(lt,0,dur))} 0) scale(${1+.05*eio(prog(lt,0,dur))})`);
    d.querySelectorAll('.peg').forEach((g,i)=>{const p=eox(prog(lt,.5+i*.28,.8+i*.28));const [x,y]=[[400,640],[680,640],[400,1040],[680,1040]][i];g.setAttribute('transform',`translate(${x} ${y}) scale(${p>0?1+.8*(1-p):0})`)});
    d.querySelector('.ghost').setAttribute('opacity',.4+.6*eoc(prog(lt,.2,1.2))*(.85+.15*Math.sin(lt*3)));const lb=d.querySelector('.lbl');lb.dataset.full=s.label;typeIn(lb,prog(lt,1.7,2.6))}
  if(s.kind==='dossier'){const c=d.querySelector('.card');const p=eoc(prog(lt,0,.8));c.style.transform=`translateY(${(1-p)*60}px) rotate(${-2+(1-p)*-4}deg) scale(${1+.04*eio(prog(lt,0,dur))})`;
    d.querySelectorAll('.row').forEach((r,i)=>typeIn(r,prog(lt,.5+i*1.0,1.3+i*1.0)));const st=d.querySelector('.st2');const sp=prog(lt,s.stampAt||2.8,(s.stampAt||2.8)+.3);st.style.opacity=sp>0?1:0;st.style.transform=`rotate(-8deg) scale(${1+.6*(1-eox(sp))})`}
  if(s.kind==='counter'){const yr=Math.round(lerp(s.from,s.to,eio(prog(lt,.3,Math.min(dur-.9,2.6)))));// the year as ONE word in one plate (Output QA NUMBERS, run 43711845193: separate digit tiles were read as single numbers, "3" while the voice said "two")
    d.querySelector('.odo').innerHTML=`<span style="display:inline-block;padding:0 40px;height:170px;line-height:170px;background:linear-gradient(180deg,#0a1430,#1c2c58 50%,#0a1430);border:1px solid rgba(217,184,102,.5);border-radius:14px;font:700 128px Cinzel;letter-spacing:.06em;color:#f2e2b0;box-shadow:inset 0 0 20px rgba(0,0,0,.8)">${yr}</span>`;
    let h='';for(let k=0;k<5;k++){const ph=((lt*.4+k/5)%1);h+=`<circle cx="540" cy="760" r="${120+ph*700}" stroke="rgba(150,190,255,${(1-ph)*.35})" stroke-width="${3-2*ph}"/>`}d.querySelector('.rings').innerHTML=h;
    const st=d.querySelector('.st2');const sa=Math.min(dur-.9,2.6)+.15;const sp=prog(lt,sa,sa+.3);st.style.opacity=sp>0?1:0;st.style.transform=`rotate(-4deg) scale(${1+.6*(1-eox(sp))})`}
  if(s.kind==='journey'){const z=1+.05*eio(prog(lt,0,dur));d.querySelector('.jz').setAttribute('transform',`translate(540 900) scale(${z}) translate(-540 -900)`);
    const cp=eoc(prog(lt,0,.6));d.querySelector('.cart').style.opacity=cp;
    const dr=s.draw||0,legs=[...d.querySelectorAll('.leg')],when={};let ship=null;   // when: the shot time each pin is reached (pure in t)
    (s.pins||[]).forEach(k=>when[k]=legs.length?99:0);
    legs.forEach((g,i)=>{const L=g.getTotalLength(),a=i<dr?-9:(s.legT??.35)+(i-dr)*1.25,p=eio(prog(lt,a,a+1.1)),k=s.legs[i].split('-');g.setAttribute('stroke-dasharray',/paris-ny|ny-paris/.test(s.legs[i])&&p>=1?'14 12':`${L*p} ${L}`);
      when[k[0]]=Math.min(when[k[0]]??99,i<dr?.2+i*.7:Math.max(0,a));when[k[1]]=Math.min(when[k[1]]??99,i<dr?.55+i*.7:Math.max(0,a+1.1));   // a recap (legs already drawn) lands its stops one by one
      if(p>0&&p<1){const pt=g.getPointAtLength(L*p),q=g.getPointAtLength(Math.max(0,L*p-4));ship=[pt.x,pt.y,pt.x<q.x?-1:1]}});
    const sp=d.querySelector('.ship');sp.setAttribute('opacity',ship?1:0);if(ship)sp.setAttribute('transform',`translate(${ship[0]} ${ship[1]-10}) scale(${ship[2]*1.3} 1.3)`);
    d.querySelectorAll('.pin').forEach(g=>{const w=when[g.dataset.k]??99,p=eox(prog(lt,w,w+.4));g.setAttribute('opacity',p>0?1:0);g.setAttribute('transform',g.getAttribute('transform').replace(/ scale\([^)]*\)/,'')+` scale(${p>0?1+.6*(1-p):0})`)});
    d.querySelectorAll('.pinl').forEach(e=>{const w=when[e.dataset.k]??99;e.style.opacity=eoc(prog(lt,w,w+.4));const st=e.querySelector('.stamp');if(st)typeIn(st,prog(lt,w+.2,w+1.0))})}
  if(s.kind==='paper'){const c=d.querySelector('.card');const p=eoc(prog(lt,0,.8));c.style.transform=`translateY(${(1-p)*70}px) rotate(${-1.5+(1-p)*-3}deg) scale(${1+.035*eio(prog(lt,0,dur))})`;
    d.querySelectorAll('.row').forEach((r,i)=>typeIn(r,prog(lt,.5+i*.8,1.2+i*.8)));
    d.querySelectorAll('.nm').forEach(e=>{const i=+e.dataset.i;e.style.opacity=lt>.9+i*.05?1:0});
    const st=d.querySelector('.st2');const sp=prog(lt,s.stampAt||2.4,(s.stampAt||2.4)+.3);st.style.opacity=sp>0?1:0;st.style.transform=`rotate(-8deg) scale(${1+.6*(1-eox(sp))})`}
  if(s.kind==='sketch'){const z=1+.07*eio(prog(lt,0,dur)),dx=-14*eio(prog(lt,0,dur));d.querySelector('.ska').setAttribute('transform',`translate(${540+dx} 860) scale(${z}) translate(-540 -860)`);
    d.querySelector('.skb').setAttribute('transform',`translate(${dx*.4} 0)`);
    const dn=s.drawn?1:0;d.querySelectorAll('.ska .ln').forEach((g,i)=>{const a=.03+Math.min(i*.022,.35),p=dn||eio(prog(lt,a,a+.45));g.style.strokeDasharray='1 1';g.style.strokeDashoffset=1-p});
    const fp=dn||eoc(prog(lt,.3,.9));d.querySelectorAll('.ska .fl').forEach(g=>g.setAttribute('opacity',fp*(+g.dataset.o||1)));d.querySelectorAll('.ska .tx').forEach(g=>g.setAttribute('opacity',dn||eoc(prog(lt,.6,1.0))));
    const x=d.querySelector('.skx');if(x&&s.xt!=null){[...x.querySelectorAll('.ln')].forEach((g,i)=>{const a=s.xt+i*.12,p=eox(prog(T,a,a+.28));g.style.strokeDasharray='1 1';g.style.strokeDashoffset=1-p})}}
  if(s.kind==='map'){const r=d.querySelector('.route'),L=r.getTotalLength(),e=Math.min(dur-.8,2.6),p=eio(prog(lt,.4,e));r.setAttribute('stroke-dasharray',`${L*p} ${L}`);
    const pt=r.getPointAtLength(L*p);d.querySelector('.nib').setAttribute('transform',`translate(${pt.x} ${pt.y}) rotate(${-30+20*Math.sin(lt*9)})`);d.querySelector('.nib').setAttribute('opacity',p>0&&p<1?1:0);
    const sp=eox(prog(lt,e,e+.4));d.querySelector('.seal').setAttribute('transform',`translate(760 1080) rotate(-12) scale(${sp>0?1.6-.6*sp:0})`);
    d.querySelector('.compass').setAttribute('transform',`translate(200 1180) rotate(${-25+25*eoc(prog(lt,0,2))})`);
    const cp=eoc(prog(lt,0,.7));d.querySelector('.cart').style.opacity=cp;d.querySelector('.cart').style.transform=`translateY(${(1-cp)*-20}px)`;
    d.querySelector('.cityA').style.opacity=eoc(prog(lt,.1,.6));d.querySelector('.cityB').style.opacity=eoc(prog(lt,e-.3,e+.2));typeIn(d.querySelector('.lbl'),prog(lt,1.0,1.9));
    d.querySelector('.mapz').setAttribute('transform',`translate(540 860) scale(${1+.06*eio(prog(lt,0,dur))}) translate(-540 -860)`)}}

// ---------- captions (the kit's: chunks of up to 4 words, spoken words full white, key words gold italic) ----------
let CH=[],capI=-2;
function buildCaps(){CH=[];EP.scenes.forEach((s,si)=>{let ph=[],cur=[];s.words.forEach((w,i)=>{cur.push(w);if(/[.,?!:]$/.test(w.w)||i===s.words.length-1){ph.push(cur);cur=[]}});
    // the kit's short chunks, balanced: a phrase of n words in ceil(n/5) even chunks (the payoff line whole at frame 0, never a 1-2 word leftover)
    ph.forEach(p=>{const k=Math.ceil(p.length/6),m=Math.ceil(p.length/k);for(let i=0;i<p.length;i+=m)CH.push({si,words:p.slice(i,i+m)})})});
  CH.forEach((c,i)=>{c.t0=i?c.words[0].t0:0;const nx=CH[i+1];c.t1=nx&&nx.si===c.si?nx.words[0].t0-.03:Math.min(c.words[c.words.length-1].t1+.5,nx?nx.words[0].t0-.05:1e9)});capI=-2}

const CV={hold:1.0,out:1.45};   // the cover title holds 1.0 s, then fades by 1.45 s (the first stamp types after it)
const DUST=[...Array(14)].map((_,i)=>({s:1.5+(i%4)}));
window.render=function(T){if(!EP)timeline(null);build();
  $$('.shot').forEach(s=>{s.style.display='none'});
  EP.shots.forEach((sh,i)=>{if(T<sh.t0||T>sh.t1)return;const lt=T-sh.t0,el=sh.el,a=i===0?1:eio(prog(T,sh.t0,sh.t0+.7));el.style.display='block';el.style.opacity=a;el.style.zIndex=i+1;
    if(sh.type==='ill')animIll(sh,lt,T);
    if(sh.adds)animAdds(sh,T);
    if(sh.bgEl){const q=eio(prog(lt,0,Math.max(1,Math.min(sh.t1,EP.total)-sh.t0)));sh.bgEl.style.transform=`scale(${1.02+.1*q}) translate(${-24*q}px,${-14*q}px)`}
    // numbers leave before the next shot fades in (Output QA NUMBERS, run 43708264631: the counter's 1913 under the map read as "1933")
    {const nx=EP.shots[i+1];if(nx)el.querySelectorAll('.odo,.st2,.stamp,.cnt').forEach(e=>{const f=1-prog(T,nx.t0-.25,nx.t0+.05);if(f<1)e.style.opacity=Math.min(+e.style.opacity||1,f)})}
    if(sh.type==='arch'&&sh.key&&sh.mode==='depth')animDepth(sh,lt,Math.max(1,Math.min(sh.t1,EP.total)-sh.t0));
    else if(sh.type==='arch'&&sh.key){const img=el.querySelector('img'),dur=Math.max(1,Math.min(sh.t1,EP.total)-sh.t0),q=eio(prog(lt,0,dur)),full=sh.mode!=='framed';
      img.style.transform=`scale(${lerp(full?1.04:1.02,full?1.16:1.12,q)}) translate(${lerp(0,full?-18:-10,q)*(sh.pan||1)}px,${lerp(0,-14,q)}px)`;
      if(sh.develop){const d=eoc(prog(lt,0,1.1));img.style.filter=`${sh.filt} brightness(${lerp(2.2,1,d)}) blur(${(1-d)*6}px)`}
      const pl=el.querySelector('.plate');if(pl)pl.style.opacity=eoc(prog(lt,.6,1.3));
      if(sh.mode==='framed'){const f=el.querySelector('.frm'),p=i===0?1:eoc(prog(lt,0,.9));f.style.transform=`translateY(${(1-p)*40-18*q}px) scale(${.96+.04*p})`;const bg=el.firstElementChild;if(bg)bg.style.transform=`scale(${1+.1*q}) translateX(${-20*q}px)`;
        if(sh.glow)f.style.boxShadow=`0 0 0 2px #e8c46a,0 0 0 14px rgba(20,12,5,.92),0 0 0 16px rgba(232,196,106,.7),0 0 ${60+50*eoc(prog(lt,.3,1.5))}px rgba(255,210,120,${.25+.25*eoc(prog(lt,.3,1.5))}),0 50px 100px rgba(0,0,0,.8)`}}
    if(sh.st){const s0=i===0&&E.cover!==false?CV.out:.35,p=prog(lt,s0,s0+1);typeIn(sh.st,i===0?Math.max(p,T<.05?0:p):p);sh.st.style.transform=`rotate(-2deg) scale(${1+.15*(1-eoc(prog(lt,.35,.6)))})`}
  });
  let ci=CH.findIndex(c=>T>=c.t0-.05&&T<c.t1);
  if(ci!==capI){capI=ci;$('#cap').innerHTML=ci<0?'':CH[ci].words.map(w=>`<span data-k="${KEYRE.test(NW(w.w))?1:0}">${w.w.replace(/\.\.\.$/,'…')}</span>`).join(' ')}
  if(ci>=0){const c=CH[ci],p=eoc(prog(T,c.t0-.05,c.t0+.25));$('#cap').style.opacity=clamp(p*1.5);$('#cap').style.transform=`translateY(${(1-p)*18}px)`;
    [...$('#cap').children].forEach((sp,i)=>{const w=c.words[i],on=T>=w.t0-.04,k=sp.dataset.k==='1';sp.style.color=on?(k?'#ffd56a':'#fff7e6'):'rgba(255,247,230,.38)';sp.style.fontStyle=k?'italic':'normal'})}
  else $('#cap').style.opacity=0;
  $('#src').textContent=E.credit||'';$('#src').style.opacity=eoc(prog(T,EP.total-1.25,EP.total-.85));$('#src').style.transform=`translateY(${(1-eoc(prog(T,EP.total-1.25,EP.total-.85)))*16}px)`;
  {const li=Math.max(0,EP.scenes.findLastIndex(x=>T>=x.start-.4)),ch=(E.chapters||[])[li];const R=['I','II','III','IV','V','VI','VII','VIII'];
   const h=ch?`<b>CHAPTER ${R[li]}</b>${ch}`:E.title;if($('#chap').dataset.h!==h){$('#chap').innerHTML=h;$('#chap').dataset.h=h}
   const st=EP.scenes[li]?EP.scenes[li].start-.4:0;$('#chap').style.opacity=li===0?1:eoc(prog(T,st,st+.5))}
  animHud(T);
  {const c=$('#cover');if(c){const p=prog(T,CV.hold,CV.out);c.style.opacity=1-eio(p);c.style.transform=`translateY(${eio(p)*20}px)`}}
  $$('#prog i').forEach((e,i)=>e.className=(EP.scenes[i]&&T>=EP.scenes[i].start-.3)?'on':'');
  const r=mulberry(Math.floor(T*15)+7);let h='';DUST.forEach(d=>{if(r()<.35)h+=`<i style="left:${r()*1080}px;top:${r()*1920}px;width:${d.s}px;height:${d.s}px;opacity:${.3+r()*.6}"></i>`});
  if(r()<.4)h+=`<b style="left:${r()*1080}px;top:0;height:1920px;opacity:${.25+r()*.4}"></b>`;$('#dust').innerHTML=h;
  $('#grain').style.backgroundPosition=`${Math.floor(r()*300)}px ${Math.floor(r()*300)}px`;
  $('#stage').style.filter=`brightness(${1+.02*Math.sin(T*37)})`;
  $('#leak').style.opacity=.5+.4*Math.sin(T*.9);
};
window.seek=t=>window.render(t);
(async()=>{timeline(null);build();try{await document.fonts.ready}catch(e){}
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));render(0);document.documentElement.dataset.ready=1})();
</script>
