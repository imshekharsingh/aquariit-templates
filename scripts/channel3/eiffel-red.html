  Turns Out: "What colour was the Eiffel Tower at first?", the GUESS format (design/rules-c3.md rule 1), 2.5D, one camera feel (2026-11-12).
  The turn: everyone pictures the tower bronze-brown; while it went up it was red.
  The format: the question, three options as chips (the tower drains from today's brown to a silhouette and gives
  nothing away until the answer), "Lock in your guess.", a 3-2-1 countdown beside the tower, the answer painted up the tower, the why, the payoff, and an ending that matches frame 0 (the reel loops).
  - Facts (two sources each; design/channel3.md "Fact rules"):
    the iron pieces got an anti-rust coat of Venetian red in Eiffel's workshop, the tower's colour while it went up in 1887-1888
      (toureiffel.paris, "Painting the Eiffel Tower" and "What colors has the Tower sported over the years?"; Smithsonian Magazine, 2018);
    seven official colours since the red-brown coat of 1889 (toureiffel.paris, both pages; Smithsonian Magazine);
    the repainting begun in 2019 returned to the historic 1907 shade, a yellow-brown (toureiffel.paris "Painting the Eiffel Tower"; Smithsonian Magazine).
  - Look: dusk Paris in cut paper (deep blue sky, warm horizon, rooftops in air), the tower as one strong coloured shape with its lattice in a
    darker shade; four worlds joined by declared transitions: Paris -> ZOOM-THROUGH the arch -> the 1887 workshop (a girder brushed red) ->
    PAGE turn -> the colour chips fanning out -> MATCH CUT on the chip's tower -> Paris today (the frame-0 view). Matte, no glow.
    Every frame is a pure function of t; seeded randomness.
  Made from the guess starter (scripts/channel3/starterguess.html) by scripts/channel3/new25d.mjs --guess.
-->
