.4) brightness(.85)"},{"type":"arch","mode":"depth","line":5,"at":"joseph","img":"pulitzer","tone":"red","stamp":"JOSEPH PULITZER","cut":[0.18,0.04,0.86,0.55],"cam":[[0.5,0.36,1.05],[0.5,0.31,1.16]]},{"type":"ill","kind":"paper","line":5,"at":"print","left":"NEW YORK","right":"THE PEDESTAL FUND","head":"THE WORLD","title":"Every gift will be printed","rows":["EVERY DONOR NAMED"],"stampTxt":"NAMES PRINTED","stampAt":2},{"type":"arch","mode":"depth","line":6,"at":"start","img":"crates|workshop","tone":"teal","stamp":"SHIPPED IN CRATES","cut":[0.25,0.1,0.75,0.65],"cam":[[0.5,0.45,1.15],[0.5,0.4,1.25]],"grade":"contrast(1.4) brightness(.85)"},{"type":"arch","mode":"depth","line":6,"at":"unveiling","img":"unveil|moran","tone":"gold","stamp":"UNVEILED · NEW YORK HARBOR","cut":[0.25,0.05,0.75,0.6],"cam":[[0.5,0.4,1.15],[0.5,0.34,1.25]],"grade":"contrast(1.25)"},{"type":"arch","mode":"depth","line":6,"at":"people","img":"moran","tone":"gold","cut":[0.3,0.03,0.72,0.55],"cam":[[0.5,0.44,1.4],[0.5,0.38,1.5]],"sat":0.85,"grade":"contrast(1.25)","adds":[{"kind":"count","at":"hundred","to":100000,"suffix":"+","label":"PEOPLE GAVE","x":240,"y":1020,"w":600,"roll":1.3}]},{"type":"ill","kind":"journey","line":6,"at":"most","legs":["paris-phila","phila-ny","paris-ny"],"draw":3,"pins":["paris","phila","ny"],"title":"HER WHOLE JOURNEY","sub":"PAID FOR BY THE PEOPLE","notes":{"phila":"1876 · THE ARM","paris":"1878 · THE HEAD","ny":"1886 · UNVEILED"}}],"dur":39,"img":{"arm1876":{"src":"media/showreel-c3-liberty-arm/arm1876.jpg","w":512,"h":640,"title":"The arm at the Centennial Exhibition · Philadelphia, 1876","credit":"PUBLIC DOMAIN · WIKIMEDIA COMMONS","mono":true},"armmad":{"src":"media/showreel-c3-liberty-arm/armmad.jpg","w":1697,"h":2400,"title":"The arm in Madison Square, New York · after Bartholdi's sketch, 1877","credit":"PUBLIC DOMAIN · WIKIMEDIA COMMONS","mono":true},"armst":{"src":"media/showreel-c3-liberty-arm/armst.jpg","w":2400,"h":1230,"title":"The arm and torch · Centenni <script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,x)=>a+(b-a)*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eoc=x=>1-Math.pow(1-x,3),eox=x=>x>=1?1:1-Math.pow(2,-10*x);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const E=window.EPC,IMG=E.img,NW=w=>w.replace(/[^\w']/g,'').toLowerCase();
const fitK=()=>document.documentElement.style.setProperty('--k',innerWidth/1080);fitK();addEventListener('resize',fitK);
const KEYRE=new RegExp('^('+E.keys.map(k=>k.toLowerCase()).join('|')+')');
const pick=k=>(k||'').split('|').find(x=>IMG[x])||null;   // "a|b": the first image that arrived (the kit's fallback per shot)

// ---------- timeline (the kit's build_ep.py, here in the page: real word times from the voice, or an estimate) ----------
let EP=null;
function timeline(vw){
  const lines=E.lines.map(l=>l.split(/\s+/).filter(Boolean));const flat=lines.flat();let times=null;
  if(vw&&vw.length){const v=vw.filter(x=>/\w/.test(x.w));
    if(v.length===flat.length)times=v.map(x=>[x.s,x.e]);
    else{// counts differ (a number read as two tokens): align by order of normalised words, spread the rest
      times=[];let j=0;for(let i=0;i<flat.length;i++){const want=NW(flat[i]);let k=j;while(k<v.length&&k<j+4&&NW(v[k].w)!==want)k++;
        if(k<v.length&&NW(v[k].w)===want){times.push([v[k].s,v[k].e]);j=k+1}else{const a=v[Math.min(j,v.length-1)];times.push([a.s,a.e]);j=Math.min(j+1,v.length)}}}}
  else{let t=.35;times=[];lines.forEach((L,li)=>{L.forEach(w=>{const d=(w.replace(/[^\w]/g,'').length+1.6)*.062;times.push([t,t+d]);t+=d+(/[.?!]$/.test(w)?.5:/,$/.test(w)?.22:.05)});t+=.15})}
  let k=0;const scenes=lines.map(L=>{const words=L.map(w=>{const [a,b]=times[k++];return{w,t0:+a.toFixed(3),t1:+b.toFixed(3)}});return{start:words[0].t0,end:words[words.length-1].t1,words}});
  const lastW=scenes[scenes.length-1].end,total=vw&&vw.length?+Math.min(E.dur,lastW+1.4).toFixed(3):E.dur;const W=(li,key)=>{let [kk,n]=key.split('#');n=+(n||0);const h=scenes[li].words.filter(x=>NW(x.w).startsWith(kk.toLowerCase()));return (h[n]||h[0]||scenes[li].words[0]).t0};
  const shots=E.shots.map(s=>{const sh=Object.assign({},s);if(s.type==='arch'&&s.stamp&&typeof s.stamp==='object'){const k=pick(s.img);sh.stamp=s.stamp[k]||s.stamp['*']||''}sh.t0=s.line===0&&s.at==='start'?0:s.at==='start'?scenes[s.line].start-.35:W(s.line,s.at)-.25;if(s.words)sh.wt=s.words.map(x=>W(s.line,x));if(s.circleAt)sh.ct=W(s.line,s.circleAt);sh.t0=+sh.t0.toFixed(3);return sh});
  shots.forEach((sh,i)=>sh.t1=+(i+1<shots.length?shots[i+1].t0+.7:E.dur).toFixed(3));
  // layered elements (16 Nov 2026): each add, year and route leg lands on its own spoken word (line, at: "start" | word | word#n; dt shifts it)
  const AT=(li,key,dt)=>+((key==='start'?scenes[li].start:W(li,key))+(dt||0)).toFixed(3);
  shots.forEach(sh=>{if(sh.adds)sh.adds=sh.adds.map(a=>Object.assign({},a,{t:AT(a.line??sh.line,a.at,a.dt)}))});
  const H=E.hud||{},hud={years:(H.years||[]).map(y=>({y:String(y.y),t:AT(y.line,y.at,y.dt)})),legs:(H.legs||[]).map(g=>Object.assign({},g,{t:AT(g.line,g.at,g.dt)})),pulse:(H.pulse||[]).map(g=>Object.assign({},g,{t:AT(g.line,g.at,g.dt)}))};
  if(EP)shots.forEach((sh,i)=>{const o=EP.shots[i];['el','st','key','filt','fh','fw','base','motes','bgEl','addEls'].forEach(k=>{if(o[k]!==undefined)sh[k]=o[k]})});
  EP={total,scenes,shots,hud};
  // after the last word + 1.4 s the video ends (run 43696792618: a 3 s tail failed Output QA DEAD) (the sound is that long and the mux is -shortest): the frames past it are never seen
  window.HOLDS=total<E.dur-.05?[[+total.toFixed(2),E.dur]]:[];
  window.TRANSITIONS=shots.slice(1).map(s=>[s.t0,+(s.t0+.7).toFixed(2),'crossfade']);
  const cov=shots[0].stamp?.35+1.0+.3:1.2;window.COVER=E.cover!==false?0:+Math.min(cov,shots[1]?shots[1].t0-.1:cov).toFixed(2);   // with the cover moment, frame 0 is the cover
  window.CUES={engine:'echoes',dur:total,ep:{total,scenes,hud,shots:shots.map(({el,st,base,motes,bgEl,addEls,...r})=>JSON.parse(JSON.stringify(r)))}};
  buildCaps();
}
window.setVoice=v=>{timeline(v&&(v.words||v));};

// ---------- shots ----------
const ROOT=$('#shots');

const TONES={teal:'#0e5a5a',green:'#1f4a2a',red:'#6a1410',blue:'#10306a',amber:'#7a4a10',violet:'#3a1a5a',terra:'#7a3018',gold:'#6a5010'};

// ---------- 2.5D depth shot (owner, 15 Nov 2026, the Mona Lisa reel: "use combination of 2.5D with such images to make it more available on the
// screen (as it seems to be centered mostly)"): the photo fills the 9:16 frame on three planes that move at different speeds.
//   far: the whole photo, cover-fitted through the shot's camera (cam: [[u, v, z] start, [u, v, z] end], photo point u, v held at the anchor),
//        out of focus and dimmed; mid: the cut-out (cut: [u0, v0, u1, v1] of the photo, a feathered ellipse) sharp and lit, scaled about its own
//        centre by 1 + d (d grows 0.05 -> 0.13 over the shot: it comes forward) and moved 1.4x the far plane's pan (parallax), with a soft
//        contact shadow under it; near: out-of-focus motes that move 2.5x. Never stops: the camera eases but keeps some speed at both ends.
const DEP={cx:540,cy:880,d0:.05,d1:.13,par:.4};
function coverAt(m,u,v,z){const S=Math.max(1080/m.w,1920/m.h)*z,W=m.w*S,H=m.h*S;return{S,x:clamp(DEP.cx-u*W,1080-W,0),y:clamp(DEP.cy-v*H,1920-H,0)}}
function buildDepth(s,m,filt){if(s.sat)filt+=` saturate(${s.sat})`;   // sat: a calmer colour for a vivid painting (pre-render COLOUR)
  if(s.grade)filt+=` ${s.grade}`;   // grade: a CSS filter for a bright archival print (Output QA GRADE black point and FILL on pale skies; liberty-arm 15 Nov 2026)
const S0=Math.max(1080/m.w,1920/m.h),bw=m.w*S0,bh=m.h*S0,c=s.cut||[.2,.15,.8,.75];
  const cx=(c[0]+c[2])/2*bw,cy=(c[1]+c[3])/2*bh,rx=(c[2]-c[0])/2*bw,ry=(c[3]-c[1])/2*bh;s.base=[bw,bh,cx,cy,rx,ry];
  const mask=`radial-gradient(${rx}px ${ry}px at ${cx}px ${cy}px,#000 62%,transparent 100%)`;
  const r=mulberry(97+(s.line||0)*7),motes=[...Array(7)].map(()=>[r()*1080,300+r()*1300,40+r()*90,.05+r()*.08]);s.motes=motes;
  return el(`<div class="far" style="position:absolute;left:0;top:0;width:${bw}px;height:${bh}px;transform-origin:0 0"><img src="${m.src}" alt="" style="width:100%;height:100%;display:block;filter:${filt} blur(7px) brightness(.62) saturate(.85)"></div>
     ${s.tone?tone(s.tone):''}
     <div class="shd" style="position:absolute;left:0;top:0;width:${bw}px;height:${bh}px;transform-origin:0 0;background:radial-gradient(${rx*1.02}px ${ry*1.02}px at ${cx+rx*.05}px ${cy+ry*.06}px,rgba(0,0,0,.55),transparent 100%)"></div>
     <div class="mid" style="position:absolute;left:0;top:0;width:${bw}px;height:${bh}px;transform-origin:0 0;-webkit-mask-image:${mask};mask-image:${mask}"><img src="${m.src}" alt="" style="width:100%;height:100%;display:block;filter:${filt} brightness(1.06) contrast(1.05)"></div>
     <div class="sub" data-subject style="position:absolute;left:0;top:0;width:10px;height:10px;pointer-events:none"></div>
     <div class="nr" style="position:absolute;inset:0">${motes.map(([x,y,R,a])=>`<i style="position:absolute;left:${x-R}px;top:${y-R}px;width:${2*R}px;height:${2*R}px;border-radius:50%;background:radial-gradient(rgba(255,236,200,${a}),transparent 70%)"></i>`).join('')}</div>
     ${s.glow?'<div class="glw" style="position:absolute;inset:0;mix-blend-mode:screen;opacity:0;background:radial-gradient(48% 30% at 50% 44%,rgba(255,214,140,.5),transparent 75%)"></div>':''}
     <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,2,.25),transparent 26%,transparent 58%,rgba(8,5,2,.45))"></div>
     <div class="plate" style="position:absolute;right:120px;top:1236px;text-align:right;font:600 14px Cinzel;letter-spacing:.22em;color:rgba(239,226,196,.9);text-shadow:0 1px 6px #000">${m.title.toUpperCase()}<br><span style="color:rgba(210,190,150,.85)">${m.credit}</span></div>`)}
function animDepth(sh,lt,dur){const m=IMG[sh.key],[bw,bh,cx,cy,rx,ry]=sh.base,c=sh.cut||[.2,.15,.8,.75],cu=(c[0]+c[2])/2,cv=(c[1]+c[3])/2;
  const K=sh.cam||[[cu,cv,1],[cu,cv,1.12]],x=clamp(lt/dur),q=.45*x+.55*eio(x);   // eased but never still
  const k=[0,1,2].map(i=>lerp(K[0][i],K[1][i],q)),f=coverAt(m,k[0],k[1],k[2]),z=k[2],f0=coverAt(m,K[0][0],K[0][1],K[0][2]);
  const T=(e,X,Y,Z)=>{e.style.transform=`translate(${X}px,${Y}px) scale(${Z})`};
  T(sh.el.querySelector('.far'),f.x,f.y,z);
  const px=f.x+cx*z,py=f.y+cy*z,p0x=f0.x+cx*K[0][2],p0y=f0.y+cy*K[0][2],d=lerp(DEP.d0,DEP.d1,q),ox=(px-p0x)*DEP.par,oy=(py-p0y)*DEP.par;   // the cut's centre on screen, then the mid plane's lead
  const mx=px+(f.x-px)*(1+d)+ox,my=py+(f.y-py)*(1+d)+oy,mz=z*(1+d);
  T(sh.el.querySelector('.mid'),mx,my,mz);T(sh.el.querySelector('.shd'),mx+(f.x-mx)*.5+10,my+(f.y-my)*.5+16,lerp(z,mz,.5));
  const sb=sh.el.querySelector('.sub'),L=mx+(cx-rx*.62)*mz,Tp=my+(cy-ry*.62)*mz;sb.style.left=Math.max(0,L)+'px';sb.style.top=Math.max(0,Tp)+'px';
  sb.style.width=Math.min(1080,L+rx*1.24*mz)-Math.max(0,L)+'px';sb.style.height=Math.min(1920,Tp+ry*1.24*mz)-Math.max(0,Tp)+'px';
  sh.el.querySelectorAll('.nr i').forEach((e,i)=>{const s2=2.5+i*.3;e.style.transform=`translate(${(px-p0x)*s2*.6+Math.sin(lt*.7+i)*12}px,${(py-p0y)*s2*.6-lt*(10+i*3)}px)`});
  const g=sh.el.querySelector('.glw');if(g)g.style.opacity=eoc(prog(lt,.3,1.6))*(.85+.15*Math.sin(lt*2.2));
  if(sh.develop){const dv=eoc(prog(lt,0,1.1));sh.el.querySelector('.mid img').style.filter=`${sh.filt} brightness(${lerp(2.2,1.06,dv)}) blur(${(1-dv)*6}px)`}
  const pl=sh.el.querySelector('.plate');if(pl)pl.style.opacity=eoc(prog(lt,.6,1.3))}
