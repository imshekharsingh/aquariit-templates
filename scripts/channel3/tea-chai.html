  Turns Out: "Why do some say tea, and others say chai?" in 2.5D, one continuous camera (6 Nov 2026).
  The turn: both words are Chinese. Most of China says cha, and it spread west over land (chai, chay); the coast of Fujian says te, and
  Dutch ships carried that word to Europe by sea (thee, the, Tee, tea). Your word shows the route tea took to reach you.
  - Facts (two sources each: WALS Feature 138A "Tea" by Osten Dahl; Quartz, "Tea if by sea, cha if by land"; Datawrapper, "Words for tea"):
    * Both word families come from Chinese: WALS; Quartz.
    * Most Chinese varieties say cha (Mandarin cha2): WALS; Quartz.
    * Over land it spread west: Hindi chai, Persian chay, Russian chai (Cyrillic chaj): WALS (map values); Quartz.
    * Min Nan, spoken on the coast of Fujian, says te: WALS; Quartz.
    * Dutch traders shipped tea by sea from the 17th century, mainly through Fujian, and Europe took te (Dutch thee, French the, German
      Tee, English tea): Quartz; Datawrapper. Portugal's cha (an exception) is left out rather than explained.
    Coasts and routes on the globe are coarse hand drawings for the picture only (the ship goes round Africa, as 17th-century ships did).
  - Look (design/channel3.md, "2.5D toolkit"): engraved paper layers at real depths in front of ONE camera that never stops and never cuts:
    a cup of tea (the camera rises through its steam), misty tea hills with a tea branch, then an atlas globe: the land route draws west
    with its words pinned on, a dive to the Fujian coast, a Dutch ship sails the sea route to Europe, the pull out to both routes.
    One grade: tea brown, tea-hill green, atlas parchment, matte, no glow. Every frame is a pure function of t; seeded randomness.
  Made from scripts/channel3/starter25d.html by scripts/channel3/new25d.mjs.
-->

    Kt.screen(); x.fillStyle = lg(0, 620, 0, 960, [[0, 'rgba(12,7,4,0)'], [1, 'rgba(12,7,4,.32)']]); x.fillRect(0, 620, 540, 340); }

  // ---------- type over the picture (kinetic type keyed to the spoken word, above the subject: y 150-340) ----------
  function kinetic(t){

  }
  function drawPayoff(t){ var k = es(P(t, DUR - 2.9, DUR - 2.2)); if (k <= 0) return; x.save(); x.globalAlpha = cl(k * 1.6, 0, 1); x.translate(270, 200); arrive(k);
    x.font = font(46, '700 ' + FD); x.textAlign = 'center'; x.strokeStyle = 'rgba(14,10,8,.75)'; x.lineWidth = 6; x.lineJoin = 'round'; x.letterSpacing = '-0.5px'; x.strokeText(PAYOFF, 0, 0); txt(PAYOFF, 0, 0, 46, '700 ' + FD, AMBER, 'center', -.5); x.restore(); }

  }
