<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Turns Out · design tutorial</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Space+Grotesk:wght@400;500;700&family=Pacifico&family=Anton&family=Courier+Prime&family=Playfair+Display:ital,wght@0,700;1,700&display=block" rel="stylesheet">
<style>
/* Turns Out design tutorials (owner, 21 Nov 2026: "rich design mechanism, not just flat this-to-that"; references = learnings, our own look).
   One shared layer (scripts/channel3/design/core.js) on the @webin20sec motion kit: a live artboard whose layout springs between states,
   guides that draw, measurements that roll, a design-tool cursor with a selection box, property chips, the before as a ghost, and the
   Turns Out dial (the logo's ring) counting the fixes. Zones (CSS px of 540x960, safe zone y 125-785): top 125-285 dial + step title,
   band 292-388 captions, hero 400-780 the artboard. */
:root{--f:'Space Grotesk',system-ui,sans-serif;--d:'Unbounded',system-ui,sans-serif;--ink:#0b0d16;--paper:#eef0f7;--dim:#9aa1b8;--amb:#ffb35a;--org:#ff7a45;--good:#5ee0a0;--bad:#ff6b6b;--sel:#7aa2ff}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f);-webkit-font-smoothing:antialiased}
.a{position:absolute}
#vp{left:0;top:0;width:540px;height:960px;overflow:hidden}
#world{left:0;top:0;width:540px;height:960px;transform-origin:0 0}
#grid{left:-200px;top:-200px;width:940px;height:1360px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 24px)}
#ov{left:0;top:0;width:540px;height:960px;overflow:visible;pointer-events:none;z-index:20}
#cur{left:0;top:0;width:30px;height:30px;z-index:30;opacity:0;pointer-events:none}
#dial{left:30px;top:132px;display:flex;align-items:center;gap:12px;z-index:40}
#dial svg{width:66px;height:66px}
#dial .lb{font:700 15px/1 var(--f);letter-spacing:.24em;color:var(--amb)}
#dial .n{font:900 26px var(--d);fill:#fff}
#ttl{left:30px;top:212px;width:480px;font:900 31px/1.08 var(--d);letter-spacing:-.02em;z-index:40}
#ttl em{font-style:normal;color:var(--amb)}
#band{left:0;top:292px;width:540px;height:96px}
#cap{left:30px;top:298px;width:480px;min-height:80px;font:700 29px/1.15 var(--f);letter-spacing:-.02em;z-index:40}
#cap span{display:inline-block;margin-right:.24em}
.chip{position:absolute;white-space:nowrap;padding:8px 14px 8px 12px;border-radius:12px;background:#141827;border:1.5px solid var(--amb);color:var(--amb);font:700 17px/1 var(--f);letter-spacing:.04em;z-index:25;opacity:0;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.chip b{color:#fff;font-weight:700}
.chip.g{border-color:var(--good);color:var(--good)}.chip.r{border-color:var(--bad);color:var(--bad)}
.board{position:absolute;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
/*CSS*/
</style>
</head>
<body>
<div id="vp" class="a" data-fit="free"><div id="world" class="a" data-fit="free">
  <div id="grid" class="a" data-fit="free"></div>
  <div id="sbox" data-subject style="position:absolute;left:40px;top:400px;width:460px;height:380px"></div>
  <!--BOARD-->
  <svg id="ov" class="a" viewBox="0 0 540 960"></svg>
  <svg id="cur" class="a" viewBox="0 0 30 30"><path d="M4 2 L4 24 L10 18 L14 27 L18 25 L14 16 L22 16 Z" fill="#fff" stroke="#0b0d16" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div></div>
<div id="dial" class="a"><svg viewBox="-40 -40 80 80"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs><circle r="34" fill="#0b0d16"/><circle r="28" fill="none" stroke="#1f2538" stroke-width="7"/><path class="arc" fill="none" stroke="url(#dg)" stroke-width="7" stroke-linecap="round"/><text class="n" y="9" text-anchor="middle"></text></svg><div class="lb"></div></div>
<div id="ttl" class="a" data-hook></div>
<div id="band" class="a" data-band></div>
<div id="cap" class="a" data-subs></div>
<script>

/*kitsfx:begin*/
/*kitsfx:end*/
/*CORE*/

</script>
</body>
</html>
