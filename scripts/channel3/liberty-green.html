<!doctype html>
<!--
  Turns Out: "Why is the Statue of Liberty green?" in 2.5D, one continuous camera (3 Nov 2026).
  The turn: she was not built green. Her copper skin was shiny brown in 1886, the air turned it green in about 20 years, a 1906 plan to
  paint her was dropped after protests, and the green layer is what protects the copper.
  - Facts (two sources each):
    * Dedicated 28 Oct 1886 with a copper-brown, shiny skin (American Chemical Society, "How the Statue of Liberty became green";
      Snopes, "Was the Statue of Liberty originally a different color?"; History.com, "Why did the Statue of Liberty change color?").
    * The copper skin is about 3/32 inch, 2.4 mm, thick (Copper Development Association, "The Statue of Liberty"; US National Park
      Service, "Statue Statistics"; Newsweek quoting art historian Erika Doss).
    * Oxygen, sulfur in the air and chloride from the sea reacted with the copper; the green patina covered her by about 1906, some 20 years
      after 1886 (ACS; Snopes).
    * In 1906 Congress funded repairs that included painting the statue; there was a public outcry and the outside was never painted
      (Snopes; History.com).
    * The patina protects the copper underneath from further corrosion (ACS; Copper Development Association).
    * The flame is drawn gold today (gold leaf since 1986) and follows the copper in the 1886-1906 part; the loupe's section is drawn
      magnified (said on screen), with the iron frame behind the skin.
  - Look (design/channel3.md, "2.5D toolkit"): engraved paper layers at real depths in front of ONE camera that never stops and never cuts:
    the harbour at dusk, the statue on her pedestal and star fort, the far shore, clouds; a magnifier for the 2.4 mm skin; a crowd on a pier
    in 1906. One grade: dusk teal and amber, matte, no glow. Illustrated figures, no likenesses. Every frame is a pure function of t; seeded randomness.
-->
