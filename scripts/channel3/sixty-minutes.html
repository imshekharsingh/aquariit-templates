<!doctype html>
<!--
  Turns Out: "Why are there 60 minutes in an hour?" in 2.5D, one continuous camera (4 Nov 2026).
  The turn: the minute and the second are not clock words at first. They are the Latin names of the first and second cuts by 60 that
  Greek astronomers made in a degree, using a base-60 count that goes back to Mesopotamia.
  - Facts (two sources each: Scientific American, "Why is a minute divided into 60 seconds, an hour into 60 minutes, yet there are only
    24 hours in a day?"; Live Science, "Keeping Time: Why 60 Minutes?"):
    * Counting in sixties (sexagesimal) began with the Sumerians in Mesopotamia and passed to the Babylonians, about 4,000 years ago.
    * 60 divides evenly by 2, 3, 4, 5 and 6 (arithmetic), the reason both sources give for its use.
    * The ancient Egyptians divided daylight into 12 hours and the night into 12 more.
    * Greek astronomy (Hipparchus, then Ptolemy's Almagest) divided each degree of a circle into 60 parts and each of those into 60 again.
    * In Latin these were "partes minutae primae" (first small parts) and "partes minutae secundae" (second small parts): the minute and
      the second. Clocks showed minutes, later seconds, many centuries afterwards (said only as "later" on screen).
  - Look (design/channel3.md, "2.5D toolkit"): engraved paper layers at real depths in front of ONE camera that never stops and never cuts;
    the camera flies through a circle into each era: a study wall clock, a clay tablet in Mesopotamia ringed by 60 beads, Egypt's 24-hour
    ring by the pyramids, a Greek bronze circle it zooms into (one degree, then 1/60, then 1/3600), the clock again. One grade: warm lamp
    and dusk amber, matte, no glow. No people. Every frame is a pure function of t; seeded randomness.
-->
