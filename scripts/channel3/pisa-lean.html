<!--
  Turns Out: "Was the Leaning Tower of Pisa built to lean?" in 2.5D, one continuous camera (7 Nov 2026, the 20:00 IST reel, E14 + E16).
  The turn: no. It was built straight; the soft ground under it gave way, the builders' fix made it worse, and engineers pulled it back.
  - Facts (two sources each; Britannica "Leaning Tower of Pisa", History.com "Why does the Leaning Tower of Pisa lean?" and "Leaning Tower
    of Pisa reopens", Smithsonian "The Leaning Tower Straightens Up"):
    * Work began in 1173, as a straight bell tower: Britannica; History.com.
    * About five years later, with the third storey built, the soft ground gave way and it began to lean: History.com; Britannica.
    * War (Pisa and Genoa) stopped the building for almost a century: History.com; Britannica (work interrupted for long periods).
    * When work resumed, the builders made the upper storeys taller on the sinking side, and the extra weight made it sink further:
      Britannica (Giovanni di Simone); History.com.
    * By 1990 the lean was at its most extreme and it was closed to visitors: History.com; Smithsonian.
    * Engineers slowly removed soil from under the north (high) side; it reopened in 2001 about 40 cm (16-17 in) straighter:
      History.com; Smithsonian.
    The drawing exaggerates the angles a little so the lean reads on a phone; the numbers on screen are the sourced ones.
  - Look (design/channel3.md, "2.5D toolkit"): engraved paper layers in front of ONE camera that never cuts: the tower standing straight on
    its lawn (frame 0, E14: an icon in a state that looks wrong), the upper floors fading to a ghost, the cut-away ground with its soft
    clay, the tower tipping, a century of suns, new floors taller on the low side (the curve), 1990 and the barrier, drills under the high
    side, and the tower today with the ghost of its 1990 lean. One grade: Pisan marble white, lawn green, clay grey, Tuscan sky; matte, no glow.
  Built on the core and kit of scripts/channel3/white-pyramid.html (made from scripts/channel3/starter25d.html).
-->
