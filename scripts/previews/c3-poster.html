<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Fix this poster live</title>

<style>

   invented school bake-sale poster on a wall) changes live as each card lands; word-by-word captions, the key word in its colour; a new
   state about every 1.5 s. Every frame is a pure function of t (window.seek). */
:root{--ink:#0d0f12;--f:'Inter Tight',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}

.a{position:absolute}
#silk{left:0;top:0;width:540px;height:500px}
#shade{left:0;top:0;width:540px;height:500px;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 34%,rgba(0,0,0,0) 70%,rgba(0,0,0,.42))}
#eyebrow{left:28px;top:30px;font:700 13px/1 var(--m);letter-spacing:.16em;color:rgba(255,255,255,.86)}
#rule{left:26px;top:52px;font:900 50px/1 var(--f);letter-spacing:-.035em;color:#fff;white-space:nowrap;text-shadow:0 6px 24px rgba(0,0,0,.25)}
#dial{right:26px;top:36px;width:74px;height:74px}
#stack{left:26px;top:128px;width:488px;height:300px}
.cd{position:absolute;left:0;width:488px;height:58px;border-radius:16px;background:rgba(255,255,255,.95);box-shadow:0 14px 30px rgba(0,0,0,.22);display:flex;align-items:center;padding:0 16px 0 14px;gap:12px}
.cd .sw{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--m);color:#fff}
.cd .nm{font:800 19px/1 var(--f);color:#111;letter-spacing:-.01em;white-space:nowrap}
.cd .nm small{display:block;font:500 12px/1.2 var(--m);color:#6b6b6b;margin-top:5px}
.cd .px{margin-left:auto;font:800 24px/1 var(--m);color:#111;letter-spacing:-.03em;white-space:nowrap}
#seam{left:0;top:498px;width:540px;height:4px;background:rgba(255,255,255,.9)}
#cap{left:16px;right:16px;top:446px;text-align:center;font:800 25px/1.15 var(--f);letter-spacing:-.015em;color:#fff;white-space:nowrap;z-index:5}
#cap .bx{display:inline-block;padding:9px 16px 10px;border-radius:14px;background:rgba(10,11,14,.86);box-shadow:0 10px 26px rgba(0,0,0,.35)}
#cap span{display:inline-block;margin:0 .12em}
/* the stage: a painted brick wall with one warm light */
#wall{left:0;top:502px;width:540px;height:458px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 30%,rgba(255,226,180,.32),rgba(0,0,0,0) 60%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 2px,transparent 2px 30px),
    linear-gradient(180deg,#b9b2a6,#8f877b)}
#bricks{left:0;top:502px;width:540px;height:458px;opacity:.55}
#poster{left:106px;top:524px;width:328px;height:420px;border-radius:3px;box-shadow:0 22px 40px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);overflow:hidden}
#poster .ln{position:absolute;left:0;top:0;white-space:nowrap;transform-origin:0 50%}
#poster .art{position:absolute}
.tape{position:absolute;width:86px;height:26px;background:rgba(240,232,210,.78);box-shadow:0 1px 3px rgba(0,0,0,.18)}
#flag{left:356px;top:536px;font:800 13px/1 var(--m);letter-spacing:.14em;padding:7px 10px;border-radius:8px;color:#fff;z-index:4}
#rings{position:absolute;left:0;top:0}
#rings .rg{position:absolute;border:3px solid #ff3b30;border-radius:50%;z-index:3}
#end{left:26px;top:128px;width:488px;height:300px;border-radius:22px;background:rgba(255,255,255,.96);box-shadow:0 20px 44px rgba(0,0,0,.28);padding:24px 24px;opacity:0}
#end .k{font:700 13px/1 var(--m);letter-spacing:.16em;color:#666}
#end ol{margin:14px 0 0;padding:0;list-style:none;font:800 22px/1.5 var(--f);color:#111;letter-spacing:-.01em}
#end ol li{display:flex;gap:12px;align-items:baseline;white-space:nowrap}
#end ol li b{font:700 14px/1 var(--m);color:#999;width:18px}
#end ol li span{font:500 14px/1 var(--m);color:#777;margin-left:auto}
</style>
</head>
