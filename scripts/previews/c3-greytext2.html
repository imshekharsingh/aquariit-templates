<title>Turns Out · design tutorial</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Space+Grotesk:wght@400;500;700&family=Pacifico&family=Anton&family=Courier+Prime&family=Playfair+Display:ital,wght@0,700;1,700&display=block" rel="stylesheet">
<style>
/* Turns Out design tutorials (owner, 21 Nov 2026: "rich design mechanism, not just flat this-to-that"; references = learnings, our own look).
   One shared layer (scripts/channel3/design/core.js) on the @webin20sec motion kit: a live artboard whose layout springs between states,
   guides that draw, measurements that roll, a design-tool cursor with a selection box, property chips, the before as a ghost, and the
   Turns Out dial (the logo's ring) counting the fixes. Zones (CSS px of 540x960, safe zone y 125-785): top 125-285 dial + step title,
   band 292-388 captions, hero 400-780 the artboard. */
:root{--f:'Space Grotesk',system-ui,sans-serif;--d:'Unbounded',system-ui,sans-serif;--ink:#0b0d16;--paper:#eef0f7;--dim:#9aa1b8;--amb:#ffb35a;--org:#ff7a45;--good:#5ee0a0;--bad:#ff6b6b;--sel:#7aa2ff}
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f);-webkit-font-smoothing:antialiased}
.a{position:absolute}
#vp{left:0;top:0;width:540px;height:960px;overflow:hidden}
#world{left:0;top:0;width:540px;height:960px;transform-origin:0 0}
/* premium staging (owner, 21 Nov 2026: "more premium in design experience ... effective colour definitions and design patterns"): a dot grid that
   fades out, the Turns Out ring turning slowly behind the design, a spotlight in the format's own tint, a contact shadow on the floor */
:root{--tint:#ffb35a;--tint2:#ff7a45}
#grid{left:-200px;top:-200px;width:940px;height:1360px;background:radial-gradient(circle,rgba(255,255,255,.085) 1.1px,transparent 1.5px) 0 0/22px 22px;-webkit-mask-image:radial-gradient(60% 50% at 50% 48%,#000 30%,transparent 100%)}
#spot{left:-60px;top:300px;width:660px;height:640px;background:radial-gradient(50% 50% at 50% 50%,color-mix(in srgb,var(--tint) 26%,transparent),transparent 70%);pointer-events:none}
#ring{left:-50px;top:280px;width:640px;height:640px;opacity:.55;pointer-events:none}
#floor{left:70px;top:770px;width:400px;height:40px;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.55),transparent 70%);filter:blur(6px);pointer-events:none}
#ov{left:0;top:0;width:540px;height:960px;overflow:visible;pointer-events:none;z-index:20}
#cur{left:0;top:0;width:30px;height:30px;z-index:30;opacity:0;pointer-events:none}
#dial{left:30px;top:132px;display:flex;align-items:center;gap:12px;z-index:40}
#dial svg{width:66px;height:66px;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--tint) 45%,transparent))}
#dial .lb{font:700 15px/1 var(--f);letter-spacing:.24em;color:var(--amb)}
#dial .n{font:900 26px var(--d);fill:#fff}
#ttl{left:30px;top:212px;width:480px;font:900 31px/1.08 var(--d);letter-spacing:-.02em;z-index:40}
#ttl em{font-style:normal;background:linear-gradient(100deg,color-mix(in srgb,var(--tint) 80%,#fff),var(--tint2));-webkit-background-clip:text;background-clip:text;color:transparent}
#band{left:0;top:292px;width:540px;height:96px}
#cap{left:30px;top:298px;width:480px;min-height:80px;font:700 29px/1.15 var(--f);letter-spacing:-.02em;z-index:40}
#cap span{display:inline-block;margin-right:.24em}
.chip{position:absolute;white-space:nowrap;padding:9px 15px 9px 13px;border-radius:999px;background:linear-gradient(rgba(18,21,34,.82),rgba(18,21,34,.82)) padding-box,linear-gradient(120deg,var(--tint),var(--tint2) 60%,rgba(255,255,255,.25)) border-box;border:1.5px solid transparent;backdrop-filter:blur(10px);color:color-mix(in srgb,var(--tint) 85%,#fff);font:700 16px/1 var(--f);letter-spacing:.08em;z-index:25;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.chip b{color:#fff;font-weight:700}
.chip.g{background:linear-gradient(rgba(14,28,24,.85),rgba(14,28,24,.85)) padding-box,linear-gradient(120deg,#5ee0a0,#2fb37a) border-box;color:#7ef0b8}.chip.r{background:linear-gradient(rgba(34,14,18,.85),rgba(34,14,18,.85)) padding-box,linear-gradient(120deg,#ff6b6b,#ff9a6a) border-box;color:#ff8e8e}
.board{position:absolute;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 24px rgba(0,0,0,.35),0 40px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.55)}
/* print feel: a fine paper grain and a soft sheen over every designed object */
.board::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:30;opacity:.5;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .16 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"),linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.04))}
/* round 6 (owner, 21 Nov 2026: "more dramatic change so that it hooks audience ... audio should also transition in that fashion"):
   each design lives in its own place (a context stage, light, drawn in code) and the place itself switches from its problem mood (dim, grey)
   to lit as the fixes land; the brand sits in a dark band at the top (dial, title, captions); frame 0 is a hook in motion */
body.ctx #spot,body.ctx #grid,body.ctx #ring,body.ctx #floor{display:none}
#ctx{left:-40px;top:-40px;width:620px;height:1040px;transform-origin:50% 60%}
#ctx .lit{position:absolute;inset:0;pointer-events:none;opacity:0}
#sweep{left:-300px;top:380px;width:240px;height:460px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);opacity:0;pointer-events:none;z-index:24;mix-blend-mode:soft-light}
#topband{left:0;top:0;width:540px;height:372px;background:linear-gradient(180deg,#0b0d16 0%,#0b0d16 88%,rgba(11,13,22,0) 100%);z-index:35;pointer-events:none}
body:not(.ctx) #topband{display:none}
#hook{left:24px;top:132px;width:492px;padding:0 6px;font:900 46px/1.06 var(--d);letter-spacing:-.03em;color:#fff;z-index:45;opacity:0;pointer-events:none}
#hook em{font-style:normal;color:#ff5f5f}
#hook i{display:inline-block;font-style:normal}
.chip{font-size:20px!important;padding:11px 18px 11px 16px!important}
.chip.sm{font-size:15px!important;padding:8px 12px!important}
.rul{position:absolute;width:24px;border-radius:6px;background:repeating-linear-gradient(180deg,rgba(24,26,36,.9) 0 2px,transparent 2px 12px) left/9px 100% no-repeat,repeating-linear-gradient(180deg,rgba(24,26,36,.75) 0 2px,transparent 2px 60px) left/16px 100% no-repeat,linear-gradient(90deg,#ece7dd,#dcd5c7);box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:1}
.rul.r{transform:scaleX(-1)}
#board{left:66px;top:396px;width:408px;height:368px;border-radius:14px;border:10px solid #6b4a2e}
.sp{position:absolute;left:28px;white-space:nowrap;font-family:'Space Grotesk'}
#h0{top:20px;font:700 30px 'Space Grotesk';letter-spacing:-.01em}
#h1{top:60px;font:500 14px 'Space Grotesk';letter-spacing:.18em}
.it{font:700 21px 'Space Grotesk'}.ds{font:400 15px 'Space Grotesk'}
#chk{left:292px;top:676px;width:176px;padding:9px 11px;border-radius:16px;background:#141827;border:1.5px solid #2a3150;box-shadow:0 14px 30px rgba(0,0,0,.5);z-index:28;opacity:0;font-family:'Space Grotesk'}
#chk .sw{display:inline-block;width:24px;height:24px;border-radius:8px;vertical-align:middle;border:2px solid rgba(255,255,255,.2)}
#chk .lb{display:block;font:700 11px 'Space Grotesk';letter-spacing:.16em;color:#9aa1b8;margin-bottom:5px}
#chk .rs{display:inline-block;margin-left:8px;font:900 19px var(--d);vertical-align:middle}
#chk .rt{display:block;margin-top:6px;font:700 21px 'Space Grotesk';color:#fff;letter-spacing:.02em;white-space:nowrap}
#drop{position:absolute;left:0;top:0;width:34px;height:34px;z-index:31;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="vp" class="a" data-fit="free"><div id="world" class="a" data-fit="free">
  <div id="ctx" class="a"><div style="position:absolute;inset:0;background:linear-gradient(175deg,#3a2a22 0%,#2e211b 55%,#241914 100%)"></div>
<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,220,180,.05) 0 2px,transparent 2px 44px)"></div>
<div style="position:absolute;left:0;right:0;top:820px;height:220px;background:linear-gradient(180deg,#7a5236,#5a3a24);box-shadow:0 -3px 0 rgba(255,220,180,.25)"></div>
<div style="position:absolute;left:412px;top:760px;width:110px;height:90px;border-radius:0 0 30px 30px;background:linear-gradient(90deg,#e9e4da,#fff,#d9d3c8);box-shadow:0 10px 16px rgba(0,0,0,.35)"></div>
<div style="position:absolute;left:30px;top:150px;width:480px;height:40px;background:repeating-linear-gradient(90deg,#c9a46a 0 14px,transparent 14px 40px);opacity:.25"></div>
<div class="lit" style="background:radial-gradient(55% 40% at 50% 55%,rgba(255,220,170,.45),transparent 75%)"></div>
<div class="lit" style="background:linear-gradient(180deg,rgba(255,200,130,.14),rgba(255,170,100,.05))"></div></div>
  <div id="spot" class="a"></div>

  <svg id="ring" class="a" viewBox="-320 -320 640 640"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--tint);stop-opacity:0"/><stop offset="1" style="stop-color:var(--tint);stop-opacity:.55"/></linearGradient></defs><circle r="300" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="26"/><g id="ringarc"><path d="M-212 -212 A300 300 0 1 1 -300 0" fill="none" stroke="url(#rg)" stroke-width="26" stroke-linecap="round"/></g></svg>
  <div id="floor" class="a"></div>

<div id="board" class="board">

</div>

  <div id="sweep" class="a"></div>
  <svg id="ov" class="a" viewBox="0 0 540 960"></svg>
  <svg id="cur" class="a" viewBox="0 0 30 30" style="filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))"><path d="M4 2 L4 24 L10 18 L14 27 L18 25 L14 16 L22 16 Z" fill="#fff" stroke="#0b0d16" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div></div>

<div id="ttl" class="a" data-hook></div>
<div id="band" class="a" data-band></div>
<div id="cap" class="a" data-subs></div>
<script>
/*kitmotion:begin*/
// ---- @webin20sec motion kit (scripts/explainer/kitmotion.js; owner, 7 Nov 2026: "Can we further improve the overall animation and flow?") ----
// Premium motion by default for every web reel, like kit25d.js for Turns Out. Inlined into a scene's main script between the kitmotion
// begin and end markers by node scripts/channel3/kit-inline.mjs <scene.html> (npm run check fails on a stale copy); start a reel with
// node scripts/explainer/newweb.mjs <slug> "Hook?" "Sentence." ... Every frame is a pure function of t: moves, transitions and taps are
// registered once (in the scene's anchors(), after the voice timings are known), then drawn from t alone in seek(t).
// Registering a move, transition or tap also writes its sound cue (move / swell / snap / blip / touch, with x) and declares a transition in
// window.TRANSITIONS, so the FLOW gate (scripts/showreel/flow.mjs: no undeclared cuts, no dead runs, continuity 85%+) knows it was meant.
//   KM.reset(dur)                         before registering (anchors()); KM.publish(extra) after: window.CUES and window.TRANSITIONS
//   eases: KM.ease.out3 / inOut3 / expoInOut / back(k, s) / spring(k) (critically damped) / settle(k, f) (overshoot and settle)
//   KM.rig({ x, y, z, drift })            the camera: a continuous eased drift (never still) + named moves, rig.at(t) -> { x, y, z, vx, vy, vz }
//     rig.pushIn(t0, d, x, y, z) · rig.pan(t0, d, x, y) · rig.pushThrough(t0, d, x, y, z) (a fast zoom through, declared) ·
//     rig.matchMove(t0, d, x, y, z) (follows a shared element, declared) · rig.creep(t0, d, dz) (a slow steady push through a held beat) · rig.apply(worldEl, t, tiltEl) · rig.toScreen(c, x, y)
//   KM.transition(kind, t0, d, cue)       declares [t0, t0 + d, kind], writes its cue, returns k(t) (0 -> 1, eased) for the setters:
//     KM.shared(el, a, b, k) (sharedElement: a box glides and scales between layouts, a/b = { x, y, w, h, r }) · KM.pushThrough(el, k, dir) ·
//     KM.morph(el, a, b, k, colA, colB) · KM.wipe(newLayer, k) (wipeRestyle: the new theme comes down top to bottom)
//   text: KM.rise(spans, t, starts, gone) (blur to sharp, word by word) · KM.type(el, html, t, t0, t1) (typing with a caret) ·
//     KM.sweep(el, t, t0, d, col) (a highlight sweep) · KM.leader(line, label, from, to, k) (a leader-line label, SVG line + text)
//   secondary: KM.parallax(el, c, depth) · KM.stagger(els, t, t0, gap, d) · KM.squeeze(el, t, tTap) (press and pop) ·
//     KM.ripple(el, t, tTap, x, y) · KM.tap(t, x) (the touch cue for a tap at screen x) · KM.touch(host) -> draw(t, s) (the slim ring touch marker, 13 Nov 2026)
//   details format (8 Nov 2026): KM.curve(spec) · KM.linearCss(f, n) · KM.timeScale(t0, t1, factor) (slow motion; the camera keeps reel time) ·
//     KM.curveGraph(svg, spec, c0, d, { clock, real }) (the live easing curve with a riding dot) · KM.slowmoBadge(el, ts, label) ·
//     KM.specChip(el, items, t0, d) (numbers roll in) · KM.partProgress(el, parts) (the segmented top bar); start a reel with newweb.mjs --details N
//   voice and subtitles: KM.voice(text, lead) -> { words, at(word, nth), phrases(max) } · KM.subs(capEl, t, V, PH, from, until, colour)
//   look (owner, 8 Nov 2026: "Let's go with C."): KM.theme(name) -> T (hex colours for KM.mixCol) sets the :root tokens (--ink, --paper, --dim,
//     --acc, --red, --ctl, --raise, --skel, --pg, --card, --on, --glass, --frost, --edge, --lift, --glow, --soft, --ring, --f, --m, --hw, --ht) and lays a
//     light canvas behind everything; KM.lights(t, c) paints it every frame: the blooms drifting (with the camera c, at depth) and the grade; KM.cutBelow(vp, fe, y, k) ends the world
//     at y (an overflow cut under a soft feather: a mask costs ~75 ms a frame); KM.depth(el, c, cx, cy, d) (a pane at its own depth: parallax in
//     the camera's moves); KM.float(t, seed, amp) (a pane's slow sine float). 'glass' (style C, "Glass and light") is the web default from
//     8 Nov 2026; 'dark' is the old ink-and-mint look. KM.theme('glass', palette) (or window.WEB_PALETTE) swaps the light and the accents:
//     KM.PALETTES aurora (the original), ember, lagoon, orchid, glacier (owner, 8 Nov 2026: colour variety, reel to reel).
//     KM.theme('dark', world): KM.WORLDS saffron, berry, jade, the dark look's own colour world per reel (owner, 15 Nov 2026: "similar colour grading");
//     KM.lights(t, c, true) holds the light still and KM.rig({ drift: 0 }) holds the camera (owner, 15 Nov 2026: "too wiggly").
//   the whole frame (owner, 14 Nov 2026: "we are squeezing most of it in one place of the screen"; rules-web.md rule 16): KM.ZONES = the
//     screen bands a web reel fills top to bottom (top: hook, counters, code; hero: the subject of the fix, the biggest thing on screen, down
//     to the band; band: subtitles), in CSS px of the 540x960 frame inside the safe zone; KM.worldY(c, y) = the world y at screen y under
//     camera c, so a card's top and bottom edges can be locked to the zones while the camera pushes in (no gap opens, nothing enters the band).
var KM = (function(){
  var cl = function(v, a, b){ a = a == null ? 0 : a; b = b == null ? 1 : b; return v < a ? a : v > b ? b : v; };
  var P = function(t, a, b){ return b <= a ? (t >= a ? 1 : 0) : cl((t - a) / (b - a)); }, mix = function(a, b, k){ return a + (b - a) * k; };
  var win = function(t, a, b, f){ return Math.min(P(t, a - f, a), 1 - P(t, b - f, b)); };
  var ease = {
    linear: function(k){ return k; },
    out3: function(k){ return 1 - Math.pow(1 - k, 3); },
    inOut3: function(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; },
    expoInOut: function(k){ return k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2; },
    back: function(k, s){ s = s == null ? 1.3 : s; return k <= 0 ? 0 : k >= 1 ? 1 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); },
    // a critically damped spring over the move's length (no overshoot, a fast start and a long soft landing), exactly 1 at the end
    spring: function(k){ if (k <= 0) return 0; if (k >= 1) return 1; var w = 9; return (1 - (1 + w * k) * Math.exp(-w * k)) / (1 - (1 + w) * Math.exp(-w)); },
    // overshoot and settle (an underdamped spring): about f wobbles, dying out, exactly 1 at the end
    settle: function(k, f){ if (k <= 0) return 0; if (k >= 1) return 1; f = f || 1.4; return 1 - Math.exp(-5 * k) * Math.cos(k * Math.PI * f) * (1 - k); }
  };
  var Q = [], TR = [], DUR = 20;
  function reset(dur){ Q = []; TR = []; DUR = dur || DUR; }
  function cue(c){ Q.push(c); return c; }
  function declare(t0, t1, kind){ TR.push([+t0.toFixed(2), +t1.toFixed(2), kind]); }
  // ---- the camera: base framing, a drift that never stops, and named moves folded in order ----
  function rig(o){
    var base = [o.x, o.y, o.z], D = o.drift == null ? 1 : o.drift, moves = [], last = base.slice();
    function add(t0, d, x, y, z, kind, e){ var to = [x, y, z == null ? last[2] : z], m = { t0: t0, d: d, to: to, kind: kind, e: e };
      moves.push(m); var dz = to[2] - last[2];
      cue({ t: t0, k: 'move', d: Math.max(.4, d * .8), g: kind === 'pan' ? .26 : .34, dir: dz >= 0 ? 1 : -1, x: 255, x2: cl(255 + (x - last[0]) * 2, 40, 500), r: .25 });
      if (kind === 'pushThrough') { cue({ t: t0, k: 'swell', d: Math.max(.5, d), g: .4, x: 255 }); cue({ t: t0 + d * .55, k: 'snap', g: .3, p: 5, x: 255, r: .2 }); declare(t0, t0 + d, 'pushThrough'); }
      if (kind === 'matchMove') declare(t0, t0 + d, 'matchMove');
      last = to; return R; }
    var R = {
      moves: moves,
      pushIn: function(t0, d, x, y, z){ return add(t0, d, x, y, z, 'pushIn', 'settle'); },
      pan: function(t0, d, x, y){ return add(t0, d, x, y, null, 'pan', 'inOut3'); },
      pushThrough: function(t0, d, x, y, z){ return add(t0, d, x, y, z, 'pushThrough', 'expoInOut'); },
      matchMove: function(t0, d, x, y, z){ return add(t0, d, x, y, z, 'matchMove', 'inOut3'); },
      pull: function(t0, d, x, y, z){ return add(t0, d, x, y, z, 'pull', 'settle'); },
      // creep: a slow, steady push to the end of a beat (a held shot that still breathes: FLOW dead runs), no cue
