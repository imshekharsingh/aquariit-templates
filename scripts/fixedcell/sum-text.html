<style>
/* Fixed Cell Nº 02, sums: "Why does SUM skip some of your numbers?"
   A spending list totals 1,025 instead of 1,455: two amounts are numbers stored as text, which sit on the left edge of their cells.
   SUM ignores text in a range; =SUMPRODUCT(--B2:B6) turns each into a number first (the text amounts slide over to the right edge),
   and every row counts.
   Fixed Cell look (design/fixedcell.md): paper white, ink, one green accent (the fill handle), red only for what is broken, a crisp grid,
   a monospace formula bar and a pointer. Engine shared by every Fixed Cell scene: sheet(), fx(), cam(), captions; this reel's part is
   below "THIS REEL". Every frame a pure function of t; beats and caption words lead the voice by 0.15 s; the title shows in full from
   frame 0 (ghosted) and lights word by word with the voice; the cover is the moment it is complete (window.COVER). */

*{box-sizing:border-box;margin:0}

.a{position:absolute}
#bg{left:-90px;top:-30px;width:720px;height:1020px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 30px;opacity:.55}

#hud b{font-weight:600}#hud .r{color:var(--red)}#hud .g{color:var(--acc)}

#note .r{background:var(--redbg);color:var(--red);box-shadow:0 0 0 1.5px #f2c6c1}
#ms{visibility:hidden;white-space:nowrap}
</style>
</head>

<script>
(function(){
  // ======== ENGINE (same in every Fixed Cell scene) ========
  var $ = function(id){ return document.getElementById(id); };
  var cl = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }, P = function(t, a, b){ return cl((t - a) / (b - a)); }, mix = function(a, b, k){ return a + (b - a) * k; };
  var out = function(k){ return 1 - Math.pow(1 - k, 3); }, io = function(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };

  var norm = function(w){ return w.toLowerCase().replace(/[^a-z0-9]/g, ''); };
  var WORDS = [], A = {}, PH = [], LEAD = .15;

  // captions: one sentence at a time (long ones split at a comma), the title's words are shown as the title instead

    WORDS.forEach(function(w, i){ cur.push(i); if (/[.?!]$/.test(w.d) || i === WORDS.length - 1) {
      if (cur.length > 8) { var best = -1; cur.forEach(function(j, k){ if (/[,:;]$/.test(WORDS[j].d) && k > 1 && k < cur.length - 2 && (best < 0 || Math.abs(k - cur.length / 2) < Math.abs(best - cur.length / 2))) best = k; });
        if (best < 0) best = Math.floor(cur.length / 2) - 1; PH.push(cur.slice(0, best + 1)); PH.push(cur.slice(best + 1)); }

    if (ph && ph[0] >= HOOK_N) for (var q = 0; q < ph.length; q++) { var j = ph[q], w = WORDS[j], d = w.d, nx = WORDS[ph[q + 1]];
      if (JOIN[norm(d)] && nx && norm(nx.d) === JOIN[norm(d)][0]) { d = JOIN[norm(d)][1] + nx.d.replace(/^[a-z]+/i, ''); q++; }   // "V lookup" spoken, VLOOKUP shown
      else if (DISP[norm(d)]) d = d.replace(/^[a-z]+/i, DISP[norm(d)]);   // "sum" spoken (not spelled out), SUM shown
      var on = t >= w.s - LEAD, k = out(P(t, w.s - LEAD, w.s - LEAD + .2)), col = GREEN.test(d) ? 'var(--acc)' : RED.test(d) ? 'var(--red)' : 'var(--ink)';
      html += '<span style="opacity:' + (on ? 1 - ex : 0) + ';transform:translateY(' + ((1 - k) * 12).toFixed(1) + 'px);color:' + col + '">' + d.replace(/</g, '') + '</span>'; }
    $('cap').innerHTML = html; }
  // the title: in full from frame 0 (pale), each word inks in as it is spoken; leaves when the next line starts
  function title(t, leave){ var gone = io(P(t, leave, leave + .35));
    [].forEach.call($('hook').querySelectorAll('.ln > span'), function(sp, i){ var s = WORDS[i] ? WORDS[i].s - LEAD : 0, k = out(P(t, s, s + .22));
      var red = sp.className === 'x', c0 = [200, 198, 190], c1 = red ? [212, 56, 44] : [22, 24, 29];
      sp.style.color = 'rgb(' + c0.map(function(v, n){ return Math.round(mix(v, c1[n], k)); }).join(',') + ')';
      sp.style.opacity = 1 - gone; sp.style.transform = 'translateY(' + (-(1 - k) * 0 - gone * 60 - Math.sin(k * Math.PI) * 6).toFixed(1) + 'px)'; }); }
  // the sheet: cols [{k, w, head}] (w animates an insert), rows of { colKey: cell } where cell = text or { v, c (classes), n (number) }
  var G = 34, HH = 30, RH = 40, SW = 468, VH = 418, STH = 66 + 30 + 8 * 40, GEO = {};

      h += '<div class="c h' + (hi && hi[c.k] ? ' on' : '') + '" style="left:' + x.toFixed(1) + 'px;top:0;width:' + c.w.toFixed(1) + 'px;height:' + HH + 'px">' + (c.w > 14 ? L[li] : '') + '</div>'; if (c.w > .5) li++; x += c.w; });
    var fw = SW - x; if (fw > 1) h += '<div class="c h" style="left:' + x.toFixed(1) + 'px;top:0;width:' + fw + 'px;height:' + HH + 'px">' + L[li] + '</div>';
    for (var r = 1; r <= nRows; r++) { var y = HH + (r - 1) * RH, row = rows[r] || {};
      h += '<div class="c h" style="left:0;top:' + y + 'px;width:' + G + 'px;height:' + RH + 'px;line-height:39px">' + r + '</div>';
      cols.forEach(function(c){ if (c.w <= .5) return; var v = row[c.k], o = v && typeof v === 'object' ? v : { v: v };
        h += '<div class="c' + (o.c ? ' ' + o.c : '') + (o.n ? ' n' : '') + (c.cls ? ' ' + c.cls : '') + '" style="left:' + GEO.x[c.k].toFixed(1) + 'px;top:' + y + 'px;width:' + c.w.toFixed(1) + 'px;height:' + RH + 'px">' + (o.v == null || c.w < 20 ? '' : o.v) + '</div>'; });
      if (fw > 1) h += '<div class="c" style="left:' + x.toFixed(1) + 'px;top:' + y + 'px;width:' + fw + 'px;height:' + RH + 'px"></div>'; }
    $('cells').innerHTML = h; $('sheet').style.height = (HH + nRows * RH + 1.5) + 'px'; }
  function box(k0, r0, k1, r1){ var x0 = GEO.x[k0], x1 = GEO.x[k1 || k0] + GEO.w[k1 || k0]; return { x: x0, y: HH + (r0 - 1) * RH, w: x1 - x0, h: ((r1 || r0) - r0 + 1) * RH }; }

  // the formula bar: segments [text, class], typed up to n characters, with a blinking caret while editing

    for (var i = 0; i < segs.length && k < n; i++) { var s = segs[i][0].slice(0, n - k); k += s.length; o += segs[i][1] ? '<span class="' + segs[i][1] + '">' + s + '</span>' : s; if (i === at) o += c; }

  var flen = function(segs){ return segs.reduce(function(a, s){ return a + s[0].length; }, 0); };

    var b = K[i], a = K[Math.max(0, i - 1)], k = io(P(t, b[0], b[0] + .55));   // each keyframe is reached 0.55 s after its time

  function readout(html){ $('hud').innerHTML = html; }

  // ======== THIS REEL ========
  var TEXT = "Why does sum skip some of your numbers? Look at the edges: these ones hug the left. They're stored as text, and sum ignores text. Wrap the range: sum product, two minus signs. The double minus turns text into numbers. Now every row counts.";
  var DUR = 17, HOOK_N = 8, JOIN = { sum: ['product', 'SUMPRODUCT'] }, DISP = { sum: 'SUM' };
  var GREEN = /^(SUMPRODUCT|two|minus|double|numbers|every|counts)/i, RED = /^(left|text|ignores)/i;
  var ROWS = [['Rent', 950, 0], ['Power', 120, 1], ['Phone', 45, 0], ['Food', 310, 1], ['Gym', 30, 0]];   // item, amount, stored as text (example data)
  var SUMF = [['=SUM(', 'k'], ['B2:B6', ''], [')', 'k']], SPF = [['=SUMPRODUCT(', 'g'], ['--', 'hg'], ['B2:B6', ''], [')', 'g']];
  var fmt = function(n){ return String(n).replace(/\B(?=(\d{3})+$)/g, ','); }, ms = $('ms'), TW = {};
  function tw(s){ if (TW[s] === undefined) { ms.style.font = "500 20px 'Inter Tight'"; ms.textContent = s; TW[s] = ms.getBoundingClientRect().width; } return TW[s]; }
  function anchors(){
    align(); phrases();
    A = { look: at('look'), edges: at('edges'), these: at('these'), left: at('left'), stored: at('stored'), text: at('text'), ignores: at('ignores'), wrap: at('wrap'),
      sp: at('sum', 3), two: at('two'), minus: at('minus'), double: at('double'), turns: at('turns'), numbers: at('numbers'), now: at('now'), every: at('every'), counts: at('counts') };

    cues();
  }
  function seek(t){
    t = Math.max(0, Math.min(DUR, t));
    var ex = 0;
    title(t, A.leave);
    var after = io(P(t, A.leave, A.leave + .5));
    $('view').style.top = mix(318, 252, after) + 'px';
    // ---- state: text numbers sit left and are skipped → the double minus turns them into numbers (they slide right) → every row counts ----
    var fixed = t >= A.now - .1, edge = win(t, A.these - .05, A.turns, .15), skip = t >= A.ignores - .05 && t < A.now - .1;
    var cols = [{ k: 'a', w: 150 }, { k: 'b', w: 150 }];
    var rows = { 1: { a: { v: 'Item', c: 'b' }, b: { v: 'Amount', c: 'b n' } } };
    ROWS.forEach(function(r, i){ var v = String(r[1]), c = '';
      if (r[2]) { var k = out(P(t, A.turns + i * .08, A.turns + i * .08 + .45)), dx = (150 - 20 - tw(v)) * k;
        if (t < A.turns + .3) c = edge > .5 ? 'bad' : ''; if (skip && k < .5) c += ' skip';
        rows[i + 2] = { a: r[0], b: { v: '<i style="transform:translateX(' + dx.toFixed(1) + 'px)">' + v + '</i>', c: c + (fixed && win(t, A.every + i * .12, A.every + i * .12 + .5, .1) > .5 ? ' ok' : '') } }; }
      else rows[i + 2] = { a: r[0], b: { v: v, n: 1, c: fixed && win(t, A.every + i * .12, A.every + i * .12 + .5, .1) > .5 ? 'ok' : '' } }; });
    var tot = !fixed ? 1025 : Math.round(1025 + 430 * out(P(t, A.now - .1, A.now + .6)));

    // ---- overlays: left-edge marks, TEXT / NUMBER tags in column C, the selected total ----
    var o = '';
    if (edge > 0) ROWS.forEach(function(r, i){ var b = box('b', i + 2), k = out(P(t, A.these + i * .07, A.these + i * .07 + .25)) * edge;
      o += '<div style="position:absolute;left:' + (r[2] ? b.x + 2 : b.x + b.w - 6) + 'px;top:' + (b.y + 6) + 'px;width:4px;height:' + (RH - 12) + 'px;border-radius:2px;background:' + (r[2] ? 'var(--red)' : '#c9c7bf') + ';opacity:' + k.toFixed(2) + '"></div>'; });
    var tA = win(t, A.stored - .05, A.now + .8, .15);
