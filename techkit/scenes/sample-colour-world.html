<!-- TEST SCENE, never posted (owner, 25 Nov 2026; design/rules-tech.md section L; design/references.md "R-ref 25 Nov").
     "3 apps x 8 tools = 24 integrations, then 3 + 8 = 11 with one shared standard", in the colour world look: one continuous 3D world
     (dark floor grid, glossy blocks, warm glowing cables, colourful app tiles, a JSON code card), the camera travels through it,
     the spoken line word by word near the top with a blue selection box on the key words. Own words, own drawing, no presenter.
     Tiles carry generic app names and hand-drawn glyphs (no real logos: no licensed file was at hand). three.js r149 inlined at the marker. -->

<script>
(() => {
const W = 1080, H = 1920;
const TL = window.TL, C = TL.cues, SC = TL.scenes, TOTAL = TL.total;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sm = (u) => (u = clamp(u), u * u * (3 - 2 * u));
const ease = (u) => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

const V = (x, y, z) => new THREE.Vector3(x, y, z);

const out = document.getElementById('out'), o = out.getContext('2d'); o.imageSmoothingQuality = 'high';

// studio reflections: dark room, soft boxes in violet, amber, cyan and white (what the glossy blocks mirror)
{ const env = new THREE.Scene(); env.background = new THREE.Color(0x06040e);
  const box = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };

function ctex(w, h, draw, lin) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = lin ? THREE.LinearEncoding : THREE.sRGBEncoding; t.anisotropy = 8; return t; }
const FONT = '"Inter Display",Inter,"DejaVu Sans",sans-serif', MONO = '"DejaVu Sans Mono","JetBrains Mono",monospace';
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

  ['Chat', '#2fd36b', (c) => { c.fillStyle = '#fff'; rr(c, -62, -52, 124, 86, 26); c.fill(); c.beginPath(); c.moveTo(-26, 30); c.lineTo(-40, 62); c.lineTo(4, 34); c.fill(); c.fillStyle = '#2fd36b'; [-32, 0, 32].forEach((x) => { c.beginPath(); c.arc(x, -9, 8, 0, 7); c.fill(); }); }],
  ['Notes', '#ffe14a', (c) => { c.strokeStyle = '#3a3320'; c.lineWidth = 9; c.lineCap = 'round'; [-34, -8, 18, 44].forEach((y, i) => { c.beginPath(); c.moveTo(-52, y); c.lineTo(i === 3 ? 6 : 52, y); c.stroke(); }); }],
  ['Maps', '#37c4ff', (c) => { c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -16, 38, 0, 7); c.fill(); c.beginPath(); c.moveTo(-26, 8); c.lineTo(0, 62); c.lineTo(26, 8); c.fill(); c.fillStyle = '#37c4ff'; c.beginPath(); c.arc(0, -16, 15, 0, 7); c.fill(); }],
  ['Pay', '#8a5cff', (c) => { c.fillStyle = '#fff'; rr(c, -64, -44, 128, 88, 14); c.fill(); c.fillStyle = '#8a5cff'; c.fillRect(-64, -22, 128, 20); c.fillRect(-48, 18, 40, 10); }],
  ['Photos', '#ff7ac8', (c) => { const cols = ['#ffd24a', '#ff6a4a', '#7ad0ff', '#7aff9a']; cols.forEach((k, i) => { c.save(); c.rotate(i * Math.PI / 2); c.fillStyle = k; c.globalAlpha = .92; c.beginPath(); c.ellipse(0, -30, 20, 36, 0, 0, 7); c.fill(); c.restore(); }); }],
];
function tileFace(name, bg, glyph) {
  return ctex(512, 512, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, bg); g.addColorStop(1, 'rgba(0,0,0,.45)'); c.fillStyle = bg; rr(c, 0, 0, w, h, 90); c.fill(); c.fillStyle = g; c.globalAlpha = .55; rr(c, 0, 0, w, h, 90); c.fill(); c.globalAlpha = 1;
    c.save(); c.translate(w / 2, h / 2 - 36); c.scale(2.0, 2.0); glyph(c); c.restore();
    c.fillStyle = bg === '#ffffff' || bg === '#ffe14a' ? '#14121e' : '#fff'; c.font = '800 54px ' + FONT; c.textAlign = 'center'; c.fillText(name, w / 2, h - 52);
  });
}
const wallX = 6.6, rowsY = [1.15, 2.95, 4.75, 6.55], colsZ = [-1.0, 1.0];
const tiles = [];
APPS.forEach((a, i) => {
  const grp = new THREE.Group(), col = i % 2, row = Math.floor(i / 2);

  const body = slab(1.6, .22, .34, new THREE.MeshPhysicalMaterial({ color: new THREE.Color(a[1]).multiplyScalar(.35), metalness: .15, roughness: .35, clearcoat: 1, clearcoatRoughness: .15, envMapIntensity: .5 }));
  grp.add(body);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.66, 1.66), new THREE.MeshBasicMaterial({ map: tileFace(a[0], a[1], a[2]), transparent: true, toneMapped: false }));
  face.position.z = .175; grp.add(face);
  const port = new THREE.Mesh(new THREE.SphereGeometry(.1, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffa23a, toneMapped: false })); port.position.set(0, 0, -.22); grp.add(port);
  scene.add(grp); tiles.push({ grp, port, col, row, i });
});
// the wall's back plate (so the tiles read as one panel in the world)
{ const plate = slab(1, .12, .08, new THREE.MeshBasicMaterial({ color: 0x0b0720 })); plate.scale.set(2.9, 8.2, 1); plate.rotation.y = -Math.PI / 2; plate.position.set(wallX + .32, 3.85, 0); scene.add(plate); }

  ['Assistant', 0x5a2bd8, (c) => { c.fillStyle = '#fff'; c.beginPath(); c.moveTo(0, -60); c.quadraticCurveTo(8, -8, 60, 0); c.quadraticCurveTo(8, 8, 0, 60); c.quadraticCurveTo(-8, 8, -60, 0); c.quadraticCurveTo(-8, -8, 0, -60); c.fill(); }],
  ['Coder', 0xc2246f, (c) => { c.strokeStyle = '#fff'; c.lineWidth = 16; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(-26, -44); c.lineTo(-62, 0); c.lineTo(-26, 44); c.moveTo(26, -44); c.lineTo(62, 0); c.lineTo(26, 44); c.stroke(); }],
  ['Agent', 0x1a7fd0, (c) => { c.fillStyle = '#fff'; rr(c, -56, -40, 112, 84, 22); c.fill(); c.fillStyle = '#2fb8ff'; [-24, 24].forEach((x) => { c.beginPath(); c.arc(x, -2, 12, 0, 7); c.fill(); }); c.fillStyle = '#fff'; c.fillRect(-4, -62, 8, 22); c.beginPath(); c.arc(0, -64, 9, 0, 7); c.fill(); }],
];
const clients = CL.map((a, i) => {
  const grp = new THREE.Group(); grp.rotation.y = -Math.PI / 2;
  const hex = '#' + new THREE.Color(a[1]).getHexString();
  grp.add(slab(1.9, .9, .4, new THREE.MeshPhysicalMaterial({ color: a[1], metalness: .2, roughness: .3, clearcoat: 1, clearcoatRoughness: .1, envMapIntensity: .55 })));

});

// ---------- cables: 24 amber (every client to every tile), then 3 + 8 green through one hub ----------
function mkCable(p0, p1, seed, color, gcolor, r, lift) {
  const R = rng(seed);
  const pts = [p0, V(lerp(p0.x, p1.x, .28), lerp(p0.y, p1.y, .2) + lift * (.4 + R()), lerp(p0.z, p1.z, .3) + (R() - .5) * 1.8),
    V(lerp(p0.x, p1.x, .66), lerp(p0.y, p1.y, .7) + lift * R() * .8, lerp(p0.z, p1.z, .7) + (R() - .5) * 1.6), p1];
  const curve = new THREE.CatmullRomCurve3(pts), N = 90, RAD = 8;
  const g = new THREE.TubeGeometry(curve, N, r, RAD, false);
  const core = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x1a0c04, emissive: color, emissiveIntensity: 1.0, roughness: .35, metalness: .3, transparent: true }));
  const glow = new THREE.Mesh(new THREE.TubeGeometry(curve, N, r * 2.9, 6, false), new THREE.MeshBasicMaterial({ color: gcolor, transparent: true, opacity: .13, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  const pk = new THREE.Mesh(new THREE.SphereGeometry(r * 2.1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false, transparent: true }));
  scene.add(core, glow, pk); core.frustumCulled = glow.frustumCulled = false;
  return { curve, core, glow, pk, per: N * RAD * 6, per2: N * 6 * 6, seed };
}
const tp = (t) => V(wallX - .35, rowsY[t.row], colsZ[t.col]);
const tangle = []; let ci = 0;

tiles.forEach((t, i) => hubCables.push(Object.assign(mkCable(V(HUB.x + 1.3, HUB.y - .3 + ((i % 4) - 1.5) * .22, HUB.z + (i % 2 ? .5 : -.5)), tp(t), 300 + i * 11, 0x42ff8c, 0x20ff70, .05, .6), { ci: 3 + i })));

hub.add(slab(2.2, 2.2, .5, new THREE.MeshPhysicalMaterial({ color: 0x4a1fd0, metalness: .25, roughness: .25, clearcoat: 1, clearcoatRoughness: .08, envMapIntensity: .6 })));
const hubFace = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 2.1), new THREE.MeshBasicMaterial({ map: ctex(512, 512, (c, w, h) => {
  c.translate(w / 2, h / 2); c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 14; c.lineCap = 'round';

const layers = [0x2fd6ff, 0x42ff8c, 0xffb62e].map((c, i) => { const m = slab(2.2, .2, .4, new THREE.MeshPhysicalMaterial({ color: c, metalness: .2, roughness: .2, clearcoat: 1, emissive: c, emissiveIntensity: .35 })); m.rotation.x = Math.PI / 2; m.rotation.z = 0; hub.add(m); return m; });

function captions(t) {
  let ci = -1; SC.forEach((s, i) => { if (t >= s.start - .05) ci = i; });

  const s = SC[ci], k = KEYS[ci], cur = s.words.findIndex((w) => t >= w.t0 && t < w.t1 + .12);

  while (i < s.words.length) {

    if (i === k[0]) {

// ---------- camera: one path through the one world ----------
const SHOTS = [   // [start, from pos, from look, to pos, to look]
  [0, [-18, 2.4, -4], [-5, 1.4, .2], [-15.5, 2.8, 1.8], [-5, 1.6, .4]],
  [T8 - .2, [-9, 4.2, -9], [6.4, 3.6, 0], [-4, 4.4, -7.2], [6.6, 3.8, .1]],
  [TCON - .1, [-15, 9.5, -3.5], [.8, 2.6, 0], [-12.5, 9.8, 4.5], [1.2, 2.8, 0]],
  [TADD - .1, [-10, 3.0, -7], [.2, 2.1, 0], [-8, 2.8, -5.6], [.2, 2.1, 0]],
  [T11 - .1, [-17, 4.6, -6.5], [1.5, 3.2, 0], [-20, 6.2, -2], [2.5, 3.6, 0]],

}

// ---------- the world at time t ----------
function world(t) {

  // amber tangle: draws on from "connect", fades when the shared standard arrives

    cb.core.material.emissiveIntensity = .9 + .35 * Math.sin(t * 3 + i) + (t > T24 ? .5 * Math.exp(-(t - T24) * 3) : 0);
    if (vis) cb.pk.position.copy(cb.curve.getPoint(((t * .6 + i * .137) % 1)));
  });

  layers.forEach((m, i) => { const u = eout(prog(t, TADD + .3 + i * .16, TADD + .9 + i * .16)); m.position.y = 1.25 + .06 + i * .3 + (1 - u) * 1.4 - 0; m.visible = u > 0; m.scale.setScalar(.88 + u * .12); });

  hubCables.forEach((cb, i) => { const u = ease(prog(t, TADD + .55 + i * .06, TADD + 1.1 + i * .06)); drawCable(cb, u); const vis = u > 0; cb.core.visible = cb.glow.visible = vis; cb.pk.visible = vis && u >= 1;
    if (vis) cb.pk.position.copy(cb.curve.getPoint(((t * .75 + i * .21) % 1))); cb.core.material.emissiveIntensity = 1.6 + .5 * Math.sin(t * 3.4 + i); });

  poolA.material.color.setHex(t > TADD + .5 ? 0x22ff80 : 0xff7a1a);

}

// ---------- foreground bokeh (soft, out of focus) ----------
const BOK = Array.from({ length: 9 }, (_, i) => { const R = rng(900 + i); return { x: R() * W, y: 300 + R() * 1500, r: 40 + R() * 90, v: (R() - .5) * 26, c: [[255, 150, 60], [138, 92, 255], [66, 255, 140], [47, 214, 255]][i % 4], a: .05 + R() * .07 }; });
