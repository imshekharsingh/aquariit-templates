     from t (no rAF, seeded randomness). One TV in a dark room; ink + white + cyan (the light) + amber (the myth, the verdict) only.
     Shots (one per spoken line, cut 0.2 s before the line):
       0 hero: a TV you can see through, its picture over a grid of lights, MYTH stamped | 1 the picture sheet lifts off: LCD |
       2 low macro across the board: the LEDs light in a wave | 3 the moon crosses the glass, only the zones under it are lit: ZONES |
       4 the bare board front-on, all 2,304 zones light in half a second (64 x 36, drawn to the count) | 5 one zone behind its 80 x 80
       pixels: a three-pixel star, a whole zone of light behind it: 6,400 | 6 the TV again, a spec card: ZONES? and back to frame 0.

  return 0;

const cSig = new THREE.Color(0xdff6ff), cOff = new THREE.Color(0x2a2616), cTmp = new THREE.Color();
function setZones(t, sh) {

    cTmp.copy(cOff).lerp(cSig, clamp(a)).multiplyScalar(sh === 2 ? .5 + .45 * a : sh === 5 ? 2.2 * a : .6 + .9 * a); colTop[n] = cTmp.r; colTop[n + 1] = cTmp.g; colTop[n + 2] = cTmp.b;

// ---------- camera per shot ----------
const G = KIT.glide;

  ledPad.visible = ledPkg.visible = sh !== 5;   // behind the pixels only the light itself shows ledCell.visible = sh !== 2;
  keyL.intensity = sh === 2 ? .8 : sh === 5 ? .12 : 2.3; rimL.intensity = sh === 2 ? 1.7 : sh === 5 ? .3 : 2.9; rim2L.intensity = sh === 2 ? 1.1 : sh === 5 ? .2 : 1.5;

// ---------- type: one bold word or number at a time (2D, screen space, the empty top band) ----------
let BOXES = []; window.__boxes = () => BOXES;
const big = (text, kind, color, t, t0, t1, opt = {}) => { const bx = KIT.word(o, text, kind, t, t0, t1, { color, ...opt }); if (bx) BOXES.push(bx); };
function typeLayer(t) {
  BOXES = [];
  const sh = shotAt(t);
  if (sh === 0) big('MYTH', 'stamp', HEATC, t, -.4, wEnd(1), { size: 270, y: 520, glow: 'rgba(255,150,40,.4)' });       // F5: the belief on the screen ("MINI LED" as a new screen), stamped in frame 0
  if (sh === 1) big('LCD', 'drop', WHITE, t, C.lcd, wEnd(2), { size: 280, y: 520 });
  if (sh === 2) big('LIGHTS', 'rise', SIGC, t, C.lights, wEnd(3), { size: 215, y: 500, glow: 'rgba(56,225,255,.45)' });
  if (sh === 3) big('ZONES', 'track', WHITE, t, C.zones3, wEnd(4), { size: 230, y: 510 });
  if (sh === 4) big('2,304', 'slam', SIGC, t, C.num, wEnd(5), { size: 270, y: 520, glow: 'rgba(56,225,255,.5)' });

    else big('MYTH', 'stamp', HEATC, t, LOOP1() - .1, TOTAL + 9, { size: 270, y: 520, glow: 'rgba(255,150,40,.4)' }); }    // the stamp returns on the verdict; the last frame is frame 0
}

const CHUNKS = []; SC.forEach((s, si) => { let cur = []; s.words.forEach((w, i) => { cur.push(w); const nx = s.words[i + 1], len = cur.map((x) => x.w).join(' ').length + (nx ? nx.w.length + 1 : 0);
    if (/[.,?!:]$/.test(w.w) || (cur.length >= 6 && !(nx && /[.,?!:]$/.test(nx.w))) || (len > 30 && !(nx && /[.,?!:]$/.test(nx.w))) || i === s.words.length - 1) { CHUNKS.push({ si, words: cur }); cur = []; } }); });
CHUNKS.forEach((c, i) => { c.t0 = c.words[0].t0; const nx = CHUNKS[i + 1]; c.t1 = nx && nx.si === c.si ? nx.words[0].t0 - .03 : c.words[c.words.length - 1].t1 + .35; });

const capEl = document.getElementById('caps'); let capIdx = -2;

  if (ci !== capIdx) { capIdx = ci; capEl.textContent = ci < 0 ? '' : CHUNKS[ci].words.map((w) => w.w).join(' '); }
  if (ci >= 0) { const p = eout(prog(t, CHUNKS[ci].t0 - .05, CHUNKS[ci].t0 + .15)); capEl.style.opacity = clamp(p * 1.5); capEl.style.transform = `translateY(${(1 - p) * 10}px)`; }
}

// ---------- the hero's box (Output QA HERO) ----------
let SUBJ = null; window.__subject = () => SUBJ;
function subjectBox(sh) {
  if (sh === 2 || sh === 5) { SUBJ = [60, 560, 1020, 1440]; return; }
  let l = 1e9, r = -1e9, tp = 1e9, b = -1e9;
  for (const x of [-TW / 2, TW / 2]) for (const y of [CY - TH / 2, CY + TH / 2]) { const p = V(x, y, 0).project(cam); const sx = (p.x + 1) / 2 * W, sy = (1 - p.y) / 2 * H; l = Math.min(l, sx); r = Math.max(r, sx); tp = Math.min(tp, sy); b = Math.max(b, sy); }
  SUBJ = [clamp(l, 0, W), clamp(tp, 0, H), clamp(r, 0, W), clamp(b, 0, H)];
}

// ---------- frame ----------
function post() {

  const bf = o.createLinearGradient(0, 1280, 0, 1920); bf.addColorStop(0, 'rgba(7,8,12,0)'); bf.addColorStop(.2, 'rgba(7,8,12,.34)'); bf.addColorStop(.3, 'rgba(7,8,12,.52)'); bf.addColorStop(.55, 'rgba(7,8,12,.6)'); bf.addColorStop(.93, 'rgba(7,8,12,.97)'); bf.addColorStop(1, 'rgba(7,8,12,1)'); o.fillStyle = bf; o.fillRect(0, 1280, W, H - 1280);
  const tf = o.createLinearGradient(0, 180, 0, 0); tf.addColorStop(0, 'rgba(7,8,12,0)'); tf.addColorStop(1, 'rgba(7,8,12,.6)'); o.fillStyle = tf; o.fillRect(0, 0, W, 180);

// the macro shots keep the top band dark for the word: a soft shade over the far part of the board
function shade(sh, a) { if ((sh !== 2 && sh !== 5) || a <= 0) return; const g = o.createLinearGradient(0, 200, 0, sh === 2 ? 760 : 640); g.addColorStop(0, `rgba(7,8,12,${(.92 * a).toFixed(3)})`); g.addColorStop(.55, `rgba(7,8,12,${(.8 * a).toFixed(3)})`); g.addColorStop(1, 'rgba(7,8,12,0)'); o.fillStyle = g; o.fillRect(0, 0, W, 780); }

const busy = (t, sh) => (sh === 1 && t < C.off + .5) || (sh === 4 && t > CNT0() - .05 && t < CNT1() + .3) || (sh === 6 && t < B[6] + .6);

    if (Math.hypot(b[0] - a[0], b[1] - a[1]) + Math.abs(Math.hypot(b[2] - b[0], b[3] - b[1]) / (Math.hypot(a[2] - a[0], a[3] - a[1]) || 1) - 1) * 1100 < 1.5) ctx.drawImage(TMP.canvas, 0, 0);
    else { SMR.globalAlpha = 1; SMR.fillStyle = '#07080c'; SMR.fillRect(0, 0, W, H); KIT.smear(SMR, TMP.canvas, a, b, W, H); ctx.drawImage(SMR.canvas, 0, 0); } }
  ctx.globalAlpha = 1;
}
window.render = (t) => {
  t = clamp(t, 0, TOTAL);
  const cu = cutAt(t), st = cu && KIT.cut(cu.kind, cu.u, cu), sh = shotAt(t);
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalAlpha = 1; o.filter = 'none'; o.fillStyle = '#07080c'; o.fillRect(0, 0, W, H);

  else {

  }

window.TRANSITIONS = [...[1, 2, 3, 4, 5, 6].map((k) => { const d = KIT.DUR[CUTS[k].kind]; return [+(B[k] - d / 2 - .1).toFixed(2), +(B[k] + d / 2 + (k === 1 || k === 4 ? 1.1 : .15)).toFixed(2), 'camera']; }), ...SHAKES().map(([t0]) => [+(t0 - .1).toFixed(2), +(t0 + .5).toFixed(2), 'jolt'])];

window.seek = window.render;
window.DUR = TOTAL;
window.render(0);
})();
