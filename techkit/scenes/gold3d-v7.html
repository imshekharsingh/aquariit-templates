<!-- 3D KIT SAMPLE v7, the last sample (26 Nov 2026; design/handoff.md task 10, rules-tech.md D9-D12; plan: review/tech/showreel-tech-gold3d-v7.md). Never posted.
     "3 apps x 8 tools = 24 cables; one hub = 11; a new tool = one more cable." Frame 0 has tension: the question on screen and Notes slamming in.
     Three big moments only (Notes' arrival, the tangle at its worst, the hub's arrival) with scale, overshoot and a light sweep; everything else
     enters quick and clean. Cables lie on the floor (never through it or through an object), run up the outside of the wall, end in plugs.
     The hub and the New tile stand on slim pillars. Numbers are flat, count, glide in and are tied to their object by a leader line.
     Every element, once in, stays alive (idle motion, a bump when its cable connects, a lean when the hub lands). window.render(t) is pure. -->

<script>
(() => {
const W = 1080, H = 1920, TL = window.TL, C = TL.cues, TOTAL = TL.total;
const { clamp, lerp } = W3D, prog = (t, a, b) => clamp((t - a) / (b - a));
const sm = (u) => (u = clamp(u), u * u * (3 - 2 * u)), ease = (u) => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const pulse = (t, at, w = .25) => Math.exp(-Math.pow((t - at) / w, 2));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const S = W3D.stage(THREE, { W, H });
S.dof.aperture = 2.4; S.dof.focusRange = 7; S.dof.maxR = 20; S.bloom = .12;
// light and grade (v6 measured: 8 of 46 frames had a pale floor, median luma over .40 at low angles): a darker floor, a weaker pool and stage glow
const world = W3D.world(S, { seed: 21, props: 36, radius: [14, 40], heroZone: 17, maxZ: -14, floor: 0x4c4f58, poolPower: .1, palette: [0x6b3cff, 0x16b8d6, 0xff4f8a, 0xffb62e, 0x2f7bff, 0x22c55e] });
world.floor.material.envMapIntensity = .1; world.floor.material.roughness = .93; world.floor.material.metalness = 0; if (world.glow) world.glow.visible = false;   // v7: a matte floor: at low angles the glossy floor caught the lights and read as a pale wash   // v7: no additive stage glow (it read as a pale floor at low angles)
// background props are matte (v7: a glossy prop lying on the floor caught the light and bloomed, GLOW peak at 8.5 s)
world.props.traverse((m) => { if (m.isMesh && m.material && 'roughness' in m.material) { m.material.roughness = Math.max(m.material.roughness, .75); if ('clearcoat' in m.material) m.material.clearcoat = 0; } });
const L = W3D.lib;

// ---------- the beats, all from the voice cues ----------
const A_IN = [0, 1.45, 2.25];                                         // Notes slams in at frame 0 (big moment 1), Chat and Mail quick and clean; all in by about 3 s
const T_IN = Math.max(3.4, C.tools - .35);                            // the tools cascade in on "eight tools"
const W1 = Math.max(T_IN + 1.7, C.wires - .1), W1_END = W1 + 1.4;     // the first cable: unrolls along the floor, up the wall, the plug clicks in
const CASC = [W1_END + .1, Math.max(W1_END + 1.3, C.twenty - .35)];    // the other 23 follow as a fast cascade, done on "twenty four"
const WORST = CASC[1] + .2;                                           // big moment 2: the tangle at its worst
const HUB_IN = Math.max(C.hub - .35, WORST + 1.5), COLLAPSE = [HUB_IN + .9, HUB_IN + 1.7], HUBW = [HUB_IN + 1.6, Math.max(HUB_IN + 2.6, C.eleven + .3)];   // big moment 3
const NEW_IN = Math.max(C.newt, HUBW[1] + 1.2), NEW_W = [NEW_IN + .45, NEW_IN + 1.2];
const PAY = C.same + .4;                                              // the payoff wide; 3+9=12 lands here

// ---------- the cast ----------
const APPS = [{ n: 'Notes', c: 0x16b8d6, g: 'notes', e: 'slam', s: -1, amp: .4 }, { n: 'Chat', c: 0xff4f8a, g: 'chat', e: 'rise', s: 1, amp: .5 }, { n: 'Mail', c: 0xffb62e, g: 'mail', e: 'slideTurn', s: 1, amp: .45 }];
const TOOLS = [['Pay', 0x6b3cff, 'pay', 'pop', -1], ['Photos', 0xe0449a, 'photos', 'rise', 1], ['Files', 0x2f7bff, 'files', 'slideTurn', -1], ['Maps', 0x1fb86a, 'maps', 'pop', 1],
  ['Calendar', 0xff6a3c, 'calendar', 'rise', -1], ['Docs', 0x7a4cff, 'files', 'slideTurn', 1], ['Tasks', 0x1294d6, 'tasks', 'pop', -1], ['Music', 0xd9a21b, 'music', 'rise', 1]];
const WALL_Y = 2.3, WALL_Z = -6.5, HUB_P = V(0, 1.25, -2.2), NEW_P = [2.85, HUB_P.y - .05, -1.7], R = .04, FL = R + .006;
const AX = (i) => (i - 1) * 1.88, TX = (j) => (j % 2 - .5) * 2.2, TY = (j) => WALL_Y + Math.floor(j / 2) * 1.45, SIDE = (j) => (j % 2 ? 1 : -1);
const EDGE = (j, k = 1, n = 3) => [TX(j) + SIDE(j) * .71, TY(j) + .65 + (k - (n - 1) / 2) * .2, WALL_Z];
const apps = APPS.map((a, i) => { const g = L.appTile(THREE, { size: 1.7, color: a.c, glyph: L.appGlyphs[a.g], name: a.n, label: 'inside' }); g.position.set(AX(i), 0, 2); S.scene.add(g); return g; });
const tools = TOOLS.map((t, i) => { const g = L.appTile(THREE, { size: 1.3, color: t[1], glyph: L.appGlyphs[t[2]], name: t[0], label: 'inside' }); g.position.set(TX(i), TY(i), WALL_Z); S.scene.add(g); return g; });
// the wall stands on a dark frame (the tools are not floating): two posts and a back panel
const frameMat = new THREE.MeshStandardMaterial({ color: 0x1b1d26, roughness: .55, metalness: .3 });
const wall = new THREE.Group(); [-1, 1].forEach((sx) => { const post = new THREE.Mesh(new THREE.BoxGeometry(.12, WALL_Y + 4 * 1.45, .12), frameMat); post.position.set(sx * 1.98, (WALL_Y + 4 * 1.45) / 2, WALL_Z - .32); wall.add(post); });
const panel = new THREE.Mesh(new THREE.BoxGeometry(3.9, 4 * 1.45 + .2, .06), frameMat); panel.position.set(0, WALL_Y + 2 * 1.45 - .1, WALL_Z - .36); wall.add(panel); S.scene.add(wall);
// pillars: the hub and the New tile stand on them
const pillar = (h, w) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(w, w * 1.15, h, 24), frameMat); m.position.y = -h / 2; return m; };
const hub = L.productBlock(THREE, { w: 2.6, d: 1.5, h: 1.05, color: 0x4a14c8, name: 'HUB', led: true }); hub.add(pillar(HUB_P.y, .32)); hub.position.copy(HUB_P); S.scene.add(hub);
const newTool = L.appTile(THREE, { size: 1.2, color: 0x00c2a8, glyph: L.appGlyphs.spark, name: 'New', label: 'inside' }); newTool.add(pillar(NEW_P[1], .14)); newTool.position.set(...NEW_P); S.scene.add(newTool);

// ---------- wires (D12, task 10 point 1): out of the app's back, down to the floor, along it, up the outside of the wall, into the tile's side edge ----------
const appPlug = (i, j) => [AX(i) + (j - 3.5) * .16, .3, 1.76];
const tangle = [];
APPS.forEach((a, i) => TOOLS.forEach((t, j) => { const k = i * 8 + j, p0 = appPlug(i, j), e = EDGE(j, i), sx = SIDE(j) * (2.25 + .1 * i + .035 * j), jit = ((k * 37) % 11) / 11 - .5, lift = FL + (k % 4) * .012;
  const jit2 = ((k * 53 + 7) % 13) / 13 - .5, wob = SIDE(j) * -1.1 * (i - 1) + jit * 1.6;   // change 4: cables swing across each other on the floor (an S-curve each, crossing the others)
  const pts = [p0, [p0[0] * .97, lift, 1.42], [p0[0] + wob, lift, .3 + jit * .6], [lerp(p0[0], sx, .55) - wob * .8 + jit2 * 1.2, lift, -1.6 + jit2 * .6], [lerp(p0[0], sx, .85) + jit2 * .7, lift, -3.9 + jit * .4], [sx, lift, -5.85], [sx, lift + .02, -6.42],
    [sx, e[1] * .5, -6.5], [sx, e[1] - .08, -6.5], [e[0] + SIDE(j) * .16, e[1], WALL_Z], e];
  for (const q of pts) { const dx = q[0] - HUB_P.x, dz = q[2] - HUB_P.z, d = Math.hypot(dx, dz); if (q[1] < .2 && d < 1.05) { const f = 1.05 / Math.max(d, .01); q[0] = HUB_P.x + (d < .01 ? SIDE(j) : dx) * f; q[2] = HUB_P.z + dz * f; } }   // keep clear of the hub's pillar
  for (let n = 0; n < pts.length - 1; n++) { const A = pts[n], B = pts[n + 1]; if (A[1] > .2 || B[1] > .2) continue;   // a floor segment that passes the pillar gets a point beside it
    const vx = B[0] - A[0], vz = B[2] - A[2], L2 = vx * vx + vz * vz || 1, u = clamp(((HUB_P.x - A[0]) * vx + (HUB_P.z - A[2]) * vz) / L2), cx = A[0] + vx * u, cz = A[2] + vz * u;
    if (Math.hypot(cx - HUB_P.x, cz - HUB_P.z) < 1.25) { const sg = Math.abs(cx) > .05 ? Math.sign(cx) : SIDE(j); pts.splice(n + 1, 0, [HUB_P.x + sg * 1.35, A[1], HUB_P.z]); n++; } }
  // the dense path: every low point kept at least 1.0 from the pillar's axis, so the cable bends round it instead of through it
  const dense = new THREE.CatmullRomCurve3(pts.map((q) => V(...q)), false, 'centripetal').getSpacedPoints(220).map((q) => { const dx = q.x - HUB_P.x, dz = q.z - HUB_P.z, d = Math.hypot(dx, dz);
    if (q.y < .35 && d < 1.0) { const f = 1.0 / Math.max(d, .01); q.x = HUB_P.x + (d < .01 ? SIDE(j) * .01 : dx) * f; q.z = HUB_P.z + dz * f; } return q; });
  tangle.push({ w: W3D.wire(S, dense, { color: a.c, radius: R, curve: 'catmullrom', tension: 0, floorY: 0, segments: 180, tone: .52 }), i, j, k }); }));
const hubW = [];
APPS.forEach((a, i) => { const p0 = appPlug(i, 3.5), x1 = AX(i) * .3;
  hubW.push({ w: W3D.wire(S, [p0, [p0[0] * .95, FL, 1.4], [lerp(p0[0], x1, .6), FL, .2], [x1, FL, HUB_P.z + 1.0], [x1, HUB_P.y - .2, HUB_P.z + .8], [x1, HUB_P.y + .22, HUB_P.z + .76]], { color: 0x2fd27a, radius: .05, curve: 'centripetal', floorY: 0, segments: 140 }), k: i }); });
TOOLS.forEach((t, j) => { const e = EDGE(j), sx = SIDE(j) * (2.3 + .05 * j), x0 = SIDE(j) * (.25 + .12 * Math.floor(j / 2));
  hubW.push({ w: W3D.wire(S, [[x0, HUB_P.y + .25, HUB_P.z - .76], [x0, HUB_P.y - .3, HUB_P.z - .85], [x0 * 1.4, FL, HUB_P.z - 1.15], [lerp(x0, sx, .6), FL, -4.6], [sx, FL + .02, -6.42], [sx, e[1] * .5, -6.5], [sx, e[1] - .08, -6.5], [e[0] + SIDE(j) * .16, e[1], WALL_Z], e], { color: 0x2fd27a, radius: .05, curve: 'centripetal', floorY: 0, segments: 160 }), k: 3 + j }); });
const newW = W3D.wire(S, [[1.3, HUB_P.y + .35, HUB_P.z + .3], [1.5, HUB_P.y - .15, HUB_P.z + .3], [2.0, FL, -1.95], [NEW_P[0] - .3, FL, NEW_P[2] + .3], [NEW_P[0] - .62, NEW_P[1] - .4, NEW_P[2] + .05], [NEW_P[0] - .62, NEW_P[1] + .45, NEW_P[2]]], { color: 0x2fd27a, radius: .05, curve: 'centripetal', floorY: 0, segments: 120 });

// ---------- light sweeps for the three big moments: a warm point light that crosses the subject once ----------
const sweep = new THREE.PointLight(0xfff1dc, 0, 4.2, 2); S.scene.add(sweep);
const SWEEPS = [{ t: .62, a: [-3.4, 1.8, 3.4], b: [-.4, 1.4, 3.4] }, { t: WORST, a: [-3.5, 1.2, -1], b: [3.5, 1.2, -4] }, { t: HUB_IN + .62, a: [-2.4, 2.6, -.6], b: [2.4, 2.4, -.6] }];

// ---------- numbers: flat, counting, a leader line to what they are about ----------
const NUM = W3D.numbers({ y: 1540 }); let LAST_NUM = null;
const NUM_AT = { n24: [190, 700], n11: [180, 940], n12: [890, 700] };   // block centres (px), beside the object, in empty space
const anchorOf = (v3) => { const p = v3.clone().project(S.cam); return p.z < 1 ? [(p.x * .5 + .5) * W, (-p.y * .5 + .5) * H] : null; };

const shadows = [...apps.map((m) => W3D.contactShadow(S, m, { w: 2.4, d: .6, strength: .9 })), W3D.contactShadow(S, hub, { w: 1.4, d: 1.4, rest: 0, strength: .7 }), W3D.contactShadow(S, newTool, { w: .8, d: .8, rest: 0, strength: .6 })];

// ---------- captions ----------
const KEYS = [[4, 4], [3, 4], [4, 5], [2, 3], [8, 8], [4, 6], [5, 6]];
const cap = W3D.captions({ y: 190, size: 60, lines: TL.scenes.map((s, i) => ({ t0: i === 0 ? -.2 : s.start, t1: i === TL.scenes.length - 1 ? TOTAL + 1 : s.end, words: s.words.map((w) => w.w), times: s.words.map((w) => w.t0), keyIdx: KEYS[i] })) });
const CAPBAND = [60, 150, 1020, 420];

// ---------- camera: one shot per beat, each with a reason; never the same move type twice in a row (plan: review/tech/showreel-tech-gold3d-v7.md) ----------
const START = { pos: [-5.5, 2.1, 9.6], look: [-1.88, .95, 2], fov: 42 };   // change 1: Notes whole in frame (about 46 % of the width once landed), the dark floor around it
const SH = [
  { t: 0, ...START, mv: 'hold' },                                                             // 1 frame 0: Notes slams in, close and low (the first big moment)
  { t: A_IN[2] + .5, pos: [0, 3.4, 15.2], look: [0, .95, 2], fov: 44, mv: 'pull-back' },   // change 2: all three whole by 3.0 s     // 2 Chat and Mail join: pull back to see the three side by side
  { t: T_IN + .9, pos: [.3, 5.3, 3.0], look: [0, 5.0, -6.5], fov: 50, mv: 'crane-up' },   // change 3: the wall fills about 70 % of the width; the apps are below the frame        // 3 the tools arrive on the wall: crane up to it
  { t: W1 + .5, pos: [-5.0, 2.4, -3.8], look: [-1.75, 2.9, -6.45], fov: 42, mv: 'dolly-in' },  // 4 the first plug clicks in: close, low, on the plug
  { t: CASC[0] + .9, pos: [-6.2, 4.6, 6.6], look: [0, 1.4, -3.4], fov: 50, mv: 'arc' },         // 5 the tangle grows on the floor: a high arc over it
  { t: WORST, pos: [.6, 4.6, 2.9], look: [0, .1, -3.2], fov: 56, mv: 'pull-back' },   // change 4: from behind the apps, looking down: the tangle on the floor fills the width   // change 4: low and close, the tangle fills the width   // 6 the tangle at its worst (big moment 2): the whole picture, 24
  { t: HUB_IN + .6, pos: [3.8, 2.8, 6.8], look: [0, 1.8, -2.2], fov: 46, mv: 'truck-in' },     // 7 the hub lands (big moment 3): low three-quarter
  { t: COLLAPSE[1] + .3, pos: [0, 7.4, 16.6], look: [0, 2.6, -3.0], fov: 52, mv: 'crane-up' }, // 8 the 24 collapse and 11 unroll: high wide
  { t: C.eleven + .6, pos: [-1.4, 6.2, 17.0], look: [0, 2.7, -3.1], fov: 52, mv: 'orbit' },     // 9 the clean picture, 11
  { t: NEW_IN + .05, pos: [3.9, 3.2, 4.6], look: [2.75, 1.3, -1.7], fov: 42, mv: 'truck' },   // change 6: New is the subject (about 40 % of the width), the hub at the edge      // 10 the new tool and its one cable
  { t: PAY, pos: [0, 6.5, 17.0], look: [0, 2.8, -3.2], fov: 52, mv: 'pull-back' },             // 11 the payoff wide: 12
  { t: TOTAL - 1.9, pos: [-8.7, 6.0, 15.5], look: [0, 2.8, -3.2], fov: 52, mv: 'arc' },   // change 7: a 25 degree arc from about 19 s, then the dolly home      // 12 a small turn
  { t: TOTAL, ...START, mv: 'dolly-in' },                                                      // 13 home to the first frame (the loop)
];
for (let k = 1; k < SH.length - 1; k++) SH[k].t = Math.min(Math.max(SH[k].t, SH[k - 1].t + .9), SH[SH.length - 1].t - (SH.length - 1 - k) * .9);
const VA = (a) => new THREE.Vector3(...a);
function camAt(t) {
  let i = 0; while (i < SH.length - 2 && t >= SH[i + 1].t) i++;
  const a = SH[i], b = SH[i + 1], gap = b.t - a.t, dur = Math.min(2.0, gap * .72), ms = b.t - dur;
  const u = sm(prog(t, ms, b.t)), hold = prog(t, a.t, ms);
  const drift = (k) => VA(k.pos).lerp(VA(k.look), .025 * hold);
  const pos = drift(a).lerp(VA(b.pos), u), look = VA(a.look).lerp(VA(b.look), u), fov = lerp(a.fov, b.fov, u);
  S.cam.position.copy(pos); if (S.cam.fov !== fov) { S.cam.fov = fov; S.cam.updateProjectionMatrix(); } S.cam.lookAt(look); S.cam.updateMatrixWorld(); return { pos, look, fov };
}

// when each tool's (and each app's) first cable lands: they bump once (they react)
const landT = (k) => (k === 0 ? W1 + 1.0 : lerp(CASC[0], CASC[1] - .55, (k - 1) / 22) + .55);
const focus = V(0, 1.6, -3); S.focus = focus;
function frame(t) {
  const p = camAt(t); focus.copy(p.look);
  if (t < 1.3) { apps[0].updateMatrixWorld(true); const np = new THREE.Box3().setFromObject(apps[0]).getCenter(new THREE.Vector3()); focus.lerp(np, 1 - prog(t, 1.0, 1.3)); }   // change 1: Notes sharp while it slams in
  const lean = pulse(t, HUB_IN + .75, .35) * .07;                     // everything shifts once when the hub lands
  apps.forEach((m, i) => { const d = APPS[i].e === 'slam' ? 1.0 : .5, inn = ease(prog(t, A_IN[i], A_IN[i] + d)); W3D.enter(m, APPS[i].e, APPS[i].e === 'slam' ? prog(t, A_IN[i], A_IN[i] + d) : inn, { side: APPS[i].s, amp: APPS[i].amp });
    if (inn >= 1) { const bump = Math.max(...TOOLS.map((_, j) => pulse(t, landT(i * 8 + j), .12))) * .05; m.position.y += Math.sin(t * 1.3 + i * 2) * .05; m.rotation.z = Math.sin(t * .9 + i) * .03; m.rotation.y = Math.sin(t * .6 + i * 1.7) * .05; m.rotation.x = -lean; m.scale.setScalar(1 + bump); } });
  tools.forEach((m, j) => { const t0 = T_IN + j * .14, inn = ease(prog(t, t0, t0 + .45)); W3D.enter(m, TOOLS[j][3], inn, { side: TOOLS[j][4], amp: .35 });
    if (inn >= 1) { const bump = Math.max(pulse(t, landT(j), .12), pulse(t, landT(8 + j), .12), pulse(t, landT(16 + j), .12), pulse(t, HUBW[0] + (3 + j) * ((HUBW[1] - HUBW[0] - .5) / 10) + .5, .12)) * .06;
      m.scale.setScalar(1 + bump + .012 * Math.sin(t * 1.7 + j)); m.rotation.y = Math.sin(t * .7 + j * 1.3) * .06; m.rotation.x = lean * .8; } });
  tangle.forEach((q) => { const u = q.k === 0 ? ease(prog(t, W1, W1 + 1.0)) : ease(prog(t, landT(q.k) - .55, landT(q.k)));
    const ret = ease(prog(t, COLLAPSE[0] + q.k * .012, COLLAPSE[0] + .5 + q.k * .012)); q.w.reveal(u * (1 - ret));
    const pk = prog(t, landT(q.k), landT(q.k) + (q.k === 0 ? .6 : .35)), pw = prog(t, WORST - .1 + q.k * .02, WORST + .35 + q.k * .02);
    q.w.pulse(Math.max(pk, pw), t, q.k === 0 && pk > 0 && pk < 1 ? 1 : .25); });   // only the first cable's pulse carries a bead; the cascade and the sweep are soft   // big moment 2: one light sweep along all 24
  // the hub: big moment 3 (falls a short way, scale overshoot, lands, light sweep); opaque from its first frame
  W3D.enter(hub, 'slam', prog(t, HUB_IN, HUB_IN + .85), { amp: .5 }); if (prog(t, HUB_IN, HUB_IN + .85) >= 1) hub.position.y = HUB_P.y + Math.sin(t * 1.1) * .02;
  hubW.forEach((q) => { const s0 = HUBW[0] + q.k * ((HUBW[1] - HUBW[0] - .5) / 10); q.w.reveal(ease(prog(t, s0, s0 + .5))); q.w.pulse(Math.max(prog(t, s0 + .5, s0 + .85), prog(t, PAY + 1.6 + q.k * .03, PAY + 2.0 + q.k * .03)), t, prog(t, PAY + 1.6 + q.k * .03, PAY + 2.0 + q.k * .03) > 0 ? .45 : 1); });
  W3D.enter(newTool, 'pop', ease(prog(t, NEW_IN, NEW_IN + .45)), { side: 1 }); if (newTool.visible && t > NEW_IN + .45) newTool.rotation.y = Math.sin(t * .8) * .04;
  newW.reveal(ease(prog(t, NEW_W[0], NEW_W[1]))); newW.pulse(Math.max(prog(t, NEW_W[1], NEW_W[1] + .6), prog(t, TOTAL - 1.3, TOTAL - .7)));
  // light sweeps
  let sw = 0; SWEEPS.forEach((s) => { const k = prog(t, s.t - .35, s.t + .55); if (k > 0 && k < 1) { sw = Math.sin(Math.PI * k); sweep.position.copy(VA(s.a).lerp(VA(s.b), k)); } }); sweep.intensity = 2.2 * sw;
