<!-- 3D KIT SAMPLE v7, the last sample, render 3 build (27 Nov 2026; design/handoff.md task 10; the upgrade critic's 15-item list in review/tech/showreel-tech-gold3d-v7.md).
     "3 apps x 8 tools = 24 cables; one hub = 11; a new tool = one more cable." Frame 0: the question and Notes already slamming in, in frame.
     The apps arrive as a chain (shadow first); the floor grid draws outward from Notes; the board builds itself (outline, panel, slots, edge light) and the
     8 tools stack onto it as one flow along an S path; the first cable plugs in; the 23 cascade; the problem breaks (red crossings, a half-pulled plug with a
     spark, Pay flickers, the 24 flashes red); a whip pan to the hub, whose landing flips the light from cold to warm and sends a ring across the floor;
     the 24 retract in one wave while the counter ticks down, the 11 fan out of the hub; New pops in; the payoff; home to frame 0 in frame 0's light.
     Numbers: one fixed spot, typed top line, odometer count, a shrinking bar, a leader to the object. One big headline word per beat.
     Cables never pass through the floor or an object (techkit/check-wires.cjs). window.render(t) is a pure function of t. -->

<script>
(() => {
const W = 1080, H = 1920, TL = window.TL, C = TL.cues, TOTAL = TL.total;
const { clamp, lerp } = W3D, prog = (t, a, b) => clamp((t - a) / (b - a));
const sm = (u) => (u = clamp(u), u * u * (3 - 2 * u)), ease = (u) => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const eout = (u) => 1 - Math.pow(1 - clamp(u), 3), eback = (u, c = 1.6) => { u = clamp(u); return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const pulse = (t, at, w = .25) => Math.exp(-Math.pow((t - at) / w, 2));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const S = W3D.stage(THREE, { W, H, ink: 0x0a0a0b, haze: 0x19191c })   // neutral blacks: the empty background reads dark, not blue (no colour cut when the near apps leave the frame edge);
S.dof.aperture = 2.4; S.dof.focusRange = 7; S.dof.maxR = 20; S.bloom = .12;
const world = W3D.world(S, { sky: ['#0e0e10', '#151517'], seed: 21, props: 36, radius: [14, 40], heroZone: 17, maxZ: -14, floor: 0x4e4e50, poolPower: .1, palette: [0x6b3cff, 0x16b8d6, 0xff4f8a, 0xffb62e, 0x2f7bff, 0x22c55e] });
world.floor.material.envMapIntensity = .1; world.floor.material.roughness = .93; world.floor.material.metalness = 0; if (world.glow) world.glow.visible = false;   // a matte floor (a glossy one read as a pale wash at low angles)
world.props.visible = false;   // fix 5 (U5): no background props (they read as clutter, not world)
const L = W3D.lib;

// ---------- the beats, from the voice cues ----------
const A_IN = [-.5, .8, 1.2];                                        // fix 4: a chain: Notes is already slamming in at frame 0 (lands at .35; started a little earlier so frame 0's label sits below the subtitle fade and reads), Chat launches off it, Mail is pushed by Chat
const BOARD = 2.6, T_IN = 4.0;   // render 4 critic fix 2: the board's frame is in view by 3.0 s                                        // fix 1: the board builds 3.0-3.9; fix 2: the tools stack 4.0-5.3 on "eight tools"
const ORDER = [6, 4, 2, 0, 1, 3, 5, 7], STEP = .15;                   // an S path: down the left column, up the right
const W1 = Math.max(T_IN + 1.6, C.wires - .1), W1_END = W1 + 1.4;
const CASC = [W1_END + 1.5, Math.max(W1_END + 2.7, C.twenty - .35)];   // r4 glitch screen: the move to the high wide now runs 1.3 s after the first plug's click; the cascade starts once it is still   // render 4 critic fix 1: the cascade starts once the camera has reached the still high wide
const WORST = CASC[1] + .2, BREAK = WORST + .6;                       // fix 6: the problem breaks at BREAK
const PAN = Math.max(C.hub + .1, WORST + 1.34), HUB_IN = PAN, HUB_D = 1.4, LAND = HUB_IN + .7 * HUB_D;   // the camera arrives on the empty spot first, then the hub drops in (a moving camera over a moving hub strobed)   // the drop lasts 0.7 s (slow enough that no part of the frame flashes past in one frame)
const COLLAPSE = [LAND + .2, LAND + .2 + 24 * .04 + .25], HUBW = [COLLAPSE[1] - .05, COLLAPSE[1] + .7];   // fix 10: one wave out, then the 11 fan out
const NEW_IN = Math.max(C.newt, HUBW[1] + .5), NEW_W = [NEW_IN + .45, NEW_IN + 2.4];   // the New cable grows slowly (its tip swept past the close camera)
const PAY = C.same + .4;

// ---------- the cast ----------
const TILT = +(window.__TILT ?? .15);   // plan critic item 4: Notes leans back less while it slams in, so frame 0 reads "Notes" (the label faced the key light)
const APPS = [{ n: 'Notes', c: 0x16b8d6, g: 'notes', e: 'slam', s: -1, amp: .4, d: 1.4, tilt: TILT }, { n: 'Chat', c: 0xff4f8a, g: 'chat', e: 'rise', s: 1, amp: .5, d: .5 }, { n: 'Mail', c: 0xffb62e, g: 'mail', e: 'slideTurn', s: 1, amp: .45, d: .5 }];
const TOOLS = [['Pay', 0x6b3cff, 'pay'], ['Photos', 0xe0449a, 'photos'], ['Files', 0x2f7bff, 'files'], ['Maps', 0x1fb86a, 'maps'], ['Calendar', 0xff6a3c, 'calendar'], ['Docs', 0x7a4cff, 'files'], ['Tasks', 0x1294d6, 'tasks'], ['Music', 0xd9a21b, 'music']];
const WALL_Y = 2.3, WALL_Z = -6.5, HUB_P = V(0, 1.25, -2.2), NEW_P = [2.85, HUB_P.y - .05, -1.7], R = .048, FL = R + .006;
const AX = (i) => (i - 1) * 1.88, TX = (j) => (j % 2 - .5) * 2.2, TY = (j) => WALL_Y + Math.floor(j / 2) * 1.45, SIDE = (j) => (j % 2 ? 1 : -1);
const EDGE = (j, k = 1, n = 3) => [TX(j) + SIDE(j) * .71, TY(j) + .65 + (k - (n - 1) / 2) * .2, WALL_Z];
const apps = APPS.map((a, i) => { const g = L.appTile(THREE, { size: 1.7, color: a.c, glyph: L.appGlyphs[a.g], name: a.n, label: 'inside' }); g.position.set(AX(i), 0, 2); S.scene.add(g); return g; });
const tools = TOOLS.map((t, i) => { const g = L.appTile(THREE, { size: 1.3, color: t[1], glyph: L.appGlyphs[t[2]], name: t[0], label: 'inside' }); g.position.set(TX(i), TY(i), WALL_Z); S.scene.add(g); return g; });
const toolBody = tools.map((g) => g.children[0]), toolCol = toolBody.map((m) => m.material.color.clone());
// ---------- fix 1-3: the board builds itself and stays alive ----------
const frameMat = new THREE.MeshStandardMaterial({ color: 0x232634, roughness: .6, metalness: .3, emissive: new THREE.Color(0x07080c) });   // a lighter panel: it reads as soon as it rises (render 3: the near-black board vanished into the background at 3.0 s)
const BW_ = 3.9, BH_ = 4 * 1.45 + .2, BY = WALL_Y + 2 * 1.45 - .1, BZ = WALL_Z - .36;
const wall = new THREE.Group(); S.scene.add(wall);
[-1, 1].forEach((sx) => { const post = new THREE.Mesh(new THREE.BoxGeometry(.12, WALL_Y + 4 * 1.45, .12), frameMat); post.position.set(sx * 1.98, (WALL_Y + 4 * 1.45) / 2, WALL_Z - .32); wall.add(post); });
const panel = new THREE.Mesh(new THREE.BoxGeometry(BW_, BH_, .06), frameMat); panel.position.set(0, BY, BZ); wall.add(panel);
const slots = tools.map((m, j) => { const mat = new THREE.MeshStandardMaterial({ color: 0x121319, roughness: .6, metalness: .2, emissive: new THREE.Color(TOOLS[j][1]), emissiveIntensity: 0 });
  const p = new THREE.Mesh(new THREE.BoxGeometry(1.42, 1.42, .04), mat); p.position.set(TX(j), TY(j) + .65, BZ + .05); wall.add(p); return p; });
const edgeMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(.55, .75, 1.0), toneMapped: false, transparent: true, opacity: .0 });
const edgeLines = [[0, BY + BH_ / 2, BW_, .03], [0, BY - BH_ / 2, BW_, .03], [-BW_ / 2, BY, .03, BH_], [BW_ / 2, BY, .03, BH_]].map(([x, y, w, h]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, .02), edgeMat); m.position.set(x, y, BZ + .04); wall.add(m); return m; });
const bead = new THREE.Mesh(new THREE.SphereGeometry(.06, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 2.0, 2.6), toneMapped: false })); bead.visible = false; S.scene.add(bead);
const perim = (u) => { const P = [[-BW_ / 2, BY + BH_ / 2], [BW_ / 2, BY + BH_ / 2], [BW_ / 2, BY - BH_ / 2], [-BW_ / 2, BY - BH_ / 2], [-BW_ / 2, BY + BH_ / 2]], seg = [BW_, BH_, BW_, BH_], tot = 2 * (BW_ + BH_);
  let d = clamp(u) * tot; for (let i = 0; i < 4; i++) { if (d <= seg[i]) { const f = d / seg[i]; return V(lerp(P[i][0], P[i + 1][0], f), lerp(P[i][1], P[i + 1][1], f), BZ + .06); } d -= seg[i]; } return V(P[4][0], P[4][1], BZ + .06); };
// the outline on the floor that the board rises out of
const fMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(.5, .7, 1.0), toneMapped: false, transparent: true, opacity: 0 });
const fLines = [[0, WALL_Z - .65, BW_ + .2, .03], [BW_ / 2 + .1, WALL_Z - .35, .03, .6], [0, WALL_Z - .05, BW_ + .2, .03], [-BW_ / 2 - .1, WALL_Z - .35, .03, .6]].map(([x, z, w, d]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, .004, d), fMat); m.position.set(x, .004, z); S.scene.add(m); return m; });
// pillars: the hub and the New tile stand on them
const pillar = (h, w) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(w, w * 1.15, h, 24), frameMat); m.position.y = -h / 2; return m; };
const hub = L.productBlock(THREE, { w: 2.6, d: 1.5, h: 1.05, color: 0x4a14c8, name: 'HUB', led: true }); hub.add(pillar(HUB_P.y, .32)); hub.position.copy(HUB_P); S.scene.add(hub);
// fix 12 (U11): 11 port LEDs on the hub's face light as the green cables plug in
const leds = Array.from({ length: 11 }, (_, k) => { const m = new THREE.Mesh(new THREE.BoxGeometry(.11, .05, .02), new THREE.MeshBasicMaterial({ color: new THREE.Color(.05, .12, .08), toneMapped: false })); m.position.set(-1.0 + k * .2, .33, .76); hub.add(m); return m; });
const newTool = L.appTile(THREE, { size: 1.2, color: 0x00c2a8, glyph: L.appGlyphs.spark, name: 'New', label: 'inside' }); newTool.add(pillar(NEW_P[1], .14)); newTool.position.set(...NEW_P); S.scene.add(newTool);
const HUBMATS = []; hub.traverse((m) => { if (m.isMesh && m.material) { m.material = m.material.clone(); HUBMATS.push(m.material);   /* its own copies: the pillar shared the board's material, so the fade hid the board too */ m.material.transparent = true; if (m !== hub.children[0]) m.renderOrder = 1; } });   // always see-through (at full opacity once in): switching it mid-reel changed its look for a frame   // the label, strip and LEDs draw after the body
hub.traverse((m) => { if (m.isMesh && m.material && m.material.isMeshBasicMaterial && m.material.color && m.material.color.g > 2) { m.scale.y = 2.2; m.material.color.multiplyScalar(.45); } });   // the hub's status strip: wider and softer (a thin, very bright line twinkled in fast moves)
[hub, newTool, ...apps, ...tools].forEach((g) => g.traverse((m) => { if (m.isMesh && m.material && m.material.roughness != null) { m.material.roughness = Math.max(m.material.roughness, .5); if (m.material.clearcoat) { m.material.clearcoat *= .4; m.material.clearcoatRoughness = Math.max(m.material.clearcoatRoughness || 0, .6); } } }));   // satin finishes: bevels no longer glint for one frame as things move

// ---------- fix 5 / 9 (U5): the floor grid draws outward from Notes; at the hub's landing a ring runs across it ----------
const FU = { uR: { value: 0 }, uC: { value: V(AX(0), 0, 2) }, uW: { value: 0 }, uHC: { value: V(HUB_P.x, 0, HUB_P.z) } };
world.floor.material.onBeforeCompile = (sh) => { Object.assign(sh.uniforms, FU);
  sh.vertexShader = 'varying vec3 vWP;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
  sh.fragmentShader = 'uniform float uR; uniform vec3 uC; uniform float uW; uniform vec3 uHC; varying vec3 vWP;\n' + sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
    { vec3 base = texture2D(map, vec2(.3, .3)).rgb * diffuse; float d = distance(vWP.xz, uC.xz); float show = 1.0 - smoothstep(uR - 2.0, uR, d);
      diffuseColor.rgb = mix(base, diffuseColor.rgb, show);
      float dh = distance(vWP.xz, uHC.xz); float ring = uW > .01 ? exp(-pow((dh - uW) / .5, 2.0)) * (1.0 - smoothstep(10.0, 16.0, uW)) : 0.0;
      diffuseColor.rgb += max(diffuseColor.rgb - base, vec3(0.0)) * ring * 3.0; }`); };
world.floor.material.needsUpdate = true;

// ---------- wires: out of the app's back, down to the floor, along it, up the outside of the wall, into the tile's side edge ----------
const appPlug = (i, j) => [AX(i) + (j - 3.5) * .16, .3, 1.76];
const tangle = [];
APPS.forEach((a, i) => TOOLS.forEach((t, j) => { const k = i * 8 + j, p0 = appPlug(i, j), e = EDGE(j, i), sx = SIDE(j) * (2.25 + .1 * i + .035 * j), jit = ((k * 37) % 11) / 11 - .5, lift = FL + (k % 4) * .012;
  const jit2 = ((k * 53 + 7) % 13) / 13 - .5, wob = SIDE(j) * -1.1 * (i - 1) + jit * 1.6;   // cables swing across each other on the floor
  const pts = [p0, [p0[0] * .97, lift, 1.42], [p0[0] + wob, lift, .3 + jit * .6], [lerp(p0[0], sx, .55) - wob * .8 + jit2 * 1.2, lift, -1.6 + jit2 * .6], [lerp(p0[0], sx, .85) + jit2 * .7, lift, -3.9 + jit * .4], [sx, lift, -5.85], [sx, lift + .02, -6.42],
    [sx, e[1] * .5, -6.5], [sx, e[1] - .08, -6.5], [e[0] + SIDE(j) * .16, e[1], WALL_Z], e];
  for (const q of pts) { const dx = q[0] - HUB_P.x, dz = q[2] - HUB_P.z, d = Math.hypot(dx, dz); if (q[1] < .2 && d < 1.05) { const f = 1.05 / Math.max(d, .01); q[0] = HUB_P.x + (d < .01 ? SIDE(j) : dx) * f; q[2] = HUB_P.z + dz * f; } }
  for (let n = 0; n < pts.length - 1; n++) { const A = pts[n], B = pts[n + 1]; if (A[1] > .2 || B[1] > .2) continue;
    const vx = B[0] - A[0], vz = B[2] - A[2], L2 = vx * vx + vz * vz || 1, u = clamp(((HUB_P.x - A[0]) * vx + (HUB_P.z - A[2]) * vz) / L2), cx = A[0] + vx * u, cz = A[2] + vz * u;
    if (Math.hypot(cx - HUB_P.x, cz - HUB_P.z) < 1.25) { const sg = Math.abs(cx) > .05 ? Math.sign(cx) : SIDE(j); pts.splice(n + 1, 0, [HUB_P.x + sg * 1.35, A[1], HUB_P.z]); n++; } }
  const dense = new THREE.CatmullRomCurve3(pts.map((q) => V(...q)), false, 'centripetal').getSpacedPoints(220).map((q) => { const dx = q.x - HUB_P.x, dz = q.z - HUB_P.z, d = Math.hypot(dx, dz);
    if (q.y < .35 && d < 1.0) { const f = 1.0 / Math.max(d, .01); q.x = HUB_P.x + (d < .01 ? SIDE(j) * .01 : dx) * f; q.z = HUB_P.z + dz * f; } return q; });
  const w = W3D.wire(S, dense, { color: a.c, radius: R, curve: 'catmullrom', tension: 0, floorY: 0, segments: 180, tone: .52 });
  tangle.push({ w, i, j, k, col: w.tube.material.color.clone(), em: w.tube.material.emissive.clone() }); }));
const RED = [12, 5, 19];                                              // fix 6: the crossings that flash red (and retract first)
// fix 10: the 11 green cables leave from the hub: app cables start at the hub's face and end in the app's back
const hubW = [];
APPS.forEach((a, i) => { const p0 = appPlug(i, 3.5), x1 = AX(i) * .3;
  hubW.push({ w: W3D.wire(S, [[x1, HUB_P.y + .22, HUB_P.z + .76], [x1, HUB_P.y - .2, HUB_P.z + .8], [x1, FL, HUB_P.z + 1.0], [lerp(p0[0], x1, .6), FL, .2], [p0[0] * .95, FL, 1.4], p0], { color: 0x2fd27a, radius: .05, curve: 'centripetal', floorY: 0, segments: 140 }), k: i }); });
TOOLS.forEach((t, j) => { const e = EDGE(j), sx = SIDE(j) * (2.3 + .05 * j), x0 = SIDE(j) * (.25 + .12 * Math.floor(j / 2));
  hubW.push({ w: W3D.wire(S, [[x0, HUB_P.y + .25, HUB_P.z - .76], [x0, HUB_P.y - .3, HUB_P.z - .85], [x0 * 1.4, FL, HUB_P.z - 1.15], [lerp(x0, sx, .6), FL, -4.6], [sx, FL + .02, -6.42], [sx, e[1] * .5, -6.5], [sx, e[1] - .08, -6.5], [e[0] + SIDE(j) * .16, e[1], WALL_Z], e], { color: 0x2fd27a, radius: .05, curve: 'centripetal', floorY: 0, segments: 160 }), k: 3 + j }); });
const newW = W3D.wire(S, [[1.3, HUB_P.y + .35, HUB_P.z + .3], [1.5, HUB_P.y - .15, HUB_P.z + .3], [2.0, FL, -1.95], [NEW_P[0] - .3, FL, NEW_P[2] + .3], [NEW_P[0] - .62, NEW_P[1] - .4, NEW_P[2] + .05], [NEW_P[0] - .62, NEW_P[1] + .45, NEW_P[2]]], { color: 0x2fd27a, radius: .05, curve: 'centripetal', floorY: 0, segments: 480 });

// ---------- light: sweeps for the big moments; fix 9 (U10): the key light is cold until the hub lands, then warm (and cold again in the last 0.3 s, frame 0's light) ----------
const sweep = new THREE.PointLight(0xfff1dc, 0, 4.2, 2); S.scene.add(sweep);
const spark = new THREE.PointLight(0xffb070, 0, 3, 2); S.scene.add(spark);
const sparkDot = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 2, 1), toneMapped: false })); sparkDot.visible = false; S.scene.add(sparkDot);
const COLD = { key: new THREE.Color(0xc4d0f2), hemi: new THREE.Color(0x9fb0d6) }, WARM = { key: new THREE.Color(0xffe2c4), hemi: new THREE.Color(0xd8c8b8) };
const warmAt = (t) => sm(prog(t, LAND, LAND + .5)) * (1 - sm(prog(t, TOTAL - .3, TOTAL)));

// ---------- numbers (fix 8): one style, a fixed spot per section, typed top line, odometer, bar, leader; fix 13: the headline words ----------
const NUM = W3D.numbers({ y: 1540, w: 300 }); let LAST_NUM = null;
const NUM_AT = { n24: [210, 800], n11: [190, 880], n12: [890, 860] };
const anchorOf = (v3) => { const p = v3.clone().project(S.cam); return p.z < 1 ? [(p.x * .5 + .5) * W, (-p.y * .5 + .5) * H] : null; };
// render 3 plan critic (item 13): big words on the wide and clean shots only, none on the close shots; "TANGLED" (the number spot already shows 24); no grey older word
const END_T = TOTAL - 1.86;                                           // the dolly home starts 0.7 s before this; the headline and the pill leave as it starts
const HEAD_ = W3D.headline({ y: 486, words: [{ t: .5, text: 'ONE TOOL' }, { t: 1.4, t1: BOARD, text: '3 APPS' }, { t: T_IN - .1, t1: T_IN + 1.3, text: '8 TOOLS' },
  { t: C.twenty - .05, t1: HUB_IN - .55, text: 'TANGLED', color: '#ff5a5a' }, { t: C.same, t1: END_T - .45, text: 'LESS WIRING', color: '#5be29a' }] });
// render 3 plan critic (B, structure): one step pill, one fixed place, 24 px under the subtitles' lowest line and above the headline
const PILL_ = W3D.headline({ y: 406, pill: true, words: [{ t: .5, text: '01 / 04 · THE SETUP' }, { t: T_IN + 1.3, text: '02 / 04 · THE WIRING' }, { t: C.twenty - .05, text: '03 / 04 · THE PROBLEM' }, { t: C.hub, t1: END_T - .45, text: '04 / 04 · THE FIX' }] });

const shadows = [...apps.map((m) => W3D.contactShadow(S, m, { w: 2.4, d: .6, strength: .9 })), W3D.contactShadow(S, hub, { w: 1.4, d: 1.4, rest: 0, strength: .7 }), W3D.contactShadow(S, newTool, { w: .8, d: .8, rest: 0, strength: .6 })];

// ---------- captions ----------
const KEYS = [[4, 4], [3, 4], [4, 5], [2, 3], [8, 8], [4, 6], null];   // the last line has no box: "LESS WIRING" carries it, and the box's top came within 6 px of "apps," (TEXT CLEAR)
const cap = W3D.captions({ y: 190, size: 60, lh: 1.6, handles: false, scrimRGB: '10,10,11', scrimA: [.985, .965], scrimMid: 175, lines: TL.scenes.map((s, i) => ({ t0: i === 0 ? -.2 : s.start, t1: i === TL.scenes.length - 1 ? TOTAL + 1 : s.end, words: s.words.map((w) => w.w), times: s.words.map((w) => w.t0), keyIdx: KEYS[i] })) });

// ---------- camera: one shot per beat, each with a reason; never the same move type twice in a row ----------
const START = { pos: [-5.5, 2.1, 9.6], look: [-1.88, .95, 2], fov: 42 };
const ENDCAM = { pos: [-4.919, 1.277, 8.127], look: [-2.0, .35, 2], fov: 42 };   // solved so the resting Notes has frame 0's size and place (box within 0.5 %; Chat's edge stays at the right: it sits 1.88 beside Notes)
const NEWCAM = { pos: [4.6, 5.4, 4.4], look: [1.1, 1.5, -2.0], fov: 48 };   // render 4 critic fix 3: further back, so the hub and New stay whole as the camera leaves
const SH = [
