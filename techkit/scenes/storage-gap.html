     Real 3D: three.js r149 (MIT, techkit/vendor), inlined at the THREE marker; KIT3D inlined at its marker. window.render(t) sets everything from t.
     Shots (cut on the voice cues from timeline.js): A a retail box printed 256 GB, a ruler of bytes runs out to the full length, then comes up short at 238 |
