     one hero phone, epoxy chips with an edge glow, rim + kicker light, bold numbers that change, smeared motion blur, KIT3D shot changes.
     Real 3D: three.js r149 (MIT, techkit/vendor), inlined at the THREE marker; KIT3D inlined at its marker. window.render(t) sets everything from t.
     Shots (cut on the voice cues from timeline.js): A hero x-ray phone, 256 GB rolls to 238 | B a low macro across a grid of 256 tiles (1 GB each, as the box counts) |
     C the same slab wide: the tiles grow to the software's gigabyte and the last 18 are squeezed out | D three phones: 128 > 119, 512 > 477, 1000 > 931 |
     E the board, a laser slices it: the gap, 69 GB | F the phone's Storage screen, the system takes its share | G the phone turns: take 7% off, back to A (loop).
     Ink + white + cyan (storage) + amber (the gap) only. -->

<script>
(() => {
const W = 1080, H = 1920;
const INK = 0x07080c, SIG = 0x38e1ff, HEAT = 0xffae3d, SIGC = '#38e1ff', HEATC = '#ffae3d', WHITE = '#f4f6f8';
const TL = window.TL, C = TL.cues, SC = TL.scenes, TOTAL = TL.total;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (u) => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const eout = (u) => 1 - Math.pow(1 - clamp(u), 3);
const ein = (u) => Math.pow(clamp(u), 3);
const eback = (u) => { u = clamp(u); const c = 1.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const KIT = window.KIT3D, Q = window.KITQ || 1;   // KITQ < 1: a quick local draft (fewer samples)

// ---------- renderer ----------
const gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
const SS = 1; gl.setPixelRatio(1); gl.setSize(W * SS, H * SS, false); gl.domElement.id = 'gl'; document.body.appendChild(gl.domElement);
gl.outputEncoding = THREE.sRGBEncoding; gl.toneMapping = THREE.ACESFilmicToneMapping; gl.toneMappingExposure = 1.2;
gl.setClearColor(INK, 1);
const scene = new THREE.Scene(); scene.background = new THREE.Color(INK);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 400);
const out = document.getElementById('out'), o = out.getContext('2d'); o.imageSmoothingEnabled = true; o.imageSmoothingQuality = 'high';

// studio reflections: a dark room with three soft boxes (deterministic PMREM)
{ const env = new THREE.Scene(); env.background = new THREE.Color(0x050608);
  const box = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  box(8, 3, 0, 7, 5, 0xdde2e8); box(2, 9, -8, 1, 3, 0x9fb4c8); box(2, 9, 8, 0, 2, 0xd8c8b0); box(10, 2, 0, -8, -4, 0x202428);
  const pm = new THREE.PMREMGenerator(gl); scene.environment = pm.fromScene(env, 0.02).texture; }

// ---------- textures (canvas, code-drawn) ----------
function ctex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }
const KM = KIT.materials(THREE, ctex);
const chipTop = KM.epoxy(512, 256, 'UFS 4.0', 'NAND  flash'), tileTex = KM.epoxy(256, 256, 'GB', '');
const pcbTex = ctex(2048, 2048, (c, w, h) => {
  c.fillStyle = '#0c1015'; c.fillRect(0, 0, w, h); const R = rng(11);
  // buses: parallel traces routed at right angles with 45-degree corners
  for (let b = 0; b < 46; b++) { const n = 3 + Math.floor(R() * 6), gap = 9, lw = 2.2; let x = R() * w, y = R() * h; const horiz = R() < .5, len1 = 120 + R() * 420, len2 = 80 + R() * 360, dir = R() < .5 ? -1 : 1;
    c.strokeStyle = `rgba(150,172,195,${.10 + .08 * R()})`; c.lineWidth = lw;
    for (let k = 0; k < n; k++) { const o2 = k * gap; c.beginPath();
      if (horiz) { c.moveTo(x, y + o2); c.lineTo(x + len1 - o2, y + o2); c.lineTo(x + len1 - o2 + 40, y + o2 + 40 * dir); c.lineTo(x + len1 - o2 + 40, y + o2 + 40 * dir + len2 * dir); }
      else { c.moveTo(x + o2, y); c.lineTo(x + o2, y + len1 - o2); c.lineTo(x + o2 + 40 * dir, y + len1 - o2 + 40); c.lineTo(x + o2 + 40 * dir + len2 * dir, y + len1 - o2 + 40); }
      c.stroke(); } }
  // vias (rings) and solder pads (small silver rectangles in rows)
  for (let i = 0; i < 420; i++) { const x = R() * w, y = R() * h; c.strokeStyle = 'rgba(175,185,198,.22)'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 4 + R() * 3, 0, 7); c.stroke(); }
  for (let i = 0; i < 70; i++) { const x = R() * w, y = R() * h, n = 4 + Math.floor(R() * 10), v = R() < .5; c.fillStyle = 'rgba(185,192,204,.20)'; for (let k = 0; k < n; k++) c.fillRect(v ? x : x + k * 14, v ? y + k * 14 : y, v ? 18 : 8, v ? 8 : 18); }
  c.fillStyle = 'rgba(170,180,195,.10)'; for (let i = 0; i < 40; i++) { c.beginPath(); c.arc(R() * w, R() * h, 2 + R() * 3, 0, 7); c.fill(); }
});
const glowTex = ctex(256, 256, (c, w, h) => { const g = c.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); });
glowTex.encoding = THREE.LinearEncoding;

});

let scrP = -1;

  c.textAlign = 'left'; c.fillStyle = 'rgba(244,246,248,.9)'; c.font = '800 54px "Inter Display", Inter, sans-serif'; c.fillText('Storage', 56, 120);

  let x = x0; parts.forEach(([f, col]) => { const ww = bw * f; c.fillStyle = col; c.fillRect(x, by, Math.max(0, ww - 3), bh); x += ww; });
  c.font = '600 34px "Inter Display", Inter, sans-serif';
  [['Apps', '#38e1ff'], ['Photos', '#f4f6f8'], ['System', '#ffae3d']].forEach(([n, col], i) => { c.fillStyle = col; c.beginPath(); c.arc(70, 300 + i * 62, 11, 0, 7); c.fill(); c.fillStyle = 'rgba(244,246,248,.8)'; c.fillText(n, 100, 312 + i * 62); });
  c.fillStyle = 'rgba(244,246,248,.14)'; for (let i = 0; i < 2; i++) { c.fillRect(56, 520 + i * 60, 190 + ((i * 67) % 90), 14); c.fillRect(330, 520 + i * 60, 108, 14); }
  screenTex.needsUpdate = true; }
drawScreen(0);

// ---------- materials ----------
const M = {
  metal: KM.metal,
  darkMetal: KM.darkMetal,
  screen: KM.glass(screenTex),
  pcb: new THREE.MeshStandardMaterial({ color: 0xffffff, map: pcbTex, metalness: .35, roughness: .62 }),

  lens: new THREE.MeshPhysicalMaterial({ color: 0x020305, metalness: .1, roughness: .05, clearcoat: 1 }),
  gold: KM.gold,

  floor: KM.floor,
};

// ---------- shapes ----------
function rrShape(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
function rrPath(w, h, r) { const s = new THREE.Path(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.quadraticCurveTo(x, y, x, y + r); s.lineTo(x, y + h - r); s.quadraticCurveTo(x, y + h, x + r, y + h); s.lineTo(x + w - r, y + h); s.quadraticCurveTo(x + w, y + h, x + w, y + h - r); s.lineTo(x + w, y + r); s.quadraticCurveTo(x + w, y, x + w - r, y); s.lineTo(x + r, y); return s; }
const PW = 3, PHh = 6.3, PD = .3, PR = .46;

// a memory chip (1 GB each in the story): body, marked top, cyan edge, glow sprite
const CHW = .74, CHH = .36, CHD = .07;
const chipGeo = (() => { const g = new THREE.ExtrudeGeometry(rrShape(CHW - .02, CHH - .02, .035), { depth: CHD - .02, bevelEnabled: true, bevelThickness: .01, bevelSize: .01, bevelSegments: 3, curveSegments: 6 }); g.translate(0, 0, -(CHD - .02) / 2);
  const uv = g.attributes.uv, pos = g.attributes.position; for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / CHW + .5, pos.getY(i) / CHH + .5); return g; })();
const chipEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(CHW, CHH, CHD));
function makeChip() {
  const top = KM.chipTop(chipTop, SIG);
  const g = new THREE.Group(), m = new THREE.Mesh(chipGeo, [top, M.chipSide]); g.add(m);
  const e = new THREE.LineSegments(chipEdges, new THREE.LineBasicMaterial({ color: SIG, transparent: true, opacity: .55 })); g.add(e);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: SIG, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.set(1.3, .86, 1); s.position.z = -.03; g.add(s);
  g.userData = { top, e, s };
  return g;
}
function chipGlow(ch, k, heat = 0) { const u = ch.userData; const col = heat > 0 ? new THREE.Color(SIG).lerp(new THREE.Color(HEAT), heat) : new THREE.Color(SIG);
  u.top.emissive.copy(col); u.top.emissiveIntensity = .035 * k + .09 * heat; u.e.material.color.copy(col); u.e.material.opacity = .35 + .65 * clamp(k); u.s.material.color.copy(col); u.s.material.opacity = .62 * clamp(k); }   // dark epoxy; the colour is the edge glow

// a phone, back facing +z; n memory chips on the board (2 columns)
function makePhone(n, seed) {

  const frameShape = rrShape(PW, PHh, PR); frameShape.holes.push(rrPath(PW - .16, PHh - .16, PR - .08));
  const fg = new THREE.ExtrudeGeometry(frameShape, { depth: PD, bevelEnabled: true, bevelThickness: .035, bevelSize: .035, bevelSegments: 5, curveSegments: 28 }); fg.translate(0, 0, -PD / 2);
  P.add(new THREE.Mesh(fg, M.metal));

  // screen (front, -z)
  const scr = new THREE.Mesh(new THREE.ShapeGeometry(rrShape(PW - .1, PHh - .1, PR - .05), 24), M.screen.clone()); scr.rotation.y = Math.PI; scr.position.z = -PD / 2 - .012; P.add(scr);
  { const uv = scr.geometry.attributes.uv, pos = scr.geometry.attributes.position; for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / (PW - .1) + .5, pos.getY(i) / (PHh - .1) + .5); }
  // board (upper half), battery (lower half)
  const board = new THREE.Mesh(new THREE.ExtrudeGeometry(rrShape(PW - .42, 3.45, .2), { depth: .05, bevelEnabled: false }), M.pcb);
  { const uv = board.geometry.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * .35, uv.getY(i) * .35); }
  board.position.set(0, 1.18, -.06); P.add(board);
  const bat = new THREE.Mesh(new THREE.ExtrudeGeometry(rrShape(PW - .5, 2.3, .14), { depth: .12, bevelEnabled: true, bevelThickness: .02, bevelSize: .02, bevelSegments: 3 }), M.battery); bat.position.set(0, -1.75, -.1); P.add(bat);
  { const uv = bat.geometry.attributes.uv, pos = bat.geometry.attributes.position; for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / (PW - .5) + .5, pos.getY(i) / 2.3 + .5); }
  const shield = new THREE.Mesh(new THREE.BoxGeometry(.95, .95, .07), M.chipSide); shield.position.set(.6, 2.62, .03); shield.scale.set(.75, .5, 1);
  // tiny parts (detail on the object)
  const comps = new THREE.InstancedMesh(new THREE.BoxGeometry(.07, .035, .035), M.comp, 12); const dm = new THREE.Object3D();
  for (let i = 0; i < 12; i++) { dm.position.set((R() - .5) * 2.3, -.45 + R() * 2.45, .01); dm.rotation.z = R() < .5 ? 0 : Math.PI / 2; dm.updateMatrix(); comps.setMatrixAt(i, dm.matrix); }
  P.add(comps);

  const chips = [], cols = [-.58, .58], rowH = .46, rows = Math.ceil(n / 2), top = 2.33;
  for (let i = 0; i < n; i++) {

  }
  // back glass (+z), see-through in the x-ray shots
  const back = new THREE.Mesh(new THREE.ShapeGeometry(rrShape(PW - .1, PHh - .1, PR - .05), 24),
    new THREE.MeshPhysicalMaterial({ color: 0x0b0d11, metalness: .1, roughness: .1, clearcoat: 1, transparent: true, opacity: .25, depthWrite: false, envMapIntensity: .45 }));

  const bump = new THREE.Group(); bump.position.set(-.78, 2.55, PD / 2 + .02); bump.scale.setScalar(.78); P.add(bump);
  { const bg = new THREE.ExtrudeGeometry(rrShape(1.12, 1.12, .3), { depth: .06, bevelEnabled: true, bevelThickness: .02, bevelSize: .02, bevelSegments: 3 }); const b = new THREE.Mesh(bg, new THREE.MeshPhysicalMaterial({ color: 0x16191e, metalness: .4, roughness: .2, clearcoat: 1 })); bump.add(b);
    [[-.24, .24], [-.24, -.24], [.25, .24]].forEach(([x, y]) => { const ring = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, .1, 40), M.metal); ring.rotation.x = Math.PI / 2; ring.position.set(x, y, .1); bump.add(ring);
      const l = new THREE.Mesh(new THREE.CylinderGeometry(.155, .155, .11, 40), M.lens); l.rotation.x = Math.PI / 2; l.position.set(x, y, .11); bump.add(l); });
    const fl = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, .08, 20), new THREE.MeshStandardMaterial({ color: 0xeeeeee, emissive: 0x222222 })); fl.rotation.x = Math.PI / 2; fl.position.set(.25, -.24, .09); bump.add(fl); }

}

// ---------- the worlds (each in its own place, shown only in its shot) ----------
const LIT = KIT.light(THREE, scene), keyL = LIT.key, rimL = LIT.rim, rim2L = LIT.rim2;

// A / E / G: the hero phone
const hero = makePhone(8, 3); scene.add(hero);
const heroGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x6aa8d8, transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false }));
heroGlow.scale.set(16, 22, 1); heroGlow.position.set(0, 1, -3); scene.add(heroGlow);

// D: three phones (4, 8, 12 chips: 128, 512, 1000 GB)
const LSP = 3.9;   // far enough apart that a close-up on one phone leaves its neighbours out of the frame
const lineup = new THREE.Group(); lineup.position.set(0, 0, -60); scene.add(lineup);
const LP = [makePhone(4, 21), makePhone(8, 22), makePhone(12, 23)]; LP.forEach((p, i) => { p.position.set((i - 1) * LSP, 0, 0); p.rotation.y = (i - 1) * -.04; lineup.add(p); });
{ const fl = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), M.floor); fl.rotation.x = -Math.PI / 2; fl.position.y = -3.25; lineup.add(fl); }


// B / C: the tile slab: 256 tiles, 1 GB each as the box counts it (16 x 16); in C the tiles grow to the software's gigabyte and the last 18 are squeezed out
const slab = new THREE.Group(); slab.position.set(0, 0, -160); scene.add(slab);
const GN = 16, TN = GN * GN, GONE0 = 238, PIT = 1.0;
{ const plate = new THREE.Mesh(new THREE.BoxGeometry(17.4, 17.4, .2), M.dimm); plate.position.z = -.2; slab.add(plate);
  const hg = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: SIG, transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false })); hg.scale.set(34, 34, 1); hg.position.set(0, 0, -3); slab.add(hg); }
const tileTop = Object.assign(KM.chipTop(tileTex, SIG), { envMapIntensity: .3, roughness: .55 });
const tiles = new THREE.InstancedMesh(new THREE.BoxGeometry(.88, .88, .24), [M.chipSide, M.chipSide, M.chipSide, M.chipSide, tileTop, M.chipSide], TN); tiles.frustumCulled = false; slab.add(tiles);
const tileGlowTex = ctex(128, 128, (c, w, h) => { c.shadowColor = '#fff'; c.shadowBlur = 14; c.strokeStyle = 'rgba(255,255,255,1)'; c.lineWidth = 5; c.beginPath(); c.roundRect ? c.roundRect(14, 14, 100, 100, 14) : c.rect(14, 14, 100, 100); c.stroke();
  c.shadowBlur = 0; c.fillStyle = 'rgba(255,255,255,.16)'; c.fill(); });
tileGlowTex.encoding = THREE.LinearEncoding;
const tileGlow = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.14, 1.14), new THREE.MeshBasicMaterial({ map: tileGlowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }), TN); tileGlow.frustumCulled = false; slab.add(tileGlow);
const TR = rng(77), TF = []; for (let i = 0; i < TN; i++) TF.push({ dx: (TR() - .5) * 7, dy: 3 + TR() * 6, dz: 6 + TR() * 5, rx: (TR() - .5) * 4, rz: (TR() - .5) * 5 });
const tileC = { cyan: new THREE.Color(SIG), white: new THREE.Color(0xdff4ff), amber: new THREE.Color(HEAT) }, td = new THREE.Object3D(), tcol = new THREE.Color();
const tileLit = (i) => { const c = i % GN, r = Math.floor(i / GN); return ((GN - 1 - r) + c) / (2 * GN - 2); };   // 0 at the near corner, 1 far
const tileFly = (i) => C.bigger + .3 + (i - GONE0) * .028;
function updateSlab(t) {
  const g = ease(prog(t, C.bigger - .1, C.bigger + .6));
