<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>test-3d-quality (hidden sample, never posted)</title>
<!-- 3D QUALITY TEST (owner, 25 Nov 2026). Hidden sample, never posted, no voice. 4 s: a glossy purple block, an invented logo tile on top,
     a green chip that drops and stacks on it, a warm orange cable glowing into its port, slow camera orbit, dark grid floor.
     Techniques are switched on one by one through window.FX (cumulative order: phys, env, shadow, bloom, dof, aces) so each step's look and
     frame cost can be measured: node techkit/3dtest-bench.cjs. Default = all on. Real 3D: three.js r149 (MIT, techkit/vendor), inlined at the
     THREE marker by scripts/3dtest-assemble.py. window.render(t) sets everything from t (no rAF, no randomness). -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07060c}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body>
<!--THREE-->
<script>
(() => {
const W = 1080, H = 1920, DUR = 4;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (u) => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const eout = (u) => 1 - Math.pow(1 - clamp(u), 3);
const FX = window.FX = Object.assign({ phys: 1, env: 1, shadow: 1, bloom: 1, dof: 1, aces: 1 }, window.FX || {});

const gl = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
gl.setPixelRatio(1); gl.setSize(W, H, false); document.body.appendChild(gl.domElement);
gl.outputEncoding = THREE.sRGBEncoding;
gl.shadowMap.type = THREE.PCFSoftShadowMap;
const INK = 0x07060c;
const scene = new THREE.Scene(); scene.background = new THREE.Color(INK);
scene.fog = new THREE.Fog(INK, 9, 26);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 80);

// ---------- environment: a dark studio with soft boxes (deterministic PMREM) ----------
let envTex;
{ const env = new THREE.Scene(); env.background = new THREE.Color(0x0a0810);
  const box = (w, h, x, y, z, c, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  box(9, 3.5, 0, 7, 4, 0xfff4e8, 1.5); box(2.4, 9, -8, 1, 3, 0xaab8ff, 1.0); box(2.4, 9, 8, 0, 2, 0xffc9a0, .7); box(8, 2, 0, 3, -7, 0xc9a8ff, .5); box(10, 2, 0, -8, -4, 0x20202a, 1);
  const pm = new THREE.PMREMGenerator(gl); envTex = pm.fromScene(env, 0.02).texture; pm.dispose(); }

// ---------- helpers ----------
function roundedShape(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0); s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2); s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI); s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5); return s; }
function roundBox(w, d, h, r, bev, seg) {   // footprint w x d (x, z), height h (y), rounded corners r, bevelled edges bev; centred, y from 0 to h
  const g = new THREE.ExtrudeGeometry(roundedShape(w - 2 * bev, d - 2 * bev, r), { depth: h - 2 * bev, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: seg, curveSegments: 10 });
  g.rotateX(-Math.PI / 2); g.translate(0, bev, 0); g.computeVertexNormals(); return g; }
function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }

// the grid floor: faint violet lines on near black (drawn, no lit floor: a grey slab otherwise)
const gridTex = tex(1024, 1024, (c, w, h) => { c.fillStyle = '#0a0812'; c.fillRect(0, 0, w, h);
  for (let i = 0; i <= 16; i++) { const p = i * w / 16, major = i % 4 === 0; c.strokeStyle = major ? 'rgba(150,110,255,.55)' : 'rgba(110,80,200,.26)'; c.lineWidth = major ? 3 : 1.5; c.beginPath(); c.moveTo(p, 0); c.lineTo(p, h); c.stroke(); c.beginPath(); c.moveTo(0, p); c.lineTo(w, p); c.stroke(); } });
gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping; gridTex.repeat.set(5, 5); gridTex.anisotropy = 16;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ map: gridTex, fog: true })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: .62, color: 0x05030c })); shadowFloor.rotation.x = -Math.PI / 2; shadowFloor.position.y = .004; shadowFloor.receiveShadow = true; scene.add(shadowFloor);

// the invented mark: a rounded tile with a folded ribbon "M" in coral to gold (no real brand)
const logoTex = tex(512, 512, (c, w, h) => { const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#ff5a7a'); g.addColorStop(1, '#ffb23d'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = '#fff6ea'; c.beginPath(); c.moveTo(110, 400); c.lineTo(110, 130); c.lineTo(256, 270); c.lineTo(402, 130); c.lineTo(402, 400); c.lineTo(340, 400); c.lineTo(340, 250); c.lineTo(256, 340); c.lineTo(172, 250); c.lineTo(172, 400); c.closePath(); c.fill();
  c.fillStyle = 'rgba(60,20,60,.28)'; c.beginPath(); c.moveTo(256, 340); c.lineTo(340, 250); c.lineTo(340, 300); c.lineTo(256, 392); c.closePath(); c.fill(); });

// ---------- objects ----------
const BLK = { w: 3.2, d: 3.2, h: 1.1 }, CHIP = { w: 1.5, d: 1.5, h: .36 };
const mats = {};
function buildMaterials() {
  const P = FX.phys;
  const mk = (cls, o) => new THREE[cls](o);
  mats.block = P ? mk('MeshPhysicalMaterial', { color: 0x3a0f9a, roughness: .24, metalness: 0, clearcoat: 1, clearcoatRoughness: .05, envMapIntensity: 1, sheen: 0 })
                 : mk('MeshStandardMaterial', { color: 0x3a0f9a, roughness: .5, metalness: 0 });
  mats.chip = P ? mk('MeshPhysicalMaterial', { color: 0x07a548, roughness: .3, metalness: .05, clearcoat: 1, clearcoatRoughness: .08, envMapIntensity: 1 })
                : mk('MeshStandardMaterial', { color: 0x07a548, roughness: .5 });
  mats.logo = P ? mk('MeshPhysicalMaterial', { map: logoTex, roughness: .3, clearcoat: 1, clearcoatRoughness: .05, envMapIntensity: 1 }) : mk('MeshStandardMaterial', { map: logoTex, roughness: .5 });
  mats.metal = mk('MeshStandardMaterial', { color: 0xd8dde6, roughness: .22, metalness: 1, envMapIntensity: 1.2 });
  mats.port = mk('MeshStandardMaterial', { color: 0x120a22, roughness: .6, metalness: .4 });
  mats.cable = new THREE.MeshBasicMaterial({ color: 0xffffff, map: cableTex(), toneMapped: false, fog: false });
  if (FX.env) { scene.environment = envTex; } else scene.environment = null;
  for (const k of ['block', 'chip', 'logo', 'metal', 'port']) { mats[k].needsUpdate = true; }
}
function cableTex() { const t = tex(512, 4, (c, w, h) => { const g = c.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#ff5a0a'); g.addColorStop(.5, '#ff8a22'); g.addColorStop(1, '#ff5a0a'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  const p = c.createRadialGradient(w * .5, 2, 0, w * .5, 2, w * .09); p.addColorStop(0, 'rgba(255,245,210,1)'); p.addColorStop(1, 'rgba(255,245,210,0)'); c.fillStyle = p; c.fillRect(0, 0, w, h); });
  t.wrapS = THREE.RepeatWrapping; t.encoding = THREE.LinearEncoding; return t; }
buildMaterials();

const root = new THREE.Group(); scene.add(root);
const block = new THREE.Mesh(roundBox(BLK.w, BLK.d, BLK.h, .36, .1, 6), mats.block); block.castShadow = block.receiveShadow = true; root.add(block);
const logo = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(1.45, 1.45, .3), 12), mats.logo);
{ // uv from position
  const g = logo.geometry, p = g.attributes.position, uv = new Float32Array(p.count * 2); for (let i = 0; i < p.count; i++) { uv[i * 2] = p.getX(i) / 1.45 + .5; uv[i * 2 + 1] = p.getY(i) / 1.45 + .5; } g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); }
logo.rotation.x = -Math.PI / 2; logo.position.set(.55, BLK.h + .004, .55); logo.rotation.z = 0; root.add(logo);
// two small pill lights on the block top: purely decorative detail
const chip = new THREE.Mesh(roundBox(CHIP.w, CHIP.d, CHIP.h, .16, .05, 5), mats.chip); chip.castShadow = chip.receiveShadow = true; root.add(chip);
const pins = new THREE.Group(); chip.add(pins);
for (let i = 0; i < 6; i++) for (const s of [-1, 1]) { const pin = new THREE.Mesh(new THREE.BoxGeometry(.07, .05, .16), mats.metal); pin.position.set(-.55 + i * .22, .13, s * (CHIP.d / 2 + .02)); pin.castShadow = true; pins.add(pin); }
const die = new THREE.Mesh(roundBox(.7, .7, .06, .08, .02, 3), new THREE.MeshStandardMaterial({ color: 0x0b2a1c, roughness: .35, metalness: .3, envMapIntensity: 1 })); die.position.set(0, CHIP.h - .004, 0); die.castShadow = true; chip.add(die);
// port on the block's +x side, a metal plug sits in it
const port = new THREE.Mesh(roundBox(.5, .78, .3, .1, .03, 3), mats.port); port.rotation.z = Math.PI / 2; port.rotation.y = 0; port.position.set(BLK.w / 2 - .02, .55, -.5);
{ const g = roundBox(.52, .8, .14, .1, .03, 3); const m = new THREE.Mesh(g, mats.port); m.rotation.z = -Math.PI / 2; m.position.set(BLK.w / 2 + .02, .55, -.5); m.rotation.y = 0; root.add(m); }
const plug = new THREE.Mesh(roundBox(.6, .6, .5, .12, .04, 3), mats.metal); plug.rotation.z = -Math.PI / 2; plug.castShadow = true; root.add(plug);
// the glow cable: a tube along a curve from far on the floor, up and into the plug
const PORT_P = new THREE.Vector3(BLK.w / 2 + .62, .55, -.5);
const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(7.2, .16, 3.4), new THREE.Vector3(5.6, .16, 1.9), new THREE.Vector3(4.4, .16, -.2), new THREE.Vector3(3.5, .3, -.5), new THREE.Vector3(2.7, .45, -.5), PORT_P.clone().setX(PORT_P.x - .05)], false, 'catmullrom', .45);
const cableGeo = new THREE.TubeGeometry(curve, 220, .1, 14, false); const cable = new THREE.Mesh(cableGeo, mats.cable); root.add(cable);
const plugPos = PORT_P.clone(); plug.position.set(plugPos.x - .15, plugPos.y, plugPos.z);
const cableLight = new THREE.PointLight(0xff8a2a, 0, 7, 1.6); cableLight.position.set(3.3, .9, -.5); root.add(cableLight);
const glowSpot = new THREE.PointLight(0xff8a2a, 0, 6, 1.7); glowSpot.position.set(4.6, .6, -.4); root.add(glowSpot);

// lights
const hemi = new THREE.HemisphereLight(0xb8a8ff, 0x1a1030, FX.env ? .1 : .6); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0e0, 1.5); key.position.set(-4.5, 8, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6; key.shadow.camera.near = 1; key.shadow.camera.far = 25; key.shadow.radius = 5; key.shadow.bias = -.0004; key.shadow.normalBias = .02;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9a7bff, 1.6); rim.position.set(5, 3.5, -6); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xff9a5a, .7); rim2.position.set(-6, 2.5, -4); scene.add(rim2);

// ---------- post: HDR target, bloom (threshold + blurred mips), depth of field (disc blur by circle of confusion), ACES + sRGB ----------
const hasDepth = typeof THREE.DepthTexture === 'function';
const rtOpt = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true };
const rtScene = new THREE.WebGLRenderTarget(W, H, Object.assign({ samples: 4 }, rtOpt));
rtScene.depthTexture = new THREE.DepthTexture(W, H); rtScene.depthTexture.type = THREE.UnsignedIntType;
const rtB = [], rtB2 = [];
const BL = [[W / 2, H / 2], [W / 4, H / 4], [W / 8, H / 8], [W / 16, H / 16]];
for (const [w, h] of BL) { const o = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false }; rtB.push(new THREE.WebGLRenderTarget(w, h, o)); rtB2.push(new THREE.WebGLRenderTarget(w, h, o)); }
const rtDof = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); const qs = new THREE.Scene(); qs.add(quad); const qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }';
const sm = (fs, u) => new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: fs, uniforms: u, depthTest: false, depthWrite: false });
const mBright = sm('varying vec2 vUv; uniform sampler2D tex; uniform float th; void main(){ vec3 c = texture2D(tex, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th + .7, l), 1.); }', { tex: { value: null }, th: { value: .9 } });
const mBlur = sm('varying vec2 vUv; uniform sampler2D tex; uniform vec2 dir; void main(){ vec3 s = texture2D(tex, vUv).rgb * .227027; vec2 o1 = dir * 1.3846; vec2 o2 = dir * 3.2308; s += (texture2D(tex, vUv + o1).rgb + texture2D(tex, vUv - o1).rgb) * .3162162; s += (texture2D(tex, vUv + o2).rgb + texture2D(tex, vUv - o2).rgb) * .0702703; gl_FragColor = vec4(s, 1.); }', { tex: { value: null }, dir: { value: new THREE.Vector2() } });
const mDof = sm(`varying vec2 vUv; uniform sampler2D tex; uniform sampler2D depth; uniform float focus, aperture, near, far, maxR; uniform vec2 px;
  float lin(float d){ float z = d * 2. - 1.; return 2. * near * far / (far + near - z * (far - near)); }
  float coc(vec2 uv){ float d = lin(texture2D(depth, uv).r); return clamp((d - focus) / d * aperture, -1., 1.); }
  void main(){ float c0 = coc(vUv); float r0 = abs(c0) * maxR; vec3 acc = texture2D(tex, vUv).rgb; float wsum = 1.;
    for (int i = 0; i < 24; i++) { float fi = float(i) + .5; float a = fi * 2.399963; float rr = sqrt(fi / 24.); vec2 o = vec2(cos(a), sin(a)) * rr;
      vec2 uv = vUv + o * maxR * abs(c0) * px; float ci = coc(uv); float ri = abs(ci) * maxR;
      float w = (ri + .5 >= rr * r0) ? 1. : .0; w *= (c0 < 0. && ci > 0.) ? .25 : 1.;   // near-focus objects do not smear into the background
      float lum = dot(texture2D(tex, uv).rgb, vec3(.33)); w *= 1. + .5 * clamp(lum - 1., 0., 3.);   // bright bokeh
      acc += texture2D(tex, uv).rgb * w; wsum += w; }
    gl_FragColor = vec4(acc / wsum, 1.); }`, { tex: { value: null }, depth: { value: null }, focus: { value: 12 }, aperture: { value: .9 }, near: { value: .1 }, far: { value: 80 }, maxR: { value: 14 }, px: { value: new THREE.Vector2(1 / W, 1 / H) } });
const mFinal = sm(`varying vec2 vUv; uniform sampler2D tex, b0, b1, b2, b3; uniform float bloom, aces, exposure, vign;
  vec3 RRTAndODTFit(vec3 v){ vec3 a = v * (v + .0245786) - .000090537; vec3 b = v * (.983729 * v + .4329510) + .238081; return a / b; }
  vec3 aces_(vec3 c){ const mat3 I = mat3(.59719, .07600, .02840, .35458, .90834, .13383, .04823, .01566, .83777); const mat3 O = mat3(1.60475, -.10208, -.00327, -.53108, 1.10813, -.07276, -.07367, -.00605, 1.07602);
    c *= exposure / .6; c = I * c; c = RRTAndODTFit(c); c = O * c; return clamp(c, 0., 1.); }
  vec3 toSRGB(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1. / 2.4)) - .055, step(.0031308, c)); }
  void main(){ vec3 c = texture2D(tex, vUv).rgb; c += bloom * (texture2D(b0, vUv).rgb * .55 + texture2D(b1, vUv).rgb * .7 + texture2D(b2, vUv).rgb * .8 + texture2D(b3, vUv).rgb * .9);
    c = aces > .5 ? aces_(c) : clamp(c * exposure, 0., 1.);
    vec2 q = vUv - .5; c *= 1. - vign * dot(q, q) * 1.6;
    gl_FragColor = vec4(toSRGB(c), 1.); }`, { tex: { value: null }, b0: { value: null }, b1: { value: null }, b2: { value: null }, b3: { value: null }, bloom: { value: 0 }, aces: { value: 1 }, exposure: { value: 1.15 }, vign: { value: .5 } });
function pass(mat, target) { quad.material = mat; gl.setRenderTarget(target); gl.render(qs, qc); }

// ---------- animation, a pure function of t ----------
const CHIP_T0 = .55, CHIP_T1 = 1.25;   // the chip drops at 0.55 s, lands at 1.25 s
function pose(t) {
  const u = prog(t, CHIP_T0, CHIP_T1), land = CHIP_T1;
  const fall = u * u;                                   // gravity
  let y = lerp(BLK.h + 5.2, BLK.h, fall) + 0;
  const bounce = t > land ? Math.exp(-(t - land) * 7) * Math.sin((t - land) * 24) * .09 : 0; y += Math.max(0, bounce);
  const squash = t > land ? 1 - Math.exp(-(t - land) * 9) * Math.sin((t - land) * 22) * .09 : 1;
  const spin = lerp(.9, 0, eout(prog(t, CHIP_T0, CHIP_T1 + .15)));
  return { y, squash, spin, vis: t >= CHIP_T0 - .02 ? 1 : 0, landed: t > land ? clamp(1 - (t - land) * 1.8) : 0 };
}
function setMats() {
  const s = FX; gl.toneMapping = (!s.aces || (s.bloom || s.dof)) ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping; gl.toneMappingExposure = 1.15;
  gl.shadowMap.enabled = !!s.shadow; key.castShadow = !!s.shadow; shadowFloor.visible = !!s.shadow;
  hemi.intensity = s.env ? .1 : .6;
}
let lastKey = '';
function sync() { const k = JSON.stringify(FX); if (k !== lastKey) { lastKey = k; buildMaterials(); block.material = mats.block; chip.material = mats.chip; logo.material = mats.logo; setMats(); scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; }); } }

window.render = (t) => {
  sync(); t = clamp(t, 0, DUR);
  const p = pose(t);
  chip.position.set(-.55, p.y, -.6); chip.rotation.y = p.spin * 1.4; chip.scale.set(1 + (1 - p.squash) * .5, p.squash, 1 + (1 - p.squash) * .5); chip.visible = !!p.vis;
  // the cable pulse runs towards the block; the glow breathes up once the chip lands (the "connection")
  mats.cable.map.offset.x = -(t * .42) % 1;
  const on = .7 + .3 * prog(t, 1.2, 1.5);
  mats.cable.color.setRGB(...(FX.bloom ? [1.35, .3, .04] : [1, .75, .4]).map((v) => v * on)); cableLight.intensity = .9 * on; glowSpot.intensity = 1.1 * on;
  // camera: a slow orbit, pushing in a little
  const a = lerp(-.62, -.18, ease(t / DUR)) + .0, rad = lerp(26, 23, ease(t / DUR)), hgt = lerp(11.8, 10.2, ease(t / DUR));
  const tx = lerp(1.3, 1.1, t / DUR);
  cam.position.set(tx + Math.sin(a) * rad * .62, hgt, Math.cos(a) * rad * .72 + 1.2); cam.lookAt(tx, 1.4, -.1); cam.updateMatrixWorld();
  const FOCUS = new THREE.Vector3(.9, 1.2, 0).sub(cam.position).dot(cam.getWorldDirection(new THREE.Vector3()));
  const post = FX.bloom || FX.dof;
  // the clear colour is written as it is: on screen it is a display value, in the HDR target the final pass encodes it, so it is linearised there
  const bg = post ? new THREE.Color(INK).convertSRGBToLinear() : new THREE.Color(INK); scene.background.copy(bg); scene.fog.color.copy(bg);
  if (!post) { gl.setRenderTarget(null); gl.render(scene, cam); return; }
  gl.setRenderTarget(rtScene); gl.render(scene, cam);
  let src = rtScene.texture;
  if (FX.dof) { const u = mDof.uniforms; u.tex.value = src; u.depth.value = rtScene.depthTexture; u.focus.value = FOCUS; u.near.value = cam.near; u.far.value = cam.far; pass(mDof, rtDof); src = rtDof.texture; }
  let bl = [null, null, null, null];
  if (FX.bloom) {
    mBright.uniforms.tex.value = rtScene.texture; pass(mBright, rtB[0]);
    for (let i = 0; i < 4; i++) { if (i > 0) { mBlur.uniforms.dir.value.set(0, 0); /* downsample by linear read */ mBlur.uniforms.tex.value = rtB[i - 1].texture; mBlur.uniforms.dir.value.set(0, 0); pass(mBlur, rtB[i]); }
      mBlur.uniforms.tex.value = rtB[i].texture; mBlur.uniforms.dir.value.set(1 / BL[i][0], 0); pass(mBlur, rtB2[i]);
      mBlur.uniforms.tex.value = rtB2[i].texture; mBlur.uniforms.dir.value.set(0, 1 / BL[i][1]); pass(mBlur, rtB[i]); bl[i] = rtB[i].texture; }
  }
  const f = mFinal.uniforms; f.tex.value = src; f.bloom.value = FX.bloom ? .55 : 0; f.aces.value = FX.aces ? 1 : 0;
  for (let i = 0; i < 4; i++) f['b' + i].value = bl[i] || src;
  pass(mFinal, null);
};
window.seek = window.render; window.DUR = DUR;
window.render(0);
})();
</script></body></html>
