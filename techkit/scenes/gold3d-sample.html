<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>gold3d-sample</title>
<!-- 3D KIT GOLD CANDIDATE (owner chat, 26 Nov 2026; design/3d-kit-phase2.md). Sample, never posted. "3 apps x 8 tools = 24 connections, then one shared hub = 11."
     Built only from techkit/world3d.js + lib3d.js: neutral dark world with blurred background props, glossy app tiles (logo slot), 3D number figures,
     24 separate glowing cables (one colour per app) that retract while one hub and 11 cables appear, one camera path through the world, word-by-word captions.
     CHANGE: markers show what a new reel replaces (the objects, the cables, the numbers, the cue times); keep the world, light, DOF, captions and camera method.
     window.render(t) is a pure function of t and the timeline cues. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#090a0e}
</style></head><body>
<script src="timeline.js"></script>
<!--THREE-->
<!--WORLD3D-->
<script>
(() => {
const W = 1080, H = 1920, TL = window.TL, C = TL.cues, TOTAL = TL.total;
const { clamp, lerp } = W3D, prog = (t, a, b) => clamp((t - a) / (b - a));
const sm = (u) => (u = clamp(u), u * u * (3 - 2 * u)), ease = (u) => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2), eout = (u) => 1 - Math.pow(1 - clamp(u), 3);
const eback = (u) => { u = clamp(u); const c = 1.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const S = W3D.stage(THREE, { W, H });
S.dof.aperture = 2.4; S.dof.focusRange = 7; S.dof.maxR = 20;
const world = W3D.world(S, { seed: 21, props: 36, radius: [14, 40], heroZone: 17, maxZ: -14, palette: [0x6b3cff, 0x16b8d6, 0xff4f8a, 0xffb62e, 0x2f7bff, 0x22c55e] });
const L = W3D.lib;

// ---------- CHANGE: the three apps (front row), the eight tools (a tall wall, 2 x 4: the portrait frame is tall), the hub (floating above the apps so it is never hidden) ----------
const APPS = [{ n: 'Notes', c: 0x16b8d6, g: 'notes' }, { n: 'Chat', c: 0xff4f8a, g: 'chat' }, { n: 'Mail', c: 0xffb62e, g: 'mail' }];
const TOOLS = [['Pay', 0x6b3cff, 'pay'], ['Photos', 0xe0449a, 'photos'], ['Files', 0x2f7bff, 'files'], ['Maps', 0x1fb86a, 'maps'], ['Calendar', 0xff6a3c, 'calendar'], ['Chat', 0x7a4cff, 'chat'], ['Mail', 0x1294d6, 'mail'], ['Notes', 0xd9a21b, 'notes']];
const AX = (i) => (i - 1) * 2.05, TX = (j) => (j % 2 - .5) * 2.5, TY = (j) => .1 + Math.floor(j / 2) * 1.95, WALL_Z = -6.5, HUB_P = V(0, 1.7, -2.4);
const apps = APPS.map((a, i) => { const g = L.appTile(THREE, { size: 1.8, color: a.c, glyph: L.appGlyphs[a.g], name: a.n, label: 'inside' }); g.position.set(AX(i), 0, 2); S.scene.add(g); return g; });
const tools = TOOLS.map((t, i) => { const g = L.appTile(THREE, { size: 1.6, color: t[1], glyph: L.appGlyphs[t[2]], name: t[0], label: 'inside' }); g.position.set(TX(i), TY(i), WALL_Z); S.scene.add(g); return g; });
const hub = L.productBlock(THREE, { w: 3.0, d: 2.0, h: 1.3, color: 0x4a14c8, name: 'HUB', sub: 'one shared standard', led: true }); hub.position.copy(HUB_P); S.scene.add(hub);
const card = L.codeCard(THREE, { w: 2.2, h: 1.45, title: 'POST /call', fs: 38, lines: [[['{', '#c7c9d1']], [['  "tool"', '#9ad1ff'], [': ', '#c7c9d1'], ['"calendar"', '#ffb86b']], [['  "app"', '#9ad1ff'], [': ', '#c7c9d1'], ['"notes"', '#ffb86b']], [['}', '#c7c9d1']]], footer: '200 OK  same shape' }); S.scene.add(card);

// ---------- cables: 24 separate tubes, one colour per app; then 3 + 8 through the hub (they end on the tile's bottom edge, so no label is ever covered) ----------
const tubes = [], hubTubes = [];
APPS.forEach((a, i) => TOOLS.forEach((t, j) => { const lift = .4 + .2 * ((i * 3 + j) % 5), tx = TX(j), ty = TY(j);
  const pts = [[AX(i), .9, 1.5], [AX(i) * .85, .9 + lift * .5, -.6], [lerp(AX(i), tx, .55), .7 + lift + ty * .15, -3.2], [tx, ty * .55 + .3, -5.2], [tx, ty + .1, -WALL_Z * 0 + WALL_Z + .3]];
  tubes.push({ c: W3D.cable(S, pts, { color: a.c, radius: .045, glow: 1.5, segments: 90, light: 0, haloSize: 2.6, halo: .2, floorGlow: .8, floorStrength: .5, pulse: { speed: .3 + .02 * j, width: .05 } }), ph: (i * 8 + j) * .137, k: i * 8 + j }); }));
APPS.forEach((a, i) => { hubTubes.push({ c: W3D.cable(S, [[AX(i), .9, 1.5], [AX(i) * .55, 1.5, -.1], [(i - 1) * .9, HUB_P.y + .1, HUB_P.z + 1.0]], { color: 0x42ff8c, radius: .06, glow: 1.6, halo: .22, haloSize: 2.6, segments: 70, light: 0, floorGlow: .9, floorStrength: .55, pulse: { speed: .5, width: .06 } }), ph: i * .3, k: i }); });
TOOLS.forEach((t, j) => { const tx = TX(j), ty = TY(j); hubTubes.push({ c: W3D.cable(S, [[(j % 2 - .5) * 1.0, HUB_P.y + .1, HUB_P.z - 1.0], [(j % 2 - .5) * 1.6, HUB_P.y - .2, -4.6], [tx, ty + .9, WALL_Z + 1.1], [tx, ty + .1, WALL_Z + .3]], { color: 0x42ff8c, radius: .06, glow: 1.6, halo: .22, haloSize: 2.6, segments: 70, light: 0, floorGlow: .9, floorStrength: .55, pulse: { speed: .5, width: .06 } }), ph: j * .11, k: 3 + j }); });

// ---------- numbers as 3D figures ----------
const fig24 = L.figure(THREE, '3x8=24', { height: .72, color: 0xffa23a, radius: .1, emissive: .12 }), fig11 = L.figure(THREE, '3+8=11', { height: .72, color: 0x42ff8c, radius: .1, emissive: .12 });
[fig24, fig11].forEach((f) => { S.scene.add(f); f.visible = false; f.traverse((m) => { if (m.isMesh) m.castShadow = false; }); });

// ---------- shadows ----------
const shadows = [...apps.map((m) => W3D.contactShadow(S, m, { w: 2.4, d: .6, strength: .9 })), ...tools.map((m) => W3D.contactShadow(S, m, { w: 1.8, d: .5, strength: .8 })), W3D.contactShadow(S, hub, { w: 3.4, d: 2.2, rest: 0, strength: .7 })];

// ---------- captions from the timeline ----------
const KEYS = [[3, 3], [8, 9], [8, 8], [4, 4], [4, 6], [5, 6]];
const cap = W3D.captions({ y: 190, size: 60, lines: TL.scenes.map((s, i) => ({ t0: i === 0 ? -.2 : s.start, t1: s.end, words: s.words.map((w) => w.w), times: s.words.map((w) => w.t0), keyIdx: KEYS[i] })) });
const CAPBAND = [60, 150, 1020, 420];

// ---------- camera: one path through the one world (CHANGE: keys follow the cues) ----------
const cam = W3D.camPath(S, [
  { t: 0, pos: [0, 5.4, 15.5], look: [0, 2.7, -3], fov: 52 },
  { t: C.eight + .2, pos: [1.6, 6.2, 16.5], look: [0, 3.0, -3], fov: 52 },
  { t: C.wire + .8, pos: [3.4, 7.2, 17], look: [0, 3.0, -3], fov: 52 },
  { t: C.twenty + .6, pos: [-3.4, 7.6, 17], look: [0, 3.0, -3], fov: 52 },
  { t: C.add + .4, pos: [0, 8.8, 18], look: [0, 2.8, -2.5], fov: 52 },
  { t: C.eleven + .4, pos: [2.2, 6.4, 16], look: [0, 3.0, -3], fov: 52 },
  { t: C.talks + .2, pos: [.6, 5.8, 15.5], look: [0, 2.3, -2.8], fov: 52 },
  { t: C.newt + .3, pos: [1.2, 5.6, 15.5], look: [.5, 2.4, -3], fov: 52 },
  { t: TOTAL, pos: [0, 7, 19], look: [0, 2.8, -3], fov: 52 },
]);

// the new tool (line 5): one more tile and ONE cable from the hub
const newTool = L.appTile(THREE, { size: 1.5, color: 0x00c2a8, glyph: L.appGlyphs.maps, name: 'New', label: 'inside' }); newTool.position.set(3.0, 0, -3.8); S.scene.add(newTool); newTool.visible = false;
const newCable = W3D.cable(S, [[1.0, HUB_P.y + .1, HUB_P.z - .3], [2.0, 1.2, -3.2], [3.0, .5, -3.7], [3.0, .1, -3.5]], { color: 0x42ff8c, radius: .06, glow: 1.6, halo: .22, haloSize: 2.6, segments: 60, light: 0, floorGlow: .9, floorStrength: .55, pulse: { speed: .5, width: .06 } });
shadows.push(W3D.contactShadow(S, newTool, { w: 1.5, d: .5, strength: .8 }));
const focus = V(0, 1.6, -3); S.focus = focus;
const heroes = [...apps, ...tools, hub];
function frame(t) {
  const p = cam(t); focus.copy(p.look);
  apps.forEach((m, i) => { const a = eback(prog(t, -.35 + i * .12, .3 + i * .12)); m.scale.setScalar(Math.max(.001, a)); m.position.y = Math.sin(t * 1.3 + i * 2) * .06; m.visible = a > .005; });
  tools.forEach((m, i) => { const a = eback(prog(t, -.3 + i * .07, .35 + i * .07)), bump = 1 + .14 * Math.exp(-Math.pow((t - C.eight - i * .05) * 5, 2)); m.scale.setScalar(Math.max(.001, a) * bump); m.visible = a > .005; });
  // 24 cables draw on from "wire" (staggered), keep pulsing, retract when the hub arrives
  tubes.forEach((q) => { const dr = ease(prog(t, C.wire + .05 + q.k * .035, C.wire + .65 + q.k * .035)), ret = ease(prog(t, C.add + .05 + q.k * .018, C.add + .7 + q.k * .018)); q.c.reveal(Math.max(0, dr - ret * 1.0) > 0 ? dr * (1 - ret) : 0); q.c.update(t + q.ph, 1); });
  const ha = eback(prog(t, C.add + .25, C.add + .85)); hub.scale.setScalar(Math.max(.001, ha)); hub.visible = ha > .005;
  const talk = 1 + .6 * Math.exp(-Math.pow((t - C.talks - .5) * 1.6, 2));   // the hub's cables brighten while the line says each talks once
  hubTubes.forEach((q) => { const u = ease(prog(t, C.hub + .1 + q.k * .05, C.hub + .75 + q.k * .05)); q.c.reveal(u); q.c.update(t + q.ph, talk); });
  { const a = eback(prog(t, C.newt, C.newt + .5)); newTool.visible = a > .005; newTool.scale.setScalar(Math.max(.001, a)); newCable.reveal(ease(prog(t, C.newt + .15, C.newt + .8))); newCable.update(t, talk); }
  const ca = eback(prog(t, C.hub + .5, C.hub + 1.1)); card.visible = ca > .005; card.scale.setScalar(Math.max(.001, ca)); card.position.set(2.2, 3.6, -1.5); card.rotation.y = -.3;
  // number figures: 24 on "twenty", 11 on "eleven"
  const a24 = eback(prog(t, C.twenty - .05, C.twenty + .4)), out24 = 1 - sm(prog(t, C.eleven - .05, C.eleven + .15)), a11 = eback(prog(t, C.eleven - .02, C.eleven + .45));
  fig24.visible = a24 > .005 && out24 > .01; fig24.scale.setScalar(Math.max(.001, a24) * Math.max(.001, out24)); fig11.visible = a11 > .005; fig11.scale.setScalar(Math.max(.001, a11));
  // the figures ride the camera: centred in the lower fifth of the frame, 9 units ahead, always facing it (nothing else is ever there)
  S.cam.updateMatrixWorld(); const ray = V(0, -.72, .5).unproject(S.cam).sub(S.cam.position).normalize(); [fig24, fig11].forEach((f) => { f.position.copy(S.cam.position).addScaledVector(ray, 10); f.quaternion.copy(S.cam.quaternion); f.rotateY(Math.sin(t * .9) * .1); });
  shadows.forEach((s) => s.update());
}
window.render = (t) => { t = clamp(t, 0, TOTAL); frame(t); S.draw(t); cap(t); };
// layout assertion for the stills: which 3D objects touch the caption band (should be none); figures must also stay clear of the tool wall
window.__layoutCheck = (t) => { frame(clamp(t, 0, TOTAL)); S.cam.updateMatrixWorld(); const bad = W3D.check(S, [fig24, fig11].filter((f) => f.visible), [CAPBAND], 0).length, hit = [fig24, fig11].filter((f) => f.visible).some((f) => [...tools, ...apps, hub].some((m) => W3D.overlaps(W3D.screenBox(S, f), W3D.screenBox(S, m)))); return { band: bad, wall: hit }; };
window.__boxes = () => [];
window.render(0);
})();
</script></body></html>
