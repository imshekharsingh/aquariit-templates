<!-- @techin20sec, 25 Nov 2026: "Your battery is rated for 500 charges. On newer phones, double." (Apple Support, iPhone battery and performance).
     Built from the GOLD tech reel (showreel-tech-ai-memory) look: ink background (#07080c), one lit hero low and large, the empty top band for ONE bold
     word or number at a time (white, cyan for the better number, amber for the target), 7 shots with different cut kinds, a slow push under every hold,
     real motion blur, the caption plate at y 1448. The hero is its OWN object (a pouch battery cell opened up like an x-ray, a tally scratched into its face),
     never a phone. Numbers change on the spoken word (500 -> 1000), never a rolling counter; every object stays whole inside the frame.
     Real 3D: three.js r149 (MIT), inlined by techkit/make.py at the THREE marker; window.render(t) sets everything from t (no rAF, seeded randomness).
     Shots (cut on the voice cues from timeline.js): A the cell and its tally, 500 then 1000 | B one cycle = a ring of four quarters that closes |
     C the 80% line on a low three-quarter cell | D two cells side by side, 500 and 1000 | E the target ring, the cell keeps going |
     F three worn cells in a row (habits) | G the health card, the tally wipes, back to A (loop). Ink + white + cyan (charge) + amber (target, heat) only. -->

<script>
(() => {

{ const env = new THREE.Scene(); env.background = new THREE.Color(0x050608);

function drawTally(c, w, h, r1, r2, one) {

    for (let k = 0; k < 5; k++) { const p = clamp(one * 5 - k); if (p <= 0) continue; c.strokeStyle = p < 1 ? '#ffb347' : '#fff1d6'; c.lineWidth = 16; c.shadowColor = '#ff9a2e'; c.shadowBlur = 26; c.beginPath();

  c.fillStyle = 'rgba(0,0,0,.45)'; for (let y = 6; y < h; y += 14) c.fillRect(0, y, w, 3);   // the stacked electrode layers as fine lines
  const d = c.createLinearGradient(0, 0, w, h); d.addColorStop(.3, 'rgba(0,0,0,0)'); d.addColorStop(.5, 'rgba(255,255,255,.12)'); d.addColorStop(.7, 'rgba(0,0,0,0)'); c.fillStyle = d; c.fillRect(0, 0, w, h); });
fillTex.encoding = THREE.LinearEncoding;
const IW = FW - .3, IH = FH - .5;   // the inner stack (what the charge fills)
const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(CW, CH, CD));
const plateGeo = new THREE.PlaneGeometry(IW, IH);

// a cell facing +z; tex is the tally on its glass. setLevel(0..1) fills the stack with charge, mark(0..1) places the 80% line.
function makeCell(tex) {
  const G = new THREE.Group(), U = {};
  G.add(new THREE.Mesh(frameGeo, foil));
  const bk = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), backPlate); bk.position.z = -CD / 2 + .012; bk.rotation.y = Math.PI; G.add(bk);
  for (let i = 0; i < 9; i++) { const p = new THREE.Mesh(plateGeo, new THREE.MeshStandardMaterial({ color: i % 2 ? 0x0b141c : 0x16100c, metalness: .2, roughness: .8, envMapIntensity: .02, transparent: true, opacity: .45, side: THREE.DoubleSide, depthWrite: false })); p.position.z = -CD / 2 + .06 + i * .027; G.add(p); }
  const fill = new THREE.Mesh(plateGeo, new THREE.MeshBasicMaterial({ map: fillTex, color: 0x0b9bbd, transparent: true, opacity: .42, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })); fill.position.z = CD / 2 - .05; fill.renderOrder = 2; G.add(fill);

// sparks: bursts of hot particles, a pure function of t
const SPARK_N = 900, sparkPos = new Float32Array(SPARK_N * 3), sparkCol = new Float32Array(SPARK_N * 3), sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3)); sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));

const BURSTS = [];    // { t0, at: () => world point, n, seed, sp, life, up, sz }
function updateSparks(t) {
  let k = 0; const hot = new THREE.Color(0xfff2d8), amb = new THREE.Color(HEAT);
  for (const b of BURSTS) { const dt = t - b.t0; if (dt < 0 || dt > 1.2 || !b.on()) continue; const R = rng(b.seed), p0 = b.at();

      const a = 1 - dt / life; if (a <= 0) continue;

const heroGlow = sprite(0x6aa8d8, .2, 14, 20); scene.add(heroGlow);

{ const d = new THREE.Object3D(), eg = new THREE.EdgesGeometry(new THREE.BoxGeometry(CW * .7, CH * .7, CD * .7)); for (let j = 0; j < 3; j++) for (let i = 0; i < 7; i++) { d.position.set((i - 3) * 2.3, (j - 1) * 3.9 + 1, -15 - (j % 2) * 1.6); d.rotation.y = (i - 3) * .05; d.updateMatrix(); bgC.setMatrixAt(j * 7 + i, d.matrix);

const rowGlow = sprite(HEAT, .12, 14, 16);

const bodyGeo = (() => { const g = new THREE.ExtrudeGeometry(rrShape(PW, PH, .36), { depth: PD, bevelEnabled: true, bevelThickness: .035, bevelSize: .035, bevelSegments: 5, curveSegments: 24 }); g.translate(0, 0, -PD / 2); return g; })();

// ---------- the subject's box (Output QA HERO) ----------
let SUBJ = null; window.__subject = () => SUBJ;
function subjectBox(sh) {
  const obj = [hero, cellB, phoneC, cellsD, tgtE, padG, phoneG][sh], bx = new THREE.Box3(); bx.setFromObject(obj);
  let l = 1e9, r = -1e9, tp = 1e9, b = -1e9;
  for (const x of [bx.min.x, bx.max.x]) for (const y of [bx.min.y, bx.max.y]) for (const z of [bx.min.z, bx.max.z]) { const p = V(x, y, z).project(cam); const sx = (p.x + 1) / 2 * W, sy = (1 - p.y) / 2 * H; l = Math.min(l, sx); r = Math.max(r, sx); tp = Math.min(tp, sy); b = Math.max(b, sy); }

}
// ---------- captions (stable phrases, bottom third) ----------
const CHUNKS = []; SC.forEach((s, si) => { let cur = []; s.words.forEach((w, i) => { cur.push(w); const nx = s.words[i + 1], len = cur.map((x) => x.w).join(' ').length + (nx ? nx.w.length + 1 : 0);
    if (/[.,?!]$/.test(w.w) || (cur.length >= 6 && !(nx && /[.,?!]$/.test(nx.w))) || (len > 30 && !(nx && /[.,?!]$/.test(nx.w))) || i === s.words.length - 1) { CHUNKS.push({ si, words: cur }); cur = []; } }); });

const capEl = document.getElementById('caps'); let capIdx = -2;

  if (ci >= 0) { const p = eout(prog(t, CHUNKS[ci].t0 - .05, CHUNKS[ci].t0 + .15)); capEl.style.opacity = clamp(p * 1.5); capEl.style.transform = `translateY(${(1 - p) * 10}px)`; }

// ---------- frame ----------
function post() {

// real motion blur (techkit/kit3d.js): a few time samples across the shutter, each smeared along the camera's own screen motion to the next

const busy = (t, sh) => sh === 0 || (sh === 1 && t > C.total - .1 && t < C.total + .9);   // sparks flying: more time samples
