<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>The Salt Wars of Velmora</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Channel 3 pilot C, "Invented world history": Velmora, a made-up continent, and the thirty years of made-up war over its one salt mine,
   told by a narrator. Everything is generated on load from fixed seeds: the coastline (warped value noise), about 150 provinces (warped
   nearest-seed cells), six starting nations (grown from their capitals over the province graph) and the scripted era (EVENTS): who takes
   which provinces, in which order, at what time. seek(t) only reads that timeline, so every frame is a pure function of t.
   Told in shots, not one map that fades (owner, 31 Oct): the camera pushes into the mine, pans to each front, cuts to the queen who starts
   it, pulls wide for the peace and rides the black sails in; a new event every ~3 s, a year counter that rolls between them, a cliffhanger.
   Every spoken sentence is on screen (window.VOICE = { text, at }: what the voice says and when; scripts/channel3/qa.mjs checks the config).
   Look (owner, 31 Oct: "too glowy"): a printed atlas. Parchment page, muted flat nation colours with a faint terrain grain, ink borders,
   a sea in three flat depth bands, crisp vector icons and portraits, a paper grain over all; no glow, no flashes, no gradients. */
*{margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#ece2cc}
canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function(){
  var SEED = 4, FS = "'Cinzel',Georgia,serif", FI = "'Inter Tight',system-ui,sans-serif", PAPER = '#ece2cc', INK = '#2b2433';
  var MW = 540, MH = 480, RW = 1080, RH = 960, WY0 = 226, WY1 = 664, WCY = (WY0 + WY1) / 2;   // the map (map units = CSS px at zoom 1), its raster, the window on screen
  function rnd(s){ return function(){ s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function cl(x, a, b){ return x < a ? a : x > b ? b : x; }
  function P(t, a, b){ return cl((t - a) / (b - a), 0, 1); }
  function mix(a, b, k){ return a + (b - a) * k; }
  function eo(k){ return 1 - Math.pow(1 - k, 3); }
  function eio(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
  function eb(k){ var c = 1.5; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }
  // value noise
  function H(i, j, s){ var h = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(s, 1442695041); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
  function vn(x, y, s){ var i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    var a = H(i, j, s), b = H(i + 1, j, s), c = H(i, j + 1, s), d = H(i + 1, j + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  function fbm(x, y, s, o){ var v = 0, a = .5, f = 1; for (var k = 0; k < o; k++){ v += a * vn(x * f, y * f, s + k * 17); a *= .5; f *= 2.03; } return v; }

  // ---- the continent: land where warped noise beats an elliptical falloff ----
  var N = RW * RH, LAND = new Uint8Array(N), SHADE = new Uint8Array(N);
  (function(){
    for (var y = 0; y < RH; y++) for (var x = 0; x < RW; x++){
      var u = x / RW, v = y / RH, wx = u + .09 * (fbm(u * 3, v * 3, SEED + 50, 3) - .5), wy = v + .09 * (fbm(u * 3 + 9, v * 3, SEED + 60, 3) - .5);
      var dx = (wx - .5) / .47, dy = (wy - .5) / .47, r = Math.sqrt(dx * dx + dy * dy), n = fbm(wx * 4.2, wy * 4.2, SEED, 5);
      var e = n + .62 - r * .78, i = y * RW + x; LAND[i] = e > .5 ? 1 : 0;
      SHADE[i] = cl(200 + (fbm(u * 14, v * 14, SEED + 90, 4) - .5) * 120 + (e - .5) * 70, 150, 255);
    }
  })();
  // ---- provinces: jittered seeds on land, each pixel to its nearest seed after a small warp (organic borders) ----
  var SEEDS = [], PID = new Int16Array(N).fill(-1);
  (function(){
    var r = rnd(SEED * 7 + 1), step = 74;
    for (var gy = step / 2; gy < RH; gy += step) for (var gx = step / 2; gx < RW; gx += step){
      var sx = Math.round(gx + (r() - .5) * step * .8), sy = Math.round(gy + (r() - .5) * step * .8);
      if (sx >= 0 && sx < RW && sy >= 0 && sy < RH && LAND[sy * RW + sx]) SEEDS.push([sx, sy]);
    }
    var B = 80, gw = Math.ceil(RW / B), gh = Math.ceil(RH / B), grid = []; for (var k = 0; k < gw * gh; k++) grid.push([]);
    SEEDS.forEach(function(s, k){ grid[Math.floor(s[1] / B) * gw + Math.floor(s[0] / B)].push(k); });
    for (var y = 0; y < RH; y++) for (var x = 0; x < RW; x++){
      var i = y * RW + x; if (!LAND[i]) continue;
      var u = x + (vn(x / 38, y / 38, SEED + 7) - .5) * 46, v = y + (vn(x / 38 + 5, y / 38, SEED + 8) - .5) * 46, cx = Math.floor(u / B), cy = Math.floor(v / B), best = -1, bd = 1e12;
      for (var j = cy - 2; j <= cy + 2; j++) for (var q = cx - 2; q <= cx + 2; q++){ if (j < 0 || q < 0 || j >= gh || q >= gw) continue;
        var L = grid[j * gw + q]; for (var m = 0; m < L.length; m++){ var s = SEEDS[L[m]], d = (s[0] - u) * (s[0] - u) + (s[1] - v) * (s[1] - v); if (d < bd) { bd = d; best = L[m]; } } }
      PID[i] = best;
    }
  })();
  var NP = SEEDS.length, AREA = new Float64Array(NP), CX = new Float64Array(NP), CY = new Float64Array(NP), ADJ = [], NB = new Int16Array(N).fill(-1);
  for (var k0 = 0; k0 < NP; k0++) ADJ.push({});
  (function(){
    for (var y = 0; y < RH; y++) for (var x = 0; x < RW; x++){
      var i = y * RW + x, p = PID[i]; if (p < 0) continue; AREA[p]++; CX[p] += x; CY[p] += y;
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++){ var xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= RW || yy >= RH) continue;
        var q = PID[yy * RW + xx]; if (q === p) continue; if (q < 0) { NB[i] = -2; } else { if (NB[i] === -1) NB[i] = q; ADJ[p][q] = (ADJ[p][q] || 0) + 1; } }
    }
    for (var p = 0; p < NP; p++) if (AREA[p]) { CX[p] /= AREA[p]; CY[p] /= AREA[p]; }
  })();
  // slivers (under 900 px) join the neighbour they share most border with, so no enclave is left behind by the events
  (function(){
    var to = []; for (var p = 0; p < NP; p++){ to.push(p); if (AREA[p] && AREA[p] < 900) { var b = -1, bc = 0; for (var q in ADJ[p]) if (ADJ[p][q] > bc && AREA[q] >= 900) { bc = ADJ[p][q]; b = +q; } if (b >= 0) to[p] = b; } }
    for (var i = 0; i < N; i++) if (PID[i] >= 0) PID[i] = to[PID[i]];
    AREA.fill(0); CX.fill(0); CY.fill(0); NB.fill(-1); ADJ = []; for (p = 0; p < NP; p++) ADJ.push({});
    for (var y = 0; y < RH; y++) for (var x = 0; x < RW; x++){
      i = y * RW + x; p = PID[i]; if (p < 0) continue; AREA[p]++; CX[p] += x; CY[p] += y;
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++){ var xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= RW || yy >= RH) continue;
        var q2 = PID[yy * RW + xx]; if (q2 === p) continue; if (q2 < 0) { NB[i] = -2; } else { if (NB[i] === -1) NB[i] = q2; ADJ[p][q2] = (ADJ[p][q2] || 0) + 1; } }
    }
    for (p = 0; p < NP; p++) if (AREA[p]) { CX[p] /= AREA[p]; CY[p] /= AREA[p]; }
  })();
  ADJ = ADJ.map(function(a){ return Object.keys(a).filter(function(q){ return a[q] > 6; }).map(Number); });
  // islands: a sea lane to the nearest province, so every province can be reached
  for (var pi = 0; pi < NP; pi++) if (AREA[pi] && !ADJ[pi].length) { var nb0 = -1, nd = 1e12; for (var qi = 0; qi < NP; qi++) if (qi !== pi && AREA[qi]) { var dd = Math.hypot(CX[pi] - CX[qi], CY[pi] - CY[qi]); if (dd < nd) { nd = dd; nb0 = qi; } } if (nb0 >= 0) { ADJ[pi].push(nb0); ADJ[nb0].push(pi); } }
  function nearestProv(fx, fy){ var b = -1, bd = 1e12; for (var p = 0; p < NP; p++){ if (!AREA[p]) continue; var d = (CX[p] - fx * RW) * (CX[p] - fx * RW) + (CY[p] - fy * RH) * (CY[p] - fy * RH); if (d < bd) { bd = d; b = p; } } return b; }
  // graph distance (Dijkstra, centroid gaps) from a set of provinces
  function dist(from){ var D = new Float64Array(NP).fill(1e9), done = new Uint8Array(NP); from.forEach(function(p){ D[p] = 0; });
    for (;;) { var u = -1, ud = 1e9; for (var p = 0; p < NP; p++) if (!done[p] && D[p] < ud) { ud = D[p]; u = p; } if (u < 0) break; done[u] = 1;
      ADJ[u].forEach(function(q){ var d = ud + Math.hypot(CX[u] - CX[q], CY[u] - CY[q]); if (d < D[q]) D[q] = d; }); }
    return D; }

  // ---- nations ----
  var NAT = [
    { name: 'KAEL', col: [196, 86, 74], at: [.27, .46] },
    { name: 'OSSARY', col: [84, 122, 176], at: [.5, .2] },
    { name: 'THREN', col: [214, 164, 70], at: [.76, .4] },
    { name: 'MIREVALE', col: [98, 156, 112], at: [.66, .76] },
    { name: 'DUSKAR', col: [136, 108, 170], at: [.32, .78] },
    { name: 'PELL', col: [86, 160, 160], at: [.8, .14] },
    { name: 'ASHEN', col: [190, 178, 156], at: [0, 0] },
    { name: '???', col: [32, 28, 38], at: [0, 0] }];
  var OWN0 = new Int8Array(NP).fill(0), CAP = NAT.slice(0, 6).map(function(n){ return nearestProv(n.at[0], n.at[1]); });
  (function(){   // grow the six from their capitals: each province goes to the nearest capital by graph distance, a little seeded noise in the weights
    var r = rnd(SEED * 13), w = []; for (var p = 0; p < NP; p++) w.push(.8 + r() * .4);
    var Ds = CAP.map(function(c){ return dist([c]); });
    for (p = 0; p < NP; p++){ if (!AREA[p]) continue; var b = -1, bd = 1e9; for (var n = 0; n < 6; n++){ var d = Ds[n][p] * w[p] * (n === 5 ? 1.5 : 1); if (d < bd) { bd = d; b = n; } } OWN0[p] = b; }
  })();
  var MINE = nearestProv(.5, .47);

  // ---- the era: each event flips provinces one after another over its length (video seconds) ----
  var FLIPS = []; for (var p0 = 0; p0 < NP; p0++) FLIPS.push([]);
  var cur = Array.prototype.slice.call(OWN0), FOCUS = {};
  function owned(n){ var o = []; for (var p = 0; p < NP; p++) if (cur[p] === n) o.push(p); return o; }
  function take(key, t, len, to, list){ list.forEach(function(p, k){ var tt = t + len * k / Math.max(1, list.length); FLIPS[p].push([tt, to]); cur[p] = to; });
    var fx = 0, fy = 0; list.forEach(function(p){ fx += CX[p]; fy += CY[p]; }); FOCUS[key] = list.length ? [fx / list.length / 2, fy / list.length / 2] : [MW / 2, MH / 2]; }
  function byDist(list, from){ var D = dist(from); return list.filter(function(p){ return D[p] < 1e9; }).sort(function(a, b){ return D[a] - D[b]; }); }
  var T = { kael: 3.2, ossary: 5.8, pact: 9.3, back: 13.8, split: 17.0, peace: 19.2, sails: 21.7, land: 24.0, end: 24.4 };
  var EVENTS = [
    { t: 0, year: 1201, text: 'SIX NATIONS · ONE SALT MINE' },
    { t: T.kael, year: 1204, text: 'KAEL TAKES THE MINE', run: function(e){ var D = dist([MINE]); var L = []; for (var p = 0; p < NP; p++) if (AREA[p] && cur[p] !== 0) L.push(p);
      L.sort(function(a, b){ return D[a] - D[b]; }); take('kael', e.t + .4, 1.5, 0, byDist(L.slice(0, 7), owned(0))); } },
    { t: T.ossary, year: 1208, text: 'OSSARY FALLS', run: function(e){ take('ossary', e.t + .2, 2.2, 0, byDist(owned(1), owned(0))); } },
    { t: T.pact, year: 1214, text: 'THREN + MIREVALE = THE PACT', rename: [2, 'THE PACT'], run: function(e){ take('pact', e.t + .4, 1.8, 2, byDist(owned(3), owned(2))); } },
    { t: T.back, year: 1219, text: 'THE PACT RETAKES THE MINE', run: function(e){ var L = byDist(owned(0), owned(2)); var D = dist([MINE]); L = L.slice(0, 14).sort(function(a, b){ return D[a] - D[b]; }).slice(0, 10); take('back', e.t + .3, 1.8, 2, byDist(L, owned(2))); } },
    { t: T.split, year: 1224, text: 'KAEL SPLITS IN TWO', run: function(e){ var L = owned(0).sort(function(a, b){ return CY[a] - CY[b]; }); take('split', e.t + .3, 1.4, 6, L.slice(0, Math.round(L.length * .42)).sort(function(a, b){ return CX[a] - CX[b]; })); } },
    { t: T.peace, year: 1230, text: 'ONE YEAR OF PEACE' },
    { t: T.sails, year: 1231, text: 'BLACK SAILS IN THE WEST', run: function(e){ var coast = []; for (var p = 0; p < NP; p++) if (AREA[p] && cur[p] >= 0 && CX[p] < RW * .3) coast.push(p);
      coast.sort(function(a, b){ return CX[a] - CX[b]; }); take('land', T.land, 1.2, 7, coast.slice(0, 3)); } }];
  EVENTS.forEach(function(e){ if (e.run) e.run(e); });
  window.OUTCOME = { ok: cur.indexOf(1) < 0 && cur.indexOf(3) < 0 && cur.indexOf(7) >= 0 && cur.indexOf(6) >= 0, provinces: NP, start: [0, 1, 2, 3, 4, 5].map(function(n){ return OWN0.filter(function(o){ return o === n; }).length; }), end: [0, 1, 2, 3, 4, 5, 6, 7].map(function(n){ return cur.filter(function(o){ return o === n; }).length; }) };
  function nameOf(n, t){ var s = NAT[n].name; EVENTS.forEach(function(e){ if (e.rename && e.rename[0] === n && t >= e.t + 1.4) s = e.rename[1]; }); return s; }
  var DUR = 27.6, MINEP = [CX[MINE] / 2, CY[MINE] / 2];

  // ---- the story ----
  var LINES = [
    { at: 0, text: 'How did one salt mine start thirty years of war?' },
    { at: T.kael, text: 'Queen Ysra of Kael took it first.' },
    { at: T.ossary, text: 'Then her army swallowed Ossary whole.' },
    { at: T.pact, text: 'So Thren and Mirevale joined forces. They called it the Pact.' },
    { at: T.back, text: 'The Pact marched on the mine, and took it back.' },
    { at: T.split, text: 'Then Kael itself split in two.' },
    { at: T.peace, text: 'For one quiet year, there was peace.' },
    { at: T.sails, text: 'Then black sails appeared in the west.' },
    { at: T.end, text: 'Nobody knew whose ships they were.' }];
  LINES = [].concat.apply([], LINES.map(function(L){ return L.text.match(/[^.?!]+[.?!]?/g).map(function(s, k){ return { at: k ? null : +L.at.toFixed(2), text: s.trim() }; }); }));
  window.VOICE = { text: LINES.map(function(L){ return L.text; }).join(' '), at: LINES.map(function(L){ return L.at; }) };
  var SPEED = .95, CAPS = LINES, lt = function(w){ return w.replace(/[^A-Za-z]/g, '').length; };
  (function(){ var end = 0; CAPS.forEach(function(L, i){ var s = L.at !== null ? Math.max(L.at, end + (i ? .12 : 0)) : end + .25, ws = L.text.split(/\s+/), t = s + .05, n = 0;
    ws.forEach(function(w){ n += lt(w); }); var d = .07 / SPEED;
    L.words = ws.map(function(w){ var o = { d: w, s: t, e: t + lt(w) * d }; t = o.e; return o; });
    L.s = s; L.e = s + .1 + n * .07 / SPEED; end = L.e; }); })();
  var norm = function(w){ return String(w).toLowerCase().replace(/[^a-z0-9]/g, ''); };
  window.setVoice = function(v){ if (!v || !v.words || !v.words.length) return; var V = v.words, j = 0;
    CAPS.forEach(function(L){ L.words.forEach(function(w){ for (var k = j; k < Math.min(V.length, j + 4); k++) if (norm(V[k].w) === norm(w.d)) { w.s = V[k].s; w.e = V[k].e; j = k + 1; return; } }); L.s = L.words[0].s; L.e = L.words[L.words.length - 1].e; }); };
  var CAPI = -1; window.__cap = function(){ return CAPI; }; window.__caps = function(){ return CAPS.map(function(L){ return [L.at, +L.s.toFixed(2), +L.e.toFixed(2), L.text]; }); };
  function capAt(t){ for (var i = CAPS.length - 1; i >= 0; i--) if (t >= CAPS[i].s - .15) return t < CAPS[i].e + 1.8 ? i : -1; return -1; }

  // ---- the shots: [start, map point, zoom] ----
  var FLEET = function(t){ var fk = P(t, T.sails, T.land); return [40 + fk * 60, 230]; };
  var SHOTS = [[0, [MW / 2, MH / 2], 1.0], [T.kael, MINEP, 2.1], [T.ossary, FOCUS.ossary, 1.55], [T.pact, FOCUS.pact, 1.9], [T.pact + 2.3, [mix(FOCUS.pact[0], MW / 2, .5), mix(FOCUS.pact[1], MH / 2, .5)], 1.3],
    [T.back, MINEP, 2.1], [T.split, FOCUS.split, 1.6], [T.peace, [MW / 2, MH / 2], 1.0], [T.sails, FLEET, 1.7], [T.end, FOCUS.land, 2.3]];
  function camera(t){
    var i = 0; while (i < SHOTS.length - 1 && t >= SHOTS[i + 1][0]) i++;
    var a = SHOTS[Math.max(0, i - 1)], b = SHOTS[i], k = i ? eio(P(t, b[0] - .1, b[0] + .6)) : 1, pt = function(q){ return typeof q[1] === 'function' ? q[1](t) : q[1]; }, pa = pt(a), pb = pt(b);
    var push = 1 + .04 * P(t, b[0], b[0] + 3.2), z = Math.exp(mix(Math.log(a[2]), Math.log(b[2]), k)) * push;
    var cx = mix(pa[0], pb[0], k), cy = mix(pa[1], pb[1], k), hw = 270 / z, hh = (WY1 - WY0) / 2 / z;   // never show past the map's edge
    return [z, cl(cx, Math.min(hw, MW / 2), Math.max(MW - hw, MW / 2)), cl(cy, Math.min(hh, MH / 2), Math.max(MH - hh, MH / 2))];
  }

  // ---- drawing ----
  var cv = document.getElementById('c'), x = cv.getContext('2d'), off = document.createElement('canvas'); off.width = RW; off.height = RH;
  var ox = off.getContext('2d'), img = ox.createImageData(RW, RH), px = new Uint32Array(img.data.buffer), SEA = new Uint32Array(N);
  function pack(r, g, b){ return (255 << 24 | (b > 255 ? 255 : b < 0 ? 0 : b) << 16 | (g > 255 ? 255 : g < 0 ? 0 : g) << 8 | (r > 255 ? 255 : r < 0 ? 0 : r)) >>> 0; }
  (function(){   // the sea: three flat depth bands and one contour line, by distance from the coast (two-pass chamfer)
    var D = new Float32Array(N).fill(1e6); for (var i = 0; i < N; i++) if (LAND[i]) D[i] = 0;
    for (var y = 0; y < RH; y++) for (var x2 = 0; x2 < RW; x2++){ var i2 = y * RW + x2; if (x2) D[i2] = Math.min(D[i2], D[i2 - 1] + 1); if (y) D[i2] = Math.min(D[i2], D[i2 - RW] + 1); }
    for (y = RH - 1; y >= 0; y--) for (x2 = RW - 1; x2 >= 0; x2--){ i2 = y * RW + x2; if (x2 < RW - 1) D[i2] = Math.min(D[i2], D[i2 + 1] + 1); if (y < RH - 1) D[i2] = Math.min(D[i2], D[i2 + RW] + 1); }
    for (i = 0; i < N; i++){ var d = D[i] + (vn((i % RW) / 50, Math.floor(i / RW) / 50, SEED + 3) - .5) * 10;
      SEA[i] = d < 12 ? pack(150, 178, 186) : d < 34 ? pack(126, 156, 168) : (d > 37 && d < 39.5) ? pack(126, 156, 168) : pack(104, 134, 150); }
  })();
  var PC = new Int32Array(NP * 3), PO = new Int8Array(NP);
  function paint(t){
    for (var p = 0; p < NP; p++){
      var f = FLIPS[p], o = OWN0[p], po = o, tf = -9; for (var k = 0; k < f.length; k++) if (f[k][0] <= t) { po = o; o = f[k][1]; tf = f[k][0]; }
      var b = eio(P(t, tf, tf + .35)), A = NAT[po].col, Bc = NAT[o].col;
      for (var c = 0; c < 3; c++) PC[p * 3 + c] = A[c] + (Bc[c] - A[c]) * b;
      PO[p] = o;
    }
    for (var i = 0; i < N; i++){
      var q = PID[i]; if (q < 0) { px[i] = SEA[i]; continue; }
      var nb = NB[i];
      if (nb === -2) { px[i] = pack(43, 36, 51); continue; }   // the coast, in ink
      if (nb >= 0 && PO[nb] !== PO[q]) { px[i] = PO[q] === 7 || PO[nb] === 7 ? pack(178, 52, 46) : pack(43, 36, 51); continue; }   // nation borders, in ink
      var s = .9 + (SHADE[i] - 150) / 105 * .12; if (nb >= 0) s *= .9;   // a faint terrain grain; province lines a shade darker
