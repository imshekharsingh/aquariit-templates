<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Four balls, one exit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Channel 3 pilot B, "Guess before it ends": four numbered balls in a turning three-ring maze, one exit, a countdown on screen from frame 0.
   A narrator sets the stakes ("Pick yours now"), calls the race as it goes (who is closest, when the maze turns back) and the answer lands
   on the last second. The physics runs once on load (fixed 480 Hz step, seeded maze) and seek(t) reads the recorded run, so every frame is a
   pure function of t; SEED was picked by a one-off search (window.__sim) for a race that ends at the countdown's zero with a close second
   and a winner who was not ahead five seconds before. The narration's names and times come from that run (window.VOICE = { text, at };
   scripts/channel3/qa.mjs checks the config says the same). The camera pushes in on the ball in front, pulls back when the maze turns,
   and rides the exit for the last three seconds. Look (owner, 31 Oct): matte ink-blue ground, cream walls, flat balls with an ink
   outline, a paper grain; no glow, no gradients, no light effects. */
*{margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#1d2840}
canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
