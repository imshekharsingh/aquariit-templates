<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>The Drop, episode 1</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Channel 3 pilot "Character cast": four invented friends race down a peg board. Zing (yellow, the show-off), Wob (blue, the worrier),
   Snick (purple, the schemer: he jumps before GO) and Pip (green, the lucky one: asleep the whole way). The physics runs once on load
   (fixed 480 Hz step, seeded peg jitter) and seek(t) reads the recorded state, so every frame is a pure function of t. SEED comes from a
   one-off search (window.__sim) for a race where Zing leads at half way, the cheat Snick finishes last and sleeping Pip wins.
   Faces never rotate: personality is in the eyes, brows, mouths, squash and the little extras (sparkles, sweat, Zzz). No voice. */
*{margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#fff3e2}
canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function(){
  var DUR = 20.5, GO = 2.7, SEED = 1046, F = "'Fredoka',system-ui,sans-serif", STEP = 1 / 480, G = 950, R = 19, PR = 5;
  var CAST = [
    { name: 'ZING', trait: 'show-off', col: '#ffc531', dark: '#d98f00', x: 100 },
    { name: 'WOB', trait: 'worrier', col: '#6cc4ff', dark: '#2f8fd6', x: 160 },
    { name: 'SNICK', trait: 'schemer', col: '#9b6bff', dark: '#6a3fd6', x: 220 },
    { name: 'PIP', trait: 'lucky', col: '#5ad67d', dark: '#26a24c', x: 280 }];
  var CHEAT = .55;   // Snick goes this long before GO
  var Z = 1.4, X0 = 270 - 190 * Z, WL = 20, WR = 360, TOP = 230, ROW0 = 320, ROWS = 21, DY = 58, DX = 62, F0 = ROW0 + ROWS * DY + 30, F1 = F0 + 150, FIN = F1 + 26, CUP = F1 + 190;
  function rnd(s){ return function(){ s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function cl(x, a, b){ return x < a ? a : x > b ? b : x; }
  function P(t, a, b){ return cl((t - a) / (b - a), 0, 1); }
  function eo(k){ return 1 - Math.pow(1 - k, 3); }
  function eio(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
  function eb(k){ var c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }

  // ---- the board: pegs in offset rows (seeded jitter), side walls, a funnel to the finish, a cup under it ----
  function board(r){
    var pegs = [], rows = [], segs = [];
    for (var i = 0; i < ROWS; i++) { rows.push([]); for (var x = (i % 2 ? 40 + DX / 2 : 40); x < 345; x += DX) { var pg = [x + (r() - .5) * 8, ROW0 + i * DY + (r() - .5) * 6]; pegs.push(pg); rows[i].push(pg); } }
    segs.push([WL, 0, WL, F0], [WR, 0, WR, F0], [WL, F0, 149, F1], [WR, F0, 231, F1], [149, F1, 149, F1 + 30], [231, F1, 231, F1 + 30],
      [80, F1 + 60, 80, CUP], [300, F1 + 60, 300, CUP], [80, CUP, 300, CUP], [60, TOP + R, 320, TOP + R]);
    return { pegs: pegs, rows: rows, segs: segs };
  }
  function sim(seed, until){
    var r = rnd(seed), Bd = board(r), B = [], rec = [], hits = [], fin = [null, null, null, null], n = Math.ceil(until / STEP), still = [0, 0, 0, 0];
    CAST.forEach(function(c, i){ B.push({ x: c.x + (r() - .5) * 10, y: TOP, vx: 0, vy: 0, go: i === 2 ? GO - CHEAT : GO }); });
    // the start ledge is a segment that drops away at each one's own start: Snick slips off it early
    for (var k = 0; k <= n; k++){
      var s = k * STEP;
      if (k % 2 === 0) { var fr = []; B.forEach(function(b){ fr.push(b.x, b.y); }); rec.push(fr); }
      for (var i = 0; i < 4; i++){
        var b = B[i];
        if (s < b.go) { b.y = TOP; b.vx = b.vy = 0; continue; }
        if (s < b.go + STEP * 1.5) { b.vx = (i === 2 ? 60 : (r() - .5) * 40); b.vy = -60; }
        b.vy += G * STEP; b.x += b.vx * STEP; b.y += b.vy * STEP;
        var gy = Math.floor((b.y - ROW0) / DY);
        for (var row = gy - 1; row <= gy + 1; row++){ if (row < 0 || row >= ROWS) continue;
          for (var j = 0; j < Bd.rows[row].length; j++) { var pg = Bd.rows[row][j]; if (Math.abs(pg[0] - b.x) < R + PR + 1) col(b, pg[0], pg[1], PR, .55, i, s); }
        }
        for (j = 0; j < Bd.segs.length; j++){ var sg = Bd.segs[j]; if (j === Bd.segs.length - 1) continue; segCol(b, sg, i, s); }
        if (fin[i] === null && b.y > FIN) fin[i] = s;
        // a body balanced on a peg for half a second gets a seeded nudge (real boards never balance)
        // a body that has moved less than 4 px in 0.4 s (balanced on a peg, wedged at a wall) gets a seeded hop toward the middle
        if (b.y < FIN) { if (!b.ax || Math.hypot(b.x - b.ax, b.y - b.ay) > 4) { b.ax = b.x; b.ay = b.y; still[i] = 0; } else if ((still[i] += STEP) > .4) { b.vx += (b.x < 190 ? 1 : -1) * (90 + r() * 60); b.vy -= 140; still[i] = 0; b.ax = 0; } }
      }
      for (i = 0; i < 4; i++) for (j = i + 1; j < 4; j++){
        var A = B[i], C2 = B[j]; if (s < A.go || s < C2.go) continue;
        var dx = C2.x - A.x, dy = C2.y - A.y, d = Math.hypot(dx, dy);
        if (d < 2 * R && d > 1e-6) { var nx = dx / d, ny = dy / d, pe = (2 * R - d) / 2; A.x -= nx * pe; A.y -= ny * pe; C2.x += nx * pe; C2.y += ny * pe;
          var vr = (C2.vx - A.vx) * nx + (C2.vy - A.vy) * ny; if (vr < 0) { var im = -.75 * vr; A.vx -= im * nx; A.vy -= im * ny; C2.vx += im * nx; C2.vy += im * ny; if (-vr > 120) hits.push([s, i, -vr, 'bump']); } }
      }
    }
    function col(b, px, py, pr, e, i, s){
      var dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy);
      if (d < R + pr && d > 1e-6) { var nx = dx / d, ny = dy / d; b.x += nx * (R + pr - d); b.y += ny * (R + pr - d);
        var vn = b.vx * nx + b.vy * ny; if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; b.vx *= .985; if (-vn > 160) hits.push([s, i, -vn, 'peg']); } }
    }
    function segCol(b, sg, i, s){
      var ax = sg[0], ay = sg[1], ux = sg[2] - ax, uy = sg[3] - ay, L2 = ux * ux + uy * uy, k = cl(((b.x - ax) * ux + (b.y - ay) * uy) / L2, 0, 1);
      col(b, ax + ux * k, ay + uy * k, 3, .35, i, s);
    }
    return { Bd: Bd, rec: rec, hits: hits, fin: fin };
  }
  function order(fin){ return [0, 1, 2, 3].filter(function(i){ return fin[i] !== null; }).sort(function(a, b){ return fin[a] - fin[b]; }); }
  function judge(S){
    var o = order(S.fin); if (o.length < 4) return { ok: false, fin: S.fin };
    var mid = Math.round((GO + (S.fin[o[0]] - GO) * .5) * 240), f = S.rec[mid], ys = [f[1], f[3], f[5], f[7]];
    var lead = ys.indexOf(Math.max.apply(null, ys)), w = S.fin[o[0]];
    return { ok: o[0] === 3 && o[3] === 2 && lead === 0 && w > 15.5 && w < 18.6 && S.fin[o[3]] < 21.6 && S.fin[o[1]] - w < 1.6, order: o, fin: S.fin, lead: lead };
  }
  window.__sim = function(seed){ return judge(sim(seed, 22)); };

  var S = sim(SEED, DUR), J = judge(S), O = order(S.fin), RANK = [9, 9, 9, 9];
  O.forEach(function(i, k){ RANK[i] = k; });
  window.OUTCOME = J; window.__state = function(t){ return state(t).map(function(v){ return Math.round(v); }); };
  function state(t){ var f = cl(t, 0, DUR) * 240, i = Math.floor(f), k = f - i, a = S.rec[Math.min(i, S.rec.length - 1)], b = S.rec[Math.min(i + 1, S.rec.length - 1)];
    return a.map(function(v, j){ return v + (b[j] - v) * k; }); }
  function vel(t, i){ var a = state(t - .02), b = state(t + .02); return [(b[2 * i] - a[2 * i]) / .04, (b[2 * i + 1] - a[2 * i + 1]) / .04]; }
  // the camera (world units, Z = 1.4 on screen): follows the pack (the mean of the three lowest) with the pack at about 500 px on screen,
  // smoothed both ways so it never lags; after the win it settles on the cup
  var CUPC = (F1 + 60 + CUP) / 2, CMAX = CUPC - 470 / Z;
  var CAM = (function(){ var n = S.rec.length, raw = new Float32Array(n), out = new Float32Array(n), w = S.fin[O[0]] || DUR;
    for (var i = 0; i < n; i++){ var f = S.rec[i], ys = [f[1], f[3], f[5], f[7]].sort(function(a, b){ return b - a; }); raw[i] = cl((ys[0] + ys[1] + ys[2]) / 3 - 500 / Z, 0, CMAX); if (i / 240 > w - .4) raw[i] = CMAX; }
    var a = raw[0]; for (i = 0; i < n; i++){ a += (raw[i] - a) * .02; out[i] = a; }
    a = out[n - 1]; for (i = n - 1; i >= 0; i--){ a += (out[i] - a) * .02; out[i] = a; }
    return out; })();
  // who is ahead, per recorded frame, with a 14 px margin before the tag moves (no flicker when two are level)
  var LEAD = (function(){ var out = new Int8Array(S.rec.length), cur = -1;
    for (var i = 0; i < S.rec.length; i++){ var f = S.rec[i], b = -1, by = -1e9; for (var j = 0; j < 4; j++) if (f[2 * j + 1] > by && !(S.fin[j] !== null && i / 240 > S.fin[j])) { by = f[2 * j + 1]; b = j; }
      if (cur < 0 || b < 0 || by > f[2 * cur + 1] + 14 || (S.fin[cur] !== null && i / 240 > S.fin[cur])) cur = b; out[i] = cur; }
    return out; })();
  function cam(t){ var f = cl(t, 0, DUR) * 240, i = Math.min(Math.floor(f), CAM.length - 2); return CAM[i] + (CAM[i + 1] - CAM[i]) * (f - i); }

  // ---- drawing ----
  var cv = document.getElementById('c'), x = cv.getContext('2d');
  // layout probe for scripts/channel3/qa.mjs: every text drawn in the last seek, as its box on screen (CSS px)
  var BOXES = []; window.__boxes = function(){ return BOXES; };
  function probe(s, X, Y, al){ if (x.globalAlpha < .05) return; var w = x.measureText(s).width, l = al === 'left' ? X : al === 'right' ? X - w : X - w / 2, m = x.getTransform();
    var a = m.transformPoint(new DOMPoint(l, Y - 10)), b = m.transformPoint(new DOMPoint(l + w, Y)); BOXES.push([s, a.x / 2, b.x / 2, a.y / 2, b.y / 2]); }
  function txt(s, px, py, size, wgt, col, al, sp){ x.font = wgt + ' ' + size + 'px ' + F; x.fillStyle = col; x.textAlign = al || 'center'; x.letterSpacing = (sp || 0) + 'px'; probe(s, px, py, x.textAlign); x.fillText(s, px, py); x.letterSpacing = '0px'; }
  function circ(px, py, r, col){ x.fillStyle = col; x.beginPath(); x.arc(px, py, r, 0, 6.2832); x.fill(); }
  function blink(t, i){ var p = (t + i * 1.37) % 3.1; return p < .12 ? 1 - Math.abs(p - .06) / .06 : 0; }
  // mood per character at time t: 'idle', 'race', 'lead', 'won', 'lost', 'shock'
  function mood(t, i, ys){
    var done = S.fin[i] !== null && t >= S.fin[i], w = S.fin[O[0]], over = t >= w;
    if (t < GO - (i === 2 ? CHEAT : 0)) return 'idle';
    if (over) return i === O[0] ? 'won' : (i === 0 ? 'shock' : 'lost');
    var lead = ys.indexOf(Math.max.apply(null, ys)); return lead === i ? 'lead' : 'race';
  }
  function face(i, px, py, t, md, v){
    var c = CAST[i], sq = cl(1 + v[1] / 4000, .9, 1.12), sx = 1 / Math.sqrt(sq), bl = blink(t, i);
    if (i === 1 && md !== 'won') { px += Math.sin(t * 61) * (md === 'idle' ? 1.2 : .7); }   // Wob trembles
    x.save(); x.translate(px, py); x.scale(sx, sq);
    // body + tuft / ears / antenna / sprout
    x.fillStyle = c.col; x.strokeStyle = c.dark; x.lineWidth = 2.5;
    if (i === 0) { x.beginPath(); x.moveTo(-9, -R + 3); x.lineTo(-5, -R - 10); x.lineTo(0, -R + 1); x.lineTo(5, -R - 13); x.lineTo(9, -R + 3); x.closePath(); x.fill(); x.stroke(); }
    if (i === 2) { [-1, 1].forEach(function(s){ x.beginPath(); x.moveTo(s * 7, -R + 4); x.lineTo(s * 14, -R - 9); x.lineTo(s * 16, -R + 8); x.closePath(); x.fill(); x.stroke(); }); }
    if (i === 1) { x.beginPath(); x.moveTo(0, -R); x.quadraticCurveTo(4, -R - 12, 12 + Math.sin(t * 7) * 2, -R - 8); x.stroke(); circ(12 + Math.sin(t * 7) * 2, -R - 8, 3.2, c.dark); }
    if (i === 3) { x.beginPath(); x.moveTo(0, -R + 1); x.lineTo(0, -R - 7); x.stroke(); [[-4, -R - 10], [4, -R - 10], [-4, -R - 4], [4, -R - 4]].forEach(function(p){ circ(p[0], p[1] - 1, 3.6, c.dark); }); circ(0, -R - 7, 2, '#c8f5d2'); }
    x.beginPath(); x.arc(0, 0, R, 0, 6.2832); x.fill(); x.stroke();
    var hl = x.createRadialGradient(-7, -8, 1, 0, 0, R); hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(.55, 'rgba(255,255,255,0)'); hl.addColorStop(1, 'rgba(0,0,0,.12)');
    x.fillStyle = hl; x.beginPath(); x.arc(0, 0, R, 0, 6.2832); x.fill();
    // eyes
    var ink = '#1d1640', look = [cl(v[0] / 600, -1, 1) * 2, cl(v[1] / 900, -1, 1) * 2];
    if (i === 3 && md !== 'won') {   // Pip sleeps: closed happy arcs
      x.strokeStyle = ink; x.lineWidth = 2.4; x.lineCap = 'round';
      [-7, 7].forEach(function(ex){ x.beginPath(); x.arc(ex, -2, 4, Math.PI * 1.1, Math.PI * 1.9); x.stroke(); });
      x.beginPath(); x.arc(0, 6, 3, 0, Math.PI); x.stroke();
    } else if (i === 3) {   // Pip after the win: one eye opens, a little confused
      var o1 = P(t, S.fin[3] + 1.6, S.fin[3] + 1.9);
      x.strokeStyle = ink; x.lineWidth = 2.4; x.lineCap = 'round';
      x.beginPath(); x.arc(-7, -2, 4, Math.PI * 1.1, Math.PI * 1.9); x.stroke();
      if (o1 > 0) { circ(7, -2, 5.6 * o1, '#fff'); circ(7.5, -2, 2.8 * o1, ink); } else { x.beginPath(); x.arc(7, -2, 4, Math.PI * 1.1, Math.PI * 1.9); x.stroke(); }
      x.beginPath(); x.arc(0, 7, 2.6, 0, 6.2832); x.stroke();
    } else {
      var er = i === 1 ? 7 : 5.8, pr = i === 1 ? 2.2 : 2.9, lid = i === 2 ? .45 : 0;
      if (md === 'shock') { er = 7.2; pr = 2; }
      [-7.5, 7.5].forEach(function(ex){
        circ(ex, -3, er, '#fff');
        var lx = look[0], ly = look[1]; if (i === 2) lx += Math.sin(t * 2.3) * 2.2;   // Snick's shifty side glance
        circ(ex + lx, -3 + ly, pr, ink);
        if (lid + bl > 0) { x.fillStyle = c.col; x.fillRect(ex - er - 1, -3 - er - 1, er * 2 + 2, (er * 2 + 2) * cl(lid + bl, 0, 1)); }
      });
      // brows
      x.strokeStyle = ink; x.lineWidth = 2.4; x.lineCap = 'round';
      if (i === 1 || md === 'shock') { x.beginPath(); x.moveTo(-12, -13); x.lineTo(-4, -15); x.moveTo(12, -13); x.lineTo(4, -15); x.stroke(); }
      if (i === 2) { x.beginPath(); x.moveTo(-13, -12); x.lineTo(-3, -9); x.moveTo(13, -14); x.lineTo(3, -11); x.stroke(); }
      if (i === 0 && md !== 'shock') { x.beginPath(); x.moveTo(-12, -11); x.lineTo(-4, -13); x.moveTo(12, -11); x.lineTo(4, -13); x.stroke(); }
      // mouths
      x.beginPath();
      if (md === 'shock') { x.fillStyle = ink; x.ellipse(0, 9, 4, 5.5, 0, 0, 6.2832); x.fill(); }
      else if (i === 0) { x.arc(0, 5, 7, .15 * Math.PI, .85 * Math.PI); x.stroke(); }
      else if (i === 1) { x.moveTo(-6, 10); x.quadraticCurveTo(-3, 7, 0, 10); x.quadraticCurveTo(3, 13, 6, 10); x.stroke(); }
      else if (i === 2) { x.moveTo(-6, 8); x.quadraticCurveTo(2, 12, 8, 5); x.stroke(); }
    }
    x.restore();
    // extras
    if (i === 0 && (md === 'lead' || md === 'idle')) for (var k = 0; k < 3; k++){ var ph = (t * 1.6 + k / 3) % 1, a = k * 2.1 + t * .5; star(px + Math.cos(a) * (R + 10 + ph * 8), py + Math.sin(a) * (R + 10 + ph * 8) - 4, 4 * Math.sin(ph * Math.PI), '#ffb300'); }
    if (i === 1 && md !== 'won') { var dp = (t * .9) % 1; x.globalAlpha = 1 - dp; drop(px + 16, py - 10 + dp * 12); x.globalAlpha = 1; }
    if (i === 3 && md !== 'won') for (k = 0; k < 2; k++){ var zp = (t * .55 + k * .5) % 1; x.globalAlpha = Math.sin(zp * Math.PI); txt('z', px + 16 + zp * 12, py - 18 - zp * 26, 12 + zp * 8, 700, '#1d1640'); x.globalAlpha = 1; }
  }
  function star(px, py, r, col){ if (r <= 0) return; x.fillStyle = col; x.beginPath(); for (var k = 0; k < 8; k++){ var a = k * Math.PI / 4, rr = k % 2 ? r * .35 : r; x.lineTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr); } x.closePath(); x.fill(); }
  function drop(px, py){ x.fillStyle = '#7fd0ff'; x.beginPath(); x.moveTo(px, py - 6); x.quadraticCurveTo(px + 5, py + 1, px, py + 4); x.quadraticCurveTo(px - 5, py + 1, px, py - 6); x.fill(); }
  function rrect(px, py, w, h, r){ x.beginPath(); x.roundRect(px, py, w, h, r); }

  var PEG = ['#ff7a59', '#ffb340', '#4fc3f7', '#9b6bff', '#45c97a'];
  function seek(t){
    x.setTransform(2, 0, 0, 2, 0, 0); BOXES.length = 0;
    var cy = cam(t), f = state(t), ys = [f[1], f[3], f[5], f[7]], w = S.fin[O[0]];
    var SX = function(wx){ return X0 + wx * Z; }, SY = function(wy){ return (wy - cy) * Z; };
    // ground: warm paper, three soft colour fields that drift slower than the board (parallax)
    var g = x.createLinearGradient(0, 0, 0, 960); g.addColorStop(0, '#fff6e8'); g.addColorStop(1, '#ffe6d3'); x.fillStyle = g; x.fillRect(0, 0, 540, 960);
    [[90, 300, 260, '#ffd2bd'], [470, 760, 290, '#e3d8ff'], [300, 1350, 260, '#cfeedd']].forEach(function(b){ var yy = (b[1] - cy * .5) % 1500; if (yy < -300) yy += 1500;
      var rg = x.createRadialGradient(b[0], yy, 0, b[0], yy, b[2]); rg.addColorStop(0, b[3]); rg.addColorStop(1, b[3] + '00'); x.fillStyle = rg; x.fillRect(0, 0, 540, 960); });
    x.save(); x.translate(X0, -cy * Z); x.scale(Z, Z);

    x.fillStyle = 'rgba(255,255,255,.45)'; x.beginPath(); x.moveTo(WL, -400); x.lineTo(WR, -400); x.lineTo(WR, F0); x.lineTo(231, F1); x.lineTo(149, F1); x.lineTo(WL, F0); x.closePath(); x.fill();
    // pegs, coloured by row
    S.Bd.rows.forEach(function(row, k){ var c = PEG[k % PEG.length]; row.forEach(function(p){ if (p[1] < cy - 20 || p[1] > cy + 720) return;
      circ(p[0], p[1] + 1.6, PR, 'rgba(60,30,80,.14)'); circ(p[0], p[1], PR, c); circ(p[0] - 1.4, p[1] - 1.4, 1.5, 'rgba(255,255,255,.75)'); }); });
    // walls, funnel, cup
    x.strokeStyle = '#3b2d5c'; x.lineWidth = 5; x.lineCap = 'round';
    S.Bd.segs.forEach(function(sg, k){ if (k === S.Bd.segs.length - 1) return; x.beginPath(); x.moveTo(sg[0], sg[1]); x.lineTo(sg[2], sg[3]); x.stroke(); });
    // the start ledge: one plank per racer that drops away at their own start
    CAST.forEach(function(c, i){ var go = i === 2 ? GO - CHEAT : GO, k = P(t, go, go + .45); if (k >= 1) return;
      x.save(); x.globalAlpha = 1 - k; x.translate(c.x, TOP + R + 4 + 120 * k * k); x.rotate((i % 2 ? -1 : 1) * k * .9); x.fillStyle = '#3b2d5c'; rrect(-26, -3, 52, 7, 3.5); x.fill(); x.restore(); });
    // the finish line: checkers across the funnel's mouth
    for (var k = 0; k < 10; k++){ x.fillStyle = k % 2 ? '#1d1640' : '#fff'; x.fillRect(149 + k * 8.2, FIN - 3, 8.2, 3); x.fillStyle = k % 2 ? '#fff' : '#1d1640'; x.fillRect(149 + k * 8.2, FIN, 8.2, 3); }
    // racers, the higher ones first
    [0, 1, 2, 3].sort(function(a, b){ return ys[a] - ys[b]; }).forEach(function(i){ face(i, f[2 * i], f[2 * i + 1], t, mood(t, i, ys), vel(t, i)); });
    x.restore();
    // ---- overlays (screen space) ----
    // a "1st" tag over whoever is ahead, from GO until the first one finishes
    var li = LEAD[Math.min(LEAD.length - 1, Math.round(t * 240))], lk = P(t, GO + 1, GO + 1.3) * (1 - P(t, w - .2, w));
    if (lk > 0 && li >= 0) { var lx = SX(f[2 * li]), ly = SY(f[2 * li + 1]) - R * Z - 42; x.globalAlpha = lk; rrect(lx - 22, ly - 13, 44, 24, 12); x.fillStyle = CAST[li].dark; x.fill();
      x.beginPath(); x.moveTo(lx - 5, ly + 11); x.lineTo(lx + 5, ly + 11); x.lineTo(lx, ly + 17); x.fill(); txt('1st', lx, ly + 5, 15, 700, '#fff'); x.globalAlpha = 1; }
    // the title from frame 0, then the cast cards until GO
    var tk = 1 - P(t, GO - .9, GO - .5);
    if (tk > 0) { x.globalAlpha = tk;
      txt('EPISODE 1', 270, 104, 17, 700, '#ff6a3d', 'center', 4);
      var ts = eb(P(t, 0, .4)); x.save(); x.translate(270, 166); x.scale(ts, ts); txt('THE DROP', 0, 0, 66, 700, '#1d1640', 'center', 1); x.restore();
      txt('4 friends. 1 race. Who wins?', 270, 208, 22, 600, '#1d1640'); x.globalAlpha = 1; }
    CAST.forEach(function(c, i){ var a = P(t, .15 + i * .15, .4 + i * .15) * (1 - P(t, GO - .5, GO - .2)); if (a <= 0) return;
      var s2 = eb(P(t, .15 + i * .15, .45 + i * .15)); x.globalAlpha = a;
      x.save(); x.translate(SX(c.x), SY(TOP + R) + 30); x.scale(s2, s2); rrect(-38, 0, 76, 46, 13); x.fillStyle = '#fff'; x.fill(); x.lineWidth = 2; x.strokeStyle = c.dark; x.stroke();
      txt(c.name, 0, 20, 18, 700, c.dark); txt(c.trait, 0, 37, 13, 600, '#1d1640'); x.restore(); x.globalAlpha = 1; });
    // 3 2 1 GO in the middle; Snick's early jump gets a red "!" from the other three
    [['3', GO - 1.5], ['2', GO - 1], ['1', GO - .5], ['GO!', GO]].forEach(function(q){ var k = P(t, q[1], q[1] + .45); if (k <= 0 || k >= 1) return;
      x.globalAlpha = 1 - k; x.save(); x.translate(270, 560); x.scale(.7 + .8 * eo(k), .7 + .8 * eo(k)); txt(q[0], 0, 24, 72, 700, q[0] === 'GO!' ? '#ff6a3d' : '#1d1640'); x.restore(); x.globalAlpha = 1; });
    var ch = P(t, GO - CHEAT, GO - CHEAT + .12) * (1 - P(t, GO + .4, GO + .7));
    if (ch > 0) { x.globalAlpha = ch; [0, 1, 3].forEach(function(i){ var s3 = eb(P(t, GO - CHEAT, GO - CHEAT + .25)); x.save(); x.translate(SX(state(t)[2 * i]), SY(state(t)[2 * i + 1]) - 46); x.scale(s3, s3); txt('!', 0, 0, 32, 700, '#ff3d5a'); x.restore(); }); x.globalAlpha = 1; }
    // the result: the winner's name, then each place as it lands
    if (t >= w) {
      var wk = eb(P(t, w, w + .45)), bk = eo(P(t, w, w + .3));
      x.globalAlpha = bk; rrect(70, 118, 400, 116, 28); x.fillStyle = 'rgba(255,255,255,.88)'; x.fill(); x.globalAlpha = 1;
      x.save(); x.translate(270, 182); x.scale(wk, wk); txt(CAST[O[0]].name + ' WINS', 0, 0, 60, 700, CAST[O[0]].dark, 'center', 1); x.restore();
      x.globalAlpha = P(t, w + .5, w + .8); txt('…in his sleep', 270, 218, 24, 600, '#1d1640'); x.globalAlpha = 1;
      O.forEach(function(i, k){ var at = S.fin[i]; if (t < at) return; var a = eo(P(t, at, at + .3)), xx = 84 + k * 124, yy = 712;
        x.globalAlpha = a; rrect(xx - 56, yy - 23, 112, 46, 23); x.fillStyle = k === 0 ? CAST[i].col : '#fff'; x.fill(); x.lineWidth = 2; x.strokeStyle = CAST[i].dark; x.stroke();
        txt(['1st', '2nd', '3rd', '4th'][k] + ' ' + CAST[i].name, xx, yy + 7, 18, 700, '#1d1640'); x.globalAlpha = 1; });
    }
  }
  // sound: the countdown blips, a whoosh at GO, soft taps for the hardest peg hits (one every 0.1 s at most), pops for bumps, a riser into the
  // finish, a hit and shimmer for the winner, a tick per place
  function cues(){
    var Q = [{ t: 0, k: 'swish', d: .5, g: .5 }, { t: .2, k: 'pop', g: .35, p: 0 }];
    CAST.forEach(function(_, i){ Q.push({ t: .25 + i * .22, k: 'pop', g: .3, p: [0, 3, 7, 12][i] }); });
    Q.push({ t: GO - CHEAT, k: 'click', g: .4 }, { t: GO - 1.5, k: 'tick', g: .4, p: 0 }, { t: GO - 1, k: 'tick', g: .4, p: 0 }, { t: GO - .5, k: 'tick', g: .4, p: 0 }, { t: GO, k: 'whoosh', d: .5, g: .6 });
    var last = -1; S.hits.slice().sort(function(a, b){ return a[0] - b[0]; }).forEach(function(h){ if (h[0] - last > .1 && h[2] > 260 && h[0] < S.fin[O[0]]) { Q.push({ t: +h[0].toFixed(3), k: h[3] === 'bump' ? 'pop' : 'tap', g: Math.min(.35, h[2] / 1600), p: [0, 5, 8, 12][h[1]] }); last = h[0]; } });
    var w = S.fin[O[0]]; Q.push({ t: w, k: 'riser', d: 1.2, g: .45 }, { t: w, k: 'hit', g: .8 }, { t: w + .05, k: 'shimmer', g: .5 });
    O.slice(1).forEach(function(i, k){ Q.push({ t: S.fin[i], k: 'pop', g: .35, p: 7 - k * 3 }); });
    window.CUES = { dur: DUR, cues: Q, bed: { bpm: 120, origin: 0, gain: .32, chords: [[48, 60, 64, 67], [53, 60, 65, 69], [45, 57, 60, 64], [55, 59, 62, 67]] } };
  }
  cues();
  window.seek = seek; window.DURATION = DUR; window.COVER = 1.0;
  document.fonts.load("700 60px 'Fredoka'").then(function(){ return document.fonts.ready; })
    .then(function(){ seek(+(new URLSearchParams(location.search).get('t') || 0)); document.documentElement.dataset.ready = 1; });
})();
