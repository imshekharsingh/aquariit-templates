<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Why the Eiffel Tower was nearly torn down</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Channel 3 pilot, pattern "Storybook cut-out" (design/channel3.md): the true story of how the Eiffel Tower was nearly torn down.
   Every shot is a little paper theatre: 3-5 paper layers at different depths, a slow camera dolly with parallax inside each shot, and a
   push THROUGH the layers into the next shot on every sentence; the new shot is already moving forward as it arrives, so the camera never
   stops between shots. Premium pass (owner, 31 Oct): one key light from the upper left (soft contact shadows down-right), sky gradients
   with haze near the horizon, far layers slightly out of focus, a riveted iron lattice tower, fewer elements per shot. Cartoon figures
   (Gustave Eiffel, a soldier, a crowd) are friendly cut-outs with simple limb rigs, recognised by props (top hat and beard, kepi and
   headphones), never caricatured faces. Every frame is a pure function of t; the voice is timed to the scene (window.VOICE).
   Facts (two sources each): toureiffel.paris "Why was the Eiffel Tower kept?" and "The Eiffel Tower laboratory"; history.com
   "How the Eiffel Tower survived": built for the 1889 Exposition Universelle, 300 m and the world's tallest structure until 1930,
   Eiffel's 20-year concession (ending 1909), radio trials with Captain Ferrie's army team from 1903, Bizerte reached in 1904,
   concession renewed for 70 years from 1 January 1910; the tower still carries radio and TV transmitters. */
*{margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#f4ead7}
canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function(){

  // every text drawn in the last seek, as its box on screen (CSS px), for scripts/channel3/qa.mjs

  function probe(s, X, Y, al, size){ if (x.globalAlpha < .05) return; var w = x.measureText(s).width, l = al === 'left' ? X : al === 'right' ? X - w : X - w / 2, m = x.getTransform();
    var a = m.transformPoint(new DOMPoint(l, Y - size * .75)), b = m.transformPoint(new DOMPoint(l + w, Y + size * .2)); BOXES.push([s, Math.min(a.x, b.x) / 2, Math.max(a.x, b.x) / 2, Math.min(a.y, b.y) / 2, Math.max(a.y, b.y) / 2]); }
  function font(size, f){ var w = f.split(' '); return w[0] + ' ' + size + 'px ' + w.slice(1).join(' '); }
  function txt(s, X, Y, size, f, col, al, sp){ x.font = font(size, f); x.textAlign = al || 'center'; x.letterSpacing = (sp || 0) + 'px';

  function tw(s, size, f, sp){ x.font = font(size, f); x.letterSpacing = (sp || 0) + 'px'; var w = x.measureText(s).width; x.letterSpacing = '0px'; return w; }

  function rgb(h){ return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

    for (var i = 0; i < im.data.length; i += 4){ var v = r(); im.data[i] = im.data[i + 1] = im.data[i + 2] = v < .5 ? 30 : 255; im.data[i + 3] = Math.abs(v - .5) > .4 ? 13 : 0; }

    CAPS.forEach(function(L){ L.words.forEach(function(w){ for (var k = j; k < Math.min(V.length, j + 4); k++) if (norm(V[k].w) === norm(w.d)) { w.s = V[k].s; w.e = V[k].e; j = k + 1; return; } }); L.s = L.words[0].s; L.e = L.words[L.words.length - 1].e; }); };

  window.__caps = function(){ return CAPS.map(function(L){ return [L.at, +L.s.toFixed(2), +L.e.toFixed(2), L.text]; }); };

  function capAt(t){ for (var i = CAPS.length - 1; i >= 0; i--) if (t >= CAPS[i].s - .12) return t < CAPS[i].e + 2.5 ? i : -1; return -1; }

    words.forEach(function(w){ var ww = x.measureText(w.d).width, n = lines.length - 1; if (lw[n] && lw[n] + sp + ww > maxW) { lines.push([]); lw.push(0); n++; } lines[n].push([w, ww]); lw[n] += (lw[n] ? sp : 0) + ww; });

  // STYLE = { hl: /words in accent/, hlCol, ink, panel }: the caption strip for every other sentence
  function drawHook(t){
    var L = CAPS[0], out = P(t, A[1] - .35, A[1] + .1); if (out >= 1) return;
    var W = wrap(L.words, HOOK.size, '800 ' + FD, 480), lh = HOOK.size * 1.08, y0 = HOOK.y - (W.lines.length - 1) * lh / 2 - eo(out) * 30;
    x.save(); x.globalAlpha = 1 - out;
    if (HOOK.label) { var lk = P(t, 0, .3); x.globalAlpha = (1 - out) * lk; tag(HOOK.label, 270, y0 + eo(out) * 30 - HOOK.size - 14, 12, '800 ' + FI, HOOK.labelCol || '#fff', HOOK.labelBg || '#23202b', 2.5); }
    W.lines.forEach(function(ln, r){ var xx = 270 - W.lw[r] / 2;
      ln.forEach(function(q){ var w = q[0], k = eo(P(t, w.s - .1, w.s + .12)), hl = HOOK.hl && HOOK.hl.test(w.d);
        x.globalAlpha = (1 - out) * (.5 + .5 * k); x.save(); x.translate(xx + q[1] / 2, y0 + r * lh); var sc = 1 + .06 * (1 - k); x.scale(sc, sc);

        txt(w.d, 0, 0, HOOK.size, '800 ' + FD, hl ? HOOK.hlCol : HOOK.col, 'center', -.6); x.restore(); xx += q[1] + W.sp; }); });
    x.restore();
  }
  // the caption card (premium pass, 31 Oct): ONE card that stays up and changes shape from sentence to sentence (no fade out and in);
  // the old line slides up out of it as the new one rises in word by word
  function capLay(i){ var size = 27, W = wrap(CAPS[i].words, size, '700 ' + FI, 452), lh = 35, n = W.lines.length, base = 716 - (n - 1) * lh / 2;
    return { W: W, base: base, pw: Math.max.apply(null, W.lw) + 34, ph: n * lh + 18, py: base - size * .8 - 10, lh: lh, size: size }; }
  function capWords(C, t, a, dy, lit){ C.W.lines.forEach(function(ln, r){ var xx = 270 - C.W.lw[r] / 2;
      ln.forEach(function(q){ var w = q[0], k = lit ? 1 : eo(P(t, w.s - .1, w.s + .08)), hl = STYLE.hl && STYLE.hl.test(w.d);
        x.globalAlpha = a * (.3 + .7 * k); txt(w.d, xx, C.base + r * C.lh + dy - (1 - k) * 3, C.size, '700 ' + FI, hl ? (STYLE.hlFor ? STYLE.hlFor(w.d) : STYLE.hlCol) : (STYLE.ink || '#23202b'), 'left', -.3); xx += q[1] + C.W.sp; }); }); }
  function drawCaption(t){
    var i = capAt(t); CAPI = i; if (i < 0) return; if (i === 0) { drawHook(t); return; }
    var L = CAPS[i], cur = capLay(i), prev = i > 1 && t < L.s + .4 ? capLay(i - 1) : null, mk = P(t, L.s - .14, L.s + .3), m = es(mk);

    x.save(); x.beginPath(); x.rect(270 - pw / 2, cy - ph / 2, pw, ph); x.clip();
    if (prev && mk < 1) capWords(prev, t, A0 * (1 - eo(P(mk, 0, .32))), (cy - prev.py - prev.ph / 2) - eo(mk) * 16, true);
    capWords(cur, t, A0 * (prev ? eo(P(mk, .36, .8)) : 1), (cy - cur.py - cur.ph / 2) + (prev ? (1 - eo(P(mk, .3, 1))) * 10 : 0), false);
    x.restore(); x.restore();
  }
  // the source credit (owner, 31 Oct: a short credit on the last frame): a small paper tag at the top for the last 3 s
  function drawCredit(t){ var k = P(t, DUR - 3, DUR - 2.5); if (k <= 0) return; k = eo(k); x.save(); x.globalAlpha = k; tag(CREDIT, 270, 92 - (1 - k) * 10, 11.5, '700 ' + FI, '#23202b', '#fbf6ea', .6); x.restore(); }
  Object.defineProperty(window, 'COVER', { configurable: true, get: function(){ return +Math.min(CAPS[0].e + .25, A[1] - .3).toFixed(2); } });   // the question fully lit
  var INK = '#23202b', IRON = '#6a4c3b', RED = '#c8452f', CREAM = '#fbf6ea', NAVY = '#2d3e6b';
  story([['Why was the Eiffel Tower almost torn down?', 0], ["It was built for the 1889 World's Fair.", .45], ['At 300 metres, it was the tallest structure on Earth.', .4],
    ["But Eiffel's permit lasted only twenty years.", .45], ['In 1909, the city could tear it down.', .4], ['So Eiffel found it a new job.', .45],
    ['In 1903, he let the army test radio from the top.', .3], ['Soon its signals crossed the Mediterranean.', .4], ['Too useful to lose, it was saved in 1910.', .45],
    ['And it is still on air today.', .45]]);
  var DUR = +(CAPS[CAPS.length - 1].e + 1.9).toFixed(1);
  var HOOK = { y: 214, size: 42, col: INK, hl: /^(eiffel|tower|torn|down)/i, hlCol: RED, label: 'THE TRUE STORY', labelBg: INK, labelCol: '#f4ead7' };
  var STYLE = { hl: /^(1889|300|twenty|1909|job|radio|army|1903|mediterranean|saved|1910|air)/i, hlCol: RED };
  var CREDIT = 'SOURCES: TOUR EIFFEL OFFICIAL SITE · HISTORY.COM';

  // ---- paper pieces ----
  function halfW(v){ return v < .19 ? mix(.215, .118, v / .19) : v < .38 ? mix(.118, .068, (v - .19) / .19) : mix(.068, .022, Math.pow(cl((v - .38) / .5, 0, 1), .7)); }
  function towerPath(cx, yb, h){ return function(){ var X = function(u){ return cx + u * h; }, Y = function(v){ return yb - v * h; };
    x.beginPath(); x.moveTo(X(0), Y(1)); x.lineTo(X(.006), Y(.97)); x.lineTo(X(.016), Y(.92)); x.lineTo(X(.022), Y(.88));
    x.quadraticCurveTo(X(.032), Y(.62), X(.068), Y(.38)); x.lineTo(X(.118), Y(.19)); x.quadraticCurveTo(X(.15), Y(.08), X(.215), Y(0));

    x.lineTo(X(-.215), Y(0)); x.quadraticCurveTo(X(-.15), Y(.08), X(-.118), Y(.19)); x.lineTo(X(-.068), Y(.38));
    x.quadraticCurveTo(X(-.032), Y(.62), X(-.022), Y(.88)); x.lineTo(X(-.016), Y(.92)); x.lineTo(X(-.006), Y(.97)); x.closePath(); }; }
  // the tower: four lattice legs (rails + X-bracing, the sky showing through), the arch, girder platforms with rivets, a lattice shaft and the
