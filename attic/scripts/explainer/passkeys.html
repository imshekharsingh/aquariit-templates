<style>
/* @techin20sec, tech explainer Nº 01 built the @webin20sec way (owner, 26 Oct: "see if it helps with growth there as well"):

.a{position:absolute}

<body>

<div id="scr" class="a">

  <div id="sheet" class="a"><div id="key" class="a"><svg viewBox="0 0 30 30"><circle cx="10" cy="15" r="6" fill="none" stroke="#5aa9ff" stroke-width="3"/><path d="M16 15h11M23 15v5M27 15v4" stroke="#5aa9ff" stroke-width="3" stroke-linecap="round" fill="none"/></svg></div>

<div id="cap" class="a"></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cl = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }, P = function(t, a, b){ return cl((t - a) / (b - a)); }, mix = function(a, b, k){ return a + (b - a) * k; };
  var out = function(k){ return 1 - Math.pow(1 - k, 3); }, io = function(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
  var spring = function(s){ if (s <= 0) return 0; var z = .62, w = 13, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + z * w / wd * Math.sin(wd * s)); };
  var win = function(t, a, b, f){ return Math.min(P(t, a - f, a), 1 - P(t, b - f, b)); };
  // the script; spoken a sentence at a time with a breath after each (voice.gap), paced against webin20sec Nº 01
  var TEXT = "Can a fake login page steal your passkey? No. A password works on any page you type it into. So a lookalike just takes it. A passkey only works on the site it was made for. On a fake address, there's nothing to give. Turn passkeys on.";
  var WORDS = [], DUR = 20, LEAD = .15;   // beats and caption words land 0.15 s before the word is spoken

  function at(word, nth){ var n = nth || 1; for (var i = 0; i < WORDS.length; i++) if (norm(WORDS[i].w) === word && --n === 0) return WORDS[i].s - LEAD; return 99; }
  function align(){ var T = TEXT.split(/\s+/), j = 0;
    WORDS.forEach(function(w){ w.d = w.w; for (var k = j; k < Math.min(T.length, j + 4); k++) if (norm(T[k]) === norm(w.w)) { w.d = T[k]; j = k + 1; break; } }); }

    align();
    A = { fake: at('fake'), passkey: at('passkey'), no: at('no'), password: at('password'), type: at('type'), into: at('into'), lookalike: at('lookalike'), takes: at('takes'),

    A.end = WORDS[WORDS.length - 1].e;
    PH = []; var cur = [];
    WORDS.forEach(function(w, i){ cur.push(i); if (/[.?!]$/.test(w.d) || i === WORDS.length - 1) {
      if (cur.length > 7) { var best = -1; cur.forEach(function(j, k){ if (/,$/.test(WORDS[j].d) && k > 1 && k < cur.length - 2) best = k; });
        if (best < 0) best = Math.floor(cur.length / 2) - 1; PH.push(cur.slice(0, best + 1)); PH.push(cur.slice(best + 1)); }
      else PH.push(cur);
      cur = []; } });
    buildCues();
  }
  var PASS = 'maple-tree-19';
  var dom = function(fake, warn){ return fake ? 'kestre<span class="one">1</span>bank.com' : 'kestrelbank.com'; };
  function show(el, o, y, s){ el.style.opacity = o; el.style.transform = 'translateY(' + (y || 0) + 'px) scale(' + (s === undefined ? 1 : s) + ')'; }
  function seek(t){
    t = Math.max(0, Math.min(DUR, t));
    var ex = io(P(t, DUR - .6, DUR - .1));
    // ---- the hook: words land as spoken; under it the sign-in page, on a lookalike address ----
    var gone = io(P(t, A.no - .35, A.no + .05));
    [].forEach.call($('hook').querySelectorAll('.ln > span'), function(sp, i){
      var s = WORDS[i] ? WORDS[i].s - LEAD : 0, k = out(P(t, s, s + .26));
      sp.style.opacity = cl((t - s) * 9) * (1 - gone); sp.style.transform = 'translateY(' + ((1 - k) * 40 - gone * 80) + 'px)'; });
    $('lbl').style.opacity = 1 - ex;
    // ---- the screen never leaves: small under the hook, full from "No." ----
    var rise = io(P(t, A.no - .35, A.no + .1)), drift = Math.sin(t * .9) * 3 * (1 - rise);
    show($('scr'), out(P(t, .05, .4)) * (1 - ex), (1 - rise) * 340 + drift + ex * 20, mix(.6, 1, rise));
    // which site the page is on: fake until "A passkey only works…", real for that sentence, fake again from "On a fake address", real for the setting
    var real = (t >= A.passkey2 - .1 && t < A.fake2 - .1) || t >= A.turn - .1, fakeNow = !real;
    $('dom').innerHTML = dom(fakeNow); $('lock').style.color = real ? '#3ddc84' : '#8a93a3'; $('lock').style.background = 'transparent'; $('lock').style.border = '2.5px solid ' + (real ? '#3ddc84' : '#8a93a3');
    // the lookalike is called out on "fake" (hook), "lookalike" and "fake address"
    var flag = Math.max(t >= A.fake && t < A.no - .2 ? 1 : 0, t >= A.lookalike - .05 && t < A.passkey2 - .1 ? 1 : 0, t >= A.fake2 && t < A.turn - .1 ? 1 : 0);
    var pulse = flag ? .5 + .5 * Math.sin((t - A.lookalike) * 7) : 0;
    $('bar').style.borderColor = flag ? 'rgba(255,77,61,' + (.5 + .4 * pulse) + ')' : real ? 'rgba(61,220,132,.45)' : 'transparent';
    $('warn').style.opacity = flag; $('warn').style.transform = 'scale(' + (flag ? .9 + .1 * spring(t - Math.max(A.lookalike, A.fake2 > t ? A.lookalike : A.fake2)) : 1) + ')';
    // "A password works on any page you type it into.": the password types into the lookalike page
    var typed = Math.floor(PASS.length * P(t, A.password + .1, A.into + .25)), pageA = 1 - io(P(t, A.passkey2 - .25, A.passkey2 + .05));
    $('dots').textContent = '•'.repeat(typed); $('page').style.opacity = pageA * (1 - io(P(t, A.turn - .25, A.turn + .05)));
    $('btn').style.transform = 'scale(' + (t >= A.lookalike - .3 && t < A.lookalike - .1 ? .96 : 1) + ')';
    // the passkey prompt: offered for the real site ("made for"), refused on the fake one ("nothing to give")
    var shIn = out(P(t, A.passkey2 - .1, A.passkey2 + .35)), shOut = io(P(t, A.turn - .25, A.turn + .05));
    show($('sheet'), shIn * (1 - shOut), (1 - shIn) * 150, 1);
    var refused = t >= A.fake2 - .1;
    $('sh1').textContent = refused ? 'No passkey for this site' : 'Use your passkey'; $('sh1').style.color = refused ? '#8a93a3' : '#eef1f6';

    $('set').style.opacity = sIn; $('set').style.transform = 'translateY(' + (1 - sIn) * 20 + 'px)';
    var sv = out(P(t, A.passkeys + .9, A.passkeys + 1.3)); $('saved').style.opacity = sv; $('saved').style.transform = 'translateY(' + (1 - sv) * 12 + 'px)';   // the hold after the switch still moves
    var on = cl(swk); $('sw').style.background = on > .5 ? '#3ddc84' : '#2a303c'; $('sw').firstChild.style.transform = 'translateX(' + 30 * swk + 'px)';
    // ---- the deck: what the site receives ----
    var dIn = out(P(t, A.password - .15, A.password + .2)), dOut = io(P(t, A.turn - .2, A.turn + .15));
    $('deck').style.opacity = dIn * (1 - dOut); $('deck').style.transform = 'translateY(' + ((1 - dIn) * 24 + dOut * 24) + 'px)';
    var dv = $('dv'), chip = $('chip'), ck;
    if (t < A.passkey2 - .1) { dv.textContent = PASS.slice(0, typed) || ' '; dv.style.color = t >= A.takes - .05 ? '#ff4d3d' : '#eef1f6';
      ck = spring(t - A.takes); chip.textContent = 'KEPT BY THE FAKE SITE'; chip.style.background = 'rgba(255,77,61,.16)'; chip.style.color = '#ff4d3d'; chip.style.opacity = t >= A.takes - .05 ? 1 : 0; }
    else if (t < A.fake2 - .1) { dv.textContent = 'a signature'; dv.style.color = '#5aa9ff';
      ck = spring(t - A.made); chip.textContent = 'ONLY FOR KESTRELBANK.COM'; chip.style.background = 'rgba(90,169,255,.16)'; chip.style.color = '#5aa9ff'; chip.style.opacity = t >= A.made - .05 ? 1 : 0; }
    else { dv.textContent = 'nothing'; dv.style.color = '#8a93a3';
      ck = spring(t - A.nothing); chip.textContent = 'NOTHING TO STEAL'; chip.style.background = 'rgba(61,220,132,.16)'; chip.style.color = '#3ddc84'; chip.style.opacity = t >= A.nothing - .05 ? 1 : 0; }
    chip.style.transform = 'scale(' + (.6 + .4 * ck) + ')';
    // ---- the readout top right and the tag ----
    var H;
    if (t < A.no - .2) H = 'kestre<b class="r">1</b>bank.com';
    else if (t < A.lookalike - .05) H = 'PASSWORD · <b>' + typed + '/' + PASS.length + '</b>';
    else if (t < A.passkey2 - .1) H = 'PASSWORD · <b class="r">STOLEN</b>';
    else if (t < A.fake2 - .1) H = 'PASSKEY · <b class="b">SITE-BOUND</b>';
    else if (t < A.turn - .1) H = 'PASSKEY · <b class="g">NOT OFFERED</b>';
    else H = 'PASSKEYS · <b class="g">' + (on > .5 ? 'ON' : 'OFF') + '</b>';
    $('hud').innerHTML = H; $('hud').style.opacity = 1 - ex;
    var tg = $('tag'); tg.style.opacity = (t >= A.no - .1 ? 1 : 0) * (1 - ex);
    tg.textContent = t < A.passkey2 - .1 ? 'A LOOKALIKE SIGN-IN PAGE' : t < A.fake2 - .1 ? 'THE REAL SITE' : t < A.turn - .1 ? 'THE LOOKALIKE AGAIN' : 'THE FIX';

    if (ph0 && ph0[0] > 7 && t < DUR - .5)   // words 0-7 are the hook question, shown as the title instead
      ph0.forEach(function(j){ var w = WORDS[j], on2 = t >= w.s - LEAD, k = out(P(t, w.s - LEAD, w.s - LEAD + .2));
      var col = /^(passkey|passkeys)/i.test(w.d) ? 'var(--blue)' : /^(lookalike|takes|fake)/i.test(w.d) ? 'var(--red)' : /^(nothing|no\.)/i.test(w.d) ? 'var(--green)' : 'var(--paper)';

  // sound under the voice: typing ticks, a hard click when the fake site keeps the password, soft air for the passkey
  function buildCues(){
    var Q = [{ t: 0, k: 'swish', d: .5, g: .5, p: -.5 }, { t: A.fake, k: 'tick', g: .3, p: -2 }, { t: A.no - .35, k: 'swish', d: .45, g: .6 }, { t: A.no, k: 'tap', g: .6 }];

    .then(function(){ seek(+(new URLSearchParams(location.search).get('t') || 0)); document.documentElement.dataset.ready = 1; });
})();
