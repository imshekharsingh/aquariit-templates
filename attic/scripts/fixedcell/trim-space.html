<head>

<style>
/* Fixed Cell Nº 03, text cleanup: "Why does your lookup miss a name that's right there?"
   "Lamp" is in the list, yet the lookup says #N/A: the name typed in A7 carries a trailing space. The cell opens to show it,
   "Lamp " is not "Lamp", and TRIM( ) is typed in around A7 inside the lookup; the space goes, the name matches, the price comes back.
   (TRIM changes the value the lookup searches for, not the cell itself, so A7 keeps its space on screen.)
   Fixed Cell look (design/fixedcell.md): paper white, ink, one green accent (the fill handle), red only for what is broken, a crisp grid,
   a monospace formula bar and a pointer. Engine shared by every Fixed Cell scene: sheet(), fx(), cam(), captions; this reel's part is
   below "THIS REEL". Every frame a pure function of t; beats and caption words lead the voice by 0.15 s; the title shows in full from
   frame 0 (ghosted) and lights word by word with the voice; the cover is the moment it is complete (window.COVER). */
:root{--paper:#fbfaf6;--ink:#16181d;--dim:#8b8a84;--line:#e3e1d9;--head:#f1efe8;--acc:#138a4b;--accbg:#e3f3e9;--red:#d4382c;--redbg:#fcebe9;

*{box-sizing:border-box;margin:0}

.a{position:absolute}
#bg{left:-90px;top:-30px;width:720px;height:1020px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 30px;opacity:.55}

#hud b{font-weight:600}#hud .r{color:var(--red)}#hud .g{color:var(--acc)}

#note .g{background:var(--accbg);color:var(--acc);box-shadow:0 0 0 1.5px #bfe0cb}
#note .r{background:var(--redbg);color:var(--red);box-shadow:0 0 0 1.5px #f2c6c1}

</style>
</head>
<body>

<script>
(function(){
  // ======== ENGINE (same in every Fixed Cell scene) ========
  var $ = function(id){ return document.getElementById(id); };
  var cl = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }, P = function(t, a, b){ return cl((t - a) / (b - a)); }, mix = function(a, b, k){ return a + (b - a) * k; };
  var out = function(k){ return 1 - Math.pow(1 - k, 3); }, io = function(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
  var win = function(t, a, b, f){ return Math.min(P(t, a - f, a), 1 - P(t, b - f, b)); };
  var norm = function(w){ return w.toLowerCase().replace(/[^a-z0-9]/g, ''); };
  var WORDS = [], A = {}, PH = [], LEAD = .15;
  function fakeWords(){ var t = .2; WORDS = []; TEXT.split(/\s+/).forEach(function(w){ var d = .14 + w.length * .03; WORDS.push({ w: w, s: t, e: t + d }); t += d + (/[.?!]$/.test(w) ? .6 : /[,:;]$/.test(w) ? .25 : .06); }); }

  // captions: one sentence at a time (long ones split at a comma), the title's words are shown as the title instead
  function phrases(){ PH = []; var cur = [];
    WORDS.forEach(function(w, i){ cur.push(i); if (/[.?!]$/.test(w.d) || i === WORDS.length - 1) {
      if (cur.length > 8) { var best = -1; cur.forEach(function(j, k){ if (/[,:;]$/.test(WORDS[j].d) && k > 1 && k < cur.length - 2 && (best < 0 || Math.abs(k - cur.length / 2) < Math.abs(best - cur.length / 2))) best = k; });
        if (best < 0) best = Math.floor(cur.length / 2) - 1; PH.push(cur.slice(0, best + 1)); PH.push(cur.slice(best + 1)); }

    if (ph && ph[0] >= HOOK_N) for (var q = 0; q < ph.length; q++) { var j = ph[q], w = WORDS[j], d = w.d, nx = WORDS[ph[q + 1]];
      if (JOIN[norm(d)] && nx && norm(nx.d) === JOIN[norm(d)][0]) { d = JOIN[norm(d)][1] + nx.d.replace(/^[a-z]+/i, ''); q++; }   // "V lookup" spoken, VLOOKUP shown

    $('cap').innerHTML = html; }
  // the title: in full from frame 0 (pale), each word inks in as it is spoken; leaves when the next line starts

    [].forEach.call($('hook').querySelectorAll('.ln > span'), function(sp, i){ var s = WORDS[i] ? WORDS[i].s - LEAD : 0, k = out(P(t, s, s + .22));
      var red = sp.className === 'x', c0 = [200, 198, 190], c1 = red ? [212, 56, 44] : [22, 24, 29];
      sp.style.color = 'rgb(' + c0.map(function(v, n){ return Math.round(mix(v, c1[n], k)); }).join(',') + ')';
      sp.style.opacity = 1 - gone; sp.style.transform = 'translateY(' + (-(1 - k) * 0 - gone * 60 - Math.sin(k * Math.PI) * 6).toFixed(1) + 'px)'; }); }
  // the sheet: cols [{k, w, head}] (w animates an insert), rows of { colKey: cell } where cell = text or { v, c (classes), n (number) }
  var G = 34, HH = 30, RH = 40, SW = 468, VH = 418, STH = 66 + 30 + 8 * 40, GEO = {};

    var fw = SW - x; if (fw > 1) h += '<div class="c h" style="left:' + x.toFixed(1) + 'px;top:0;width:' + fw + 'px;height:' + HH + 'px">' + L[li] + '</div>';
    for (var r = 1; r <= nRows; r++) { var y = HH + (r - 1) * RH, row = rows[r] || {};
      h += '<div class="c h" style="left:0;top:' + y + 'px;width:' + G + 'px;height:' + RH + 'px;line-height:39px">' + r + '</div>';
      cols.forEach(function(c){ if (c.w <= .5) return; var v = row[c.k], o = v && typeof v === 'object' ? v : { v: v };
        h += '<div class="c' + (o.c ? ' ' + o.c : '') + (o.n ? ' n' : '') + (c.cls ? ' ' + c.cls : '') + '" style="left:' + GEO.x[c.k].toFixed(1) + 'px;top:' + y + 'px;width:' + c.w.toFixed(1) + 'px;height:' + RH + 'px">' + (o.v == null || c.w < 20 ? '' : o.v) + '</div>'; });
      if (fw > 1) h += '<div class="c" style="left:' + x.toFixed(1) + 'px;top:' + y + 'px;width:' + fw + 'px;height:' + RH + 'px"></div>'; }

  // ======== THIS REEL ========
  var TEXT = "Why does your lookup miss a name that's right there? Look closer: there's a space after it. To a lookup, that's a different name. Wrap the name in trim. Trim cuts the extra spaces. Now the name matches, and the price comes back.";
  var DUR = 17, HOOK_N = 10, JOIN = {}, DISP = { trim: 'TRIM' };

  var XF = function(tr){ return [['=XLOOKUP(', 'g'], [tr ? 'TRIM(' : '', 'hg'], ['A7', ''], [tr ? ')' : '', 'hg'], [',', 'd'], ['A2:A4', 'k'], [',', 'd'], ['B2:B4', 'g'], [')', 'g']]; };
  function anchors(){

    A = { look: at('look'), closer: at('closer'), space: at('space'), after: at('after'), to: at('to'), different: at('different'), wrap: at('wrap'), trim: at('trim', 1), trim2: at('trim', 2),

    var cols = [{ k: 'a', w: 150 }, { k: 'b', w: 130 }];
    var rows = { 1: { a: { v: 'Item', c: 'b' }, b: { v: 'Price', c: 'b n' } } };

    rows[6] = { a: { v: 'Find', c: 'b' }, b: { v: 'Price', c: 'b n' } };

    o += rect(editA ? box('a', 7) : box('b', 7), 'sel', 1, '<i></i>');
    if (spA) { var b = box('a', 7), k = out(P(t, A.space - .1, A.space + .2)) * (1 - P(t, A.wrap - .3, A.wrap));
      o += '<div class="badge r" style="left:' + (b.x + 76) + 'px;top:' + (b.y + 8 - (1 - k) * 6).toFixed(1) + 'px;opacity:' + k.toFixed(2) + '">SPACE</div>'; }
    $('ovl').innerHTML = o;
    // ---- the formula bar: the lookup, then A7's own text with its space, then TRIM( … ) typed in around A7 ----

    var C = cam(t, K); $('cam').style.transform = 'translate(' + C.tx.toFixed(1) + 'px,' + C.ty.toFixed(1) + 'px) scale(' + C.s.toFixed(4) + ')';
